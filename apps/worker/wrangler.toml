name = "everyday-learning"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Every 15 minutes; the code decides whether a morning lesson or evening reminder is due (config/schedule.yaml).
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "everyday-learning"
database_id = "27e3f4a2-b9ff-43c0-9ccc-03a2d8d44a44"   # not a secret
migrations_dir = "migrations"

[observability]
enabled = true
