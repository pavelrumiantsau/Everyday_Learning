name = "everyday-learning"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Every 15 minutes; the code decides whether a morning lesson or evening reminder is due (config/schedule.yaml).
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "everyday-learning"
database_id = "REPLACE_WITH_ID_FROM_d1_create"   # SETUP.md step 4.1 — not a secret
migrations_dir = "migrations"

[observability]
enabled = true
