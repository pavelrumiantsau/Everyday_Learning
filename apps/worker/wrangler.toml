name = "everyday-learning"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "1fa40d21ace501fab9ce46dc6e27165f"   # not a secret; lets GitHub Actions deploy without guessing the account

# The Mini App (apps/miniapp, built to dist) is served as static files; API and webhook go to the Worker code.
[assets]
directory = "../miniapp/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/tg/*", "/health"]

[vars]
WEBAPP_URL = "https://everyday-learning.p-rumiantsau.workers.dev/"

# Every 15 minutes; the code decides whether a morning lesson or evening reminder is due (config/schedule.yaml).
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "everyday-learning"
database_id = "27e3f4a2-b9ff-43c0-9ccc-03a2d8d44a44"   # not a secret
migrations_dir = "migrations"

[observability]
enabled = true
