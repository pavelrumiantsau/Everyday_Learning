id: es-r-0001
cefr: A1
title: Mi barrio
topic: my neighbourhood
source: generated
text: |
  Me llamo Ana y vivo en Madrid. Mi piso es pequeño, pero tiene mucha luz. Está en un barrio tranquilo, cerca del centro.

  En mi calle hay una panadería, un supermercado y una farmacia. Todas las mañanas compro pan en la panadería. La panadera se llama Carmen y es muy simpática.

  Por la tarde, después del trabajo, me gusta pasear por el parque. Allí hay muchos árboles y niños que juegan. Los fines de semana voy al mercado con mi amiga Lucía. Compramos fruta y verdura, y después tomamos un café en una terraza. ¡Me encanta mi barrio!
