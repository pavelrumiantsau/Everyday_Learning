id: es-r-0002
cefr: A2
title: Un sábado en Valencia
topic: plans for Saturday
source: generated
text: |
  Pablo vive en Valencia. Mañana es sábado y no tiene que trabajar, así que tiene muchos planes.

  Primero, va a levantarse tarde, a las diez. Después va a desayunar tranquilamente: café con leche y tostadas con tomate. A las doce va a quedar con su hermano Javier en la plaza. Quieren ir juntos a una exposición de fotografía en el museo.

  Por la tarde va a hacer sol y calor, así que van a ir a la playa. Pablo quiere nadar un poco y leer su libro nuevo. Por la noche, va a cenar con sus amigos en un restaurante italiano. Va a estar cansado, pero muy contento. ¡Va a ser un día perfecto!
