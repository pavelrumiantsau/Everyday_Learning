id: es-g-0052
cefr: B1
order: 52
title: "Subjunctive or indicative? A review"
explanation:
  en: |
    **Subjunctive** when the clause is **not stated as a fact**:
    - wishes, requests: *Quiero que **vengas**.* *Te pido que me **llames**.*
    - feelings: *Me alegra que **estés** aquí.*
    - doubt, denial: *No creo que **tenga** razón.* *Dudo que **llueva**.*
    - impersonal judgements: *Es importante que **lleguemos** a tiempo.*
    - purpose: *para que **entiendas***
    - the future after *cuando, hasta que, antes de que*: *Cuando **llegues**, llámame.*
    - unknown or non-existent things: *Busco un piso que **sea** barato.*
    - *ojalá*: *¡Ojalá **venga**!*

    **Imperfect subjunctive** after past verbs and in unreal *si* clauses: *Quería que **vinieras**.* *Si **tuviera** dinero, viajaría.*

    **Indicative** for facts, certainty and habits: *Creo que **tiene** razón.* *Es verdad que **es** tarde.* *Cuando **llego** a casa, siempre ceno.*
comparison:
  en: |
    The key question is always the same: is the speaker **stating** it (indicative) or only wishing, doubting, feeling or planning it (subjunctive)? *Cuando llego* (whenever I arrive — a habit, a fact) vs *cuando llegue* (when I arrive — not yet).
examples:
  - { text: "Ojalá venga.", translation: "Let's hope she comes.", source: "tatoeba:815438" }
  - { text: "Espero que sí.", translation: "I hope so.", source: "tatoeba:762110" }
  - { text: "Quería que vinieras.", translation: "I wanted you to come.", source: "tatoeba:2102052" }
  - { text: "Iré aunque llueva.", translation: "I will go even if it rains.", source: "tatoeba:991342" }
  - { text: "Ojalá pudiera.", translation: "I wish I could.", source: "tatoeba:1793673" }
exercises:
  - type: cloze
    text: "Quiero que tú ___ conmigo."
    answer: "vengas"
    hint: "venir — a wish"
    translation: "I want you to come with me."
  - type: cloze
    text: "Creo que ella ___ razón."
    answer: "tiene"
    hint: "tener — the speaker states it"
    translation: "I think she's right."
  - type: cloze
    text: "Cuando ___ a casa, llámame."
    answer: "llegues"
    hint: "llegar — the future, not yet"
    translation: "When you get home, call me."
  - type: cloze
    text: "Cuando ___ a casa, siempre ceno."
    answer: "llego"
    hint: "llegar — a habit, a fact"
    translation: "When I get home, I always have dinner."
  - type: cloze
    text: "Me alegra que ___ aquí."
    answer: "estés"
    hint: "estar — a feeling"
    translation: "I'm glad you're here."
  - type: cloze
    text: "Si ___ dinero, viajaría más."
    answer: "tuviera"
    hint: "tener — unreal condition"
    translation: "If I had money, I'd travel more."
  - type: cloze
    text: "Busco un piso que ___ barato."
    answer: "sea"
    hint: "ser — an unknown flat"
    translation: "I'm looking for a flat that's cheap."
  - type: cloze
    text: "Es verdad que ___ tarde."
    answer: "es"
    hint: "ser — a fact"
    translation: "It's true that it's late."
