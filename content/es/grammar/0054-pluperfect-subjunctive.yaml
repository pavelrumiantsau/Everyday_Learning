id: es-g-0054
cefr: B1
order: 54
title: "Si hubiera sabido…: the pluperfect subjunctive"
explanation:
  en: |
    **Form:** *hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran* + past participle (*hablado, hecho, visto, dicho*). The *-se* forms (*hubiese, hubieses…*) mean the same.

    It is the past of the subjunctive — for things that **did not happen**:
    - **unreal past condition:** *Si **hubiera sabido**, te lo **habría dicho**.* The result is *habría* + participle; in speech *hubiera* is common there too.
    - **past condition, present result:** *Si **hubiera cogido** ese avión, ahora **estaría** muerto.*
    - **regret** with *ojalá*: *¡Ojalá **hubieras venido**!* — I wish you had come. (*Ojalá vinieras* — I wish you would come.)
    - **como si** + an earlier action: *Parecía **como si hubiera visto** un fantasma.*
    - after a past verb of wish, feeling or doubt, about an **earlier** action: *Me alegré de que **hubieras llegado** bien.*

    Compare: *Si **tuviera** dinero, **compraría** un coche* (now) vs *Si **hubiera tenido** dinero, **habría comprado** un coche* (then).
comparison:
  en: |
    English uses "had + participle" in the same places: *if I had known, I wish I had…, as if he had…*. Russian «если бы я знал» covers both now and then; Spanish separates them: *si supiera* (now) vs *si hubiera sabido* (in the past).
examples:
  - { text: "Si lo hubiera sabido, habría cambiado mi plan.", translation: "If I had known about it, I would have changed my plan.", source: "tatoeba:521121" }
  - { text: "Ojalá lo hubiera sabido.", translation: "I wish I had known.", source: "tatoeba:7980579" }
  - { text: "Ojalá no hubiera dicho eso.", translation: "I wish I hadn't said that.", source: "tatoeba:9983462" }
  - { text: "Si hubiera cogido ese avión, ahora estaría muerto.", translation: "If I had taken that plane, I would be dead now.", source: "tatoeba:941037" }
  - { text: "Parecía como si hubiese visto un fantasma.", translation: "She looked as though she had seen a ghost.", source: "tatoeba:804803" }
exercises:
  - type: cloze
    text: "Si ___ estudiado más, habría aprobado el examen."
    answer: "hubiera"
    also: ["hubiese"]
    hint: "haber — unreal past (yo)"
    translation: "If I had studied more, I would have passed the exam."
  - type: cloze
    text: "Si me lo hubieras dicho, te ___ ayudado."
    answer: "habría"
    also: ["hubiera"]
    hint: "haber — the result (yo)"
    translation: "If you had told me, I would have helped you."
  - type: cloze
    text: "¡Ojalá ___ venido a la fiesta!"
    answer: "hubieras"
    also: ["hubieses"]
    hint: "haber — tú, a regret"
    translation: "I wish you had come to the party!"
  - type: cloze
    text: "Si hubiera salido antes, ahora ___ en casa."
    answer: "estaría"
    hint: "estar — the result now"
    translation: "If I had left earlier, I'd be at home now."
  - type: cloze
    text: "Me miró como si ___ visto un fantasma."
    answer: "hubiera"
    also: ["hubiese"]
    hint: "haber — como si + an earlier action"
    translation: "He looked at me as if he had seen a ghost."
  - type: cloze
    text: "Si lo hubiéramos ___, no habríamos venido."
    answer: "sabido"
    hint: "saber — participle"
    translation: "If we had known, we wouldn't have come."
  - type: cloze
    text: "Me alegré de que tú ___ llegado bien."
    answer: "hubieras"
    also: ["hubieses"]
    hint: "haber — after a past feeling"
    translation: "I was glad you had arrived safely."
  - type: cloze
    text: "Si tuviera dinero, ___ un coche."
    answer: "compraría"
    hint: "comprar — now, not the past"
    translation: "If I had money, I'd buy a car."
