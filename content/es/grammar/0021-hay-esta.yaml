id: es-g-0021
cefr: A1
order: 21
title: "Hay or está? \"There is\" vs \"it is (located)\""
explanation:
  en: |
    **hay** (from *haber*) says that something **exists** — "there is / there are". It never changes: *hay un libro, hay dos libros*.
    - ***Hay** un gato en mi casa.* — There's a cat in my house.
    - *¿**Hay** un problema?* — Is there a problem?

    **está / están** (from *estar*) says **where a known thing is**.
    - *El libro **está** en la mesa.* — The book is on the table.
    - *¿Dónde **está** el baño?* — Where's the toilet?

    The test is the article:
    - **hay** + *un, una*, a number, *mucho*, or no article: *hay **un** bar, hay **tres** bares, hay **mucha** gente, hay pan*
    - **está** + *el, la*, a name, *mi, tu*…: ***el** bar está aquí, **mi** casa está cerca, Madrid está en España*

    Past: **había** (there was, description) and **hubo** (there was, an event); future: **habrá**.
comparison:
  en: |
    Like Russian «есть» vs «находится»: *¿Hay una farmacia cerca?* — «Здесь есть аптека?»; *¿Dónde está la farmacia?* — «Где (находится) аптека?». English uses "there is" for the first and "is" for the second, in the same way.
examples:
  - { text: "Hay un gato en mi casa.", translation: "There's a cat in my house.", source: "tatoeba:1103324" }
  - { text: "¿Hay un problema?", translation: "Is there a problem?", source: "tatoeba:2220504" }
  - { text: "El libro está en la mesa.", translation: "The book is on the table.", source: "tatoeba:2345994" }
  - { text: "¿Dónde está el baño?", translation: "Where's the toilet?", source: "tatoeba:338917" }
  - { text: "Hay un bus en la calle.", translation: "There is a bus on the street.", source: "tatoeba:1547919" }
exercises:
  - type: cloze
    text: "___ un supermercado cerca de mi casa."
    answer: "Hay"
    hint: "exists: a supermarket"
    translation: "There's a supermarket near my house."
  - type: cloze
    text: "El supermercado ___ al lado del banco."
    answer: "está"
    hint: "location of a known thing"
    translation: "The supermarket is next to the bank."
  - type: cloze
    text: "¿Dónde ___ mis llaves?"
    answer: "están"
    hint: "location, plural"
    translation: "Where are my keys?"
  - type: cloze
    text: "En mi clase ___ veinte estudiantes."
    answer: "hay"
    hint: "exists: a number"
    translation: "There are twenty students in my class."
  - type: cloze
    text: "¿___ leche en la nevera?"
    answer: "Hay"
    hint: "exists: no article"
    translation: "Is there any milk in the fridge?"
  - type: cloze
    text: "Madrid ___ en el centro de España."
    answer: "está"
    hint: "location of a name"
    translation: "Madrid is in the centre of Spain."
  - type: cloze
    text: "Ayer ___ un accidente en la carretera."
    answer: "hubo"
    hint: "past event: haber"
    translation: "There was an accident on the road yesterday."
  - type: cloze
    text: "Mañana ___ mucha gente en la playa."
    answer: "habrá"
    hint: "future: haber"
    translation: "There will be a lot of people on the beach tomorrow."
