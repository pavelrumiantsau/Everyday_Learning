id: es-g-0067
cefr: B1
order: 67
title: "Al llegar, antes de salir, fumar es malo: infinitive or gerund?"
explanation:
  en: |
    English "-ing" is usually a Spanish **infinitive**:
    - **as a subject:** ***Fumar** es malo para la salud.* — Smoking is bad… (not ~~Fumando es…~~)
    - **after verbs of liking:** *Me encanta **leer**.* *Odio **esperar**.*
    - **after any preposition** — never a gerund there: *antes de **salir**, después de **comer**, sin **decir** nada, en vez de **trabajar**, gracias por **venir***
    - ***al*** + **infinitive** = when / on doing: ***Al llegar**, no vi a nadie.* = *Cuando llegué…*
    - **signs:** *Prohibido **fumar**.*

    The **gerund** (*-ando / -iendo*) is for:
    - an action in progress: *estar, seguir, llevar, pasar el día* + gerund — *Estoy **leyendo**.* *Pasé el día **viendo** la televisión.*
    - **how / by doing:** *Aprendí español **viendo** series.* *Llegó a casa **llorando**.*

    The gerund is **never a noun or an adjective**: a sleeping bag = *un saco **de dormir***; the people living here = *la gente **que vive** aquí*.
comparison:
  en: |
    The trap is English: "before leaving", "thanks for coming", "swimming is fun" — all infinitives in Spanish (*antes de salir, gracias por venir, nadar es divertido*). Russian helps: where Russian uses an infinitive or a noun («курить вредно», «перед выходом»), Spanish uses the infinitive; where Russian uses a деепричастие («пришла плача», «учил, смотря сериалы»), Spanish uses the gerund.
examples:
  - { text: "Al llegar, no vi a nadie.", translation: "When I arrived, I didn't see anyone.", source: "tatoeba:6632850" }
  - { text: "Péinate antes de salir.", translation: "Comb your hair before you go out.", source: "tatoeba:865707" }
  - { text: "Fumar es malo para la salud.", translation: "Smoking is bad for the health.", source: "tatoeba:338600" }
  - { text: "Odio viajar.", translation: "I hate traveling.", source: "tatoeba:5011313" }
  - { text: "Pasé el día viendo la televisión.", translation: "I spent the day watching TV.", source: "tatoeba:3355208" }
