id: uk-b-0903
part: 9
order: 3
title: "Русское «по» → за, з, на, через"
source: "§9.2"
level: B2
rule: |
  Русское ***по*** в украинском распадается на **разные предлоги** — это одна из самых частых калек:

  - *по закону, по приказу* → ***за законом, за наказом***;
  - *по профессии* → ***за фахом, за професією***;
  - *по вашей просьбе* → ***на ваше прохання***;
  - *по ошибке* → ***помилково***;
  - *по причине болезни* → ***через хворобу***;
  - *комиссия по вопросам* → ***комісія з питань***; *специалист по маркетингу* → ***фахівець з маркетингу***; *экзамен по математике* → ***іспит з математики***;
  - *по месту жительства* → ***за місцем проживання***;
  - *по понедельникам* → ***щопонеділка, у понеділки***;
  - *по телефону* → ***телефоном***.

  **Но:** движение по поверхности — ***по*** верно: *ходити по кімнаті, гуляти по парку*; также *по черзі*.
