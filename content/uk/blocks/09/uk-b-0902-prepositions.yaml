# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §9.2 and §9.6 and standard usage guides. Exercises are append-only.
id: uk-b-0902
part: 9
order: 2
title: "Предлоги: до лікаря, через хворобу, щодо"
source: "§9.2"
level: B2
rule: |
  Предлоги и союзы чаще всего выдают русскоязычного говорящего. Главные:

  - ***до*** + Р. — направление к человеку или месту: *іти **до лікаря**, до школи* (рус. *к врачу*);
  - ***у / в*** + М. — местонахождение: *у місті*; ***на*** + М. — поверхность, событие: *на роботі, на концерті*;
  - ***о*** + М. — точное время: *о п’ятій*;
  - ***через*** + З. — причина, в т. ч. негативная: *через хворобу, через дощ*; ***завдяки*** + Д. — **только позитивная**: *завдяки допомозі*;
  - ***за*** + О. — позади: *за будинком*; ***за*** + З. — «по чему-то», срок: *за законом, за годину*;
  - **цель движения** («сходить за чем») — ***по*** + З.: *піти **по хліб**, по воду, по лікаря* (рус. *за хлебом*); *за хлібом* — калька;
  - ***з*** + Р. — откуда, из чего: *з Києва, з дерева*; ***з*** + О. — вместе с: *з другом*; ***від*** + Р. — от кого: *лист від мами*;
  - ***щодо*** + Р. — относительно; ***між*** + О.; ***серед, біля, коло*** + Р.;
  - ***згідно з*** + О., ***відповідно до*** + Р.: *згідно з наказом, відповідно до закону*.
tables:
  - head: ["Неправильно", "Правильно"]
    rows:
      - ["відносно цього питання", "щодо цього питання"]
      - ["згідно наказу", "згідно з наказом / відповідно до наказу"]
      - ["завдяки хворобі не прийшов", "через хворобу не прийшов"]
      - ["іду к лікарю", "іду до лікаря"]
pairs:
  - { wrong: "відносно цього питання", right: "щодо цього питання" }
  - { wrong: "згідно наказу", right: "згідно з наказом" }
  - { wrong: "завдяки хворобі", right: "через хворобу" }
examples:
  - { text: "Я іду до лікаря, бо через хворобу не спав усю ніч." }
  - { text: "Завдяки вашій допомозі ми встигли вчасно." }
  - { text: "Щодо цього питання я ще не вирішив." }
exercises:
  - { type: cloze, text: "Я йду до ___.", answer: "лікаря", hint: "лікар", explain: "к врачу — до лікаря" }
  - { type: choice, text: "Іду ___ лікаря.", options: ["до", "к"], answer: 0, explain: "направление к человеку — до + Р." }
  - { type: cloze, text: "Він сьогодні на ___.", answer: "роботі", hint: "робота", explain: "на + М. — на роботі" }
  - { type: cloze, text: "Учора ми були на ___.", answer: "концерті", hint: "концерт", explain: "событие — на + М." }
  - { type: choice, text: "Зустрінемося ___ п’ятій.", options: ["о", "в"], answer: 0, explain: "точное время — о + М." }
  - { type: choice, text: "Я не прийшов ___ хворобу.", options: ["через", "завдяки"], answer: 0, explain: "негативная причина — через" }
  - { type: choice, text: "Ми перемогли ___ вашій допомозі.", options: ["завдяки", "через"], answer: 0, explain: "позитивная причина — завдяки + Д." }
  - { type: cloze, text: "Сходи в магазин ___ хліб.", answer: "по", hint: "рус. за хлебом", explain: "цель движения — по + З.: по хліб" }
  - { type: cloze, text: "Машина стоїть за ___.", answer: "будинком", hint: "будинок", explain: "позади — за + О." }
  - { type: cloze, text: "Він упорався за ___.", answer: "годину", hint: "година", explain: "срок — за + З." }
  - { type: choice, text: "Ми діяли ___ законом.", options: ["за", "по"], answer: 0, explain: "по закону — за законом" }
  - { type: cloze, text: "Я отримав лист від ___.", answer: "мами", hint: "мама", explain: "от кого — від + Р." }
  - { type: cloze, text: "Стіл зроблений з ___.", answer: "дерева", hint: "дерево", explain: "из чего — з + Р." }
  - { type: cloze, text: "Вона приїхала з ___.", answer: "Києва", hint: "Київ", explain: "откуда — з + Р." }
  - { type: choice, text: "Що ви думаєте ___ цього питання?", options: ["щодо", "відносно"], answer: 0, explain: "относительно — щодо" }
  - { type: cloze, text: "Між ___ немає секретів.", answer: "нами", hint: "ми", explain: "між + О." }
  - { type: cloze, text: "Серед моїх ___ є лікар.", answer: "друзів", hint: "друзі", explain: "серед + Р." }
  - { type: cloze, text: "Він живе біля ___.", answer: "парку", hint: "парк", explain: "біля + Р." }
  - { type: choice, text: "Діяти згідно ___ інструкцією.", options: ["з", "до"], answer: 0, explain: "згідно з + О." }
  - { type: choice, text: "Відповідно ___ закону.", options: ["до", "з"], answer: 0, explain: "відповідно до + Р." }
  - { type: fix, text: "Відносно цього питання є інша думка.", answer: "Щодо цього питання є інша думка.", explain: "относительно — щодо" }
  - { type: fix, text: "Згідно наказу школу зачинили.", answer: "Згідно з наказом школу зачинили.", also: ["Відповідно до наказу школу зачинили."], explain: "згідно з + О. / відповідно до + Р." }
  - { type: fix, text: "Завдяки хворобі він не прийшов.", answer: "Через хворобу він не прийшов.", explain: "завдяки — только о хорошем" }
  - { type: fix, text: "Я іду к лікарю.", answer: "Я іду до лікаря.", also: ["Я йду до лікаря."], explain: "к врачу — до лікаря" }
