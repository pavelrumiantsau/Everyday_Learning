id: uk-b-0906
part: 9
order: 6
title: "Междометия и повторение служебных слов"
source: "§9.5–9.6"
level: B2
rule: |
  **Междометия:** *ой, ай, ого, овва* (удивление), ***агов*** (оклик «эй!»), *гей*, ***цить*** (тихо!), *ба*, *гай-гай* (сожаление о прошлом). Их уместное употребление сильно добавляет естественности устной речи.

  **Типичные ошибки в служебных словах (§9.6):**
  - ✗ *відносно цього питання* → ✓ ***щодо цього питання***;
  - ✗ *згідно наказу* → ✓ ***згідно з наказом / відповідно до наказу***;
  - ✗ *завдяки хворобі не прийшов* → ✓ ***через хворобу не прийшов***;
  - ✗ *краще, чим учора* → ✓ ***краще, ніж учора***;
  - ✗ *Прийдеш ли ти?* → ✓ ***Чи ти прийдеш?***;
  - ✗ *іду к лікарю* → ✓ ***іду до лікаря***;
  - и русское *по*: ✓ *за законом, на ваше прохання, комісія з питань*.
pairs:
  - { wrong: "відносно цього питання", right: "щодо цього питання" }
  - { wrong: "краще, чим учора", right: "краще, ніж учора" }
  - { wrong: "іду к лікарю", right: "іду до лікаря" }
examples:
  - { text: "Агов, хто там?" }
  - { text: "Цить, дитина спить!" }
  - { text: "Ого, яка гарна сукня!" }
