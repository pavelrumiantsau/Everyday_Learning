# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §9.3 and standard grammar. Exercises are append-only.
id: uk-b-0904
part: 9
order: 4
title: "Союзы: ніж, бо, щоб, хоча, ніби"
source: "§9.3"
level: B2
rule: |
  - ***і, й, та*** — «и» (см. блок 2.7); ***а, але, проте, однак, зате*** — противопоставление;
  - ***або, чи*** — «или»;
  - ***бо, тому що, оскільки*** — причина; ***тому, тож, отже*** — следствие;
  - ***якщо / якби*** — реальное / нереальное условие;
  - ***що / щоб*** — «что» / «чтобы»;
  - ***хоча, хоч*** — уступка;
  - ***коли, поки, доки, щойно, як тільки*** — время;
  - ***ніби, наче, немов, мов*** — «будто»;
  - ***ніж*** — «чем» при сравнении.

  ***Чим*** в значении русского «чем» при сравнении — **ошибка**; допустимо только в паре ***чим… тим***: *чим більше читаєш, тим краще пишеш*.

  ***Бо*** — очень частотный и нейтральный союз, равный «потому что / ведь» (как белорусское *бо*). ***Як*** — и «как», и (в разговорной речи) «когда / если»: *як прийдеш, то поговоримо*.
tables:
  - head: ["Значение", "Союзы", "Пример"]
    rows:
      - ["причина", "бо, тому що, оскільки", "не прийшов, бо захворів"]
      - ["следствие", "тому, тож, отже", "захворів, тому не прийшов"]
      - ["уступка", "хоча, хоч", "хоча було пізно, він працював"]
      - ["время", "коли, поки, доки, щойно", "щойно приїду, подзвоню"]
      - ["сравнение", "ніж, ніби, наче", "краще пізно, ніж ніколи"]
pairs:
  - { wrong: "краще, чим учора", right: "краще, ніж учора" }
examples:
  - { text: "Він не прийшов, бо захворів." }
  - { text: "Чим більше читаєш, тим краще пишеш." }
  - { text: "Щойно приїду, одразу подзвоню." }
