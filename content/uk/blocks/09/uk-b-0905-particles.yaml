# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §9.4 and standard grammar. Exercises are append-only.
id: uk-b-0905
part: 9
order: 5
title: "Частицы: чи, хіба, невже, аж, -таки"
source: "§9.4"
level: B2
rule: |
  ***Чи*** — главное отличие от русского. В нейтральном и письменном **общем вопросе** оно стоит **в начале**: *Чи можна запитати?* И в косвенном вопросе: *Не знаю, чи він удома.* Сравните с белорусским *ці* и литовским *ar*: *Ar tu ateisi?* — та же модель. В разговоре вопрос можно задать интонацией, но *чи* звучит литературнее. Русского *ли* в украинском нет.

  - ***хіба, невже*** — удивление, сомнение: *Хіба ти не знав? Невже це правда?*
  - ***не / ні*** — отрицание / усиленное отрицание, ответ «нет»: *не знаю; ні слова; — Ні.*
  - ***ж / же*** — «ведь, же»: *це ж очевидно*;
  - ***аж*** — усиление «даже, целых»: *чекав аж дві години*;
  - ***лише, тільки, лишень*** — «только»;
  - ***-таки*** — «всё-таки»: *таки прийшов, все-таки*;
  - ***-но*** — смягчение приказа: *скажи-но, дай-но*;
  - ***хай, нехай*** — «пусть»; ***ось, от*** — «вот».
tables:
  - head: ["Частица", "Функция", "Пример"]
    rows:
      - ["чи", "общий вопрос (рус. ли / интонация)", "Чи ти прийдеш? Не знаю, чи він удома."]
      - ["хіба, невже", "удивление, сомнение", "Хіба ти не знав?"]
      - ["аж", "«даже, целых»", "чекав аж дві години"]
      - ["-таки", "«всё-таки»", "таки прийшов"]
      - ["-но", "смягчение приказа", "скажи-но"]
pairs:
  - { wrong: "Прийдеш ли ти?", right: "Чи ти прийдеш?" }
  - { wrong: "Не знаю, вдома ли він.", right: "Не знаю, чи він удома." }
examples:
  - { text: "Чи можна запитати?" }
  - { text: "Я чекав аж дві години, але він таки прийшов." }
  - { text: "Хіба ти не чув новину?" }
