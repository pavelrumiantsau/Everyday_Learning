# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §9.1 and Український правопис 2019. Exercises are append-only.
id: uk-b-0901
part: 9
order: 1
title: "Наречие: образование и написание (вранці, по-моєму, на жаль)"
source: "§9.1"
level: B2
strict: true
rule: |
  **Образование** от прилагательных — суффиксы ***-о*** (*швидко, гарно, тепло*) и ***-е*** (*добре, гаряче, синьо*). **Степени:** *швидше, найшвидше, якнайшвидше; більш / менш вдало, найбільш вдало*.

  ***Теж*** и ***також*** близки, но *також* чаще значит «кроме того» и звучит нейтральнее в письменной речи.

  **Слитно** (предлог + слово стали одним наречием): *вдень, вранці, ввечері / увечері, вгорі, внизу, додому, назавжди, напам’ять, навпаки, удвох, зранку, наостанку*.

  **Через дефис:** *по-моєму, по-українськи / по-українському, будь-коли, де-не-де, віч-на-віч, пліч-о-пліч, давним-давно*.

  **Раздельно** (сохраняют связь с существительным): *до речі, на жаль, на щастя, з радістю, без кінця, час від часу, до побачення, на добраніч*.
tables:
  - head: ["Слитно", "Через дефис", "Раздельно"]
    rows:
      - ["вдень, вранці, ввечері", "по-моєму, по-українськи", "до речі, на жаль"]
      - ["додому, назавжди, напам’ять", "будь-коли, де-не-де", "на щастя, з радістю"]
      - ["навпаки, удвох, зранку", "віч-на-віч, пліч-о-пліч", "час від часу, до побачення"]
pairs:
  - { wrong: "нажаль", right: "на жаль" }
  - { wrong: "доречі", right: "до речі" }
  - { wrong: "по моєму", right: "по-моєму" }
examples:
  - { text: "На жаль, я не зможу прийти ввечері." }
  - { text: "По-моєму, він вивчив вірш напам’ять." }
  - { text: "До речі, ми ходимо туди час від часу." }
