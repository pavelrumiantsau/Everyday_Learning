# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §13.4 and Караванський «Практичний словник синонімів». Exercises are append-only.
id: uk-b-1304
part: 13
order: 4
title: "Синонимы вместо повторов"
source: "§13.4"
level: C1
rule: |
  Речь C1 избегает повторов одного и того же слова. Самые нужные ряды (§13.4):

  - **«Сказать»:** *зазначити* (отметить), *наголосити, підкреслити* (подчеркнуть), *стверджувати* (утверждать), *повідомити* (сообщить), *додати* (добавить), *мовити* (книжн.).
  - **«Большой»:** *великий, чималий* (немалый), *значний* (значительный), *величезний* (огромный), *вагомий* (весомый — о вкладе).
  - **«Очень»:** *дуже, вельми* (весьма), *надзвичайно* (чрезвычайно), *вкрай* (крайне), *великою мірою* (в значительной мере).
  - **«Важный»:** *важливий, суттєвий* (существенный), *вирішальний* (решающий), *ключовий* (ключевой).

  Словарь синонимов для C1 — С. Караванський, «Практичний словник синонімів української мови».
tables:
  - head: ["Значение", "Синонимы"]
    rows:
      - ["сказать", "зазначити, наголосити, підкреслити, стверджувати, повідомити, додати"]
      - ["большой", "чималий, значний, величезний, вагомий"]
      - ["очень", "вельми, надзвичайно, вкрай, великою мірою"]
      - ["важный", "суттєвий, вирішальний, ключовий"]
pairs:
  - { wrong: "Він сказав… і ще сказав…", right: "Він зазначив… і додав…" }
examples:
