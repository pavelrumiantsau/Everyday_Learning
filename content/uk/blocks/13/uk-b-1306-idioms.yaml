# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §13.6 (and several of the most frequent idioms). Exercises are append-only.
id: uk-b-1306
part: 13
order: 6
title: "Фразеологизмы"
source: "§13.6"
level: C1
rule: |
  Для C1 достаточно **уверенно понимать** фразеологизмы и **активно использовать 20–30 самых частотных**.

  - *бити байдики* — бездельничать; *пекти раків* — краснеть от стыда;
  - *дати гарбуза* — отказать жениху; *накивати п’ятами* — удрать;
  - *збити з пантелику* — сбить с толку; *водити за ніс* — обманывать;
  - *товкти воду в ступі* — заниматься пустым делом;
  - *як грім серед ясного неба* — как снег на голову;
  - *ні пари з вуст* — ни слова; *як з гуски вода* — как с гуся вода;
  - *кури не клюють* — очень много (денег); *хоч греблю гати* — очень много;
  - *клювати носом* — дремать; *ні в зуб ногою* — ничего не знать;
  - *як у воду дивився* — как в воду глядел; *тримати язик за зубами* — молчать.
