# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §13.3 and standard stylistics. Exercises are append-only.
id: uk-b-1303
part: 13
order: 3
title: "Связки для аргументации"
source: "§13.3"
level: C1
rule: |
  - **добавить:** *крім того, щобільше, ба більше, також, до того ж* (не *більше того*);
  - **уточнить:** *зокрема, а саме, тобто, інакше кажучи*;
  - **противопоставить:** *натомість, водночас, проте, утім, щоправда*;
  - **причина:** *з огляду на, через те що, оскільки, завдяки тому що*;
  - **вывод:** *отже, відтак, тож, у такий спосіб, зрештою*;
  - **уступка:** *попри це, незважаючи на, хоч як було*;
  - **мнение:** *на мою думку, на мій погляд, я переконаний, що*.

  ***Таким чином*** в значении «следовательно» встречается часто, но редакторы советуют заменять его на ***отже, відтак***.
