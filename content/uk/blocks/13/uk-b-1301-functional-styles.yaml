# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §13.1 and standard stylistics. Exercises are append-only.
id: uk-b-1301
part: 13
order: 1
title: "Функциональные стили"
source: "§13.1"
level: C1
rule: |
  На уровне C1 нужно уметь **переключать регистры**: писать деловое письмо, строить аргументацию со связками и естественно звучать в разговоре.

  - ***Офіційно-діловий*** — точность, стандартные формулы: формы на *-но / -то*, *відповідно до, згідно з*;
  - ***науковий*** — логика, термины, авторское «ми»: *у статті розглянуто, слід зазначити, з огляду на*;
  - ***публіцистичний*** — оценочность, экспрессия: риторические вопросы, фразеологизмы;
  - ***художній*** — образность: инверсия, давнопрошедшее время, уменьшительные формы;
  - ***розмовний*** — спонтанность: частицы, междометия, звательный, *ходімо, та ну!*
tables:
  - head: ["Стиль", "Черты", "Типичные средства"]
    rows:
      - ["офіційно-діловий", "точность, стандартные формулы", "формы на -но/-то, відповідно до, згідно з"]
      - ["науковий", "логика, термины, авторское «ми»", "у статті розглянуто, слід зазначити, з огляду на"]
      - ["публіцистичний", "оценочность, экспрессия", "риторические вопросы, фразеологизмы"]
      - ["художній", "образность", "инверсия, давноминулий час, уменьшительные"]
      - ["розмовний", "спонтанность", "частицы, междометия, ходімо, та ну!"]
pairs:
  - { wrong: "Нами було розглянуто питання (в статье)", right: "У статті розглянуто питання" }
examples:
  - { text: "Відповідно до наказу роботу завершено вчасно." }
  - { text: "У статті розглянуто вплив клімату на врожайність." }
  - { text: "Та ну! Ходімо краще в кіно!" }
exercises:
  - { type: choice, text: "«Відповідно до наказу роботу завершено». Який це стиль?", options: ["офіційно-діловий", "розмовний"], answer: 0, explain: "відповідно до + форма на -но — деловой" }
  - { type: choice, text: "«У статті розглянуто вплив клімату на врожайність». Який стиль?", options: ["науковий", "художній"], answer: 0, explain: "у статті розглянуто — научный" }
  - { type: choice, text: "«Та ну! Ходімо краще в кіно!» Який стиль?", options: ["розмовний", "офіційно-діловий"], answer: 0, explain: "междометия, ходімо — разговорный" }
  - { type: choice, text: "«Хіба можна мовчати, коли гинуть ліси?» Який стиль?", options: ["публіцистичний", "науковий"], answer: 0, explain: "риторический вопрос — публицистический" }
  - { type: choice, text: "«Степ широкий, а над ним сонечко ясне». Який стиль?", options: ["художній", "офіційно-діловий"], answer: 0, explain: "инверсия, уменьшительное — художественный" }
  - { type: choice, text: "Яка фраза підходить для наукової статті?", options: ["Слід зазначити, що результати попередні.", "Ну, результати поки так собі."], answer: 0, explain: "научный стиль — слід зазначити" }
  - { type: choice, text: "Яка фраза підходить для офіційного документа?", options: ["Згідно з договором оплату здійснено.", "Ми вже заплатили, як домовлялися."], answer: 0, explain: "деловой — згідно з, форма на -но" }
  - { type: choice, text: "Яка фраза підходить для розмови з другом?", options: ["Ходімо на каву!", "Пропонуємо відвідати кав’ярню."], answer: 0, explain: "разговорный — ходімо" }
  - { type: choice, text: "Що типово для наукового стилю?", options: ["авторське «ми»", "вигуки"], answer: 0, explain: "научный — авторское «ми»" }
  - { type: choice, text: "Що типово для художнього стилю?", options: ["інверсія та образність", "стандартні формули"], answer: 0, explain: "художественный — образность" }
  - { type: choice, text: "Що типово для офіційно-ділового стилю?", options: ["форми на -но, -то", "риторичні запитання"], answer: 0, explain: "деловой — формы на -но/-то" }
  - { type: choice, text: "Як написати в науковій статті?", options: ["З огляду на ці дані, зробимо висновок.", "Глянувши на ці дані, вирішимо."], answer: 0, explain: "з огляду на — научный оборот" }
  - { type: fix, text: "Нами в статті було розглянуто проблему.", answer: "У статті розглянуто проблему.", explain: "научный стиль: у статті розглянуто, без «нами»" }
  - { type: fix, text: "Мною зроблено висновок, що метод ефективний.", answer: "Ми дійшли висновку, що метод ефективний.", also: ["Можна зробити висновок, що метод ефективний."], explain: "авторское «ми» вместо «мною»" }
  - { type: fix, text: "Згідно наказу роботу завершили.", answer: "Згідно з наказом роботу завершено.", also: ["Відповідно до наказу роботу завершено."], explain: "деловой: згідно з + форма на -но" }
  - { type: cloze, text: "У статті ___ нові методи.", answer: "розглянуто", hint: "розглянути, -то", explain: "научный стиль: форма на -то" }
  - { type: cloze, text: "___ зазначити, що дослідження триває.", answer: "Слід", hint: "следует", explain: "научный: слід зазначити" }
  - { type: cloze, text: "___ до закону документ анульовано.", answer: "Відповідно", hint: "в соответствии", explain: "деловой: відповідно до" }
  - { type: cloze, text: "___ на результати, ми продовжимо роботу.", answer: "З огляду", hint: "учитывая", explain: "научный: з огляду на" }
  - { type: judge, text: "У статті розглянуто три підходи.", correct: true, explain: "научный стиль" }
  - { type: judge, text: "Договір підписано обома сторонами.", correct: false, fix: "Договір підписали обидві сторони.", explain: "исполнителя в О. в. при форме на -но лучше не указывать" }
  - { type: judge, text: "Ходімо, бо запізнимося!", correct: true, explain: "разговорный стиль" }
