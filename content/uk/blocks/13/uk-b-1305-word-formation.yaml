# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §13.5 and standard grammar. Exercises are append-only.
id: uk-b-1305
part: 13
order: 5
title: "Словообразование и уменьшительные формы"
source: "§13.5"
level: C1
rule: |
  - ***-ник, -ач, -альник, -увач*** — деятель: *працівник, слухач, викладач, читач, відпочивальник, завідувач, керівник*;
  - ***-ість, -ння, -ство / -цтво*** — абстрактное понятие, процесс: *відповідальність, щедрість, навчання, товариство, керівництво*;
  - ***-к(а), -иня, -иця, -еса*** — феминитивы: *викладачка, філологиня, учениця, поетеса* (блок 3.7);
  - ***-еньк-, -оньк-, -есеньк-*** — ласка (прилагательные и наречия): *тихенький, сивенький, біленький, малесенький, тихенько*;
  - ***-ик, -чик, -очк-, -ечк-, -уся, -еня*** — уменьшение, ласка: *столик, ручечка, матуся, сонечко, кошеня*.

  Уменьшительные формы в украинском **гораздо употребительнее**, чем в русском, особенно в разговорной и художественной речи.
tables:
  - head: ["Суффикс", "Значение", "Примеры"]
    rows:
      - ["-ник, -ач, -альник, -увач", "деятель", "працівник, слухач, відпочивальник, завідувач"]
