      - ["-к(а), -иня, -иця, -еса", "феминитив", "викладачка, філологиня, учениця, поетеса"]
      - ["-еньк-, -оньк-, -есеньк-", "ласка (прил.)", "тихенький, сивенький, малесенький"]
      - ["-ик, -очк-, -ечк-, -уся, -еня", "уменьшение, ласка", "столик, ручечка, матуся, сонечко, кошеня"]
