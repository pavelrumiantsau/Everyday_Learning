  - { type: fix, text: "Ми приймемо участь у конференції.", answer: "Ми візьмемо участь у конференції.", also: ["Ми братимемо участь у конференції."], explain: "брати участь" }
  - { type: judge, text: "Шановна пані Ганно! Повідомляємо, що Вашу заяву розглянуто.", correct: true, explain: "звательный; Вашу с заглавной; форма на -но" }
  - { type: judge, text: "Шановний колега!", correct: false, fix: "Шановний колего!", explain: "обращение — звательный: колего" }
