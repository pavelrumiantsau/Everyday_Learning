# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §13.2 and standard business-writing guides. Exercises are append-only.
id: uk-b-1302
part: 13
order: 2
title: "Деловое письмо"
source: "§13.2"
level: C1
rule: |
  - **Обращение — в звательном падеже:** *Шановний пане Іване! Шановна пані Олено! Шановні колеги!*
  - **Вежливое *Ви, Ваш*** в письме одному адресату — **с заглавной**.
  - **Формулы:**
    - *У відповідь на Ваш лист від…*
    - *Прошу розглянути…*
    - *Повідомляємо, що…*
    - *Заздалегідь дякуємо.*
    - *Будемо вдячні за відповідь.*
    - *З повагою,* (подпись)

  Кальки деловой речи (Часть 12) в письмах заметнее всего: *приймати участь, на протязі, згідно наказу, в якості*.
tables:
  - head: ["Часть письма", "Формула"]
    rows:
      - ["обращение", "Шановний пане Іване! / Шановна пані Олено!"]
      - ["начало", "У відповідь на Ваш лист від 10 травня…"]
      - ["просьба", "Прошу розглянути можливість…"]
      - ["сообщение", "Повідомляємо, що…"]
      - ["благодарность", "Заздалегідь дякуємо. Будемо вдячні за відповідь."]
      - ["завершение", "З повагою, Олена Коваленко"]
pairs:
  - { wrong: "Шановний пан Іван!", right: "Шановний пане Іване!" }
  - { wrong: "Дякуємо вас за співпрацю.", right: "Дякуємо Вам за співпрацю." }
examples:
  - { text: "Шановна пані Олено! У відповідь на Ваш лист повідомляємо, що зустріч відбудеться в понеділок." }
  - { text: "Прошу розглянути мою заяву. Заздалегідь дякую." }
  - { text: "Будемо вдячні за відповідь. З повагою, Андрій Мельник." }
exercises:
  - { type: cloze, text: "Шановний ___!", answer: "пане Іване", hint: "пан Іван", explain: "обращение — звательный: пане Іване" }
  - { type: cloze, text: "Шановна ___!", answer: "пані Олено", hint: "пані Олена", explain: "пані + имя в звательном" }
  - { type: cloze, text: "Шановні ___!", answer: "колеги", hint: "колеги", explain: "мн. ч.: звательный = именительный" }
  - { type: cloze, text: "У відповідь на ___ лист від 10 травня повідомляємо…", answer: "Ваш", hint: "ваш (одному адресату)", explain: "одному адресату — Ваш с заглавной" }
  - { type: cloze, text: "Прошу ___ мою заяву.", answer: "розглянути", hint: "рассмотреть", explain: "формула: прошу розглянути" }
  - { type: cloze, text: "___, що нараду перенесено.", answer: "Повідомляємо", hint: "сообщаем", explain: "формула: повідомляємо, що…" }
  - { type: cloze, text: "___ дякуємо за співпрацю.", answer: "Заздалегідь", hint: "заранее", explain: "формула: заздалегідь дякуємо" }
  - { type: cloze, text: "Будемо ___ за відповідь.", answer: "вдячні", hint: "благодарны", explain: "формула: будемо вдячні" }
  - { type: cloze, text: "З ___, Олена Коваленко", answer: "повагою", hint: "с уважением", explain: "формула: з повагою" }
  - { type: choice, text: "Як почати лист?", options: ["Шановний пане директоре!", "Шановний пан директор!"], answer: 0, explain: "обращение — звательный" }
  - { type: choice, text: "Як звернутися до однієї особи в листі?", options: ["Дякуємо Вам за допомогу.", "Дякуємо вас за допомогу."], answer: 0, explain: "дякувати кому; Вам — с заглавной" }
  - { type: choice, text: "Як завершити лист?", options: ["З повагою, Андрій Мельник", "Поважаючи, Андрій Мельник"], answer: 0, explain: "стандартная формула: З повагою" }
  - { type: choice, text: "Як точніше написати в листі?", options: ["Прошу надати інформацію щодо графіка.", "Прошу надати інформацію відносно графіка."], answer: 0, explain: "относительно — щодо" }
  - { type: choice, text: "Як написати в листі?", options: ["Відповідно до договору оплату здійснено.", "У відповідності з договором оплату здійснено."], answer: 0, explain: "у відповідності з → відповідно до" }
  - { type: choice, text: "Як повідомити про участь?", options: ["Наша компанія братиме участь у виставці.", "Наша компанія прийматиме участь у виставці."], answer: 0, explain: "брати участь" }
  - { type: fix, text: "Шановний пан Петренко!", answer: "Шановний пане Петренку!", explain: "обращение — звательный: пане Петренку" }
  - { type: fix, text: "На протязі місяця просимо надіслати звіт.", answer: "Протягом місяця просимо надіслати звіт.", explain: "на протязі → протягом" }
