# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §6.2 and standard grammar. Exercises are append-only.
id: uk-b-0602
part: 6
order: 2
title: "Числительное + существительное: два роки, півтора року"
source: "§6.2"
level: B1
rule: |
  **Ключевое отличие от русского:** после ***2, 3, 4*** (и 22, 33, 44…) существительное стоит в **именительном множественного**, а не в родительном единственного: ***два роки*** (два года), ***три дні*** (три дня), ***чотири студенти***.

  - ***1, 21, 31…*** — именительный ед. ч.: *один стіл, двадцять одна гривня*;
  - ***2, 3, 4*** — именительный мн. ч.: *два столи, три сестри, чотири вікна*;
  - ***5 и больше*** — родительный мн. ч.: *п’ять столів, десять сестер*;
  - ***півтора / півтори*** — родительный ед. ч.: *півтора року, півтори години*;
  - **дроби** — родительный ед. ч.: *п’ять восьмих метра, 2,5 відсотка* (*дві цілих п’ять десятих відсотка*).

  **Прилагательное после 2–4** чаще в именительном, реже в родительном мн. ч.: *два нові будинки / два нових будинки*.
tables:
  - head: ["Числительное", "Существительное", "Примеры"]
    rows:
      - ["1, 21, 31…", "Н. ед.", "один стіл, двадцять одна гривня"]
      - ["2, 3, 4 (22, 33…)", "Н. мн.", "два столи, три сестри, чотири вікна"]
      - ["5 и больше", "Р. мн.", "п’ять столів, десять сестер"]
      - ["півтора / півтори", "Р. ед.", "півтора року, півтори години"]
      - ["дроби", "Р. ед.", "п’ять восьмих метра, 2,5 відсотка"]
pairs:
  - { wrong: "два рока, три дня", right: "два роки, три дні" }
  - { wrong: "півтора роки", right: "півтора року" }
  - { wrong: "2,5 відсотків", right: "2,5 відсотка" }
examples:
  - { text: "Я живу в Києві вже два роки." }
  - { text: "Фільм триває півтори години." }
  - { text: "Ціни зросли на 2,5 відсотка." }
