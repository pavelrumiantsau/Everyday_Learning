id: uk-b-0605
part: 6
order: 5
title: "Время: котра година? о пів на шосту"
source: "§6.5"
level: B1
rule: |
  **Вопрос:** ***Котра година?*** (а не *скільки часу?*). «Во сколько?» — ***О котрій?*** — *о п’ятій, о пів на шосту*.

  Время называют **порядковыми числительными женского рода** (*година* подразумевается):
  - 14:00 — *друга година дня*, *чотирнадцята година*;
  - 14:15 — *чверть на третю*, *п’ятнадцять хвилин на третю*;
  - 14:30 — ***пів на третю***;
  - 14:45 — ***за чверть третя***;
  - 14:50 — *за десять хвилин третя*.

  Логика «половина следующего часа» знакома по литовскому: *pusė trijų* = 2:30 = *пів на третю*.

  **Типичные ошибки:** *скільки зараз часу?* → ***котра зараз година?***; *в п’ять годин* → ***о п’ятій (годині)***.
tables:
