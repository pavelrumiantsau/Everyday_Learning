      - ["14:15", "чверть на третю, п’ятнадцять хвилин на третю"]
      - ["14:30", "пів на третю"]
      - ["14:45", "за чверть третя"]
      - ["14:50", "за десять хвилин третя"]
      - ["О 17:00", "о п’ятій, о сімнадцятій годині"]
