# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §6.4 and standard grammar. Exercises are append-only.
id: uk-b-0604
part: 6
order: 4
title: "Порядковые числительные и даты"
source: "§6.4"
level: B1
rule: |
  **Порядковые** склоняются как твёрдые прилагательные (*перший, другий, п’ятий*), кроме мягкого ***третій*** (*на третьому поверсі*).

  **В составных порядковых склоняется только последнее слово:** *у дві тисячі двадцять шостому році, до дві тисячі тридцятого року, у тисяча дев’ятсот дев’яносто п’ятому році*. Русская модель «в двух тысяч…» здесь — ошибка.

  **Дата:**
  - *що?* — ***п’ятнадцяте листопада*** (*Сьогодні п’ятнадцяте листопада*);
  - *коли?* — ***п’ятнадцятого листопада*** (*Я народився п’ятнадцятого листопада*).

  **Месяц в дате всегда в родительном:** *січня, лютого, березня, квітня, травня, червня, липня, серпня, вересня, жовтня, листопада, грудня*.

  Названия месяцев славянские и частично совпадают с белорусскими (*ліпень, верасень, лістапад*), а с литовским — по принципу: лит. *liepa* (липа) = укр. *липень* (оба от липы).
tables:
