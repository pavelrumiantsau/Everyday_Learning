# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §6.1 and standard grammar. Exercises are append-only.
id: uk-b-0601
part: 6
order: 1
title: "Склонение количественных числительных"
source: "§6.1"
level: B2
rule: |
  Украинские числительные склоняются почти как русские, но у числительных **от 5 до 80 есть параллельные формы**: *п’яти / п’ятьох, п’ятьма / п’ятьома*.

  - ***Один*** склоняется как прилагательное: *одного, одному, одним*; ж. р. *однієї / одної, одній, одну, однією / одною*.
  - ***Два, три, чотири***: *двох, двом, двома; трьох, трьом, трьома; чотирьох, чотирьом, **чотирма*** (не *чотирьома*!).
  - ***11–19, 20, 30, 50–80*** склоняются как *п’ять*: *двадцяти / двадцятьох, двадцятьма / двадцятьома*.
  - ***Сорок, дев’яносто, сто*** во всех косвенных падежах имеют одну форму: *сорока, дев’яноста, ста*.
  - **Сотни:** *двісті — двохсот — двомстам — двомастами — (на) двохстах*; *п’ятсот — п’ятисот — п’ятистам — п’ятьмастами / п’ятьомастами — (на) п’ятистах*.
  - ***Тисяча*** склоняется как существительное I склонения, ***мільйон, мільярд*** — как II.
  - В составных количественных **склоняется каждая часть**: *з двома тисячами п’ятьмастами сорока трьома гривнями*.
