  - { type: spot, text: "Я чекаю тебе півтора роки.", wrong: "роки", answer: "року", explain: "півтора — Р. ед.: року" }
  - { type: spot, text: "Ціни зросли на 3,5 відсотків.", wrong: "відсотків", answer: "відсотка", explain: "дробь — Р. ед.: відсотка" }
