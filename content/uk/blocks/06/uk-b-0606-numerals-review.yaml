# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 6 (course PDF §6.6 «Типичные ошибки»). Written with Claude Code. Exercises are append-only.
id: uk-b-0606
part: 6
order: 6
title: "Числительное: повторение и типичные ошибки"
source: "§6.6"
level: B2
rule: |
  Типичные ошибки русскоязычных в числительном (§6.6):

  - ✗ *два рока, три дня* → ✓ ***два роки, три дні***;
  - ✗ *скільки зараз часу?* → ✓ ***котра зараз година?***;
  - ✗ *в п’ять годин* → ✓ ***о п’ятій (годині)***;
  - ✗ *чотирьома* → ✓ ***чотирма***;
  - ✗ *два цілих п’ять десятих відсотків* → ✓ ***дві цілих п’ять десятих відсотка***;
  - ✗ *півтора роки* → ✓ ***півтора року***;
  - ✗ *у двох тисяч двадцять шостому році* → ✓ ***у дві тисячі двадцять шостому році***.

  Плюс собирательные (*троє дітей, обидві сестри*) и даты (*п’ятнадцятого листопада*).
pairs:
  - { wrong: "два рока", right: "два роки" }
  - { wrong: "з чотирьома", right: "з чотирма" }
  - { wrong: "півтора роки", right: "півтора року" }
examples:
  - { text: "Ми прожили в Одесі три роки й чотири місяці." }
  - { text: "О котрій ти прийдеш? — О пів на сьому." }
  - { text: "У нас троє дітей, і обидві доньки вже дорослі." }
exercises:
