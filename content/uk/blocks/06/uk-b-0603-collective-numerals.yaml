# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §6.3 and standard grammar. Exercises are append-only.
id: uk-b-0603
part: 6
order: 3
title: "Собирательные числительные: двоє, троє, обидва"
source: "§6.3"
level: B2
rule: |
  ***Двоє, троє, четверо, п’ятеро, шестеро, семеро, десятеро…*** употребляются:
  - с существительными мужского и общего рода, обозначающими людей: *двоє студентів*;
  - со словами ***діти, люди***: *троє дітей*;
  - с существительными IV склонения: *п’ятеро курчат, троє кошенят*;
  - со словами, имеющими только множественное число: *двоє дверей, двоє штанів*.

  После них — **родительный множественного**. Склоняются как количественные: *двох, трьох, п’ятьох; двома, трьома, п’ятьма*.

  ***Обидва*** (м. и ср. р.), ***обидві*** (ж. р.), ***обоє*** (люди разного пола, дети): *обидва брати, обидві сестри, обоє — і син, і донька*.
tables:
  - head: ["Слово", "С чем", "Пример"]
    rows:
      - ["двоє, троє, четверо…", "люди (м. р.), діти, люди, IV скл., только мн.", "троє дітей, двоє дверей"]
      - ["обидва", "м. и ср. р.", "обидва брати, обидва вікна"]
      - ["обидві", "ж. р.", "обидві сестри"]
      - ["обоє", "люди разного пола, дети", "обоє прийшли"]
pairs:
  - { wrong: "три дітей", right: "троє дітей" }
  - { wrong: "обидва подруги", right: "обидві подруги" }
examples:
  - { text: "У нас троє дітей: двоє синів і донька." }
  - { text: "Обидві сестри вчаться в університеті." }
  - { text: "У кішки народилося п’ятеро кошенят." }
exercises:
  - { type: cloze, text: "У нас ___ дітей.", answer: "троє", hint: "3, собирательное", explain: "с діти — собирательное: троє" }
  - { type: cloze, text: "До кімнати зайшли ___ студентів.", answer: "двоє", hint: "2, собирательное", explain: "люди мужского рода: двоє студентів" }
  - { type: cloze, text: "У кішки ___ кошенят.", answer: "п’ятеро", hint: "5, собирательное", explain: "IV склонение: п’ятеро кошенят" }
  - { type: cloze, text: "У будинку ___ дверей.", answer: "двоє", hint: "2, собирательное", explain: "только мн. ч.: двоє дверей" }
  - { type: cloze, text: "Нас було ___.", answer: "четверо", hint: "4, собирательное", explain: "о людях: четверо" }
  - { type: cloze, text: "___ людей чекали на автобус.", answer: "Десятеро", hint: "10, собирательное", explain: "с люди — собирательное" }
  - { type: cloze, text: "На лавці сиділо ___ хлопців.", answer: "шестеро", hint: "6, собирательное", explain: "люди мужского рода: шестеро" }
  - { type: cloze, text: "У сім’ї ___ синів.", answer: "семеро", hint: "7, собирательное", explain: "люди мужского рода: семеро" }
  - { type: choice, text: "___ брати пішли до школи.", options: ["Обидва", "Обидві"], answer: 0, explain: "мужской род: обидва" }
  - { type: choice, text: "___ сестри вчаться в університеті.", options: ["Обидві", "Обидва"], answer: 0, explain: "женский род: обидві" }
  - { type: choice, text: "___ — і син, і донька — прийшли додому.", options: ["Обоє", "Обидва"], answer: 0, explain: "люди разного пола: обоє" }
  - { type: choice, text: "___ вікна відчинені.", options: ["Обидва", "Обидві"], answer: 0, explain: "средний род: обидва" }
  - { type: choice, text: "У нас ___ дітей.", options: ["троє", "три"], answer: 0, explain: "с діти — собирательное" }
  - { type: choice, text: "Прийшли ___ студенти.", options: ["три", "троє"], answer: 0, explain: "три + Н. мн. (троє + Р. мн.: троє студентів)" }
  - { type: choice, text: "Прийшло ___ студентів.", options: ["троє", "три"], answer: 0, explain: "троє + Р. мн." }
  - { type: choice, text: "Я купив ___ штанів.", options: ["двоє", "два"], answer: 0, explain: "только мн. ч.: двоє штанів" }
  - { type: cloze, text: "Я купив подарунки для ___ дітей.", answer: "трьох", hint: "троє", explain: "Р. в.: трьох" }
  - { type: cloze, text: "Мати пишається ___ синами.", answer: "п’ятьма", also: ["п’ятьома"], hint: "п’ятеро", explain: "О. в.: п’ятьма / п’ятьома" }
  - { type: cloze, text: "Ми говорили з ___ учнями.", answer: "двома", hint: "двоє", explain: "О. в.: двома" }
  - { type: judge, text: "У нас двоє дітей.", correct: true, explain: "двоє дітей — норма" }
  - { type: judge, text: "У неї три дітей.", correct: false, fix: "У неї троє дітей.", explain: "с діти — собирательное" }
  - { type: judge, text: "Обидві сестри прийшли.", correct: true, explain: "женский род: обидві" }
  - { type: judge, text: "Обидва подруги прийшли.", correct: false, fix: "Обидві подруги прийшли.", explain: "женский род: обидві" }
