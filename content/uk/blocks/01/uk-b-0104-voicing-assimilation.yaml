# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §1.4–1.6 and standard phonetics. Exercises are append-only.
id: uk-b-0104
part: 1
order: 4
title: "Нет оглушения, звук [ў], уподобление"
source: "§1.4–1.6"
level: B2
rule: |
  **Звонкие согласные не оглушаются** — ни в конце слова, ни перед глухими: *дуб* [дуб], *хліб* [хл’іб], *ніж* [н’іж], *казка* [казка], *ложка* [ложка]. В русском и белорусском здесь оглушение, поэтому это один из самых заметных акцентов.
  - Исключение: ***г* перед *к, т* → [х]**: *легко* [лехко], *нігті* [н’іхт’і], *вогкий*.

  **Глухие перед звонкими озвончаются:** *боротьба* [бород’ба], *вокзал* [воґзал], *просьба* [проз’ба].

  **В в конце слога** звучит как [ў] (как в белорусском): *вовк* [воўк], *любов* [л’убоў], *читав* [читаў], *правда* [праўда]. Не [ф]!

  **Уподобление** — пишется по морфемам, произносится иначе:
  - *-ться* → долгое [ц’:]: *сміється* [с’м’ійец’:а], *робиться* [робиц’:а];
  - *-шся* → долгое [с’:]: *смієшся* [с’м’ійес’:а];
  - *з* перед шипящим → шипящий: *зчистити* [шчистити];
  - шипящий перед *ц* → свистящий: *книжці* [книз’ц’і], *мишці* [мис’ц’і].
