# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §1.7–1.8 and §3.2–3.3, Український правопис 2019. Exercises are append-only.
id: uk-b-0105
part: 1
order: 5
title: "Дж, дз, долгие согласные, апостроф"
source: "§1.7–1.8"
level: B1
rule: |
  ***Дж, дз* в одной морфеме — один звук**, как в белорусском: *джерело, дзвін, ходжу, ґудзик*. **На стыке приставки и корня — два звука:** *підживити, відзначити* (*під-, від-* + корень).

  **Долгие согласные** произносятся дольше, а не дважды: *життя* [жит’:а], *знання, волосся, зілля*. Русскому *-ье, -ие* (*житьё, знание*) часто соответствует украинское удвоение + *-я* — как в белорусском *жыццё, веданне*. Если после согласного нет гласного, удвоения нет: *знання — знань*.

  **Апостроф** перед *я, ю, є, ї* показывает, что согласный твёрдый, а дальше звучит [й]: *м’ясо* [мйасо], *сім’я* [с’імйа]. Основные случаи:
  - после губных: *п’ять, м’ясо, в’язати*;
  - после *р* в конце слога: *бур’ян, подвір’я*;
  - после приставок на согласный: *з’їзд, від’їзд*.

  **Апостроф не пишется**, если *я, ю* обозначают мягкость (*буря, бюро*) и если перед губным стоит другой согласный корня (*свято, цвях*). Подробно — в Части 3.
tables:
  - head: ["Пишем", "Говорим", "Почему"]
    rows:
      - ["джерело, ходжу", "один звук [дж]", "одна морфема"]
      - ["підживити", "[д] + [ж]", "приставка під-"]
      - ["життя, знання", "[т’:], [н’:]", "долгий мягкий согласный"]
      - ["м’ясо", "[мйасо]", "апостроф: твёрдый м + [й]"]
      - ["буря", "[бур’а]", "мягкий р — без апострофа"]
pairs:
  - { wrong: "мясо", right: "м’ясо" }
  - { wrong: "житя", right: "життя" }
  - { wrong: "бур’я (буря)", right: "буря" }
examples:
  - { text: "Таке життя!" }
  - { text: "У нас велика сім’я." }
  - { text: "Біля дороги б’є джерело." }
  - { text: "Цей день треба відзначити." }
