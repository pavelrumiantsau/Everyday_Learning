  - { type: choice, text: "У слові «підживити» дж — це…", options: ["два звуки", "один звук"], answer: 0, explain: "приставка під- + корень: [д] + [ж]" }
  - { type: choice, text: "У слові «дзвін» дз — це…", options: ["один звук", "два звуки"], answer: 0, explain: "дз в одной морфеме — один звук" }
  - { type: choice, text: "У слові «відзначити» дз — це…", options: ["два звуки", "один звук"], answer: 0, explain: "приставка від- + корень: [д] + [з]" }
  - { type: choice, text: "У слові «ходжу» дж — це…", options: ["один звук", "два звуки"], answer: 0, explain: "чередование д → дж в корне: один звук" }
  - { type: choice, text: "У слові «ґудзик» дз — це…", options: ["один звук", "два звуки"], answer: 0, explain: "дз в корне — один звук" }
