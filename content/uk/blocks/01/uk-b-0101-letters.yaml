# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §1.1–1.2 and Український правопис 2019. Exercises are append-only.
id: uk-b-0101
part: 1
order: 1
title: "Буквы, которые читаются не как в русском"
source: "§1.1–1.2"
level: B1
rule: |
  В украинском алфавите 33 буквы: **нет *ё, ъ, ы, э***, зато есть *ґ, є, і, ї*. Апостроф (’) — не буква, а знак: он делает то, что в русском делает разделительный *ъ* (*в’їзд*, рус. *въезд*).

  - ***и*** — звук между русскими *ы* и *и*; согласный перед ним **не смягчается**: *дим, син, риба* (рус. *ы*).
  - ***і*** — как русское *и*, согласный перед ним мягкий: *ліс, ніс, сіль*.
  - ***ї*** — всегда два звука [йі]: *їжак, мої, Україна, в’їзд*.
  - ***е*** — как русское *э*, согласный перед ним твёрдый: *село, тепер, небо*. Русское начальное *э* → *е*: *екран, етап*.
  - ***є*** — [йе] в начале слова и после гласного (*Європа, моє*), а после согласного — мягкость + [е] (*синє*).
  - ***г*** — фрикативный звонкий звук (как в белорусском и южнорусском): *гора, голова, берег*.
  - ***ґ*** — взрывной, как русское *г*, в небольшом списке слов: *ґанок, ґудзик, ґрунт, аґрус, ґава*.
  - ***щ*** — всегда два звука [шч]: *що, щастя, борщ*.

  В транскрипции ниже *г* означает украинский фрикативный звук, *’* — мягкость.
tables:
  - caption: "Буквы и звуки"
    head: ["Буква", "Звук", "Примеры", "Русский"]
    rows:
      - ["и", "[и], не смягчает", "дим, син", "ближе к ы"]
      - ["і", "[і], смягчает", "ліс, сіль", "и"]
      - ["ї", "[йі]", "їжак, мої", "—"]
      - ["е", "[е], согласный твёрдый", "село, тепер", "э"]
      - ["є", "[йе] / мягкость + е", "Європа, синє", "е"]
      - ["г", "фрикативный", "гора, берег", "нет в норме"]
      - ["ґ", "взрывной", "ґанок, ґудзик", "г"]
      - ["щ", "[шч]", "що, щастя", "щ [ш’:]"]
pairs:
  - { wrong: "въїзд", right: "в’їзд" }
  - { wrong: "Украіна", right: "Україна" }
  - { wrong: "Это мій друг.", right: "Це мій друг." }
examples:
  - { text: "Мій син живе в Україні." }
  - { text: "Що ти сьогодні їв на обід?" }
  - { text: "Біля ґанку росте аґрус." }
  - { text: "Це моє улюблене село." }
exercises:
  - { type: choice, text: "Мій ___ навчається у Львові.", options: ["син", "сін"], answer: 0, explain: "рус. ы → укр. и: син (рус. сын)" }
  - { type: choice, text: "На вечерю була смажена ___.", options: ["риба", "ріба"], answer: 0, explain: "рус. ы → укр. и: риба" }
  - { type: choice, text: "Увечері ми підемо в ___.", options: ["кіно", "кино"], answer: 0, explain: "после к перед гласным в заимствованиях — і: кіно (правило дев’ятки, §3.5)" }
  - { type: choice, text: "Ми живемо в ___.", options: ["Україні", "Украіні"], answer: 0, explain: "после гласного звук [йі] пишется ї" }
  - { type: choice, text: "Це ___ книжки.", options: ["мої", "моі"], answer: 0, explain: "после гласного [йі] → ї: мої" }
  - { type: choice, text: "Це ___ місто.", options: ["моє", "мое"], answer: 0, explain: "после гласного [йе] → є: моє" }
  - { type: choice, text: "На ___ телефона тріщина.", options: ["екрані", "єкрані"], answer: 0, explain: "русское начальное э → е: екран" }
  - { type: choice, text: "На сорочці відірвався ___.", options: ["ґудзик", "гудзик"], answer: 0, explain: "ґудзик — одно из слов с ґ" }
  - { type: choice, text: "Діти сидять на ___.", options: ["ґанку", "ганку"], answer: 0, explain: "ґанок — с ґ" }
  - { type: choice, text: "У саду росте ___.", options: ["аґрус", "агрус"], answer: 0, explain: "аґрус — с ґ" }
  - { type: choice, text: "Тут добрий ___ для пшениці.", options: ["ґрунт", "грунт"], answer: 0, explain: "ґрунт — с ґ" }
  - { type: choice, text: "Як звучить г у слові «гора»?", options: ["фрикативний (як у білоруській)", "вибуховий (як російське г)"], answer: 0, explain: "буква г — всегда фрикативный звук" }
  - { type: choice, text: "Як звучить ґ у слові «ґанок»?", options: ["вибуховий (як російське г)", "фрикативний (як у білоруській)"], answer: 0, explain: "ґ — взрывной звук" }
  - { type: choice, text: "Як читається «дим»?", options: ["д твердий, и — середній звук", "д м’який, и звучить як [і]"], answer: 0, explain: "перед и согласный не смягчается" }
  - { type: choice, text: "Як читається «ліс»?", options: ["[л’іс] — л м’який", "[лис] — л твердий"], answer: 0, explain: "перед і согласный мягкий" }
  - { type: choice, text: "Як читається «село»?", options: ["[село] — с твердий", "[с’ело] — с м’який"], answer: 0, explain: "перед е согласный твёрдый" }
  - { type: choice, text: "Як читається «синє»?", options: ["[син’е]", "[с’ин’йе]"], answer: 0, explain: "после согласного є = мягкость + [е]; перед и с твёрдый" }
  - { type: choice, text: "Як читається «моє»?", options: ["[мойе]", "[мое]"], answer: 0, explain: "после гласного є = [йе]" }
  - { type: choice, text: "Як читається «їжак»?", options: ["[йіжак]", "[іжак]"], answer: 0, explain: "ї — всегда [йі]" }
  - { type: choice, text: "Як читається «єнот»?", options: ["[йенот]", "[енот]"], answer: 0, explain: "в начале слова є = [йе]" }
  - { type: choice, text: "Як читається «щастя»?", options: ["[шчаст’а]", "[шаст’а]"], answer: 0, explain: "щ — всегда два звука [шч]" }
  - { type: choice, text: "Як читається «борщ»?", options: ["[боршч]", "[борш]"], answer: 0, explain: "щ = [шч] и в конце слова" }
  - { type: judge, text: "Ми въїхали в місто.", correct: false, fix: "Ми в’їхали в місто.", explain: "в украинском нет ъ — вместо него апостроф" }
  - { type: judge, text: "Ёлка стоїть у кімнаті.", correct: false, fix: "Ялинка стоїть у кімнаті.", explain: "буквы ё нет; ёлка — ялинка" }
  - { type: judge, text: "Это мій друг.", correct: false, fix: "Це мій друг.", explain: "буквы э нет; «это» — це" }
  - { type: judge, text: "Сьогодні ми їдемо до Європи.", correct: true, explain: "Європа — в начале є = [йе]; їдемо — ї = [йі]" }
