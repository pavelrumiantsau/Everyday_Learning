id: uk-b-0103
part: 1
order: 3
title: "Согласные: твёрдость и мягкость"
source: "§1.4"
level: B1
rule: |
  **Мягкими могут быть только девять согласных:** *д, т, з, с, ц, л, н, дз, р*. Мягкость обозначают *ь, я, ю, є, і*: *день, сіль, тюльпан, буря*.

  Остальные согласные **всегда твёрдые**, перед *і* — полумягкие:
  - губные *б, п, в, м, ф*: после них *ь* не пишется — *сім, кров, степ, любов* (рус. *семь, кровь, степь, любовь*);
  - шипящие *ж, ч, ш, дж*: ***ч* твёрдый** — *чай, чотири, ніч* (рус. мягкое *ч*); после них *ь* в конце не пишется — *ніч, піч* (рус. *ночь, печь*);
  - *г, ґ, к, х*: *кит, хитрий*.

  **Перед *е* согласный твёрдый:** *тепер* [тепер], *день* [ден’]. **Перед *и* — твёрдый:** *низький, тихо*. **Перед *і* — мягкий или полумягкий:** *дім* [д’ім], *білий*.

  ***Р* в конце слога и слова всегда твёрдый:** *кобзар, вечір, секретар* (но в формах с гласным — мягкий: *кобзаря*). Отсюда *гіркий* (рус. *горький*).
