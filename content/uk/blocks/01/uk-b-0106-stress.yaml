id: uk-b-0106
part: 1
order: 6
title: "Ударение (наголос)"
source: "§1.9"
level: B2
rule: |
  Ударение в украинском **свободное и подвижное**, как в русском, поэтому его учат вместе со словом. Опасность для русскоязычного — переносить русское ударение в похожие слова.

  **Правило приставки *ви-*:** в глаголах совершенного вида *ви-* всегда ударная: ***ви́***пити, ***ви́***нести, ***ви́***писати, ***ви́***рішити, ***ви́***йти. В существительных с *ви-* ударение обычно тоже на приставке (*ви́хід, ви́мова, ви́падок, ви́бір*), но есть исключения: *вимо́га*.

  **Слова, где ударение не как в русском** (самые частые):
  - кіломе́тр (рус. кило́метр), ката́лог (рус. катало́г)
  - одина́дцять, чотирна́дцять, п'ятна́дцять (рус. оди́ннадцать, четы́рнадцать)
  - ненави́сть (рус. не́нависть), кропива́ (рус. крапи́ва)
  - були́ (рус. бы́ли), легки́й (рус. лёгкий), ко́лесо (рус. колесо́)

  **Слова, в которых часто ошибаются:** поми́лка, оці́нка, завда́ння, яки́й.

  Проверяйте ударение по словарю: goroh.pp.ua или «Орфоепічний словник».
