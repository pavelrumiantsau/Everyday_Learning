      - ["весна", "ве́сни", "е"]
      - ["сестра", "се́стри", "е"]
      - ["зима", "зи́ми", "и"]
      - ["писати", "пи́ше", "и"]
      - ["широкий", "ши́рше", "и"]
pairs:
  - { wrong: "[малако]", right: "[молоко]" }
  - { wrong: "сило", right: "село" }
  - { wrong: "зема", right: "зима" }
