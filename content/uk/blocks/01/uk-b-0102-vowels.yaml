# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §1.3 and standard phonetics. Exercises are append-only.
id: uk-b-0102
part: 1
order: 2
title: "Гласные: нет аканья, безударные е и и"
source: "§1.3"
level: B1
rule: |
  Гласных звуков шесть: [а], [о], [у], [е], [и], [і].

  **Нет аканья.** Безударное *о* произносится как [о]: *молоко* [молоко], *голова* [голова], *вода* [вода]. Это главное отличие от русского и белорусского (*малако*). Перед слогом с ударным [у] *о* может приближаться к [у]: *кожух, зозуля*.

  **Безударные *е* и *и* сближаются:** *село* звучит почти как [сеило], *зима* — как [зиема]. Поэтому написание проверяют **ударением**: *село — се́ла*, *зима — зи́ми*, *весна — ве́сни*, *писати — пи́ше*. Гласные *а, у, і* без ударения не меняются.

  **Я, ю, є, ї — два звука** [йа], [йу], [йе], [йі] в начале слова, после гласного и после апострофа (*яма, моя, м’ята*); после согласного *я, ю, є* обозначают его мягкость (*ляля, люди*). *Ї* всегда [йі] и после согласных не пишется.
tables:
  - caption: "Проверка безударных е / и"
    head: ["Слово", "Проверка", "Пишем"]
    rows:
