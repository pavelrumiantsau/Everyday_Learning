# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §10.3 and standard usage guides. Exercises are append-only.
id: uk-b-1004
part: 10
order: 4
title: "Безличные предложения: треба, слід, варто; щоб підвищити"
source: "§10.3"
level: B2
rule: |
  **Безличные и инфинитивные предложения:**
  - состояние: *Мені холодно. Надворі тепло.*
  - модальность: ***треба, потрібно, слід, варто, можна, не можна***: *Слід зазначити… Варто спробувати. Мені треба йти.*
  - формы на *-но / -то*: *Проєкт затверджено* (блок 8.10).

  Русские *нужно, следует, стоит* → ***треба / потрібно, слід, варто*** (не *нужно, слідує, стоїть*).

  **Украинский любит глагольные конструкции вместо отглагольных существительных:** ***щоб підвищити якість*** лучше, чем *з метою підвищення якості*.
tables:
  - head: ["Русский", "Українська"]
    rows:
      - ["нужно, надо", "треба, потрібно"]
      - ["следует отметить", "слід зазначити"]
      - ["стоит попробовать", "варто спробувати"]
      - ["с целью повышения качества", "щоб підвищити якість"]
pairs:
  - { wrong: "мені нужно", right: "мені треба" }
  - { wrong: "слідує зазначити", right: "слід зазначити" }
  - { wrong: "стоїть спробувати", right: "варто спробувати" }
examples:
  - { text: "Мені холодно, треба вдягнути светр." }
  - { text: "Слід зазначити, що проєкт успішний." }
  - { text: "Ми працюємо, щоб підвищити якість." }
