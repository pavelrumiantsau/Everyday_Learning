# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §10.4–10.5 and standard grammar. Exercises are append-only.
id: uk-b-1005
part: 10
order: 5
title: "Сложные предложения и порядок слов"
source: "§10.4–10.5"
level: B2
rule: |
  **Типы придаточных:**
  - изъяснительные: ***що, чи***: *Знаю, що він згоден. Не знаю, чи він згоден.*
  - желание, просьба: ***щоб*** + прошедшее: *Хочу, щоб ти прийшов.*
  - цель: ***щоб*** + инфинитив: *Приїхав, щоб допомогти.*
  - определительные: ***який, що, чий, де***: *Місто, де я народився.*
  - причина: ***бо, тому що, через те що, оскільки***;
  - условие: ***якщо, якби, як***; уступка: ***хоча, хоч, незважаючи на те що***;
  - время: ***коли, поки, доки, щойно, після того як***;
  - сравнение: ***ніж, ніби, наче, як***.

  **Косвенная речь** строится как в русском, **без согласования времён**: *Він сказав, що прийде.*

  **Порядок слов** свободный; нейтральный — подлежащее, сказуемое, дополнение. **Новая информация обычно стоит в конце**: *У кімнату зайшла вчителька* (важно, кто вошёл). Безударные местоимения и частицы *б, ж* тяготеют к началу: *Я б йому це сказав.* Прилагательное после существительного (*степ широкий*) — черта поэзии и народной песни.
