# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §10.1 (table, verbs) and standard usage guides. Exercises are append-only.
id: uk-b-1001
part: 10
order: 1
title: "Управление глаголов: дякую вам, хворіти на грип"
source: "§10.1"
level: B2
rule: |
  Синтаксис украинского близок к русскому, поэтому на уровне C1 главное — **точное управление**: какой падеж и предлог требует слово.

  - *благодарить кого* → ***дякувати кому***: *дякую вам*;
  - *извините меня* → ***вибачте мені, пробачте мені***;
  - *смеяться над кем* → ***сміятися з кого, глузувати з кого***;
  - *болеть гриппом* → ***хворіти на грип***; *хворий на діабет*;
  - *жениться на ком* → ***одружитися з ким***; *выйти замуж за кого* → ***вийти заміж за кого***;
  - *изменить кому* → ***зрадити кого***;
  - *скучать по кому* → ***сумувати за ким, скучати за ким***;
  - *заботиться о ком* → ***піклуватися про кого, дбати про кого***;
  - *следить за чем* → *стежити за чим*; *касаться чего* → *торкатися чого*; *гордиться кем* → *пишатися ким*;
  - *ждать кого* → ***чекати кого / на кого***; *звонить кому* → *телефонувати кому, дзвонити кому*;
  - *обратиться к кому* → ***звернутися до кого***; *принимать участие* → ***брати участь у чому***.
tables:
  - head: ["Русский", "Українська"]
    rows:
      - ["благодарить кого", "дякувати кому"]
      - ["извините меня", "вибачте мені"]
      - ["болеть гриппом", "хворіти на грип"]
      - ["жениться на ком", "одружитися з ким"]
      - ["изменить кому", "зрадити кого"]
      - ["скучать по кому", "сумувати за ким"]
      - ["заботиться о ком", "піклуватися про кого"]
      - ["обратиться к кому", "звернутися до кого"]
pairs:
  - { wrong: "дякую вас", right: "дякую вам" }
  - { wrong: "хворіти грипом", right: "хворіти на грип" }
  - { wrong: "він зрадив дружині", right: "він зрадив дружину" }
examples:
  - { text: "Дякую вам за допомогу!" }
  - { text: "Мій брат хворіє на грип." }
  - { text: "Я сумую за тобою." }
