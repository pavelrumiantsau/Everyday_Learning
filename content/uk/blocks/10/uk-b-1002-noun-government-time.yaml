id: uk-b-1002
part: 10
order: 2
title: "Управление существительных и прилагательных; минулого року"
source: "§10.1"
level: B2
rule: |
  - *похож на кого* → ***схожий на кого, подібний до кого***;
  - *равнодушный к чему* → ***байдужий до чого***;
  - *говорить на украинском языке* → ***говорити (розмовляти) українською мовою***;
  - *экзамен по математике* → ***іспит з математики***; *учебник по истории* → ***підручник з історії***;
  - *ехать поездом / на поезде* → ***їхати потягом***;
  - *в прошлом году, этой зимой* → ***минулого року, цієї зими***;
  - *в понедельник, по утрам* → ***у понеділок, щоранку / вранці***.

  **Время в родительном без предлога** — очень характерная украинская модель: ***минулого тижня, наступного місяця, цього разу, того дня***.
tables:
