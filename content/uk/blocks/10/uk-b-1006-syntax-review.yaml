# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 10 (course PDF §10.6 «Типичные ошибки»). Written with Claude Code. Exercises are append-only.
id: uk-b-1006
part: 10
order: 6
title: "Синтаксис и управление: повторение"
source: "§10.6"
level: B2
rule: |
  Типичные ошибки русскоязычных в управлении (§10.6):

  - ✗ *дякую вас* → ✓ ***дякую вам***;
  - ✗ *хворіти грипом* → ✓ ***хворіти на грип***;
  - ✗ *розмовляти на українській мові* → ✓ ***розмовляти українською (мовою)***;
  - ✗ *в минулому році* → ✓ ***минулого року***;
  - ✗ *іспит по фізиці* → ✓ ***іспит з фізики***;
  - ✗ *приймати участь* → ✓ ***брати участь***;
  - ✗ *він зрадив дружині* → ✓ ***він зрадив дружину***.

  Плюс *мені треба* (не *нужно*), *слід зазначити*, *щоб підвищити* вместо *з метою підвищення*, вежливое *Ви праві*.
pairs:
  - { wrong: "дякую вас", right: "дякую вам" }
  - { wrong: "в минулому році", right: "минулого року" }
  - { wrong: "приймати участь", right: "брати участь" }
examples:
  - { text: "Дякую вам: минулого року ви допомогли мені скласти іспит з фізики." }
  - { text: "Ми розмовляємо українською і беремо участь у конференції." }
  - { text: "Слід зазначити, що він хворів на грип." }
exercises:
