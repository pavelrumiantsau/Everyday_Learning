# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §10.2 and standard grammar. Exercises are append-only.
id: uk-b-1003
part: 10
order: 3
title: "Согласование: ми з братом пішли, Ви праві"
source: "§10.2"
level: B2
rule: |
  - ***Ми з братом пішли*** — сказуемое во множественном числе, как в русском.
  - С ***більшість, частина, ряд*** и собирательными числительными **возможны оба числа**: *більшість студентів прийшла / прийшли, двоє дітей грало / гралися*. Множественное подчёркивает активность каждого.
  - **Вежливое *Ви* к одному человеку:** глагол и прилагательное **во множественном числе**: *Ви праві, Ви дуже люб’язні*.
  - **Названия должностей мужского рода при женщине:** сказуемое согласуется по смыслу (*директор підписала*), но в современной норме лучше феминитив: ***директорка підписала***.
tables:
  - head: ["Случай", "Пример"]
    rows:
      - ["ми з кимось", "Ми з братом пішли."]
      - ["більшість, частина, ряд", "Більшість прийшла / прийшли."]
      - ["собирательные", "Двоє дітей грало / гралися."]
      - ["вежливое Ви", "Ви праві. Ви дуже люб’язні."]
      - ["должность при женщине", "Директорка підписала (директор підписала)."]
pairs:
  - { wrong: "Ви прав", right: "Ви праві" }
  - { wrong: "ми з братом пішов", right: "ми з братом пішли" }
examples:
  - { text: "Ми з сестрою поїхали до бабусі." }
  - { text: "Пане директоре, Ви праві." }
  - { text: "Більшість студентів склали іспит." }
