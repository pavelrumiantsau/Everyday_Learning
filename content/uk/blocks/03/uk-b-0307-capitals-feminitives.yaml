# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.7, §10.2, §13.5 and Український правопис 2019. Exercises are append-only.
id: uk-b-0307
part: 3
order: 7
title: "Заглавные буквы и феминитивы"
source: "§3.7"
level: B2
rule: |
  **Должности в неофициальных текстах — со строчной:** *вибори президента, розпорядження прем’єр-міністра, зустріч із міністром*.

  **Товарные знаки** — с заглавной в кавычках (*кава «Ранок»*), но со строчной, когда это нарицательное слово.

  **Феминитивы.** Правопис 2019 закрепляет феминитивы: *директорка, філологиня, поетеса*. В современном украинском они **нейтральны** и широко употребляются в СМИ и документах. Суффиксы:
  - ***-к(а)***: *директорка, студентка, журналістка, авторка, лікарка, вчителька*;
  - ***-иня***: *філологиня, психологиня, продавчиня*;
  - ***-иця***: *керівниця, учениця*;
  - ***-еса***: *поетеса*.

  Если о женщине сказано мужским словом, сказуемое согласуется по смыслу (*директор підписала*), но в современной норме лучше феминитив: ***директорка підписала***.
tables:
  - head: ["Он", "Она", "Суффикс"]
    rows:
      - ["директор, студент, автор", "директорка, студентка, авторка", "-к(а)"]
      - ["філолог, психолог, продавець", "філологиня, психологиня, продавчиня", "-иня"]
      - ["керівник, учень", "керівниця, учениця", "-иця"]
      - ["поет", "поетеса", "-еса"]
pairs:
  - { wrong: "вибори Президента (в новостях)", right: "вибори президента" }
  - { wrong: "директор підписала", right: "директорка підписала" }
examples:
  - { text: "Наша директорка підписала наказ." }
  - { text: "Леся Українка — відома українська поетеса." }
  - { text: "У новинах говорили про вибори президента." }
