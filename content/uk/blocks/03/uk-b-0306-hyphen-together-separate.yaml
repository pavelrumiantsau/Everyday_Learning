# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.6 and Український правопис 2019. Exercises are append-only.
id: uk-b-0306
part: 3
order: 6
title: "Слитно, раздельно, через дефис; пів"
source: "§3.6"
level: B2
strict: true
rule: |
  **Слитно (с 2019 года):**
  - первые части *анти-, контр-, віце-, екс-, лейб-, обер-, штабс-, унтер-*: *віцепрезидент, ексміністр, антивірус, контрнаступ*;
  - *міні-, мікро-, супер-, топ-, прес-, веб-, поп-, флеш-*: *пресконференція, вебсайт, топменеджер, мінісукня*;
  - прилагательные из подчинительных сочетаний: *сільськогосподарський, залізобетонний*;
  - частицы *аби-, де-, ні-, що-* в местоимениях и наречиях: *абихто, деякий, ніхто, щоразу*.

  **Через дефис:**
  - прилагательные из равноправных частей и оттенки цвета: *науково-технічний, жовто-блакитний, темно-синій*;
  - частицы *будь-, -небудь, казна-, хтозна-, бозна-* и *-то, -таки, -бо, -но*: *будь-хто, що-небудь, казна-що, все-таки, скажи-но*.

  **Раздельно:** ***пів*** в значении «половина» перед родительным (с 2019): *пів години, пів яблука, пів Києва*; но слитно, если это одно понятие: *півострів, півмісяць, півколо*.

  ***Не*** с глаголами — раздельно (*не знаю*), кроме слов, которые без *не* не употребляются (*ненавидіти, нездужати*). С существительными и прилагательными — слитно, если без *не* слово не употребляется или есть синоним без *не*: *неправда* (= брехня), *невеликий* (= малий).
tables:
  - head: ["Слитно", "Через дефис", "Раздельно"]
    rows:
      - ["віцепрезидент, пресконференція", "жовто-блакитний, темно-синій", "пів години, пів яблука"]
      - ["ніхто, деякий, щоразу", "будь-хто, що-небудь, все-таки", "не знаю"]
      - ["півострів, неправда", "скажи-но", "—"]
pairs:
  - { wrong: "прес-конференція", right: "пресконференція" }
  - { wrong: "півгодини", right: "пів години" }
  - { wrong: "будь хто", right: "будь-хто" }
examples:
  - { text: "Віцепрезидент компанії провів пресконференцію." }
  - { text: "Я чекав пів години, а він усе-таки не прийшов." }
  - { text: "Над містом майорить жовто-блакитний прапор." }
