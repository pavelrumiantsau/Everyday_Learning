  - { type: choice, text: "Це дуже складна ___.", options: ["система", "сістема"], answer: 0, explain: "с из «дев’ятки» → и" }
  - { type: choice, text: "Напиши ___ п’ять.", options: ["цифру", "ціфру"], answer: 0, explain: "ц из «дев’ятки» → и" }
  - { type: choice, text: "У мене новий ___ роботи.", options: ["режим", "режім"], answer: 0, explain: "ж из «дев’ятки» → и" }
  - { type: choice, text: "Відчуй ___ музики.", options: ["ритм", "рітм"], answer: 0, explain: "р из «дев’ятки» → и" }
  - { type: choice, text: "Наш ___ дуже вимогливий.", options: ["директор", "діректор"], answer: 0, explain: "д из «дев’ятки» перед согласным → и" }
  - { type: choice, text: "Мені подобається класична ___.", options: ["музика", "музіка"], answer: 0, explain: "з из «дев’ятки» → и" }
