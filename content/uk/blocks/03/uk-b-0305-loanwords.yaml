# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.5 and Український правопис 2019. Exercises are append-only.
id: uk-b-0305
part: 3
order: 5
title: "Заимствования: правило дев’ятки, проєкт"
source: "§3.5"
level: B2
strict: true
rule: |
  **«Правило дев’ятки»:** после ***д, т, з, с, ц, ж, ч, ш, р*** перед согласным пишется ***и***: *диплом, система, цифра, режим, ритм, директор, музика*. В остальных случаях — ***і***: *біологія, кіно, таксі, гітара, фізика, інженер*, а также перед гласным: *діагноз*.

  **Звук [й] в заимствованиях** передаётся буквами *є, ї, ю, я* по произношению: ***проєкт***, *траєкторія, конвеєр, плеєр, феєрверк, фоє*.

  **Мягкий знак** пишется после *д, т, з, с, ц, л, н* перед *я, ю, є, ї, о*: *бульйон, медальйон, віньєтка, Ньютон*.

  **Русские фамилии на *-ой*** передаются через *-ий*: *Донський, Трубецький*; исключение — *Толстой*.

  Апостроф в заимствованиях (*комп’ютер, інтерв’ю*) — в блоке «Апостроф».
tables:
  - head: ["После д, т, з, с, ц, ж, ч, ш, р + согласный → и", "В остальных случаях → і"]
    rows:
      - ["диплом, система, цифра", "біологія, кіно, таксі"]
      - ["режим, ритм, директор", "гітара, фізика, інженер"]
      - ["музика, фізик", "діагноз (перед гласным)"]
pairs:
  - { wrong: "проект", right: "проєкт" }
  - { wrong: "сістема", right: "система" }
  - { wrong: "бульон", right: "бульйон" }
examples:
  - { text: "Директор схвалив наш новий проєкт." }
  - { text: "Інженер пояснив, як працює система." }
  - { text: "Мама зварила курячий бульйон." }
exercises:
