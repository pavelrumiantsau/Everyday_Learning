  - { type: choice, text: "Над містом спалахнув ___.", options: ["феєрверк", "фейєрверк"], answer: 0, explain: "[й] передаётся є: феєрверк" }
  - { type: choice, text: "Зустрінемося у ___ театру.", options: ["фоє", "фойє"], answer: 0, explain: "[й] передаётся є: фоє" }
