  - { type: choice, text: "Треба ___ дроти.", options: ["від’єднати", "відєднати"], answer: 0, explain: "после приставки від- → апостроф" }
  - { type: choice, text: "Учитель ___ правило.", options: ["роз’яснив", "розяснив"], answer: 0, explain: "после приставки роз- → апостроф" }
