  - { type: choice, text: "Бабуся ___ светр.", options: ["в’яже", "вяже"], answer: 0, explain: "после губного перед я → апостроф" }
  - { type: choice, text: "Тут ___ болото.", options: ["торф’яне", "торфяне"], answer: 0, explain: "после губного ф перед я → апостроф (р перед ним не мешает)" }
  - { type: choice, text: "У дворі ростуть ___.", options: ["бур’яни", "буряни"], answer: 0, explain: "после р в конце слога → апостроф" }
  - { type: choice, text: "Діти граються на ___.", options: ["подвір’ї", "подвірї"], answer: 0, explain: "после р в конце слога → апостроф" }
  - { type: choice, text: "Мою сестру звати ___.", options: ["Мар’яна", "Маряна"], answer: 0, explain: "после р в конце слога → апостроф" }
  - { type: choice, text: "На городі ростуть ___.", options: ["буряки", "бур’яки"], answer: 0, explain: "р мягкий → апостроф не нужен" }
  - { type: choice, text: "Діти стали в ___.", options: ["ряд", "р’яд"], answer: 0, explain: "р мягкий → апостроф не нужен" }
