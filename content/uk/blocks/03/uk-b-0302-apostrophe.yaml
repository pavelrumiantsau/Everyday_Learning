  - { type: choice, text: "Я купив новий ___.", options: ["рюкзак", "р’юкзак"], answer: 0, explain: "ю обозначает мягкость → без апострофа" }
  - { type: choice, text: "Це ___ ініціатива.", options: ["пан’європейська", "панєвропейська"], answer: 0, explain: "после первой части сложного слова → апостроф" }
  - { type: choice, text: "Без води квіти ___.", options: ["в’януть", "вянуть"], answer: 0, explain: "после губного перед я → апостроф" }
