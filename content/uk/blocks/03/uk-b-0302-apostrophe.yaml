# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.2 and Український правопис 2019. Exercises are append-only.
id: uk-b-0302
part: 3
order: 2
title: "Апостроф"
source: "§3.2"
level: B2
strict: true
rule: |
  Апостроф ставится перед *я, ю, є, ї*, когда они обозначают **[й] + гласный**:

  - **после губных *б, п, в, м, ф***: *б’ю, п’ять, в’язати, м’ясо, торф’яний*. **Не ставится**, если перед губным стоит другой согласный корня (кроме *р*): *свято, цвях*; но *верб’я, торф’яний*;
  - **после *р* в конце слога**: *бур’ян, подвір’я, Мар’яна*. **Не ставится**, когда *р* мягкий: *буря, ряд, буряк*;
  - **после приставок на согласный**: *з’їзд, від’єднати, роз’яснити*;
  - **после первой части сложных слов**: *пан’європейський*;
  - **в заимствованиях** после *б, п, в, м, ф, г, к, х, ж, ч, ш, р*: *комп’ютер, інтерв’ю, п’єса, бар’єр*. **Не ставится**, когда *я, ю* обозначают мягкость: *бюро, пюре, рюкзак*.

  Как набирать: правильный знак — *’* (или *ʼ*); на клавиатуре часто используют прямой *'*. Приложение принимает любой.
tables:
  - head: ["Ставим апостроф", "Не ставим"]
    rows:
      - ["п’ять, м’ясо, в’язати", "свято, цвях"]
      - ["бур’ян, подвір’я", "буря, ряд, буряк"]
      - ["з’їзд, роз’яснити", "—"]
      - ["комп’ютер, інтерв’ю, п’єса", "бюро, пюре, рюкзак"]
pairs:
  - { wrong: "компютер", right: "комп’ютер" }
  - { wrong: "бур’як", right: "буряк" }
  - { wrong: "розяснити", right: "роз’яснити" }
examples:
  - { text: "Мар’яна дала інтерв’ю місцевій газеті." }
  - { text: "На подвір’ї ростуть бур’яни, а на городі — буряки." }
  - { text: "Учитель роз’яснив нам нове правило." }
exercises:
