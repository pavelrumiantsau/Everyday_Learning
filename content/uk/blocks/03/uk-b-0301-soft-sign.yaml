# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.1 and Український правопис 2019. Exercises are append-only.
id: uk-b-0301
part: 3
order: 1
title: "Мягкий знак"
source: "§3.1"
level: B2
strict: true
rule: |
  ***Ь* пишется** после мягких *д, т, з, с, ц, л, н, дз*:
  - в конце слова и слога: *сіль, хлопець, батько, сильний*;
  - в суффиксах *-зьк-, -цьк-, -ськ-, -еньк-, -оньк-, -есеньк-*: *близький, київський, тихенько*;
  - перед *о*: *сьогодні, льон* (в начале слога — *йо*: *йогурт, район*);
  - в глагольных формах на *-ть, -ться*: *робить, знають, сміється*;
  - после *л* перед другими согласными: *пальці, їдальня, тільки*.

  ***Ь* не пишется:**
  - после губных, шипящих и *р* в конце слова: *сім, степ, ніч, цар* (рус. *семь, степь, ночь, царь*);
  - после *н* перед *ж, ч, ш, щ* и перед суффиксами *-ськ-, -ств-*: *кінчик, тонший, український, селянство*;
  - между двумя мягкими согласными (кроме случаев с *л*): *пісня, кінця, сніг*;
  - после удвоенных мягких: *знання, весілля*.
tables:
  - head: ["Пишем ь", "Не пишем ь"]
    rows:
      - ["сіль, хлопець, батько", "сім, степ, ніч, цар"]
      - ["близький, київський, тихенько", "український, селянство"]
      - ["сьогодні, льон", "кінчик, тонший"]
      - ["робить, сміється", "пісня, кінця"]
      - ["пальці, їдальня, тільки", "знання, весілля"]
pairs:
  - { wrong: "україньский", right: "український" }
  - { wrong: "пісьня", right: "пісня" }
  - { wrong: "тілки", right: "тільки" }
examples:
  - { text: "Сьогодні ми обідаємо в їдальні." }
  - { text: "Я вивчаю українську мову." }
  - { text: "Говори тихенько, дитина спить." }
