# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.4 and Український правопис 2019. Exercises are append-only.
id: uk-b-0304
part: 3
order: 4
title: "Приставки: з- / с-, роз-, без-, пре- / при- / прі-"
source: "§3.4"
level: B2
strict: true
rule: |
  ***С-*** пишется **только перед *к, п, т, ф, х*** (мнемоника «*кафе птах*»), во всех остальных случаях — ***з-***: *сказати, спитати, стиснути, сфотографувати, схилити*; но *зробити, зберегти, зсунути, зшити, зцілити*. Русское *сшить, сделать* → *зшити, зробити*.

  ***Роз-, без-*** — всегда с *з*, в отличие от русского *рас-, бес-*: *розписати, розказати, безпека, безсилий, безплатний*.

  ***Пре-*** — высокая степень признака: *премудрий, прегарний*.
  ***При-*** — приближение, неполнота действия, присоединение: *приїхати, прикрити, пришити*.
  ***Прі-*** — только в нескольких словах: *прізвище, прізвисько, прірва*.
tables:
  - head: ["Приставка", "Правило", "Примеры"]
    rows:
      - ["с-", "только перед к, п, т, ф, х", "сказати, спитати, схилити"]
      - ["з-", "во всех остальных случаях", "зробити, зшити, зсунути"]
      - ["роз-, без-", "всегда з", "розказати, безпека"]
      - ["пре-", "высокая степень", "прегарний"]
      - ["при-", "приближение, неполнота, присоединение", "приїхати, пришити"]
      - ["прі-", "несколько слов", "прізвище, прірва"]
pairs:
  - { wrong: "сшити", right: "зшити" }
  - { wrong: "росказати", right: "розказати" }
  - { wrong: "бесплатно", right: "безплатно" }
examples:
  - { text: "Мама зшила мені сукню, і я сфотографувалася в ній." }
  - { text: "Він розказав, що вхід безплатний." }
  - { text: "Як ваше прізвище?" }
