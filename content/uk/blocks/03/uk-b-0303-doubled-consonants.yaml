# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.3 and Український правопис 2019. Exercises are append-only.
id: uk-b-0303
part: 3
order: 3
title: "Удвоение согласных"
source: "§3.3"
level: B2
strict: true
rule: |
  Удвоение бывает двух типов.

  **1. Стык одинаковых согласных:**
  - приставка + корень: *віддати, беззубий, ззаду*;
  - корень + суффикс: *кінний, денний, туманний, письменник*, по Правопису 2019 — ***священник***;
  - глагольная форма + *-ся*: *розрісся, принісся*.

  **2. Удлинение мягких** *д, т, з, с, ц, л, н, ж, ч, ш* между гласными перед *я, ю, є, і*:
  - средний род на *-я*: *знання, життя, волосся, збіжжя*;
  - некоторые слова мужского и женского рода: *суддя, Ілля, стаття, рілля*;
  - творительный падеж III склонения: *сіллю, ніччю, подорожжю*.

  **Удлинения нет**, если перед согласным стоит другой согласный (*щастя, радістю, повістю*), и в формах без гласного после (*знань, статей*).

  **Прилагательные на *-анний, -янний, -енний*** со значением невозможности или высокой степени — с *нн*: *незрівнянний, бездоганний, страшенний*. **Причастия — с одним *н***: *сказаний, зроблений, написаний*.

  **В заимствованиях удвоения, как правило, нет:** *клас, група, програма, комісія*. Исключения: *ванна, тонна, брутто, нетто, вілла*. По 2019 году английское *ck* → *к*: *Дікенс*.
tables:
  - head: ["С удвоением", "Без удвоения"]
    rows:
      - ["віддати, кінний, священник", "—"]
      - ["знання, життя, стаття", "знань, статей"]
      - ["сіллю, ніччю", "радістю, повістю"]
      - ["незрівнянний, бездоганний", "сказаний, зроблений"]
      - ["ванна, тонна", "клас, група, програма"]
pairs:
  - { wrong: "класс", right: "клас" }
  - { wrong: "написанний лист", right: "написаний лист" }
  - { wrong: "священик", right: "священник" }
examples:
  - { text: "Суддя прочитав статтю про нові закони." }
  - { text: "Це незрівнянний вечір: зоряне небо й тиша." }
  - { text: "Наша група виконала програму бездоганно." }
