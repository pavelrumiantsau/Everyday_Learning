# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §3.8 and Український правопис 2019 (overview: osvita.ua). Exercises are append-only.
id: uk-b-0308
part: 3
order: 8
title: "Что нового в Правописе 2019"
source: "§3.8"
level: C1
strict: true
rule: |
  **Обязательные изменения:**
  - ***-є-*** в словах с латинским *-ject-*: *проєкт, проєкція, траєкторія*;
  - ***пів*** раздельно перед родительным: *пів години, пів Європи*;
  - слитно ***віце-, екс-, прес-, веб-*** и др.: *віцепрем’єр, вебсторінка*;
  - ***священник*** с *нн*;
  - английское ***ck → к***: *Дікенс, Шерлок*.

  **Варианты** (обе формы нормативны):
  - *th* → *т* или *ф*: *кафедра / катедра, міф / міт, ефір / етер*;
  - *au* → *ау* или *ав*: *аудиторія / авдиторія, пауза / павза*;
  - *g* → *г* или *ґ* в именах: *Гете / Ґете*;
  - *и* в начале некоторых слов: *ірій / ирій, індик / индик*;
  - *-и* в родительном III склонения: *радості / радости, любові / любови, осені / осени*.

  В образовании и на экзаменах обычно используют **первую, традиционную** форму. Главное — **быть последовательным** в одном тексте.
tables:
  - head: ["Изменение", "Тип", "Примеры"]
