      - ["віце-, екс-, прес-, веб- слитно", "обязательно", "віцепрем’єр, вебсторінка"]
      - ["ck → к", "обязательно", "Дікенс, Шерлок"]
      - ["th → т / ф", "вариант", "міф / міт"]
      - ["au → ау / ав", "вариант", "пауза / павза"]
      - ["-и в Р. в. III скл.", "вариант", "радості / радости"]
