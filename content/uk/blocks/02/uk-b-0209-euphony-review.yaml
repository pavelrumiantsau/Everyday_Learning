  - { type: choice, text: "Мама ___ тато вдома.", options: ["і", "й"], answer: 1, explain: "после гласного перед согласным → й" }
  - { type: choice, text: "На столі хліб ___ масло.", options: ["і", "й"], answer: 0, explain: "между согласными → і" }
  - { type: choice, text: "Брат ___ сестрою пішли в театр.", options: ["з", "із", "зі"], answer: 1, explain: "между согласными, перед с → із" }
  - { type: choice, text: "Вона вийшла ___ дому о сьомій.", options: ["з", "із", "зі"], answer: 0, explain: "после гласного перед согласным → з" }
  - { type: choice, text: "Ми ___ поїхали, якби мали час.", options: ["б", "би"], answer: 0, explain: "после гласного → б" }
  - { type: choice, text: "Він ___ прийшов, але захворів.", options: ["б", "би"], answer: 1, explain: "после согласного → би" }
  - { type: choice, text: "___ Одесі тепло навіть узимку.", options: ["У", "В"], answer: 1, explain: "в начале перед гласным → в" }
  - { type: choice, text: "___ неділю ми відпочиваємо.", options: ["У", "В"], answer: 0, explain: "в начале перед согласным → у" }
