# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of uk-b-0206–0208 (course PDF §2.6–2.9). Written with Claude Code. Exercises are append-only.
id: uk-b-0209
part: 2
order: 9
title: "Благозвучие: повторение"
source: "§2.6–2.9"
level: B2
rule: |
  Все правила благозвучия (*милозвучність*) держатся на одном принципе: **гласные и согласные чередуются**, без скоплений.

  - ***у / в***: *у* между согласными и перед *в, ф, льв, св, тв, хв*; *в* между гласными и после гласного перед согласным;
  - ***і / й***: *й* после гласного; *і* между согласными, в начале, после паузы, перед *й, я, ю, є, ї*;
  - ***з / із / зі***: *з* у гласных, *із* между согласными, *зі* перед группами *з-, с-, ш-, щ-* + согласный;
  - ***б / би, ж / же***: короткая форма после гласного, полная — после согласного.

  **Как тренировать (§2.9):** читайте вслух качественную украинскую прессу и объясняйте себе каждое *у/в, і/й, з/із/зі*. На уровне C1 выбор должен стать автоматическим в устной речи; в официальных текстах норма строже, художественная речь допускает варианты.
pairs:
  - { wrong: "живу в Львові", right: "живу у Львові" }
  - { wrong: "брат й сестра", right: "брат і сестра" }
  - { wrong: "пішов з школи", right: "пішов зі школи" }
examples:
  - { text: "Учора в школі був концерт, і ми з Анною співали." }
  - { text: "У неділю мама й тато поїдуть у Вінницю." }
  - { text: "Брат із сестрою повернулися з Києва зі святковим настроєм." }
exercises:
