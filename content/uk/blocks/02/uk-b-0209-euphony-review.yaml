  - { type: choice, text: "Туристи повернулися ___ сходу.", options: ["з", "із", "зі"], answer: 2, explain: "перед группой сх → зі" }
  - { type: choice, text: "Він ___ я працюємо разом.", options: ["і", "й"], answer: 0, explain: "перед я → і" }
  - { type: choice, text: "Сестра вчиться ___ університеті.", options: ["у", "в"], answer: 1, explain: "между гласными → в" }
  - { type: choice, text: "Вона працює ___ фірмі.", options: ["у", "в"], answer: 0, explain: "перед ф → у" }
  - { type: choice, text: "Вони відпочивали ___ Італії.", options: ["у", "в"], answer: 1, explain: "между гласными → в" }
  - { type: choice, text: "Петро ___ Іван — брати.", options: ["і", "й"], answer: 1, explain: "между гласными → й" }
  - { type: choice, text: "Цілий день ішов дощ ___ сніг.", options: ["і", "й"], answer: 0, explain: "между согласными → і" }
  - { type: choice, text: "Він ___ цим не згоден.", options: ["з", "із", "зі"], answer: 1, explain: "между согласными, перед ц → із" }
  - { type: judge, text: "Я живу в Львові.", correct: false, fix: "Я живу у Львові.", explain: "перед льв → у" }
  - { type: judge, text: "Вона й він пішли в кіно.", correct: true, explain: "й после гласного; в после гласного перед согласным" }
