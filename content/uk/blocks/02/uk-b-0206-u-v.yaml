# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.6 and Український правопис 2019, §23. Exercises are append-only.
id: uk-b-0206
part: 2
order: 6
title: "Благозвучие: у / в"
source: "§2.6"
level: B2
rule: |
  Украинский избегает скопления согласных и скопления гласных, поэтому предлог *у / в* (и начальные *у- / в-* в словах вроде *учитель — вчитель, удома — вдома*) выбирают по соседним звукам. Принцип: **гласные и согласные чередуются**.

  **Пишем *у*:**
  - между согласными: *бра**т у** школі*;
  - в начале предложения перед согласным: ***У** лісі тихо.*;
  - перед *в, ф* и сочетаниями *льв, св, тв, хв* — независимо от предыдущего слова: *у вівторок, у Львові, у фірмі, вона увійшла*;
  - после паузы (запятой, тире, двоеточия) перед согласным: *Сонце сіло, **у** полі тихо.*

  **Пишем *в*:**
  - между гласными: *вон**а в** автобусі*;
  - в начале предложения перед гласным: ***В** Америці.*;
  - после гласного перед согласным (кроме *в, ф, льв…*): *вон**а в** школі*.

  **Чередования нет:** в словах, где *у-* и *в-* различают смысл (*уважний* «внимательный» — *вважати* «считать»), в устойчивых словах и терминах (*увага, вплив, влада*) и в именах (*Уляна, Владислав*).
tables:
  - caption: "Как выбрать"
    head: ["Позиция", "Пишем", "Пример"]
    rows:
      - ["согласный _ согласный", "у", "брат у школі"]
      - ["начало предложения _ согласный", "у", "У лісі тихо."]
      - ["_ в, ф, льв, св, тв, хв", "у", "у вівторок, у Львові"]
      - ["пауза (запятая) _ согласный", "у", "Сонце сіло, у полі тихо."]
      - ["гласный _ гласный", "в", "вона в автобусі"]
      - ["начало предложения _ гласный", "в", "В Америці живе."]
      - ["гласный _ согласный", "в", "вона в школі"]
pairs:
  - { wrong: "живе в Львові", right: "живе у Львові" }
  - { wrong: "брат в школі", right: "брат у школі" }
  - { wrong: "вона у автобусі", right: "вона в автобусі" }
examples:
  - { text: "Брат у школі, а сестра в університеті." }
  - { text: "Вона в автобусі, а він у таксі." }
  - { text: "У вівторок ми будемо у Львові." }
  - { text: "Учитель увійшов у клас." }
exercises:
  - { type: choice, text: "Брат ___ школі.", options: ["у", "в"], answer: 0, explain: "между согласными (т _ ш) → у" }
  - { type: choice, text: "Вона ___ автобусі.", options: ["у", "в"], answer: 1, explain: "между гласными (а _ а) → в" }
  - { type: choice, text: "Вона ___ школі.", options: ["у", "в"], answer: 1, explain: "после гласного перед согласным (а _ ш) → в" }
  - { type: choice, text: "___ лісі тихо.", options: ["У", "В"], answer: 0, explain: "в начале предложения перед согласным → у" }
  - { type: choice, text: "___ Америці живе мій дядько.", options: ["У", "В"], answer: 1, explain: "в начале предложения перед гласным → в" }
  - { type: choice, text: "Ми зустрінемося ___ вівторок.", options: ["у", "в"], answer: 0, explain: "перед в → всегда у" }
  - { type: choice, text: "Вона живе ___ Львові.", options: ["у", "в"], answer: 0, explain: "перед льв → всегда у" }
  - { type: choice, text: "Мама працює ___ фірмі.", options: ["у", "в"], answer: 0, explain: "перед ф → всегда у" }
  - { type: choice, text: "Діти ___ саду.", options: ["у", "в"], answer: 1, explain: "после гласного перед согласным (і _ с) → в" }
  - { type: choice, text: "Його брат ___ Києві.", options: ["у", "в"], answer: 0, explain: "между согласными (т _ К) → у" }
  - { type: choice, text: "Учора ми були ___ кіно.", options: ["у", "в"], answer: 1, explain: "после гласного перед согласным (і _ к) → в" }
  - { type: choice, text: "Учора ___ місті було свято.", options: ["у", "в"], answer: 1, explain: "после гласного перед согласным (а _ м) → в" }
  - { type: choice, text: "Батько ___ лікарні.", options: ["у", "в"], answer: 1, explain: "после гласного перед согласным (о _ л) → в" }
  - { type: choice, text: "Сонце сіло, ___ полі стало тихо.", options: ["у", "в"], answer: 0, explain: "после паузы (запятой) перед согласным → у" }
  - { type: choice, text: "Стіл стоїть ___ кутку.", options: ["у", "в"], answer: 0, explain: "между согласными (ть _ к) → у" }
  - { type: choice, text: "Я народився ___ Харкові.", options: ["у", "в"], answer: 1, explain: "после гласного перед согласным (я _ Х) → в" }
  - { type: choice, text: "Сестра вчиться ___ університеті.", options: ["у", "в"], answer: 1, explain: "между гласными (я _ у) → в" }
