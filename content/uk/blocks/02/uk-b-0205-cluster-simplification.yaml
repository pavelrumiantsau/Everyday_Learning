  - { type: choice, text: "Це дуже ___ товар.", options: ["якісний", "якістний"], answer: 0, explain: "стн → сн: якість — якісний" }
  - { type: choice, text: "Сьогодні я дуже ___.", options: ["щасливий", "щастливий"], answer: 0, explain: "стл → сл: щастя — щасливий" }
