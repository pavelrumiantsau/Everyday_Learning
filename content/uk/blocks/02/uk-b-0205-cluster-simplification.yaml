# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.5 (example «зависливий» replaced, see docs/UK-GRAMMAR-ERRATA.md)
# and Український правопис 2019. Exercises are append-only.
id: uk-b-0205
part: 2
order: 5
title: "Упрощение групп согласных (чесний, щасливий)"
source: "§2.5"
level: B2
rule: |
  В украинском упрощение групп согласных **отражается на письме** — в отличие от русского *честный*:

  - *ждн → жн*: *тиждень — тижня, тижневий*;
  - *здн → зн*: *виїзд — виїзний, проїзд — проїзний*;
  - *стл → сл*: *щастя — щасливий*;
  - *стн → сн*: *честь — чесний, користь — корисний, радість — радісний, якість — якісний, область — обласний, вість — вісник, пристрасть — пристрасний*.

  **Исключения** (буква сохраняется): *зап’ястний, кістлявий, пестливий, хвастливий, хвастнути, шістнадцять*, а также прилагательные от заимствований на *-ст*: *контрастний, баластний, компостний, форпостний*.
tables:
  - head: ["Группа", "Примеры"]
    rows:
      - ["ждн → жн", "тиждень — тижня, тижневий"]
      - ["здн → зн", "проїзд — проїзний, виїзд — виїзний"]
      - ["стл → сл", "щастя — щасливий"]
      - ["стн → сн", "честь — чесний, користь — корисний, якість — якісний"]
pairs:
  - { wrong: "честний", right: "чесний" }
  - { wrong: "щастливий", right: "щасливий" }
  - { wrong: "проїздний квиток", right: "проїзний квиток" }
examples:
  - { text: "Він чесна і щаслива людина." }
  - { text: "Я купив проїзний квиток на місяць." }
  - { text: "Минулого тижня ми отримали корисну пораду." }
exercises:
