# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.4 and standard grammar. Exercises are append-only.
id: uk-b-0204
part: 2
order: 4
title: "Чередование согласных: на нозі, ходжу"
source: "§2.4"
level: B1
rule: |
  **В существительных** *г, к, х* перед окончанием *-і* (дательный и местный падеж, мн. ч. мужского рода) переходят в ***з, ц, с***: *нога — на нозі, рука — в руці, муха — на мусі, вухо — у вусі, друг — друзі, Америка — в Америці*.

  Перед суффиксами и в звательном падеже — в ***ж, ч, ш***: *ніжка, ручка, вушко; друже, козаче*.

  Здесь помогает белорусский, где то же самое: *на назе, у руцэ*. **Типичная ошибка** — *на ногі, в рукі* по русской модели.

  **В глаголах II спряжения** в 1-м лице ед. ч. настоящего времени:
  - *д → дж*: *ходити — ходжу, водити — воджу, сидіти — сиджу* (рус. *хожу, сижу*);
  - *зд → ждж*: *їздити — їжджу* (рус. *езжу*);
  - *з → ж, с → ш, т → ч, ст → щ*: *возити — вожу, носити — ношу, платити — плачу, пустити — пущу*;
  - губной + *л*: *любити — люблю, робити — роблю, ловити — ловлю*.
tables:
  - head: ["Группа", "Перед -і", "Звательный / суффикс"]
    rows:
      - ["г — з — ж", "нога — на нозі; друг — друзі", "друже, ніжка"]
      - ["к — ц — ч", "рука — в руці; річка — у річці", "козаче, ручка"]
      - ["х — с — ш", "муха — на мусі; вухо — у вусі", "мушка, вушко"]
  - head: ["Инфинитив", "1-е лицо"]
    rows:
      - ["ходити, сидіти", "ходжу, сиджу"]
      - ["їздити", "їжджу"]
      - ["носити, платити, пустити", "ношу, плачу, пущу"]
      - ["любити, робити", "люблю, роблю"]
pairs:
  - { wrong: "в рукі", right: "в руці" }
  - { wrong: "на ногі", right: "на нозі" }
  - { wrong: "я їзжу", right: "я їжджу" }
examples:
  - { text: "У руці в мене ключі, а на нозі синець." }
  - { text: "Я їжджу на роботу автобусом, а додому ходжу пішки." }
  - { text: "Мої друзі приїхали з Америки, а подруга досі живе в Америці." }
exercises:
