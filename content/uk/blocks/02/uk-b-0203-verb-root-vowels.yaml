# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.3 and Український правопис 2019. Exercises are append-only.
id: uk-b-0203
part: 2
order: 3
title: "Чередование гласных в глагольных корнях"
source: "§2.3"
level: B2
rule: |
  В корнях глаголов гласная меняется вместе с видом:

  - ***е — и***: *и* пишется, если **после корня стоит суффикс *-а-*** (*-бира-, -дира-, -мира-, -пира-, -тира-*): *брати, беру — збирати*; *терти — стирати*; *вмерти — вмирати*; *обрати, оберу — обирати*.
  - ***е — і***: в глаголах несовершенного вида на *-ати*: *летіти — літати*; *мести — вимітати*.
  - ***о — а***: в глаголах несовершенного вида: *гонити — ганяти*; *ломити — ламати*; *схопити — хапати*.

  Логика знакома по русскому (*собрать — собирать*), но гласные другие: русскому *о* часто соответствует украинское *а* (*хватать — хапати*), а русскому *е — і* (*вылетать — вилітати*).
tables:
  - head: ["Чередование", "Пары", "Когда"]
    rows:
      - ["е — и", "беру — збирати, стерти — стирати", "и перед суффиксом -а-"]
      - ["е — і", "летіти — літати, підмести — вимітати", "несов. вид на -ати"]
      - ["о — а", "схопити — хапати, ломити — ламати", "несов. вид"]
pairs:
  - { wrong: "зберати", right: "збирати" }
  - { wrong: "летати", right: "літати" }
  - { wrong: "хопати", right: "хапати" }
examples:
  - { text: "Діти збирають гриби, а я беру кошик." }
  - { text: "Літак летить над містом, а птахи літають низько." }
  - { text: "Кіт хапає мишу, але вчора не схопив." }
exercises:
