  - { type: choice, text: "Мама ст___рає пил із полиці.", options: ["и", "е"], answer: 0, explain: "суффикс -а- → и: стирати" }
  - { type: choice, text: "Треба ст___рти з дошки.", options: ["е", "и"], answer: 0, explain: "без -а- → е: стерти" }
  - { type: choice, text: "Він ум___рає від сміху.", options: ["и", "е"], answer: 0, explain: "суффикс -а- → и: умирати" }
  - { type: choice, text: "Дідусь пом___р минулого року.", options: ["е", "и"], answer: 0, explain: "без -а- → е: померти, помер" }
  - { type: choice, text: "Без води квіти пом___рають.", options: ["и", "е"], answer: 0, explain: "суффикс -а- → и: помирати" }
  - { type: choice, text: "Ми об___раємо нового директора.", options: ["и", "е"], answer: 0, explain: "суффикс -а- → и: обирати" }
  - { type: choice, text: "Я об___ру червону сукню.", options: ["е", "и"], answer: 0, explain: "без -а- → е: обрати, оберу" }
  - { type: choice, text: "Спортсмен вит___рає піт.", options: ["и", "е"], answer: 0, explain: "суффикс -а- → и: витирати" }
  - { type: choice, text: "Літак л___тить над морем.", options: ["е", "і"], answer: 0, explain: "летіти — е" }
  - { type: choice, text: "Птахи л___тають над полем.", options: ["і", "е"], answer: 0, explain: "несов. вид на -ати → і: літати" }
  - { type: choice, text: "Пташка вил___тіла з гнізда.", options: ["е", "і"], answer: 0, explain: "вилетіти — е" }
  - { type: choice, text: "Літак вил___тає о п’ятій.", options: ["і", "е"], answer: 0, explain: "несов. вид на -ати → і: вилітати" }
  - { type: choice, text: "Двірник вим___тає подвір’я.", options: ["і", "е"], answer: 0, explain: "несов. вид на -ати → і: вимітати" }
  - { type: choice, text: "Треба підм___сти підлогу.", options: ["е", "і"], answer: 0, explain: "мести, підмести — е" }
  - { type: choice, text: "Діти г___няють м’яча.", options: ["а", "о"], answer: 0, explain: "несов. вид → а: ганяти" }
  - { type: choice, text: "Хлопчик зл___мав олівець.", options: ["а", "о"], answer: 0, explain: "ламати — зламати: а" }
  - { type: choice, text: "Кіт х___пає мишу.", options: ["а", "о"], answer: 0, explain: "несов. вид → а: хапати (рус. хватать)" }
  - { type: choice, text: "Він сх___пив мене за руку.", options: ["о", "а"], answer: 0, explain: "сов. вид: схопити — о" }
  - { type: judge, text: "Ми збераємо підписи.", correct: false, fix: "Ми збираємо підписи.", explain: "суффикс -а- → и: збирати" }
  - { type: judge, text: "Ластівки летають низько.", correct: false, fix: "Ластівки літають низько.", explain: "несов. вид на -ати → і: літати" }
  - { type: judge, text: "Я оберу інший варіант.", correct: true, explain: "без -а- → е: оберу" }
