# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.2 and Український правопис 2019. Exercises are append-only.
id: uk-b-0202
part: 2
order: 2
title: "Е → о после шипящих и й (чорний, шостий)"
source: "§2.2"
level: B2
rule: |
  После *ж, ч, ш, щ, дж, й* **перед твёрдым согласным пишется *о***, **перед мягким или шипящим — *е***: *шостий — шести, жонатий — женитися, бджола, щока, його*.

  **Подсказка из русского:** русское *ё* после шипящих почти всегда = украинское *о*: *чорний* (чёрный), *жовтий* (жёлтый), *шовк* (шёлк), *чорт* (чёрт). Так же *чоловік* (человек), *чорнило* (чернила).

  **Исключения — остаётся *е*:** *черга, червоний, черевик, черствий, шелест, щедрий, джерело, чесати, шепотіти, щезати* и некоторые другие. Запомните также *четвер* (при *чотири*).
tables:
  - head: ["Пишем о", "Пишем е"]
    rows:
      - ["чорний, жовтий, шовк", "черга, червоний, черевик"]
      - ["шостий, щока, бджола", "шести, щедрий, джерело"]
      - ["чоловік, чотири", "четвер, чесати"]
pairs:
  - { wrong: "черний", right: "чорний" }
  - { wrong: "шестий", right: "шостий" }
  - { wrong: "чорга", right: "черга" }
examples:
  - { text: "У нас чорний кіт і жовтий папуга." }
  - { text: "У четвер у мене шостий урок — фізика." }
  - { text: "Біля каси довга черга." }
