# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.7 and Український правопис 2019, §24. Exercises are append-only.
id: uk-b-0207
part: 2
order: 7
title: "Благозвучие: і / й, та"
source: "§2.7"
level: B2
rule: |
  Союз *і* чередуется с *й* по той же логике, что *у / в*: **гласные и согласные должны чередоваться**.

  **Пишем *й*:**
  - между гласными: *Оля **й** Ірина*;
  - после гласного перед согласным: *мама **й** тато, вона **й** він*.

  **Пишем *і*:**
  - между согласными: *брат **і** сестра*;
  - в начале предложения: ***І** сміх, і гріх!*;
  - после паузы (запятой и т. п.): *Він прийшов, **і** ми почали.*;
  - перед *й, я, ю, є, ї*: *він **і** я, йому **і** їй*.

  Как союз «и» можно использовать и ***та***: *хліб та сіль*. Та же логика в белорусском: *брат і сястра, маці й бацька*.
tables:
  - head: ["Позиция", "Пишем", "Пример"]
    rows:
      - ["гласный _ согласный", "й", "мама й тато"]
      - ["гласный _ гласный", "й", "Оля й Ірина"]
      - ["согласный _ согласный", "і", "брат і сестра"]
      - ["_ й, я, ю, є, ї", "і", "він і я"]
      - ["начало предложения, после паузы", "і", "І сміх, і гріх!"]
pairs:
  - { wrong: "брат й сестра", right: "брат і сестра" }
  - { wrong: "він й я", right: "він і я" }
examples:
  - { text: "Мама й тато поїхали на море." }
  - { text: "Брат і сестра часто сваряться." }
  - { text: "Ми запросили і його, і її." }
  - { text: "Хліб та сіль — символ гостинності." }
exercises:
