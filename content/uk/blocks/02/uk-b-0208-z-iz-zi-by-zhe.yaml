# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.8 and Український правопис 2019, §25. Exercises are append-only.
id: uk-b-0208
part: 2
order: 8
title: "Благозвучие: з / із / зі / зо, б / би, ж / же"
source: "§2.8"
level: B2
rule: |
  Предлог «с, из» выбирают по соседним звукам:

  - ***з*** — перед гласными и после гласного перед большинством согласных: *з Анною, пішла з дому, кава з молоком*;
  - ***із*** — между согласными, особенно перед *з, с, ц, ч, ш, щ*: *брат із сестрою, він із цим згоден*;
  - ***зі*** — перед группами согласных, первый из которых *з, с, ш, щ*: *зі школи, зі сходу, зі зброєю*; также ***зі мною***;
  - ***зо*** — перед числительными в значении «примерно»: *зо два тижні*.

  **Та же логика для частиц:** *б* после гласного, *би* после согласного (*я б пішов, він би пішов*); *ж / же* (*це ж він, він же сказав*); постфикс *-ся* после гласного можно заменить на *-сь* (*вона вчилась*).
tables:
  - head: ["Форма", "Когда", "Примеры"]
    rows:
      - ["з", "перед гласным; после гласного перед согласным", "з Анною, пішла з дому"]
      - ["із", "между согласными (особенно перед з, с, ц, ч, ш, щ)", "брат із сестрою"]
      - ["зі", "перед группой з-, с-, ш-, щ- + согласный; зі мною", "зі школи, зі сходу"]
      - ["зо", "перед числом «примерно»", "зо два тижні"]
      - ["б / би", "после гласного / согласного", "я б пішов, він би пішов"]
      - ["ж / же", "после гласного / согласного", "це ж він, він же сказав"]
pairs:
  - { wrong: "з школи", right: "зі школи" }
  - { wrong: "брат з сестрою", right: "брат із сестрою" }
  - { wrong: "він б пішов", right: "він би пішов" }
examples:
  - { text: "Діти повернулися зі школи о третій." }
  - { text: "Брат із сестрою пішли в кіно, а я — з Анною." }
  - { text: "Я б допоміг, але він би не погодився." }
  - { text: "Ходімо зі мною!" }
exercises:
  - { type: choice, text: "Я йду в кіно ___ Анною.", options: ["з", "із", "зі"], answer: 0, explain: "перед гласным → з" }
  - { type: choice, text: "Вона пішла ___ дому рано.", options: ["з", "із", "зі"], answer: 0, explain: "после гласного перед согласным → з" }
  - { type: choice, text: "Брат ___ сестрою пішли гуляти.", options: ["з", "із", "зі"], answer: 1, explain: "между согласными, перед с → із" }
  - { type: choice, text: "Він ___ цим згоден.", options: ["з", "із", "зі"], answer: 1, explain: "между согласными, перед ц → із" }
  - { type: choice, text: "Діти повернулися ___ школи.", options: ["з", "із", "зі"], answer: 2, explain: "перед группой шк → зі" }
  - { type: choice, text: "Вітер дме ___ сходу.", options: ["з", "із", "зі"], answer: 2, explain: "перед группой сх → зі" }
  - { type: choice, text: "Ходімо ___ мною!", options: ["з", "із", "зі"], answer: 2, explain: "зі мною — устойчиво" }
  - { type: choice, text: "Ми не бачилися ___ два тижні.", options: ["зо", "з", "зі"], answer: 0, explain: "«примерно» перед числом → зо" }
  - { type: choice, text: "Вартовий стояв ___ зброєю.", options: ["з", "із", "зі"], answer: 2, explain: "перед группой зб → зі" }
  - { type: choice, text: "Я п’ю чай ___ цукром.", options: ["з", "із", "зі"], answer: 1, explain: "между согласными (й _ ц) → із" }
  - { type: choice, text: "Я люблю каву ___ молоком.", options: ["з", "із", "зі"], answer: 0, explain: "после гласного перед согласным → з" }
  - { type: choice, text: "Вона приїхала ___ Одеси.", options: ["з", "із", "зі"], answer: 0, explain: "перед гласным → з" }
  - { type: choice, text: "Прийшов лист ___ Києва.", options: ["з", "із", "зі"], answer: 1, explain: "между согласными (т _ К) → із" }
  - { type: choice, text: "Вона вийшла ___ кімнати.", options: ["з", "із", "зі"], answer: 0, explain: "после гласного перед согласным → з" }
  - { type: choice, text: "Я ___ пішов, але не маю часу.", options: ["б", "би"], answer: 0, explain: "после гласного → б" }
  - { type: choice, text: "Він ___ допоміг, якби знав.", options: ["б", "би"], answer: 1, explain: "после согласного → би" }
  - { type: choice, text: "Ми ___ поїхали на море.", options: ["б", "би"], answer: 0, explain: "после гласного → б" }
  - { type: choice, text: "Брат ___ прийшов, якби його запросили.", options: ["б", "би"], answer: 1, explain: "после согласного → би" }
  - { type: choice, text: "Це ___ він!", options: ["ж", "же"], answer: 0, explain: "после гласного → ж" }
  - { type: choice, text: "Він ___ сказав правду.", options: ["ж", "же"], answer: 1, explain: "после согласного → же" }
  - { type: judge, text: "Вона вчилась у Києві.", correct: true, explain: "после гласного -ся можно заменить на -сь" }
  - { type: judge, text: "Я пішла з школи о третій.", correct: false, fix: "Я пішла зі школи о третій.", explain: "перед группой шк → зі" }
  - { type: judge, text: "Він би це зробив.", correct: true, explain: "после согласного → би" }
  - { type: judge, text: "Він б пішов із нами.", correct: false, fix: "Він би пішов із нами.", explain: "после согласного → би" }
