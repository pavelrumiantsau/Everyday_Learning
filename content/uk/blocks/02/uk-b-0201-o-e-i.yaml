# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §2.1 and standard grammar. Exercises are append-only.
id: uk-b-0201
part: 2
order: 1
title: "Чередование о, е → і (кінь — коня)"
source: "§2.1"
level: B1
rule: |
  В корне ***о* и *е* в открытом слоге чередуются с *і* в закрытом** — чаще всего в начальной форме слова: *кінь — коня, ніс — носа, сіль — солі, піч — печі, шість — шести, вечір — вечора, Харків — Харкова, рік — року, дім — дому*.

  **Чередования нет:**
  - в беглых *о, е*: *сон — сну, день — дня*;
  - в сочетаниях *-ор-, -ол-, -ер-, -ел-* между согласными: *горб, вовк, смерть*;
  - в большинстве заимствований: *атом — атома, батон — батона*.

  **Подсказка из русского:** старинная буква «ять» (рус. и бел. *е*) в украинском даёт ***і* во всех формах**: *хліб* (хлеб), *ліс* (лес), *сніг* (снег), *дід* (дед), *світ* (свет). Здесь *і* не чередуется: *хліба, лісу, снігу*.
tables:
  - head: ["Закрытый слог", "Открытый слог"]
    rows:
      - ["кінь, ніс, сіль", "коня, носа, солі"]
      - ["піч, шість, сім", "печі, шести, семи"]
      - ["вечір, Харків", "вечора, Харкова"]
      - ["рік, дім", "року, дому"]
pairs:
  - { wrong: "конь", right: "кінь" }
  - { wrong: "кіня", right: "коня" }
  - { wrong: "до вечіра", right: "до вечора" }
examples:
  - { text: "У полі пасеться кінь, а біля коня — лоша." }
  - { text: "До вечора ще далеко." }
  - { text: "Я родом із Харкова." }
  - { text: "Цього року випало багато снігу." }
exercises:
  - { type: cloze, text: "Я не бачу свого ___.", answer: "коня", hint: "кінь", explain: "открытый слог: і → о (кінь — коня)" }
  - { type: cloze, text: "Біля ___ сидить кіт.", answer: "печі", hint: "піч", explain: "открытый слог: і → е (піч — печі)" }
  - { type: cloze, text: "Додай трохи ___.", answer: "солі", hint: "сіль", explain: "открытый слог: і → о (сіль — солі)" }
  - { type: cloze, text: "Нам не вистачає ___ гривень.", answer: "шести", hint: "шість", explain: "открытый слог: і → е (шість — шести)" }
  - { type: cloze, text: "Із ___ учнів прийшли тільки троє.", answer: "семи", also: ["сімох"], hint: "сім", explain: "і → е в открытом слоге: сім — семи (или сімох)" }
  - { type: cloze, text: "До ___ ще далеко.", answer: "вечора", hint: "вечір", explain: "открытый слог: і → о (вечір — вечора)" }
  - { type: cloze, text: "Я родом із ___.", answer: "Харкова", hint: "Харків", explain: "открытый слог: і → о (Харків — Харкова)" }
  - { type: cloze, text: "Протягом ___ ми багато подорожували.", answer: "року", hint: "рік", explain: "открытый слог: і → о (рік — року)" }
  - { type: cloze, text: "Біля ___ росте яблуня.", answer: "дому", hint: "дім", explain: "открытый слог: і → о (дім — дому)" }
  - { type: cloze, text: "Дитина доторкнулася до свого ___.", answer: "носа", hint: "ніс", explain: "открытый слог: і → о (ніс — носа)" }
  - { type: choice, text: "У полі пасеться ___.", options: ["кінь", "конь"], answer: 0, explain: "закрытый слог: о → і" }
  - { type: choice, text: "На столі стоїть ___.", options: ["сіль", "соль"], answer: 0, explain: "закрытый слог: о → і" }
  - { type: choice, text: "Минув ще один ___.", options: ["рік", "рок"], answer: 0, explain: "закрытый слог: о → і" }
  - { type: choice, text: "Мій ___ — моя фортеця.", options: ["дім", "дом"], answer: 0, explain: "закрытый слог: о → і" }
  - { type: choice, text: "Добрий ___!", options: ["вечір", "вечер"], answer: 0, explain: "закрытый слог: е → і" }
  - { type: cloze, text: "Він прокинувся зі ___.", answer: "сну", hint: "сон", explain: "беглое о не чередуется с і: сон — сну" }
  - { type: cloze, text: "Чекаю цілого ___.", answer: "дня", hint: "день", explain: "беглое е: день — дня" }
  - { type: judge, text: "У лісі живе вівк.", correct: false, fix: "У лісі живе вовк.", explain: "-ов- / -ол- между согласными не чередуется: вовк" }
  - { type: cloze, text: "Купи свіжого ___.", answer: "хліба", hint: "хліб", explain: "і из «ять» сохраняется во всех формах: хліб — хліба" }
  - { type: cloze, text: "Ми вийшли з ___.", answer: "лісу", hint: "ліс", explain: "і из «ять»: ліс — лісу (рус. лес)" }
  - { type: cloze, text: "Цієї зими випало багато ___.", answer: "снігу", hint: "сніг", explain: "і из «ять»: сніг — снігу (рус. снег)" }
  - { type: cloze, text: "Я приїхав до ___.", answer: "діда", hint: "дід", explain: "і из «ять»: дід — діда (рус. дед)" }
