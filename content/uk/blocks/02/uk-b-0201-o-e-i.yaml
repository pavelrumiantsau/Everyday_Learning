  - { type: judge, text: "Учені вивчають будову атома.", correct: true, explain: "заимствование: атом — атома" }
  - { type: judge, text: "До вечіра ми закінчимо.", correct: false, fix: "До вечора ми закінчимо.", explain: "в открытом слоге о: вечора" }
