# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.8, Український правопис 2019 (variant -и) and standard grammar.
# Exercises are append-only.
id: uk-b-0408
part: 4
order: 8
title: "III склонение (ніч, радість, любов, мати)"
source: "§4.8"
level: B2
rule: |
  К III склонению относятся слова **женского рода с нулевым окончанием** (*ніч, радість, любов, сіль, подорож, тінь*) и слово ***мати***.

  - **В косвенных падежах *і* чередуется с *о, е*:** *ніч — ночі, сіль — солі, піч — печі, радість — радості*.
  - **Творительный:**
    - после одного согласного — **удвоение**: *ніччю, сіллю, подорожжю*;
    - после губных и *р* — **апостроф**: *кров’ю, любов’ю, матір’ю*;
    - после двух согласных — **без удвоения**: *радістю, смертю, якістю*.
  - ***Мати***: *матері, матір* (В.), *матір’ю*.
  - **Вариант *-и* в родительном** (Правопис 2019) — для слов на *-ть* после согласного и *кров, любов, осінь, сіль, Русь, Білорусь*: *радості / радости, любові / любови, осені / осени*. Обе формы нормативны; в школе — первая.
tables:
  - head: ["Падеж", "ніч", "радість", "любов", "мати"]
    rows:
      - ["Н.", "ніч", "радість", "любов", "мати"]
      - ["Р.", "ночі", "радості / радости", "любові / любови", "матері"]
      - ["Д.", "ночі", "радості", "любові", "матері"]
      - ["З.", "ніч", "радість", "любов", "матір"]
      - ["О.", "ніччю", "радістю", "любов’ю", "матір’ю"]
      - ["М.", "(у) ночі", "(у) радості", "(у) любові", "(на) матері"]
      - ["Кл.", "ноче!", "радосте!", "любове!", "мати!"]
pairs:
  - { wrong: "сілью", right: "сіллю" }
  - { wrong: "радісттю", right: "радістю" }
  - { wrong: "з матерью", right: "з матір’ю" }
examples:
  - { text: "Я щодня розмовляю з матір’ю телефоном." }
  - { text: "Я з радістю поділюся з тобою." }
  - { text: "Посеред ночі нас розбудив грім." }
