# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.5 and standard grammar. Exercises are append-only.
id: uk-b-0404
part: 4
order: 4
title: "Дательный -ові, местный -і / -у"
source: "§4.5"
level: B2
rule: |
  **Дательный падеж мужского рода: *-ові / -еві / -єві* или *-у / -ю*.**
  - У одушевлённых предпочтительно ***-ові***: *братові, Іванові, лікареві, Сергієві* (формы *брату, Івану* тоже правильны).
  - Если подряд **два слова** в дательном, окончания **чередуют**: *Іванові Петровичу, панові директору*.
  - У неодушевлённых обычно ***-у***: *наказу, столу, проєкту*.

  **Местный падеж мужского рода:**
  - ***-і*** — у большинства слов: *у місті, на дубі, у театрі, на вокзалі*;
  - ***-у*** — у основ на *г, к, х*: *у парку, на снігу, у будинку, на даху*;
  - ***-ові*** — у одушевлённых: *на братові*.

  **Типичная ошибка:** *сидіти в парке / паркі* — по-украински ***в парку***.
tables:
  - head: ["Падеж", "Окончание", "Примеры"]
    rows:
      - ["Д. одуш.", "-ові / -еві / -єві (-у / -ю)", "братові, лікареві, Сергієві"]
      - ["Д. два слова подряд", "чередование", "Іванові Петровичу, панові директору"]
      - ["Д. неодуш.", "-у", "наказу, столу"]
      - ["М. большинство", "-і", "у місті, на столі"]
      - ["М. основа на г, к, х", "-у", "у парку, на снігу, у будинку"]
      - ["М. одуш.", "-ові", "на братові"]
pairs:
  - { wrong: "в парке", right: "в парку" }
  - { wrong: "Іванові Петровичові", right: "Іванові Петровичу" }
  - { wrong: "на сніге", right: "на снігу" }
