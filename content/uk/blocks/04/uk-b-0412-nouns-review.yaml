# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 4 (course PDF §4.12 «Типичные ошибки»). Written with Claude Code. Exercises are append-only.
id: uk-b-0412
part: 4
order: 12
title: "Существительное: повторение и типичные ошибки"
source: "§4.12"
level: B2
rule: |
  Самые частые ошибки русскоязычных в существительном — из курса (§4.12):

  - род отдельных слов: ***сильний біль***, *новий шампунь, чистий посуд*;
  - чередование перед *-і*: ***в руці, на нозі***;
  - творительный: ***з мамою***, не *з мамой*;
  - звательный в обращении: ***Іване, добрий день!***;
  - родительный *-у* у учреждений и веществ: ***до університету, трохи цукру***;
  - местный *-у* у основ на *г, к, х*: ***в парку***;
  - женские фамилии не склоняются: ***з Оленою Шевченко***.

  В этом блоке — смешанные задания: найдите ошибку, исправьте предложение целиком или выберите форму.
pairs:
  - { wrong: "сильна біль", right: "сильний біль" }
  - { wrong: "в рукі, на ногі", right: "в руці, на нозі" }
  - { wrong: "з мамой", right: "з мамою" }
  - { wrong: "Іван, добрий день!", right: "Іване, добрий день!" }
  - { wrong: "до університета", right: "до університету" }
  - { wrong: "в парке", right: "в парку" }
examples:
  - { text: "Іване, у мене сильний біль у нозі." }
  - { text: "Ми з мамою гуляли в парку біля університету." }
  - { text: "Я розмовляла з Оленою Шевченко." }
exercises:
