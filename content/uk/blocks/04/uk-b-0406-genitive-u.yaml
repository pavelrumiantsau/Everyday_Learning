id: uk-b-0406
part: 4
order: 6
title: "Родительный -а / -у ②: когда -у, и пары по смыслу"
source: "§4.6"
level: B2
rule: |
  Окончание ***-у (-ю)*** — для абстрактного, вещества и совокупности:

  - **вещества, материалы:** *цукру, піску*;
  - **абстрактные понятия, чувства:** *успіху, болю, відчаю, сміху*;
  - **собирательные:** *лісу, народу, колективу, натовпу*;
  - **процессы, явления природы:** *руху, ремонту, вітру, дощу*;
  - **учреждения, здания:** *університету, заводу, театру, будинку*;
  - **географические названия, кроме населённых пунктов:** *Кавказу, Криму, Дунаю, Китаю*;
  - **слова на *-изм, -ізм*:** *романтизму, реалізму*.

  **Окончание может менять смысл:**
  - *акта* — документ / *акту* — действие, часть спектакля;
  - *апарата* — прибор / *апарату* — учреждение, штат;
  - *блока* — деталь / *блоку* — союз, объединение;
  - *рахунка* — счёт-документ / *рахунку* — счёт в банке, подсчёт.

  Помните также *року* и *дому* (*з дому* — из дома, домашнего очага).
tables:
