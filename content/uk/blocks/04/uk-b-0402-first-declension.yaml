# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.4 and standard grammar. Exercises are append-only.
id: uk-b-0402
part: 4
order: 2
title: "I склонение (вода, земля, круча)"
source: "§4.4"
level: B1
rule: |
  К I склонению относятся слова женского, мужского и общего рода на ***-а, -я***: *вода, земля, груша, Микола, суддя, сирота*. Три группы: **твёрдая** (*вода*), **мягкая** (*земля*), **смешанная** — основа на *ж, ч, ш, щ, дж* (*круча*).

  - **Творительный:** ***-ою*** в твёрдой группе, ***-ею*** в мягкой и смешанной, ***-єю*** после гласного и апострофа (*надією, сім’єю*). **Русское *-ой* не употребляется:** *з мамою*, не *з мамой*.
  - **Дательный и местный** — с чередованием *г, к, х → з, ц, с*: *нозі, руці, свекрусі* (см. блок 2.4).
  - **Родительный множественного** обычно с нулевым окончанием, иногда со вставными *о, е* и чередованием: *книг, пісень, сестер, корів*; иногда *-ей*: *мишей*.
  - Слова на ***-ія***: в Р., Д., М. — ***-ї***: *історії, Марії*.
tables:
  - head: ["Падеж", "Твёрдая", "Мягкая", "Смешанная"]
    rows:
      - ["Н.", "вода", "земля", "круча"]
      - ["Р.", "води", "землі", "кручі"]
      - ["Д.", "воді", "землі", "кручі"]
      - ["З.", "воду", "землю", "кручу"]
      - ["О.", "водою", "землею", "кручею"]
      - ["М.", "(у) воді", "(на) землі", "(на) кручі"]
      - ["Кл.", "водо!", "земле!", "круче!"]
      - ["Н. мн.", "води", "землі", "кручі"]
      - ["Р. мн.", "вод", "земель", "круч"]
      - ["О. мн.", "водами", "землями", "кручами"]
pairs:
  - { wrong: "з мамой", right: "з мамою" }
  - { wrong: "немає сестрів", right: "немає сестер" }
  - { wrong: "з Марієй", right: "з Марією" }
examples:
  - { text: "Я живу з сім’єю в Полтаві." }
  - { text: "Ми говорили про історію України." }
  - { text: "У мене немає сестер, але є брат." }
