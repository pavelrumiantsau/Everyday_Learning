# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.10 and standard grammar. Exercises are append-only.
id: uk-b-0410
part: 4
order: 10
title: "Звательный падеж (кличний відмінок)"
source: "§4.10"
level: B2
rule: |
  В литературном украинском **обращение всегда в звательном падеже**. Обращение в именительном (*Іван, зайди!*) звучит как русизм. Логика та же, что в литовском: *Jonas → Jonai!*, *Іван → Іване!*

  **Официальное обращение:** в звательный ставятся **оба слова**: *пане Олександре, пані Оксано, Іване Петровичу, Ганно Петрівно, пане професоре, шановний пане директоре*.
  - *пані* не склоняется: *пані Олено*;
  - мужские фамилии тоже в звательном: *пане Коваленку, пане Мельнику*;
  - несклоняемые женские фамилии не меняются: *пані Мельник*.

  **Множественное число** = именительный: *Друзі! Пані та панове!*

  Обращение выделяется запятыми: *Пане Андрію, добрий день!*
tables:
  - caption: "Окончания звательного падежа"
    head: ["Склонение, группа", "Окончание", "Примеры"]
    rows:
      - ["I, твёрдая", "-о", "Олено, Миколо, сестро, Ольго"]
      - ["I, мягкая и смешанная", "-е, -є", "земле, душе, Надіє, Маріє"]
      - ["I, ласкательные имена", "-ю", "Галю, Олю"]
      - ["II, твёрдая", "-е (г → ж, к → ч)", "брате, Іване, пане, Петре, друже, козаче"]
      - ["II, с суффиксом -к-, родство", "-у", "синку, батьку, діду"]
      - ["II, мягкая", "-ю", "Андрію, Сергію, Ігорю, вчителю"]
      - ["II, смешанная", "-у", "товаришу, слухачу"]
      - ["II, на -ець", "-че", "хлопче, молодче"]
      - ["III", "-е", "ноче, радосте"]
      - ["Отчества", "-у (м.), -о (ж.)", "Петровичу, Петрівно"]
pairs:
  - { wrong: "Іван, добрий день!", right: "Іване, добрий день!" }
  - { wrong: "Пане Андрій!", right: "Пане Андрію!" }
  - { wrong: "Шановний пан директор!", right: "Шановний пане директоре!" }
examples:
  - { text: "Пане професоре, можна запитати?" }
  - { text: "Олено, ти вдома?" }
  - { text: "Іване Петровичу, дякую вам за допомогу." }
  - { text: "Дорогі друзі, вітаю вас зі святом!" }
exercises:
  - { type: cloze, text: "___, зайди до мене!", answer: "Іване", hint: "Іван", explain: "II скл., твёрдая группа → -е" }
  - { type: cloze, text: "Добрий день, ___!", answer: "пані Оксано", hint: "пані Оксана", explain: "пані не склоняется, имя — в звательном: Оксано" }
  - { type: cloze, text: "Дякую, ___!", answer: "мамо", hint: "мама", explain: "I скл., твёрдая группа → -о" }
  - { type: cloze, text: "___, де ти був?", answer: "Петре", hint: "Петро", explain: "II скл., твёрдая группа → -е: Петре" }
  - { type: cloze, text: "Привіт, ___!", answer: "друже", hint: "друг", explain: "-е с чередованием г → ж: друже" }
  - { type: cloze, text: "___, допоможи мені.", answer: "Андрію", hint: "Андрій", explain: "II скл., мягкая группа (основа на й) → -ю" }
  - { type: cloze, text: "Шановний ___, прошу розглянути мою заяву.", answer: "пане директоре", hint: "пан директор", explain: "в официальном обращении оба слова в звательном" }
  - { type: cloze, text: "___, скажіть, будь ласка, котра година?", answer: "Ганно Петрівно", hint: "Ганна Петрівна", explain: "имя и отчество — оба на -о" }
  - { type: cloze, text: "___, можна запитати?", answer: "Іване Петровичу", hint: "Іван Петрович", explain: "имя на -е, отчество на -у" }
  - { type: cloze, text: "___, вставай, бо запізнишся!", answer: "синку", hint: "синок", explain: "суффикс -к- → -у: синку" }
  - { type: cloze, text: "___, не плач!", answer: "Олю", hint: "Оля", explain: "ласкательное имя мягкой группы → -ю" }
  - { type: cloze, text: "___, ти молодець!", answer: "Сергію", hint: "Сергій", explain: "основа на й → -ю" }
  - { type: cloze, text: "___, чекаю на тебе.", answer: "Олено", hint: "Олена", explain: "I скл., твёрдая группа → -о" }
  - { type: cloze, text: "Шановний ___!", answer: "пане професоре", hint: "пан професор", explain: "оба слова в звательном: пане професоре" }
  - { type: cloze, text: "___, іди сюди!", answer: "хлопче", hint: "хлопець", explain: "существительные на -ець → -че" }
  - { type: cloze, text: "___, дякую за допомогу.", answer: "пане лікарю", hint: "пан лікар", explain: "лікар — мягкая группа (лікаря) → -ю" }
  - { type: cloze, text: "___, як справи?", answer: "Наталіє", hint: "Наталія", explain: "на -ія → -іє: Наталіє, Маріє" }
  - { type: cloze, text: "___, ти вдома?", answer: "Тарасе", hint: "Тарас", explain: "II скл., твёрдая группа → -е" }
