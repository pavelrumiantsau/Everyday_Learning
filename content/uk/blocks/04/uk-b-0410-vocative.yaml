  - { type: cloze, text: "Щиро дякую, ___!", answer: "колего", hint: "колега", explain: "I скл., твёрдая группа → -о" }
  - { type: judge, text: "Іван, добрий день!", correct: false, fix: "Іване, добрий день!", explain: "обращение — в звательном падеже" }
  - { type: judge, text: "Пані Олено, дякую вам!", correct: true, explain: "пані не меняется, имя в звательном" }
  - { type: judge, text: "Пане Андрій, заходьте!", correct: false, fix: "Пане Андрію, заходьте!", explain: "оба слова в звательном: пане Андрію" }
  - { type: judge, text: "Шановний пане Іване!", correct: true, explain: "в письме: Шановний пане + имя в звательном" }
