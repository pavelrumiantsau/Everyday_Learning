  - { type: cloze, text: "___, ходімо додому!", answer: "Діти", hint: "діти", explain: "во множественном числе звательный = именительный" }
  - { type: cloze, text: "___, послухай мене.", answer: "Миколо", hint: "Микола", explain: "мужское имя I скл., твёрдая группа → -о" }
  - { type: cloze, text: "Добраніч, ___!", answer: "дідусю", hint: "дідусь", explain: "мягкая группа → -ю: дідусю" }
