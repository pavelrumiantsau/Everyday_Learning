# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.7 and standard grammar. Exercises are append-only.
id: uk-b-0407
part: 4
order: 7
title: "II склонение: средний род (вікно, поле, знання)"
source: "§4.7"
level: B1
rule: |
  Средний род II склонения: **твёрдая** группа (*вікно, місто, озеро*), **мягкая** (*поле, море*) и слова на ***-ння, -ття, -сся*** (*знання, життя, волосся*), которые тоже относятся к мягкой.

  - **Творительный:** *-ом* в твёрдой (*вікном, містом*), *-ем* в мягкой (*полем, морем*), *-ям* у слов на *-ння* (*знанням*).
  - **Местный:** *-і* (*у вікні, у полі, у місті*).
  - **Родительный мн.:** нулевое окончание со вставными *о, е* или с чередованием в твёрдой группе (*вікон, озер, крісел, сіл*), *-ів* в мягкой (*полів, морів*), нуль у слов на *-ння* (*знань*).
  - **Звательный** среднего рода **совпадает с именительным**: *сонце!, море!*
tables:
  - head: ["Падеж", "Твёрдая", "Мягкая", "На -ння"]
    rows:
      - ["Н.", "вікно", "поле", "знання"]
      - ["Р.", "вікна", "поля", "знання"]
      - ["Д.", "вікну", "полю", "знанню"]
      - ["З.", "вікно", "поле", "знання"]
      - ["О.", "вікном", "полем", "знанням"]
      - ["М.", "(у) вікні", "(у) полі", "(у) знанні"]
      - ["Р. мн.", "вікон", "полів", "знань"]
pairs:
  - { wrong: "багато полей", right: "багато полів" }
  - { wrong: "багато вікн", right: "багато вікон" }
  - { wrong: "багато сел", right: "багато сіл" }
examples:
  - { text: "За вікном шумить море." }
  - { text: "У нашому районі багато сіл і озер." }
  - { text: "Учитель задоволений нашими знаннями." }
