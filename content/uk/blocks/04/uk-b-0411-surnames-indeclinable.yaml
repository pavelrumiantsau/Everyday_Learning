# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.11 and standard grammar. Exercises are append-only.
id: uk-b-0411
part: 4
order: 11
title: "Фамилии и несклоняемые слова"
source: "§4.11"
level: B2
rule: |
  **Мужские фамилии на *-ко*** склоняются по II склонению: *Шевченко — Шевченка, Шевченкові, Шевченком*. **Женские на *-ко*** не склоняются: *з Оленою Шевченко, роман Ліни Костенко*.

  **Фамилии на согласный:** мужские склоняются (*Мельник — Мельника, панові Мельнику*), женские — нет (*пані Ганні Мельник*).

  **Фамилии на *-ов, -ін, -ин*** в творительном получают ***-им***: *з Петровим, з Пушкіним*.

  Имя при фамилии склоняется всегда: *Івана Франка, Ліни Костенко*. Если подряд два слова в дательном, окончания чередуют: *Тарасові Шевченку*.

  **Несклоняемые заимствования** обычно **среднего рода**: *кафе, кіно, пальто, таксі, журі* — *нове пальто, затишне кафе*.
tables:
  - head: ["Фамилия", "Он", "Она"]
    rows:
      - ["Шевченко", "Шевченка, Шевченкові, Шевченком", "не склоняется"]
      - ["Мельник", "Мельника, Мельникові, Мельником", "не склоняется"]
      - ["Петров", "Петрова, Петрову, Петровим", "Петрова, Петрової, Петровою"]
pairs:
  - { wrong: "з Оленою Шевченкою", right: "з Оленою Шевченко" }
  - { wrong: "з паном Петровом", right: "з паном Петровим" }
  - { wrong: "новий пальто", right: "нове пальто" }
examples:
  - { text: "Ми читали вірші Тараса Шевченка і Ліни Костенко." }
  - { text: "Пані Ганна Мельник познайомилася з паном Петровим." }
  - { text: "Я купила нове пальто й пішла в кафе." }
exercises:
