  - { type: cloze, text: "Ми зустрілися з паном ___.", answer: "Коваленком", hint: "Коваленко", explain: "мужская фамилия на -ко: О. в. -ом" }
  - { type: cloze, text: "Я розмовляла з Оленою ___.", answer: "Шевченко", hint: "Шевченко", explain: "женская фамилия на -ко не склоняется" }
  - { type: cloze, text: "Передайте лист пані Ганні ___.", answer: "Мельник", hint: "Мельник", explain: "женская фамилия на согласный не склоняется" }
  - { type: cloze, text: "Документи передали панові ___.", answer: "Мельнику", hint: "Мельник", explain: "мужская фамилия склоняется; два слова в Д. в. — чередование" }
