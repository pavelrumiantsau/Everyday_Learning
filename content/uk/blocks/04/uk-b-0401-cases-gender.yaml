# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.1–4.3 and standard grammar. Exercises are append-only.
id: uk-b-0401
part: 4
order: 1
title: "Падежи и род: что не как в русском"
source: "§4.1–4.3"
level: B1
rule: |
  В украинском **7 падежей** — шесть русских плюс **звательный** (*кличний*) — и **4 склонения** (*відміни*). Литовский с его падежами почти совпадает по набору, но украинский **местный падеж употребляется только с предлогом** (*у, в, на, по, при*): *у місті*, а не литовское *mieste*.

  **Род не как в русском** — частая ошибка русскоязычных:
  - мужской: ***біль*** (*сильний біль*), *степ, насип, ступінь, полин, посуд, продаж*, *тюль, шампунь*; ***собака*** — обычно мужской (*великий собака*);
  - женский: ***подорож*** (*цікава подорож*), *розкіш*.

  Белорусский здесь помогает: *боль* и *сабака* в нём тоже мужского рода.

  **Только множественное число:** *двері, ворота, гроші, окуляри, штани, ножиці, канікули*.

  **Склонения:** I — на *-а, -я* (*вода, земля, Микола*); II — мужской род с нулём или *-о* и средний на *-о, -е, -я* (*дуб, батько, вікно, поле, знання*); III — женский с нулевым окончанием + *мати* (*ніч, радість*); IV — средний на *-а, -я* с *-ат-, -ят-, -ен-* (*курча, ім’я*).
