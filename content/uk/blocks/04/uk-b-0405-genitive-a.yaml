# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.6 (table, left column) and Український правопис 2019. Exercises are append-only.
id: uk-b-0405
part: 4
order: 5
title: "Родительный -а / -у ①: когда -а"
source: "§4.6"
level: B2
rule: |
  Окончание родительного падежа мужского рода II склонения — ***-а (-я)*** или ***-у (-ю)***. Это самое сложное место грамматики для всех, включая носителей. **Общая логика: *-а* — для конкретного и счётного, *-у* — для абстрактного, вещества и совокупности.** В этом блоке — случаи на ***-а***:

  - **люди, животные, имена:** *брата, професора, коня, Петра*;
  - **конкретные предметы:** *олівця, ножа, комп’ютера, автобуса*;
  - **единицы измерения, месяцы, дни недели:** *метра, кілограма, літра, березня, понеділка, тижня*;
  - **населённые пункты:** *Києва, Львова, Луцька, Парижа*;
  - **геометрические фигуры:** *квадрата, трикутника*;
  - **термины-предметы:** *атома, суфікса, документа*.

  Отдельно запомните ***року*** (а не «рока») и ***дому*** (как «домашний очаг») — они на *-у*. Правопис 2019 допускает параллельные формы для некоторых городов; если сомневаетесь, проверяйте по словарю (goroh.pp.ua).
