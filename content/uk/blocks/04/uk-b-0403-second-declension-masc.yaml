# Written with Claude Code from the course PDF §4.5 and standard grammar. Exercises are append-only.
id: uk-b-0403
part: 4
order: 3
title: "II склонение: мужской род (дуб, брат, кінь, ніж)"
source: "§4.5"
level: B1
rule: |
  Мужской род II склонения делится на группы: **твёрдая** (*дуб, брат*), **мягкая** (*кінь, лікар, учитель*), **смешанная** — основа на *ж, ч, ш, щ* (*ніж, товариш*).

  - **Творительный:** ***-ом*** в твёрдой (*братом*), ***-ем*** в мягкой и смешанной (*конем, ножем, лікарем, товаришем*).
  - **Винительный:** у неодушевлённых = именительный (*бачу дуб*), у одушевлённых = родительный (*бачу брата*).
  - **Именительный мн.:** *-и* в твёрдой (*дуби, брати*), *-і* в мягкой и смешанной (*коні, ножі*).
  - **Родительный мн.:** обычно ***-ів*** (*дубів, братів, ножів*), у некоторых ***-ей*** (*коней*).
  - **Творительный мн.:** *-ами*; у *кінь* — *кіньми* (и *конями*).

  Дательный (*братові*) и местный (*на дубі, у парку*) — в блоке 4.4, родительный *-а / -у* — в 4.5–4.6.
tables:
  - head: ["Падеж", "Твёрдая (неодуш.)", "Твёрдая (одуш.)", "Мягкая", "Смешанная"]
    rows:
