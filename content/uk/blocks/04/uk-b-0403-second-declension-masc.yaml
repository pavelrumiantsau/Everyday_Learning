      - ["З.", "дуб", "брата", "коня", "ніж"]
      - ["О.", "дубом", "братом", "конем", "ножем"]
      - ["Н. мн.", "дуби", "брати", "коні", "ножі"]
      - ["Р. мн.", "дубів", "братів", "коней", "ножів"]
      - ["О. мн.", "дубами", "братами", "кіньми, конями", "ножами"]
pairs:
  - { wrong: "ріжу ножом", right: "ріжу ножем" }
  - { wrong: "працює лікарьом", right: "працює лікарем" }
  - { wrong: "немає коньов", right: "немає коней" }
examples:
