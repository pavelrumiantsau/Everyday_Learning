# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §4.9 and standard grammar. Exercises are append-only.
id: uk-b-0409
part: 4
order: 9
title: "IV склонение (курча, кошеня, ім’я)"
source: "§4.9"
level: B2
rule: |
  К IV склонению относятся слова **среднего рода на *-а, -я***, которые в косвенных падежах добавляют суффиксы ***-ат-, -ят-*** (детёныши: *курча, теля, кошеня, цуценя, лоша, пташеня*) или ***-ен-*** (*ім’я, плем’я*).

  - **Творительный ед. ч.:** суффикс *-ат-* **выпадает**: *курчам, телям, кошеням*; у *ім’я* — *ім’ям* и *іменем*.
  - **Винительный ед. ч.** = именительный: *бачу кошеня*.
  - **Множественное:** *курчата, кошенята, імена*; Р. мн. *курчат, кошенят, імен*.
  - **Звательный** = именительный.

  Русские *цыплёнок, телёнок, котёнок, щенок* в украинском чаще передаются именно IV склонением: *курча, теля, кошеня, цуценя*.
