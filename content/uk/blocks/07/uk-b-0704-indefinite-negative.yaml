# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §7.5 and Український правопис 2019. Exercises are append-only.
id: uk-b-0704
part: 7
order: 4
title: "Неопределённые и отрицательные: хтось, будь-хто, ні з ким"
source: "§7.5"
level: B2
rule: |
  - ***-сь*** (*хтось, щось, якийсь*) — кто-то, что-то: конкретное, но неизвестное;
  - ***-небудь, будь-*** (*хто-небудь, будь-що, будь-який*) — кто-нибудь, что угодно, любой;
  - ***де-*** (*дехто, дещо, деякий*) — некоторые, кое-что;
  - ***аби-*** (*абихто, абищо, абияк*) — с оттенком «кто попало, как попало»;
  - ***казна-, хтозна-, бозна-*** (*казна-що, хтозна-де*) — бог знает что / где;
  - ***ні-*** (*ніхто, ніщо, ніякий, нічий*) — отрицание.

  **Предлог встаёт между частицей и местоимением, и всё пишется раздельно:** ***ні з ким, де в кого, будь з ким, казна з чим***.

  **Двойное отрицание**, как в русском и литовском: *Ніхто нічого не знає.*
tables:
  - head: ["Тип", "Примеры", "Значение"]
    rows:
      - ["-сь", "хтось, щось, якийсь", "кто-то, что-то"]
      - ["-небудь, будь-", "хто-небудь, будь-що", "кто-нибудь, что угодно"]
      - ["де-", "дехто, дещо, деякий", "некоторые, кое-что"]
      - ["аби-", "абихто, абищо, абиякий", "кто попало"]
      - ["казна-, хтозна-, бозна-", "казна-що, хтозна-де", "бог знает что / где"]
      - ["ні-", "ніхто, ніщо, ніякий, нічий", "отрицание"]
pairs:
  - { wrong: "ні-з-ким", right: "ні з ким" }
  - { wrong: "будь-з ким", right: "будь з ким" }
examples:
  - { text: "Мені хтось телефонував, але я не знаю хто." }
  - { text: "Я ні з ким не сварився." }
  - { text: "Ніхто нічого не знає." }
exercises:
