  - { type: choice, text: "Він робить роботу ___.", options: ["абияк", "будь-як"], answer: 0, explain: "как попало — абияк" }
  - { type: choice, text: "Він говорить ___.", options: ["казна-що", "будь-що"], answer: 0, explain: "бог знает что — казна-що" }
  - { type: choice, text: "___ не знає відповіді.", options: ["Ніхто", "Хтось"], answer: 0, explain: "двойное отрицание: ніхто не знає" }
