  - { type: cloze, text: "Він ходить казна ___.", answer: "з ким", hint: "з + хто", explain: "казна з ким — раздельно" }
  - { type: cloze, text: "Він ні ___ не залежить.", answer: "від кого", hint: "від + хто", explain: "ні від кого — раздельно" }
