  - { type: cloze, text: "Ми сиділи біля ___.", answer: "них", hint: "вони", explain: "после предлога — н-: біля них" }
  - { type: cloze, text: "У ___ є сестра.", answer: "неї", hint: "вона", explain: "после предлога — н-: у неї" }
