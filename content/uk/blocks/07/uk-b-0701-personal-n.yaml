# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §7.1 and standard grammar. Exercises are append-only.
id: uk-b-0701
part: 7
order: 1
title: "Личные местоимения: до нього, у неї є"
source: "§7.1"
level: B1
rule: |
  **Приставное *н-* появляется после предлога:** *до **нього**, з **нею**, біля **них**, у **неї** є сестра*. Без предлога — *його, її, їх*: *я його бачу*.

  **Притяжательные *його, її, їх* не получают *н-*** даже после предлога: *до **його** брата* (к его брату), но *до **нього*** (к нему).

  **В творительном *ним, нею, ними* всегда с *н-***, даже без предлога: *пишаємося ним, захоплююся нею*.

  **«У меня есть»** — *у мене є* или с глаголом ***мати***: *я маю час*. Оба варианта нормативны; конструкция с *мати* очень частотна и звучит естественно (как белорусское *я маю*).
tables:
  - head: ["Падеж", "я", "ти", "він, воно", "вона", "ми", "ви", "вони", "себе"]
    rows:
      - ["Р.", "мене", "тебе", "його, нього", "її, неї", "нас", "вас", "їх, них", "себе"]
      - ["Д.", "мені", "тобі", "йому", "їй", "нам", "вам", "їм", "собі"]
      - ["З.", "мене", "тебе", "його, нього", "її, неї", "нас", "вас", "їх, них", "себе"]
      - ["О.", "мною", "тобою", "ним", "нею", "нами", "вами", "ними", "собою"]
      - ["М.", "(на) мені", "(на) тобі", "(на) ньому, нім", "(на) ній", "(на) нас", "(на) вас", "(на) них", "(на) собі"]
pairs:
  - { wrong: "у його є машина", right: "у нього є машина / він має машину" }
  - { wrong: "до нього брата", right: "до його брата" }
  - { wrong: "з їми", right: "з ними" }
examples:
  - { text: "У неї є сестра, і я часто розмовляю з нею." }
  - { text: "Я йду до нього, а не до його брата." }
  - { text: "Ми пишаємося ним." }
exercises:
