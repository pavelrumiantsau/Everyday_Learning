# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §7.2 and standard grammar. Exercises are append-only.
id: uk-b-0702
part: 7
order: 2
title: "Притяжательные: мій, наш, їхній; свій"
source: "§7.2"
level: B1
rule: |
  ***Мій, твій, свій*** склоняются одинаково (*мого, моєї, моєму, моїм…*); ***наш, ваш*** — как твёрдые прилагательные (*нашого, нашій, нашим*). «Их» как притяжательное: ***їхній, їхня, їхнє*** (склоняется) или неизменяемое ***їх***: *їхній дім = їх дім*.

  **Свій против мій.** Если предмет принадлежит подлежащему, в хорошем стиле употребляется ***свій***: *Я люблю **своє** місто, Вона подзвонила **своїй** мамі*. Здесь помогает литовский: *savo* работает так же (*aš myliu savo miestą*).

  **В третьем лице разница меняет смысл:** *Він узяв **свою** книжку* (свою) — *Він узяв **його** книжку* (чужую, другого человека).
tables:
  - head: ["Падеж", "м. р.", "ж. р.", "мн. ч."]
    rows:
      - ["Н.", "мій", "моя", "мої"]
      - ["Р.", "мого", "моєї", "моїх"]
      - ["Д.", "моєму", "моїй", "моїм"]
      - ["З.", "мій / мого", "мою", "мої / моїх"]
      - ["О.", "моїм", "моєю", "моїми"]
      - ["М.", "(на) моєму, моїм", "(на) моїй", "(на) моїх"]
pairs:
  - { wrong: "Вона подзвонила її мамі (о своей маме)", right: "Вона подзвонила своїй мамі" }
  - { wrong: "Я люблю моє місто", right: "Я люблю своє місто" }
examples:
  - { text: "Я люблю своє місто." }
  - { text: "Олег узяв свою книжку, а не братову." }
  - { text: "Це їхній будинок, а наш — поруч." }
exercises:
  - { type: cloze, text: "Я люблю ___ місто.", answer: "своє", also: ["моє"], hint: "своє / моє", explain: "предмет принадлежит подлежащему — лучше свій" }
  - { type: cloze, text: "Вона подзвонила ___ мамі.", answer: "своїй", hint: "своя мама", explain: "свою маму = своїй; її мамі — мама другой женщины" }
  - { type: cloze, text: "Він узяв ___ книжку.", answer: "свою", hint: "свою", explain: "собственная книга — свій" }
  - { type: cloze, text: "Немає ___ сестри вдома.", answer: "моєї", hint: "моя", explain: "Р. в. ж. р.: моєї" }
  - { type: cloze, text: "Я подарував це ___ другові.", answer: "своєму", also: ["моєму"], hint: "свій / мій", explain: "Д. в.: своєму (лучше) / моєму" }
  - { type: cloze, text: "Біля ___ будинку є парк.", answer: "нашого", hint: "наш", explain: "наш — как твёрдое прилагательное" }
  - { type: cloze, text: "Ми познайомилися з ___ дітьми.", answer: "вашими", hint: "ваш", explain: "О. мн.: вашими" }
  - { type: cloze, text: "Це ___ дім.", answer: "їхній", also: ["їх"], hint: "вони, чий?", explain: "їхній или неизменяемое їх" }
  - { type: cloze, text: "Я знаю ___ доньку.", answer: "їхню", also: ["їх"], hint: "вони, чию?", explain: "їхня → З. в. їхню (или їх)" }
  - { type: cloze, text: "Я розповів про ___ родину.", answer: "свою", also: ["мою"], hint: "свою / мою", explain: "принадлежит подлежащему — лучше свою" }
  - { type: cloze, text: "Я пишаюся ___ сином.", answer: "своїм", also: ["моїм"], hint: "свій / мій", explain: "О. в.: своїм (лучше) / моїм" }
  - { type: cloze, text: "Він познайомився з ___ подругою.", answer: "моєю", hint: "моя", explain: "моя подруга (подлежащее — він): моєю" }
  - { type: cloze, text: "Що у ___ кімнаті?", answer: "твоїй", hint: "твоя", explain: "М. в. ж. р.: твоїй" }
  - { type: cloze, text: "Ключі лежать на ___ столі.", answer: "моєму", also: ["моїм"], hint: "мій", explain: "М. в.: моєму / моїм" }
  - { type: choice, text: "Петро взяв ___ телефон (свій власний).", options: ["свій", "його"], answer: 0, explain: "собственный — свій" }
  - { type: choice, text: "Петро взяв ___ телефон (телефон брата).", options: ["його", "свій"], answer: 0, explain: "чужой — його" }
  - { type: choice, text: "Діти люблять ___ батьків.", options: ["своїх", "їхніх"], answer: 0, explain: "собственных — своїх" }
  - { type: choice, text: "Вона розповіла про ___ роботу.", options: ["свою", "її"], answer: 0, explain: "о собственной работе — свою" }
  - { type: choice, text: "Я не знайшов ___ ключів.", options: ["своїх", "свої"], answer: 0, explain: "после отрицания — Р. мн.: своїх" }
  - { type: judge, text: "Вона подзвонила своїй мамі.", correct: true, explain: "свій — предмет принадлежит подлежащему" }
  - { type: judge, text: "Олег прийшов зі своєю дружиною.", correct: true, explain: "свій — своєю дружиною" }
  - { type: judge, text: "Це їх будинок.", correct: true, explain: "їх — неизменяемый вариант їхній" }
  - { type: judge, text: "Це їхній будинок.", correct: true, explain: "їхній — склоняемый вариант" }
