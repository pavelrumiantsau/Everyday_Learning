# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 7 (course PDF §7.7 «Типичные ошибки»). Written with Claude Code. Exercises are append-only.
id: uk-b-0706
part: 7
order: 6
title: "Местоимение: повторение и типичные ошибки"
source: "§7.7"
level: B2
rule: |
  Типичные ошибки русскоязычных в местоимении (§7.7):

  - ✗ *у його є машина* → ✓ ***у нього є машина / він має машину***;
  - ✗ *до нього брата* → ✓ ***до його брата***;
  - ✗ *з їми* → ✓ ***з ними***;
  - ✗ *той же самий* → ✓ ***той самий***;
  - ✗ *книга, котру я читаю* → ✓ ***книга, яку я читаю***;
  - ✗ *будь-з ким, ні-з ким* → ✓ ***будь з ким, ні з ким***.

  Плюс *свій* для того, что принадлежит подлежащему, и *усе / все* по благозвучию.
pairs:
  - { wrong: "у його є машина", right: "у нього є машина" }
  - { wrong: "книга, котру я читаю", right: "книга, яку я читаю" }
  - { wrong: "ні-з-ким", right: "ні з ким" }
examples:
  - { text: "У нього є брат, і я часто бачу його брата." }
  - { text: "Я ні з ким не говорив про це." }
  - { text: "Це той самий фільм, який ми дивилися вчора." }
