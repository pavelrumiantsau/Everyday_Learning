  - { type: choice, text: "Вона ___ знає.", options: ["все", "усе"], answer: 0, explain: "после гласного перед согласным → все" }
  - { type: choice, text: "Брат ___ розповів.", options: ["усе", "все"], answer: 0, explain: "между согласными → усе" }
  - { type: choice, text: "Мама ___ приготувала.", options: ["все", "усе"], answer: 0, explain: "после гласного → все" }
  - { type: cloze, text: "Я дякую ___ вам.", answer: "всім", hint: "всі", explain: "Д. мн.: всім" }
  - { type: cloze, text: "Ми поговорили з ___ учасниками.", answer: "усіма", hint: "усі / всі", explain: "О. мн.; після з — усіма (благозвучие)" }
  - { type: cloze, text: "Протягом ___ дня йшов дощ.", answer: "усього", hint: "увесь / весь", explain: "Р. в.; после согласного — усього" }
  - { type: cloze, text: "Вона задоволена ___ роботою.", answer: "всією", hint: "вся / уся", explain: "О. в. ж. р.; после гласного — всією" }
  - { type: cloze, text: "Новина облетіла ___ країну.", answer: "всю", hint: "вся / уся", explain: "З. в. ж. р.; после гласного — всю" }
  - { type: cloze, text: "___ учень має щоденник.", answer: "Кожен", also: ["Кожний"], hint: "кожний / кожен", explain: "кожен = кожний" }
  - { type: choice, text: "Візьми ___ ручку.", options: ["будь-яку", "всяку"], answer: 0, explain: "«любую» — будь-яку" }
  - { type: choice, text: "Я ___ це зроблю.", options: ["сам", "самий"], answer: 0, explain: "собственной персоной — сам" }
  - { type: choice, text: "Прийшов ___ директор.", options: ["сам", "самий"], answer: 0, explain: "собственной персоной — сам" }
  - { type: choice, text: "Це той ___ чоловік.", options: ["самий", "сам"], answer: 0, explain: "тот же — той самий" }
  - { type: choice, text: "Ми розмовляли до ___ ранку.", options: ["самого", "самому"], answer: 0, explain: "до + Р. в.: до самого ранку" }
  - { type: fix, text: "Це той же самий чоловік.", answer: "Це той самий чоловік.", explain: "той же самий → той самий" }
  - { type: fix, text: "Це самий кращий день.", answer: "Це найкращий день.", explain: "самий для превосходной не употребляется" }
  - { type: fix, text: "Всякий може помилитися.", answer: "Будь-хто може помилитися.", also: ["Кожен може помилитися.", "Кожний може помилитися."], explain: "«любой» — будь-хто / кожен" }
  - { type: cloze, text: "Вона живе в ___ місті.", answer: "іншому", hint: "інший", explain: "М. в.: іншому" }
  - { type: cloze, text: "Я сам ___ зробив.", answer: "усе", hint: "все / усе", explain: "между согласными (м _ з) → усе" }
  - { type: judge, text: "Він усе знає.", correct: true, explain: "между согласными → усе" }
  - { type: judge, text: "Ми чекали до самого вечора.", correct: true, explain: "самий = именно тот: до самого вечора" }
