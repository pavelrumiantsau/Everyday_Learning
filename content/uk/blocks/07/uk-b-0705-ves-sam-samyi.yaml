# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §7.6 and standard grammar. Exercises are append-only.
id: uk-b-0705
part: 7
order: 5
title: "Весь / увесь, кожен, сам и самий"
source: "§7.6"
level: B2
rule: |
  ***Весь / увесь, вся / уся, все / усе, всі / усі*** — выбор формы по правилу благозвучия (как *у / в*): *він **усе** знає, вона **все** знає*. Склонение: *всього, всьому, всім; всієї, всій, всю, всією; всіх, всім, всіма*.

  ***Кожний / кожен, будь-який, інший***. Русское *всякий* в смысле «любой» — лучше ***будь-який***.

  ***Сам*** = «сам, собственной персоной»: *я сам зроблю, сам директор прийшов*.
  ***Самий*** = «тот же / именно тот»: *той самий чоловік, до самого ранку*. Для превосходной степени *самий* **не употребляется** (см. блок 5.4). Русское *тот же самый* → ***той самий***.
tables:
  - head: ["Слово", "Значение", "Пример"]
    rows:
      - ["сам", "собственной персоной", "я сам зроблю"]
      - ["самий", "тот же, именно тот", "той самий чоловік, до самого ранку"]
      - ["будь-який", "любой", "будь-яка ручка"]
pairs:
  - { wrong: "той же самий", right: "той самий" }
  - { wrong: "всякий може помилитися", right: "будь-хто може помилитися" }
examples:
  - { text: "Він усе знає, а вона все забуває." }
  - { text: "Це той самий чоловік, якого ми бачили вчора." }
  - { text: "Я сам усе зроблю." }
exercises:
