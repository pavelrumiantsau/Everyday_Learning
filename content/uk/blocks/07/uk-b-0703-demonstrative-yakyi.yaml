# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §7.3–7.4 and standard grammar. Exercises are append-only.
id: uk-b-0703
part: 7
order: 3
title: "Цей, той; який против котрий"
source: "§7.3–7.4"
level: B2
rule: |
  **Указательные *цей, той*** склоняются (см. таблицу); так же *такий, стільки*. Русское *это* как связка — ***це***: *Це мій друг.*

  **Вопросительные *хто, що*:** *кого, кому, ким, (на) кому / кім; чого, чому, чим, (на) чому / чім*.

  **Який против котрий.** В относительных придаточных естественнее ***який***: *книга, **яку** я читаю; людина, **яка** це сказала*. ***Котрий*** — для **порядка и выбора из ряда**: *Котра година? Котрий з вас перший?* Постоянное *котрий* по модели русского *который* выдаёт кальку.

  ***Що*** тоже служит относительным словом в разговорной и художественной речи: *той, що прийшов; хата, що на краю села*.
tables:
  - head: ["Падеж", "цей", "ця", "ці", "той", "та", "ті"]
    rows:
      - ["Н.", "цей (ср. це)", "ця", "ці", "той (ср. те)", "та", "ті"]
      - ["Р.", "цього", "цієї", "цих", "того", "тієї, тої", "тих"]
      - ["Д.", "цьому", "цій", "цим", "тому", "тій", "тим"]
      - ["З.", "цей / цього", "цю", "ці / цих", "той / того", "ту", "ті / тих"]
      - ["О.", "цим", "цією", "цими", "тим", "тією, тою", "тими"]
      - ["М.", "(на) цьому, цім", "(на) цій", "(на) цих", "(на) тому, тім", "(на) тій", "(на) тих"]
pairs:
  - { wrong: "книга, котру я читаю", right: "книга, яку я читаю" }
  - { wrong: "будинок, в котрому я живу", right: "будинок, у якому я живу" }
examples:
  - { text: "Книжка, яку я читаю, дуже цікава." }
  - { text: "Котрий з вас прийшов першим?" }
  - { text: "Хата, що на краю села, — наша." }
