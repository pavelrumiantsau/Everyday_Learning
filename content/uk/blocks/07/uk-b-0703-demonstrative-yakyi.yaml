  - { type: cloze, text: "Я розмовляла з ___ жінкою.", answer: "тією", also: ["тою"], hint: "та", explain: "О. в. ж. р.: тією / тою" }
  - { type: cloze, text: "Про ___ людей я нічого не знаю.", answer: "тих", hint: "ті", explain: "З. мн. одушевлённых: тих" }
