# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.11 and standard grammar. Exercises are append-only.
id: uk-b-0812
part: 8
order: 12
title: "Деепричастия: читаючи, прочитавши"
source: "§8.11"
level: B2
rule: |
  **Деепричастия (*дієприслівники*):**
  - несовершенного вида — ***-учи, -ючи, -ачи, -ячи***: *читаючи, несучи, сидячи, сміючись* (рус. *читая, неся, сидя, смеясь*);
  - совершенного вида — ***-вши, -ши***: *прочитавши, принісши, повернувшись* (рус. *прочитав, принеся, вернувшись*).

  **Ловушка:** русское деепричастие *прочитав* совпадает с украинским **прошедшим временем** *прочитав* («прочитал»). Деепричастие в украинском — только ***прочитавши***.

  **Деепричастный оборот должен относиться к подлежащему**, как и в русском: *Прочитавши лист, вона заплакала*, а не ✗ *Прочитавши лист, їй стало сумно*.
tables:
  - head: ["Вид", "Суффиксы", "Примеры", "Русский"]
    rows:
      - ["несовершенный", "-учи, -ючи, -ачи, -ячи", "читаючи, несучи, сидячи, сміючись", "читая, неся, сидя, смеясь"]
      - ["совершенный", "-вши, -ши", "прочитавши, принісши, повернувшись", "прочитав, принеся, вернувшись"]
pairs:
  - { wrong: "Прочитав лист, вона заплакала.", right: "Прочитавши лист, вона заплакала." }
  - { wrong: "Прочитавши лист, їй стало сумно.", right: "Прочитавши лист, вона засмутилася." }
examples:
