# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.2 and standard grammar. Exercises are append-only.
id: uk-b-0802
part: 8
order: 2
title: "Настоящее время: два спряжения (він пише, вони роблять)"
source: "§8.2"
level: B1
rule: |
  **3-е лицо ед. ч. I спряжения — без *-ть***: *він **пише**, читає, може* — точно так же, как в белорусском (*піша, чытае*). **Во II спряжении *-ть* есть**: *він **робить***.

  **1-е лицо мн. ч. — *-емо / -имо*** (рус. *-ем / -им*): *читаємо, робимо*.

  **Как определить спряжение:** по 3-му лицу мн. ч. *-уть / -ють* — I, *-ать / -ять* — II.

  **Чередования** в 1-м лице II спряжения: *ходжу, їжджу, люблю, ношу* (см. блок 2.4). **В 3-м лице мн. ч. у глаголов с губным появляется *л***: *роблять, люблять, сплять* (рус. *делают, любят, спят*).
tables:
  - head: ["Лицо", "I: писати", "I: читати", "II: робити", "II: стояти"]
    rows:
      - ["я", "пишу", "читаю", "роблю", "стою"]
      - ["ти", "пишеш", "читаєш", "робиш", "стоїш"]
      - ["він, вона", "пише", "читає", "робить", "стоїть"]
      - ["ми", "пишемо", "читаємо", "робимо", "стоїмо"]
      - ["ви", "пишете", "читаєте", "робите", "стоїте"]
      - ["вони", "пишуть", "читають", "роблять", "стоять"]
pairs:
  - { wrong: "він пишеть", right: "він пише" }
  - { wrong: "вони робять", right: "вони роблять" }
  - { wrong: "ми читаєм", right: "ми читаємо" }
examples:
  - { text: "Він пише лист, а вона читає книжку." }
  - { text: "Діти сплять, а батьки роблять вечерю." }
  - { text: "Ми читаємо разом щовечора." }
