# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.5 and standard grammar. Exercises are append-only.
id: uk-b-0806
part: 8
order: 6
title: "Вид глагола и суффикс -ува- (записувати)"
source: "§8.5"
level: B2
rule: |
  Система вида та же, что в русском. Пары образуются:
  - приставками: *писати — написати*;
  - суффиксами: *вирішувати — вирішити*;
  - другими корнями: *брати — взяти, казати — сказати*.

  **Особенность: украинский суффикс *-ува- / -юва-*** на месте русского *-ыва- / -ива-*: *переписувати* (переписывать), *записувати* (записывать), *підписувати, показувати, розв’язувати, використовувати, організовувати, розраховувати*.

  В настоящем времени *-ува-* превращается в *-у-*: *записувати — записую, записує; використовувати — використовую*. Русская основа *-ыва-* (*використовиваю*) — типичная ошибка.
tables:
  - head: ["Русский", "Українська", "Наст. время"]
    rows:
      - ["записывать", "записувати", "записую, записує"]
      - ["использовать", "використовувати", "використовую"]
      - ["подписывать", "підписувати", "підписую"]
      - ["решать (задачу, вопрос)", "розв’язувати", "розв’язую"]
      - ["организовывать", "організовувати", "організовую"]
pairs:
  - { wrong: "використовиваю", right: "використовую" }
  - { wrong: "записиваю", right: "записую" }
examples:
  - { text: "Я завжди записую нові слова в зошит." }
  - { text: "Ми використовуємо сучасні методи." }
  - { text: "Директор підписує документи щоранку." }
exercises:
  - { type: cloze, text: "Він завжди ___ лекції.", answer: "записує", hint: "рус. записывает", explain: "-ува- → наст. вр. записує" }
  - { type: cloze, text: "Ми ___ нові технології.", answer: "використовуємо", hint: "рус. используем", explain: "використовувати → використовуємо" }
  - { type: cloze, text: "Треба ___ цей текст.", answer: "переписати", also: ["переписувати"], hint: "рус. переписать", explain: "переписати / переписувати" }
  - { type: cloze, text: "Він ___ нам місто.", answer: "показує", hint: "рус. показывает", explain: "показувати → показує" }
  - { type: cloze, text: "Директор ___ документи.", answer: "підписує", hint: "рус. подписывает", explain: "підписувати → підписує" }
  - { type: cloze, text: "Учні ___ задачу.", answer: "розв’язують", hint: "рус. решают", explain: "розв’язувати → розв’язують" }
  - { type: cloze, text: "Ми ще ___, куди поїхати.", answer: "вирішуємо", hint: "рус. решаем", explain: "вирішувати → вирішуємо (о вопросе, проблеме лучше розв’язувати)" }
  - { type: cloze, text: "Дитина сама ___ шнурки.", answer: "зав’язує", hint: "рус. завязывает", explain: "зав’язувати → зав’язує" }
  - { type: cloze, text: "Ми ___ на вашу допомогу.", answer: "розраховуємо", hint: "рус. рассчитываем", explain: "розраховувати → розраховуємо" }
  - { type: cloze, text: "Він ___ концерт.", answer: "організовує", hint: "рус. организовывает", explain: "організовувати → організовує" }
  - { type: cloze, text: "Ти вже ___ цей матеріал?", answer: "опрацював", hint: "рус. обработал", explain: "опрацьовувати — опрацювати" }
  - { type: cloze, text: "Він довго писав і нарешті ___ лист.", answer: "написав", hint: "писати, сов. вид", explain: "пара с приставкой: писати — написати" }
  - { type: cloze, text: "Він ___ книжку і пішов.", answer: "взяв", also: ["узяв"], hint: "брати, сов. вид", explain: "другой корень: брати — взяти" }
  - { type: cloze, text: "Що він тобі ___?", answer: "сказав", hint: "казати, сов. вид", explain: "казати — сказати" }
  - { type: cloze, text: "Учора ми ___ поїхати на море.", answer: "вирішили", hint: "вирішувати, сов. вид", explain: "суффиксная пара: вирішувати — вирішити" }
  - { type: cloze, text: "Він щодня ___ нові слова.", answer: "записує", hint: "записувати", explain: "несов. вид, повторяющееся действие" }
  - { type: choice, text: "Він ___ все в зошит.", options: ["записує", "записиває"], answer: 0, explain: "-ува- → записує" }
  - { type: choice, text: "Ми ___ комп’ютер щодня.", options: ["використовуємо", "використовиваємо"], answer: 0, explain: "використовувати → використовуємо" }
  - { type: choice, text: "Хто ___ свято?", options: ["організовує", "організовиває"], answer: 0, explain: "організовувати → організовує" }
  - { type: judge, text: "Я переписую текст начисто.", correct: true, explain: "переписувати → переписую" }
  - { type: judge, text: "Він використовиває старі методи.", correct: false, fix: "Він використовує старі методи.", explain: "використовувати → використовує" }
  - { type: fix, text: "Я завжди записиваю домашнє завдання.", answer: "Я завжди записую домашнє завдання.", explain: "записувати → записую" }
