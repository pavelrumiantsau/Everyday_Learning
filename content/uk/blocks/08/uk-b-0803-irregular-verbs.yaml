# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.2 (irregular verbs) and standard grammar. Exercises are append-only.
id: uk-b-0803
part: 8
order: 3
title: "Неправильные глаголы: дати, їсти, відповісти; бути"
source: "§8.2"
level: B1
rule: |
  **Неправильные глаголы** — *дати, їсти, відповісти* (и все с теми же корнями: *продати, з’їсти, розповісти, повісти*):

  - *дати*: дам, даси, дасть, дамо, дасте, дадуть;
  - *їсти*: їм, їси, їсть, їмо, їсте, їдять;
  - *відповісти*: відповім, відповіси, відповість, відповімо, відповісте, відповідять.

  У ***бути*** в настоящем времени **одна форма *є* для всех лиц**: *у мене є, це є проблема*. В функции связки *є* чаще **опускается**: *Він лікар.*
tables:
  - head: ["Лицо", "дати", "їсти", "відповісти"]
    rows:
      - ["я", "дам", "їм", "відповім"]
      - ["ти", "даси", "їси", "відповіси"]
      - ["він", "дасть", "їсть", "відповість"]
      - ["ми", "дамо", "їмо", "відповімо"]
      - ["ви", "дасте", "їсте", "відповісте"]
      - ["вони", "дадуть", "їдять", "відповідять"]
pairs:
  - { wrong: "він їсте", right: "він їсть" }
  - { wrong: "вони дадут", right: "вони дадуть" }
examples:
  - { text: "Я дам тобі книжку, а ти мені — зошит." }
  - { text: "Що ви їсте на сніданок?" }
  - { text: "Мій брат лікар, а сестра вчителька." }
