# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.9 and standard usage guides. Exercises are append-only.
id: uk-b-0810
part: 8
order: 10
title: "Формы на -но, -то (роботу виконано)"
source: "§8.9"
level: C1
rule: |
  **Безличные формы на *-но, -то*** — характерная черта украинского. Они обозначают **результат действия** и **управляют винительным падежом**: *Роботу виконано. Двері зачинено. Лист надіслано. Відкрито нову школу.*

  **Время** передаётся связкой: *було зроблено, буде зроблено*; для настоящего — без связки.

  **Исполнителя в творительном лучше не указывать:** вместо *Мною зроблено звіт* — ***Я зробив звіт***.

  **В деловых текстах** эти формы звучат естественнее страдательных оборотов с *-ся*: *Питання розглянуто* лучше, чем *Питання розглядається комісією*.
tables:
  - head: ["Глагол", "Форма", "Пример"]
    rows:
      - ["виконати", "виконано", "Роботу виконано."]
      - ["зачинити", "зачинено", "Двері зачинено."]
      - ["відкрити", "відкрито", "Відкрито нову школу."]
      - ["розбити", "розбито", "Вікно розбито."]
      - ["затвердити", "затверджено", "Проєкт затверджено."]
pairs:
  - { wrong: "Мною зроблено звіт.", right: "Я зробив звіт." }
  - { wrong: "Відкрито нова школа.", right: "Відкрито нову школу." }
examples:
  - { text: "Роботу виконано вчасно." }
  - { text: "У місті відкрито нову школу." }
  - { text: "Звіт буде подано до п’ятниці." }
