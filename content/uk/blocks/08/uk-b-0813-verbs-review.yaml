# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 8 (course PDF §8.12 «Типичные ошибки»). Written with Claude Code. Exercises are append-only.
id: uk-b-0813
part: 8
order: 13
title: "Глагол: повторение и типичные ошибки"
source: "§8.12"
level: B2
rule: |
  Типичные ошибки русскоязычных в глаголе (§8.12):

  - ✗ *давайте почнемо* → ✓ ***почнімо***;
  - ✗ *він пишеть* → ✓ ***він пише***;
  - ✗ *вони робять* → ✓ ***вони роблять***;
  - ✗ *діючий договір* → ✓ ***чинний договір***;
  - ✗ *прочитав лист, вона заплакала* → ✓ ***прочитавши лист, вона заплакала***;
  - ✗ *я буду прочитати* → ✓ ***я прочитаю / я читатиму***;
  - ✗ *використовывати* → ✓ ***використовувати***;
  - *сміятися над ним* — лучше ***сміятися з нього***.
pairs:
  - { wrong: "давайте почнемо", right: "почнімо" }
  - { wrong: "він пишеть", right: "він пише" }
  - { wrong: "я буду прочитати", right: "я прочитаю" }
examples:
  - { text: "Почнімо: він пише, а вони роблять вправу." }
  - { text: "Прочитавши договір, ми переконалися, що він чинний." }
  - { text: "Завтра я читатиму, а потім прочитаю тобі уривок." }
exercises:
  - { type: fix, text: "Давайте почнемо урок.", answer: "Почнімо урок.", explain: "«давайте + будущее» → почнімо" }
  - { type: spot, text: "Він пишеть твір.", wrong: "пишеть", answer: "пише", explain: "I спряжение: без -ть" }
  - { type: spot, text: "Вони робять уроки.", wrong: "робять", answer: "роблять", explain: "губной + л: роблять" }
  - { type: spot, text: "Ми підписали діючий договір.", wrong: "діючий", answer: "чинний", explain: "действующий — чинний" }
  - { type: fix, text: "Прочитав книжку, він повернув її.", answer: "Прочитавши книжку, він повернув її.", explain: "деепричастие — прочитавши" }
  - { type: fix, text: "Я буду написати лист.", answer: "Я напишу лист.", also: ["Я писатиму лист.", "Я буду писати лист.", "Я напишу листа."], explain: "буду + совершенный вид — ошибка" }
  - { type: spot, text: "Ми використовиваємо нові методи.", wrong: "використовиваємо", answer: "використовуємо", explain: "-ува-: використовуємо" }
  - { type: spot, text: "Він не мог прийти.", wrong: "мог", answer: "міг", explain: "прошедшее: міг" }
  - { type: spot, text: "Кіт їсте рибу.", wrong: "їсте", answer: "їсть", explain: "їсти: він їсть" }
  - { type: fix, text: "Давай подзвонимо мамі.", answer: "Подзвонімо мамі.", explain: "«давай + будущее» → подзвонімо" }
  - { type: fix, text: "Пусть він відпочине.", answer: "Хай він відпочине.", also: ["Нехай він відпочине."], explain: "пусть → хай / нехай" }
  - { type: fix, text: "Як би я знав, то прийшов би.", answer: "Якби я знав, то прийшов би.", explain: "«если бы» — якби" }
  - { type: fix, text: "Слідуючий потяг прибуде о п’ятій.", answer: "Наступний потяг прибуде о п’ятій.", explain: "следующий — наступний" }
  - { type: choice, text: "Я ___ тебе біля входу.", options: ["чекатиму", "почекатиму"], answer: 0, explain: "синтетическое — только несовершенный вид" }
  - { type: choice, text: "Ми ___ щовечора.", options: ["читаємо", "читаєм"], answer: 0, explain: "1 л. мн.: -емо" }
  - { type: choice, text: "___ вправу, він відпочив.", options: ["Зробивши", "Зробив"], answer: 0, explain: "деепричастие — зробивши" }
  - { type: choice, text: "Хочу пояснити, ___ ти зрозумів.", options: ["щоб", "що б"], answer: 0, explain: "«чтобы» — щоб" }
  - { type: cloze, text: "Вони ___ свої речі.", answer: "несуть", hint: "нести", explain: "I спряжение: несуть" }
  - { type: cloze, text: "Він ___ сумку.", answer: "ніс", hint: "нести, прош.", explain: "прошедшее: ніс" }
  - { type: cloze, text: "Роботу ___ вчасно.", answer: "виконано", hint: "виконати, -но", explain: "форма на -но" }
  - { type: cloze, text: "___ в кіно!", answer: "Ходімо", hint: "ходити, ми", explain: "1 л. мн.: ходімо" }
  - { type: judge, text: "Я читатиму цю книжку весь вечір.", correct: true, explain: "синтетическое будущее" }
  - { type: judge, text: "Парламент ухвалив закон.", correct: true, explain: "активная конструкция" }
