# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.6 and standard grammar. Exercises are append-only.
id: uk-b-0807
part: 8
order: 7
title: "Повелительное: ходімо, почнімо, хай"
source: "§8.6"
level: B2
rule: |
  **Образование (2-е лицо ед. ч.):** после гласного — ***-й*** (*читай*), после ударного окончания — ***-и*** (*пиши, неси*), при ударении на основе — нулевое окончание или ***-ь*** (*сядь, встань, кинь, будь*). Мн. ч.: *-іть / -те*: *пишіть, читайте, сядьте*.

  **1-е лицо мн. ч. — призыв к совместному действию:** ***ходімо! почнімо! зробімо це!*** Вместо *давайте домовимося* — ***домовмося***. **Калька «давайте + будущее» — один из самых заметных русизмов.**

  **3-е лицо — с частицами *хай, нехай***: *Хай він подзвонить. Нехай живе Україна!*
tables:
  - head: ["Лицо", "писати", "читати", "сісти", "їсти"]
    rows:
      - ["2 ед.", "пиши", "читай", "сядь", "їж"]
      - ["1 мн.", "пишімо, пишім", "читаймо", "сядьмо", "їжмо"]
      - ["2 мн.", "пишіть", "читайте", "сядьте", "їжте"]
pairs:
  - { wrong: "давайте почнемо", right: "почнімо" }
  - { wrong: "давай подумаємо", right: "подумаймо" }
  - { wrong: "пусть він прийде", right: "хай (нехай) він прийде" }
examples:
  - { text: "Ходімо в кіно!" }
  - { text: "Почнімо урок." }
  - { text: "Хай він подзвонить мені ввечері." }
exercises:
