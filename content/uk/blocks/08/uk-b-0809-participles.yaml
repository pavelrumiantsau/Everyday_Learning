# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.8 and standard usage guides. Exercises are append-only.
id: uk-b-0809
part: 8
order: 9
title: "Причастия и кальки: чинний закон, наступний"
source: "§8.8"
level: C1
rule: |
  Русские причастия на *-ущ-, -ющ-, -ащ-, -ящ-* в украинском чаще всего передаются **иначе**.

  - **Действительные настоящего времени** (*-уч-, -юч-, -ач-, -яч-*) — **ограниченно**, обычно как прилагательные: *квітучий, сидячий, палаючий*.
  - **Действительные прошедшего** (*-л-*) — от непереходных глаголов: *посивілий, зів’ялий, почорнілий*.
  - **Страдательные прошедшего** (*-н-, -ен-, -т-*) — **свободно**: *написаний, зроблений, закритий*.
  - **Страдательных настоящего** (рус. *-ем-, -им-*) **в украинском нет**: *читаемый → який читають; управляемый → керований*.

  **Общее правило:** если есть прилагательное, существительное или придаточное с *який / що* — выбирайте их. Часть таких слов всё же стала нормой: *ведучий* (передачи).
tables:
  - head: ["Русский", "Калька", "Норма"]
    rows:
      - ["действующий закон", "діючий закон", "чинний закон"]
      - ["заведующий кафедрой", "завідуючий", "завідувач кафедри"]
      - ["окружающая среда", "оточуюче середовище", "довкілля, навколишнє середовище"]
      - ["окружающие", "оточуючі", "люди навколо"]
      - ["отдыхающие", "відпочиваючі", "відпочивальники"]
      - ["следующий", "слідуючий", "наступний"]
      - ["работающий на заводе", "працюючий на заводі", "той, хто працює на заводі"]
pairs:
  - { wrong: "діючий закон", right: "чинний закон" }
  - { wrong: "слідуючий", right: "наступний" }
  - { wrong: "оточуюче середовище", right: "довкілля" }
examples:
  - { text: "Згідно з чинним законом це дозволено." }
  - { text: "Наступна зупинка — вокзал." }
  - { text: "Треба берегти довкілля." }
exercises:
