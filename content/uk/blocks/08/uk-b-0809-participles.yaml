  - { type: fix, text: "Треба берегти оточуюче середовище.", answer: "Треба берегти довкілля.", also: ["Треба берегти навколишнє середовище."], explain: "довкілля / навколишнє середовище" }
  - { type: fix, text: "Оточуючі дивилися на нього.", answer: "Люди навколо дивилися на нього.", explain: "окружающие — люди навколо" }
  - { type: fix, text: "Відпочиваючі прийшли на пляж.", answer: "Відпочивальники прийшли на пляж.", explain: "отдыхающие — відпочивальники" }
  - { type: spot, text: "Слідуючий урок — математика.", wrong: "Слідуючий", answer: "Наступний", explain: "следующий — наступний" }
