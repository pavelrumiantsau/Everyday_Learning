# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.10 and standard usage guides. Exercises are append-only.
id: uk-b-0811
part: 8
order: 11
title: "Пассив с -ся и управление возвратных глаголов"
source: "§8.10"
level: C1
rule: |
  **«Глагол на *-ся* + исполнитель в творительном»** (*закон приймається парламентом*) считается **неудачным** — лучше активная конструкция: ***парламент ухвалює закон***.

  **Без исполнителя *-ся* нормален:** *Будинок будується. У нас будується нова школа.*

  **У возвратных глаголов часто меняется управление** (подробнее в Части 10):
  - *смеяться над кем* — ***сміятися з кого*** (предпочтительно; *над* тоже встречается);
  - *бояться чего* — ***боятися чого***;
  - *интересоваться чем* — ***цікавитися чим***, *увлекаться* — ***захоплюватися чим***, *гордиться* — ***пишатися ким***;
  - *надеяться на* — ***сподіватися на що***; *улыбаться кому* — ***посміхатися кому***.
tables:
  - head: ["Неудачно", "Лучше"]
    rows:
      - ["Закон приймається парламентом.", "Парламент ухвалює закон."]
      - ["Документи перевіряються бухгалтером.", "Бухгалтер перевіряє документи."]
      - ["Лекція читається професором.", "Професор читає лекцію."]
pairs:
  - { wrong: "закон приймається парламентом", right: "парламент ухвалює закон" }
  - { wrong: "сміятися над ним (предпочтительно иначе)", right: "сміятися з нього" }
examples:
  - { text: "Парламент ухвалив новий закон." }
  - { text: "У нашому районі будується нова школа." }
  - { text: "Не смійся з нього, він старається." }
