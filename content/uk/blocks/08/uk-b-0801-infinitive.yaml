# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.1 and standard grammar. Exercises are append-only.
id: uk-b-0801
part: 8
order: 1
title: "Инфинитив на -ти (могти, пекти, берегти)"
source: "§8.1"
level: B1
rule: |
  Инфинитив оканчивается на ***-ти***: *читати, нести, вчитися*. Форма на *-ть* (*читать*) — разговорная и поэтическая; в нейтральной и письменной речи — только *-ти*.

  **Русским глаголам на *-чь* соответствует *-ти* с *г* или *к* в основе:**
  - *мочь — **могти**, помочь — **допомогти**, беречь — **берегти**, стеречь — **стерегти**, лечь — **лягти**, запрячь — **запрягти**, стричь — **стригти***;
  - *печь — **пекти**, течь — **текти**, толочь — **товкти***.
tables:
  - head: ["Русский", "Українська"]
    rows:
      - ["мочь, помочь", "могти, допомогти"]
      - ["беречь, стеречь", "берегти, стерегти"]
      - ["лечь", "лягти"]
      - ["печь, течь", "пекти, текти"]
      - ["стричь", "стригти"]
pairs:
  - { wrong: "допомочь", right: "допомогти" }
  - { wrong: "читать (в письме)", right: "читати" }
examples:
  - { text: "Я не можу тобі допомогти сьогодні." }
  - { text: "Бабуся любить пекти пироги." }
  - { text: "Треба берегти природу." }
exercises:
