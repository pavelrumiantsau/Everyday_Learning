  - { type: cloze, text: "Вона ___ сумку.", answer: "несла", hint: "нести", explain: "ж. р.: несла" }
  - { type: cloze, text: "Він ___ дрова.", answer: "віз", hint: "везти", explain: "основа на согласный: е → і" }
  - { type: cloze, text: "Вона ___ дітей до школи.", answer: "везла", hint: "везти", explain: "ж. р.: везла" }
  - { type: cloze, text: "Він не ___ прийти.", answer: "міг", hint: "могти", explain: "основа на согласный: о → і" }
