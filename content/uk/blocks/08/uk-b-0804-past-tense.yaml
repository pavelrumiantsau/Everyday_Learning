  - { type: choice, text: "Він ___ сумку.", options: ["ніс", "нес"], answer: 0, explain: "рус. нёс → укр. ніс" }
  - { type: choice, text: "Він не ___.", options: ["міг", "мог"], answer: 0, explain: "рус. мог → укр. міг" }
  - { type: judge, text: "Вона була заснула, але дзвінок її розбудив.", correct: true, explain: "давноминулий час: прерванное действие" }
  - { type: judge, text: "Він ліг спати о десятій.", correct: true, explain: "лягти — ліг" }
  - { type: fix, text: "Він нес сумку.", answer: "Він ніс сумку.", explain: "е → і в закрытом слоге: ніс" }
