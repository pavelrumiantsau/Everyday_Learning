# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.3 and standard grammar. Exercises are append-only.
id: uk-b-0804
part: 8
order: 4
title: "Прошедшее время (ніс — несла, міг — могла)"
source: "§8.3"
level: B1
rule: |
  Прошедшее время образуется суффиксом ***-в*** (мужской род) и ***-л-*** (остальные): *читав, читала, читало, читали*. *В* в конце произносится как [ў] — как в белорусском *чытаў*.

  **У основ на согласный** в мужском роде суффикса нет, а ***о / е* переходит в *і***: *ніс — несла, віз — везла, міг — могла, пік — пекла, ліг — лягла* (рус. *нёс, вёз, мог, пёк, лёг*).

  **Давнопрошедшее** (*давноминулий час*): *я був читав, вона була пішла*. Обозначает действие, предшествующее другому прошедшему, или прерванное действие. Редко, в основном в художественной литературе; для C1 важно **узнавать**.
tables:
  - head: ["Инфинитив", "м. р.", "ж. р.", "мн. ч."]
    rows:
      - ["читати", "читав", "читала", "читали"]
      - ["нести", "ніс", "несла", "несли"]
      - ["везти", "віз", "везла", "везли"]
      - ["могти", "міг", "могла", "могли"]
      - ["пекти", "пік", "пекла", "пекли"]
      - ["лягти", "ліг", "лягла", "лягли"]
pairs:
  - { wrong: "він нес", right: "він ніс" }
  - { wrong: "він не мог", right: "він не міг" }
examples:
  - { text: "Він ніс важку сумку, а вона несла квіти." }
  - { text: "Бабуся пекла пиріг, а дідусь читав газету." }
  - { text: "Я не міг прийти, бо захворів." }
