# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.7 and Український правопис 2019. Exercises are append-only.
id: uk-b-0808
part: 8
order: 8
title: "Условное наклонение: якби, щоб, б / би"
source: "§8.7"
level: B2
rule: |
  **Условное наклонение** = прошедшее время + ***б / би***: *я б прочитав, він би прийшов* (*б* после гласного, *би* после согласного — см. блок 2.8).

  - Союз ***якби*** («если бы») пишется **слитно**: *Якби я знав, то сказав би.*
  - Союз ***щоб*** («чтобы») — тоже **слитно**: *Прийшов, щоб допомогти. Хочу, щоб ти прийшов.*
  - **Раздельно** пишутся местоимение/наречие + частица: *що б* («что бы»), *як би* («как бы»): *Що б ти хотів? Як би ти це зробив?*

  **Якщо или якби?** *Якщо* — реальное условие (*Якщо матиму час, прийду*), *якби* — нереальное (*Якби мав час, прийшов би*). Русская модель *якщо б* → ***якби***.
tables:
  - head: ["Слитно", "Раздельно"]
    rows:
      - ["якби (если бы)", "як би (как бы): Як би ти це зробив?"]
      - ["щоб (чтобы)", "що б (что бы): Що б ти хотів?"]
pairs:
  - { wrong: "як би я знав (если бы)", right: "якби я знав" }
  - { wrong: "що б допомогти (чтобы)", right: "щоб допомогти" }
  - { wrong: "якщо б", right: "якби" }
examples:
  - { text: "Якби я знав, то сказав би тобі." }
  - { text: "Я прийшов, щоб допомогти." }
  - { text: "Що б ти хотів на вечерю?" }
