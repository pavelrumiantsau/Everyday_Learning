  - { type: cloze, text: "Він ___ на нас удома.", answer: "чекатиме", hint: "чекати", explain: "инфинитив + -ме" }
  - { type: cloze, text: "Ми ___ щодня.", answer: "тренуватимемося", also: ["тренуватимемось"], hint: "тренуватися", explain: "инфинитив + -мемо + -ся" }
  - { type: cloze, text: "Ви ___ українську?", answer: "вивчатимете", hint: "вивчати", explain: "инфинитив + -мете" }
  - { type: cloze, text: "Вони ___ нас біля входу.", answer: "зустрічатимуть", hint: "зустрічати", explain: "инфинитив + -муть" }
  - { type: cloze, text: "Восени я ___ в університеті.", answer: "вчитимуся", also: ["вчитимусь", "учитимуся", "учитимусь"], hint: "вчитися", explain: "инфинитив + -му + -ся" }
  - { type: cloze, text: "Ми часто ___.", answer: "зустрічатимемося", also: ["зустрічатимемось"], hint: "зустрічатися", explain: "инфинитив + -мемо + -ся" }
  - { type: cloze, text: "Вона ___ лікарем.", answer: "працюватиме", hint: "працювати", explain: "инфинитив + -ме" }
