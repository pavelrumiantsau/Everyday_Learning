# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §8.4 and standard grammar. Exercises are append-only.
id: uk-b-0805
part: 8
order: 5
title: "Будущее время: читатиму, буду читати, прочитаю"
source: "§8.4"
level: B2
rule: |
  **Три формы будущего:**
  - **простая** (совершенный вид): *прочитаю, зроблю*;
  - **составная** (несовершенный): *буду читати, будеш робити*;
  - **синтетическая** (несовершенный): ***читатиму, робитимеш***.

  **Синтетическое будущее** — инфинитив + окончания исторического *иму* («иметь»): *читатиму, читатимеш, читатиме, читатимемо, читатимете, читатимуть*. С постфиксом: *вчитимуся, зустрічатимемося*. Оно **равноценно составному** и очень характерно для живой и литературной речи. В русском и белорусском такой формы нет — её стоит сознательно внедрять в свою речь.

  **От глаголов совершенного вида не образуется:** ✗ *прочитатиму*, ✗ *я буду прочитати* → ✓ *прочитаю*.
tables:
  - head: ["Лицо", "Синтетическое", "Составное"]
    rows:
      - ["я", "читатиму", "буду читати"]
      - ["ти", "читатимеш", "будеш читати"]
      - ["він", "читатиме", "буде читати"]
      - ["ми", "читатимемо", "будемо читати"]
      - ["ви", "читатимете", "будете читати"]
      - ["вони", "читатимуть", "будуть читати"]
pairs:
  - { wrong: "я буду прочитати", right: "я прочитаю / я читатиму" }
  - { wrong: "прочитатиму", right: "прочитаю" }
examples:
  - { text: "Завтра я працюватиму весь день." }
  - { text: "Ми часто зустрічатимемося." }
  - { text: "Я прочитаю цю книжку до неділі." }
exercises:
