# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §11.3 and standard punctuation guides. Exercises are append-only.
id: uk-b-1103
part: 11
order: 3
title: "Прямая речь, диалог, кавычки"
source: "§11.3"
level: B2
rule: |
  **Кавычки:** основные — ***«ялинки»***, внутренние — ***„лапки“***: *«Він сказав: „Прийду“».*

  **Схемы прямой речи** — те же, что в русском:
  - *«Прийду завтра», — сказав він.*
  - *«Ти прийдеш?» — запитала вона.* (после ? или ! запятая не ставится)
  - *Він сказав: «Прийду завтра».*
  - *«Чудово! — вигукнув він. — Нарешті!»*

  **Диалог** — с **тире в начале реплики**, каждая реплика с новой строки:
  *— Ти вдома?*
  *— Так, заходь.*

  **Косвенная речь** — без кавычек: *Він сказав, що прийде.*

  Названия книг, газет, фильмов — в кавычках: *роман «Тигролови»*.
tables:
  - head: ["Схема", "Пример"]
    rows:
      - ["«П», — а.", "«Прийду завтра», — сказав він."]
      - ["«П?» — а.", "«Ти прийдеш?» — запитала вона."]
      - ["А: «П».", "Він сказав: «Прийду завтра»."]
      - ["«П, — а, — п».", "«Добре, — сказав він, — я зачекаю»."]
pairs:
  - { wrong: "«Добре», сказав він.", right: "«Добре», — сказав він." }
  - { wrong: "«Ти прийдеш?», — запитала вона.", right: "«Ти прийдеш?» — запитала вона." }
examples:
  - { text: "«Прийду завтра», — сказав він." }
  - { text: "Мама попросила: «Купи хліба»." }
  - { text: "«Він сказав: „Прийду“», — розповіла сестра." }
exercises:
  - { type: choice, text: "Пряма мова перед словами автора: як правильно?", options: ["«Прийду завтра», — сказав він.", "«Прийду завтра» — сказав він."], answer: 0, explain: "«П», — а." }
  - { type: choice, text: "Слова автора перед прямою мовою: як правильно?", options: ["Він сказав: «Прийду завтра».", "Він сказав «Прийду завтра»."], answer: 0, explain: "А: «П»." }
  - { type: choice, text: "Лапки всередині лапок: як правильно?", options: ["«Він сказав: „Прийду“», — розповіла мама.", "«Він сказав: «Прийду»», — розповіла мама."], answer: 0, explain: "внутри ялинок — лапки „“" }
  - { type: choice, text: "Питання в прямій мові: як правильно?", options: ["«Ти прийдеш?» — запитала вона.", "«Ти прийдеш?», — запитала вона."], answer: 0, explain: "после ? запятая не ставится" }
  - { type: choice, text: "Слова автора всередині прямої мови: як правильно?", options: ["«Чудово! — вигукнув він. — Нарешті!»", "«Чудово!» — вигукнув він. — «Нарешті!»"], answer: 0, explain: "«П! — а. — П!»" }
  - { type: choice, text: "Прохання в прямій мові: як правильно?", options: ["Мама попросила: «Купи хліба».", "Мама попросила «купи хліба»."], answer: 0, explain: "А: «П»." }
  - { type: choice, text: "Які лапки основні в українській мові?", options: ["«ялинки»", "„лапки“"], answer: 0, explain: "основные — «ялинки»" }
  - { type: choice, text: "Які лапки вживають усередині цитати?", options: ["„лапки“", "«ялинки»"], answer: 0, explain: "внутренние — „лапки“" }
  - { type: choice, text: "Чим позначають репліки діалогу?", options: ["тире на початку рядка", "лапками"], answer: 0, explain: "диалог — тире в начале реплики" }
  - { type: choice, text: "Пряма мова і дія автора: як правильно?", options: ["«Я втомився», — сказав він і сів.", "«Я втомився» сказав він і сів."], answer: 0, explain: "«П», — а." }
  - { type: choice, text: "Коротка відповідь: як правильно?", options: ["Вона відповіла: «Ні».", "Вона відповіла «Ні»."], answer: 0, explain: "А: «П»." }
  - { type: choice, text: "Оголошення вчителя: як правильно?", options: ["Учитель сказав: «Завтра контрольна».", "Учитель сказав, «завтра контрольна»."], answer: 0, explain: "А: «П»." }
  - { type: choice, text: "Непряма мова: як правильно?", options: ["Він сказав, що прийде.", "Він сказав: що прийде."], answer: 0, explain: "косвенная речь — запятая, без кавычек" }
  - { type: choice, text: "Назва журналу: як правильно?", options: ["Журнал «Країна» вийшов друком.", "Журнал Країна вийшов друком."], answer: 0, explain: "названия — в кавычках" }
  - { type: choice, text: "Назва роману: як правильно?", options: ["Роман «Тигролови» написав Іван Багряний.", "Роман Тигролови написав Іван Багряний."], answer: 0, explain: "названия — в кавычках" }
  - { type: choice, text: "Діалог: як правильно?", options: ["— Ти вдома? — Так, заходь.", "- Ти вдома? - Так, заходь."], answer: 0, explain: "реплики — тире (—), не дефис" }
  - { type: choice, text: "Розірвана пряма мова: як правильно?", options: ["«Добре, — сказав він, — я зачекаю».", "«Добре», — сказав він, — «я зачекаю»."], answer: 0, explain: "«П, — а, — п»." }
  - { type: judge, text: "«Котра година?» — запитав він.", correct: true, explain: "после ? запятая не ставится" }
  - { type: judge, text: "Вона сказала: «Я згодна».", correct: true, explain: "А: «П»." }
  - { type: judge, text: "«Добре», сказав він.", correct: false, fix: "«Добре», — сказав він.", explain: "«П», — а." }
  - { type: judge, text: "Він сказав, що прийде завтра.", correct: true, explain: "косвенная речь — без кавычек" }
