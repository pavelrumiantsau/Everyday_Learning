  - { text: "Я знаю одне: треба працювати." }
  - { text: "Не йди без парасольки: надворі дощ." }
exercises:
  - { type: choice, text: "Підмет і присудок — іменники: як правильно?", options: ["Київ — столиця України.", "Київ столиця України."], answer: 0, explain: "между существительными — тире" }
  - { type: choice, text: "Перед «це»: як правильно?", options: ["Книга — це джерело знань.", "Книга це джерело знань."], answer: 0, explain: "перед це — тире" }
  - { type: choice, text: "Посада після іменника: як правильно?", options: ["Мій брат — лікар.", "Мій брат лікар."], answer: 0, explain: "подлежащее и сказуемое — существительные: тире" }
  - { type: choice, text: "Підмет — займенник: як правильно?", options: ["Він лікар.", "Він — лікар."], answer: 0, explain: "подлежащее — местоимение: без тире" }
  - { type: choice, text: "Причина без сполучника: як правильно?", options: ["Не йди: надворі дощ.", "Не йди — надворі дощ."], answer: 0, explain: "причина — двоеточие" }
  - { type: choice, text: "Перелік після узагальнювального слова: як правильно?", options: ["На столі лежали фрукти: яблука, груші, сливи.", "На столі лежали фрукти, яблука, груші, сливи."], answer: 0, explain: "перед перечислением — двоеточие" }
  - { type: choice, text: "«Усе» перед переліком: як правильно?", options: ["Я купив усе: хліб, молоко й сир.", "Я купив усе, хліб, молоко й сир."], answer: 0, explain: "после обобщающего слова — двоеточие" }
  - { type: choice, text: "Діапазон років: як правильно?", options: ["Війна тривала у 1914–1918 роках.", "Війна тривала у 1914 - 1918 роках."], answer: 0, explain: "диапазон — короткое тире без пробелов" }
  - { type: choice, text: "Який знак ставлять між підметом і присудком-іменником?", options: ["тире", "двокрапку"], answer: 0, explain: "тире" }
  - { type: choice, text: "Що означає двокрапка в реченні «Не йди: надворі дощ»?", options: ["причину", "протиставлення"], answer: 0, explain: "двоеточие — причина, пояснение" }
  - { type: choice, text: "Числа: як правильно?", options: ["Два плюс два — чотири.", "Два плюс два чотири."], answer: 0, explain: "числа — тире" }
  - { type: choice, text: "Інфінітив-присудок: як правильно?", options: ["Моя мрія — подорожувати.", "Моя мрія подорожувати."], answer: 0, explain: "существительное и инфинитив — тире" }
  - { type: choice, text: "Обидва — інфінітиви: як правильно?", options: ["Жити — Вітчизні служити.", "Жити Вітчизні служити."], answer: 0, explain: "два инфинитива — тире" }
  - { type: choice, text: "Заперечення «не»: як правильно?", options: ["Брехня не виправдання.", "Брехня — не виправдання."], answer: 0, explain: "при не — обычно без тире" }
  - { type: choice, text: "Пояснення після «одне»: як правильно?", options: ["Знаю одне: треба працювати.", "Знаю одне, треба працювати."], answer: 0, explain: "пояснение — двоеточие" }
  - { type: choice, text: "Чим тире відрізняється від дефіса?", options: ["тире довше й стоїть із пробілами", "нічим"], answer: 0, explain: "тире (—) с пробелами, дефис (-) без" }
