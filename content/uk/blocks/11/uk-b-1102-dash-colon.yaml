# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §11.2 and standard punctuation guides. Exercises are append-only.
id: uk-b-1102
part: 11
order: 2
title: "Тире и двоеточие"
source: "§11.2"
level: B2
rule: |
  **Тире между подлежащим и сказуемым-существительным:** *Київ — столиця України*; **перед *це***: *Книга — це джерело знань.* Также если оба — инфинитивы или числа: *Моя мрія — подорожувати. Два плюс два — чотири.*

  **Тире не ставится**, если подлежащее — личное местоимение (*Він лікар.*) и обычно при отрицании *не* (*Брехня не виправдання.*).

  **Двоеточие** — перед перечислением после обобщающего слова (*На столі лежали фрукти: яблука, груші, сливи.*) и в бессоюзных предложениях со значением **причины или пояснения**: *Не йди: надворі дощ.*

  **Тире (—) с пробелами отличается от дефиса (-) без пробелов;** диапазон цифр — **короткое тире без пробелов**: *1991–2026*.
tables:
  - head: ["Знак", "Когда", "Пример"]
    rows:
