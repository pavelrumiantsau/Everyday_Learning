      - ["тире", "перед це", "Книга — це джерело знань."]
      - ["без тире", "подлежащее — местоимение; при не", "Він лікар. Брехня не виправдання."]
      - ["двоеточие", "перед перечислением", "фрукти: яблука, груші"]
      - ["двоеточие", "причина, пояснение", "Не йди: надворі дощ."]
      - ["короткое тире", "диапазон", "1991–2026"]
pairs:
  - { wrong: "Моя сестра лікарка.", right: "Моя сестра — лікарка." }
  - { wrong: "Він — лікар.", right: "Він лікар." }
examples:
