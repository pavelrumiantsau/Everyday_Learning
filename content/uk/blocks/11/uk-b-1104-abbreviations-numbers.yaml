# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §11.4 and Український правопис 2019. Exercises are append-only.
id: uk-b-1104
part: 11
order: 4
title: "Сокращения, числа, даты: тощо, вул., 5-й"
source: "§11.4"
level: B2
rule: |
  - **«И так далее»** — ***тощо*** (предпочтительно), *і т. ін., та ін., і т. д.*
  - **Порядковые цифрами:** *5-й, 5-та, 5-те, 5-го, 5-му* — с дефисом и **одной-двумя последними буквами** окончания.
  - **Год, век:** *2026 р., у 2026 році, XXI ст.* (не *г., в.*).
  - **Десятичные и тысячи:** *3,5* (запятая); *10 000* (разряды через пробел).
  - **Частые сокращения:** *тис.* (тысяча), *млн, млрд, грн*, ***вул.*** (улица), ***м.*** (город), *с.* (село), *с.* (страница), *прим.*

  **Русские сокращения *ул., г., тыс.* в украинском тексте — ошибка:** ***вул., м., тис.***
tables:
  - head: ["Слово", "Сокращение", "Не так"]
    rows:
      - ["вулиця", "вул.", "ул."]
      - ["місто", "м.", "г."]
      - ["тисяча", "тис.", "тыс."]
      - ["рік", "р.", "г."]
      - ["століття", "ст.", "в."]
      - ["гривня", "грн", "гр."]
      - ["сторінка", "с.", "стр."]
pairs:
  - { wrong: "ул. Франка", right: "вул. Франка" }
  - { wrong: "XIX в.", right: "XIX ст." }
  - { wrong: "3.5", right: "3,5" }
examples:
  - { text: "Ми живемо в м. Львові на вул. Шевченка." }
  - { text: "На ринку продають овочі, фрукти тощо." }
  - { text: "Тираж — 10 000 примірників, ціна — 250 грн." }
