# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §11.1 and standard punctuation guides. Exercises are append-only.
id: uk-b-1101
part: 11
order: 1
title: "Запятая"
source: "§11.1"
level: B2
rule: |
  Украинская пунктуация почти полностью совпадает с русской. Главное:

  - **Перед подчинительными союзами и союзными словами** *що, щоб, який, бо, якщо, коли, хоча, ніж*: *Знаю, що ти правий.*
  - **Обращение** (в звательном падеже) выделяется запятыми: *Пане Андрію, добрий день!*
  - **Вводные слова** выделяются: *мабуть, звичайно, на жаль, на щастя, по-перше, отже, щоправда, до речі, здається, виявляється*. Также ***будь ласка***: *Скажіть, будь ласка, де вокзал?*
  - **Не вводные и не выделяются:** *навіть, майже, нібито, начебто, якраз, ледве, приблизно, принаймні* (в значении «хотя бы»).
  - **Причастный оборот** выделяется после определяемого слова (*лист, написаний учора, лежав на столі*); **деепричастный** — всегда.
  - **Перед *як*** при сравнении: *білий, як сніг*; без запятой в устойчивых сочетаниях и в значении «в качестве»: *як рідний, виступав як експерт*.
  - **Перед *а, але, проте, однак, зате***; **нет запятой** перед одиночными *і, та, або* при однородных членах.
tables:
  - head: ["Выделяются", "Не выделяются"]
    rows:
      - ["мабуть, звичайно, на жаль, до речі", "навіть, майже, нібито"]
      - ["здається, виявляється, отже", "якраз, ледве, приблизно"]
      - ["будь ласка", "принаймні («хотя бы»)"]
pairs:
  - { wrong: "Скажіть будь ласка, де вокзал?", right: "Скажіть, будь ласка, де вокзал?" }
  - { wrong: "Він, навіть, не подзвонив.", right: "Він навіть не подзвонив." }
examples:
  - { text: "Пане Андрію, скажіть, будь ласка, котра година?" }
  - { text: "На жаль, я не зможу прийти, бо захворів." }
  - { text: "Лист, написаний учора, лежав на столі." }
exercises:
  - { type: choice, text: "Кома перед «що»: як правильно?", options: ["Я знаю, що ти правий.", "Я знаю що ти правий."], answer: 0, explain: "перед подчинительным союзом — запятая" }
  - { type: choice, text: "Звертання: як правильно?", options: ["Пане Андрію, добрий день!", "Пане Андрію добрий день!"], answer: 0, explain: "обращение выделяется" }
  - { type: choice, text: "«Будь ласка»: як правильно?", options: ["Скажіть, будь ласка, де вокзал?", "Скажіть будь ласка, де вокзал?"], answer: 0, explain: "будь ласка выделяется с двух сторон" }
  - { type: choice, text: "«На жаль»: як правильно?", options: ["На жаль, я не прийду.", "На жаль я не прийду."], answer: 0, explain: "вводное — выделяется" }
  - { type: choice, text: "«Мабуть»: як правильно?", options: ["Він, мабуть, уже вдома.", "Він мабуть уже вдома."], answer: 0, explain: "вводное — выделяется" }
  - { type: choice, text: "«Навіть»: як правильно?", options: ["Він навіть не подзвонив.", "Він, навіть, не подзвонив."], answer: 0, explain: "навіть — не вводное" }
  - { type: choice, text: "«Приблизно»: як правильно?", options: ["Це коштує приблизно сто гривень.", "Це коштує, приблизно, сто гривень."], answer: 0, explain: "приблизно — не вводное" }
  - { type: choice, text: "«Принаймні» (хоча б): як правильно?", options: ["Прочитай принаймні один розділ.", "Прочитай, принаймні, один розділ."], answer: 0, explain: "принаймні «хотя бы» — не выделяется" }
  - { type: choice, text: "Дієприкметниковий зворот після слова: як правильно?", options: ["Лист, написаний учора, лежав на столі.", "Лист написаний учора лежав на столі."], answer: 0, explain: "после определяемого слова — выделяется" }
  - { type: choice, text: "Зворот перед словом: як правильно?", options: ["Написаний учора лист лежав на столі.", "Написаний учора, лист лежав на столі."], answer: 0, explain: "перед определяемым словом — не выделяется" }
  - { type: choice, text: "Дієприслівниковий зворот: як правильно?", options: ["Прочитавши лист, вона заплакала.", "Прочитавши лист вона заплакала."], answer: 0, explain: "деепричастный оборот — выделяется" }
  - { type: choice, text: "Порівняння з «як»: як правильно?", options: ["Сніг білий, як молоко.", "Сніг білий як молоко."], answer: 0, explain: "сравнение — запятая перед як" }
  - { type: choice, text: "«Як» у значенні «в якості»: як правильно?", options: ["Він виступав як експерт.", "Він виступав, як експерт."], answer: 0, explain: "«в качестве» — без запятой" }
  - { type: choice, text: "Сталий вислів з «як»: як правильно?", options: ["Вона мені як рідна.", "Вона мені, як рідна."], answer: 0, explain: "устойчивое сочетание — без запятой" }
  - { type: choice, text: "Кома перед «але»: як правильно?", options: ["Я хотів прийти, але не зміг.", "Я хотів прийти але не зміг."], answer: 0, explain: "перед але — запятая" }
  - { type: choice, text: "Однорідні члени з «і»: як правильно?", options: ["Купи хліб і молоко.", "Купи хліб, і молоко."], answer: 0, explain: "одиночное і — без запятой" }
  - { type: choice, text: "Однорідні члени з «або»: як правильно?", options: ["Ти будеш чай або каву?", "Ти будеш чай, або каву?"], answer: 0, explain: "одиночное або — без запятой" }
  - { type: choice, text: "«По-перше»: як правильно?", options: ["По-перше, треба відпочити.", "По-перше треба відпочити."], answer: 0, explain: "вводное — выделяется" }
  - { type: choice, text: "«Здається»: як правильно?", options: ["Він, здається, захворів.", "Він здається захворів."], answer: 0, explain: "вводное — выделяется" }
  - { type: choice, text: "Кома перед «щоб»: як правильно?", options: ["Я прийшов, щоб допомогти.", "Я прийшов щоб допомогти."], answer: 0, explain: "перед щоб — запятая" }
  - { type: choice, text: "Кома перед «ніж»: як правильно?", options: ["Сьогодні тепліше, ніж учора.", "Сьогодні тепліше ніж учора."], answer: 0, explain: "перед ніж — запятая" }
  - { type: choice, text: "Підрядне з «який»: як правильно?", options: ["Людина, яка це сказала, пішла.", "Людина яка це сказала, пішла."], answer: 0, explain: "придаточное выделяется с двух сторон" }
  - { type: judge, text: "До речі, ти вже обідав?", correct: true, explain: "до речі — вводное" }
  - { type: judge, text: "Отже ми закінчили.", correct: false, fix: "Отже, ми закінчили.", explain: "отже — вводное" }
  - { type: judge, text: "Він ледве встиг на потяг.", correct: true, explain: "ледве — не вводное" }
