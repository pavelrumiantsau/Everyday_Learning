# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §12.3 and standard usage guides. Exercises are append-only.
id: uk-b-1205
part: 12
order: 5
title: "Пары, которые часто путают: питання / запитання"
source: "§12.3"
level: C1
rule: |
  - ***питання*** — вопрос-проблема, тема: *питання фінансування, порядок денний із трьох питань*;
    ***запитання*** — вопрос, на который отвечают: *відповісти на запитання, поставити запитання*.
  - ***говорити*** — говорить; ***розмовляти*** — разговаривать, **владеть языком**: *розмовляти трьома мовами*.
  - ***казати / сказати*** — передать чьи-то слова: *він каже, що зайнятий*.
  - ***ухвалювати*** рішення, закон — **коллективный орган**: *Рада ухвалила закон*; ***приймати*** рішення — **человек**: *я прийняв рішення*.
  - ***мати рацію*** — быть правым: *Ви маєте рацію* (также *Ви праві*).
  - ***вірний*** — верный, преданный; ***правильний*** — правильный.
tables:
  - head: ["Слово", "Значение", "Пример"]
    rows:
      - ["питання", "вопрос-проблема, тема", "питання фінансування"]
      - ["запитання", "вопрос, на который отвечают", "відповісти на запитання"]
      - ["розмовляти", "разговаривать, владеть языком", "розмовляти трьома мовами"]
      - ["ухвалювати", "решение коллективного органа", "Рада ухвалила закон"]
      - ["приймати рішення", "решение человека", "я прийняв рішення"]
      - ["мати рацію", "быть правым", "Ви маєте рацію"]
pairs:
  - { wrong: "відповісти на питання (вопрос в тесте)", right: "відповісти на запитання" }
  - { wrong: "Парламент прийняв закон", right: "Парламент ухвалив закон" }
examples:
