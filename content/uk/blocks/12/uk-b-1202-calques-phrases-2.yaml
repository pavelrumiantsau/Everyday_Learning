# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §12.1 (second half of the table) and standard usage guides.
# Exercises are append-only.
id: uk-b-1202
part: 12
order: 2
title: "Кальки в устойчивых сочетаниях ②"
source: "§12.1"
level: B2
rule: |
  Продолжение таблицы калек (§12.1):

  - ✗ *в той же час* → ✓ ***водночас, разом із тим***
  - ✗ *в цілому* → ✓ ***загалом***
  - ✗ *в даний час* → ✓ ***нині, тепер, зараз***
  - ✗ *на протязі року* → ✓ ***протягом року***
  - ✗ *в якості експерта* → ✓ ***як експерт***
  - ✗ *у відповідності з* → ✓ ***відповідно до***
  - ✗ *в залежності від* → ✓ ***залежно від***
  - ✗ *по відношенню до* → ✓ ***щодо, стосовно***
  - ✗ *з ціллю* → ✓ ***з метою***
  - ✗ *так як* (причина) → ✓ ***оскільки, бо, тому що***
  - ✗ *між іншим* («кстати») → ✓ ***до речі***
  - ✗ *година пік* → ✓ ***години пік***
tables:
  - head: ["Калька", "Норма"]
    rows:
      - ["в той же час", "водночас, разом із тим"]
      - ["в цілому", "загалом"]
      - ["в даний час", "нині, тепер, зараз"]
      - ["на протязі року", "протягом року"]
      - ["в якості експерта", "як експерт"]
      - ["у відповідності з", "відповідно до"]
      - ["в залежності від", "залежно від"]
      - ["по відношенню до", "щодо, стосовно"]
      - ["з ціллю", "з метою"]
      - ["так як", "оскільки, бо, тому що"]
      - ["між іншим (кстати)", "до речі"]
      - ["година пік", "години пік"]
pairs:
  - { wrong: "на протязі року", right: "протягом року" }
  - { wrong: "в якості експерта", right: "як експерт" }
  - { wrong: "так як він захворів", right: "оскільки він захворів" }
examples:
  - { text: "Протягом року ми двічі їздили до Карпат." }
  - { text: "Загалом проєкт вдалий, хоча водночас має недоліки." }
  - { text: "До речі, залежно від погоди ми змінимо план." }
exercises:
  - { type: fix, text: "Він працює і в той же час навчається.", answer: "Він працює і водночас навчається.", also: ["Він працює й водночас навчається.", "Він працює і разом із тим навчається."], explain: "в той же час → водночас" }
  - { type: choice, text: "Вона весела і ___ серйозна.", options: ["водночас", "в той же час"], answer: 0, explain: "водночас" }
  - { type: fix, text: "В цілому все пройшло добре.", answer: "Загалом усе пройшло добре.", also: ["Загалом все пройшло добре."], explain: "в цілому → загалом" }
  - { type: choice, text: "___ ми задоволені результатом.", options: ["Загалом", "В цілому"], answer: 0, explain: "загалом" }
  - { type: fix, text: "В даний час він живе в Одесі.", answer: "Нині він живе в Одесі.", also: ["Тепер він живе в Одесі.", "Зараз він живе в Одесі."], explain: "в даний час → нині, тепер, зараз" }
  - { type: choice, text: "___ ця проблема дуже актуальна.", options: ["Нині", "В даний час"], answer: 0, explain: "нині" }
  - { type: fix, text: "На протязі року ми зібрали гроші.", answer: "Протягом року ми зібрали гроші.", explain: "на протязі → протягом" }
  - { type: fix, text: "Я чекав на протязі години.", answer: "Я чекав протягом години.", also: ["Я чекав годину."], explain: "протягом години («на протязі» — на сквозняке)" }
  - { type: fix, text: "Його запросили в якості експерта.", answer: "Його запросили як експерта.", explain: "в якості → як" }
  - { type: choice, text: "Він виступив ___ свідок.", options: ["як", "в якості"], answer: 0, explain: "в качестве — як" }
  - { type: fix, text: "У відповідності з планом ми почали роботу.", answer: "Відповідно до плану ми почали роботу.", explain: "у відповідності з → відповідно до + Р." }
  - { type: fix, text: "В залежності від погоди ми підемо в парк.", answer: "Залежно від погоди ми підемо в парк.", explain: "в залежності від → залежно від" }
  - { type: choice, text: "Ціна змінюється ___ сезону.", options: ["залежно від", "в залежності від"], answer: 0, explain: "залежно від" }
  - { type: fix, text: "По відношенню до дітей він дуже добрий.", answer: "Щодо дітей він дуже добрий.", also: ["Стосовно дітей він дуже добрий."], explain: "по відношенню до → щодо, стосовно" }
  - { type: fix, text: "Ми зібралися з ціллю обговорити план.", answer: "Ми зібралися з метою обговорити план.", also: ["Ми зібралися, щоб обговорити план."], explain: "з ціллю → з метою (или щоб)" }
  - { type: fix, text: "Я не прийшов, так як захворів.", answer: "Я не прийшов, бо захворів.", also: ["Я не прийшов, оскільки захворів.", "Я не прийшов, тому що захворів."], explain: "так як (причина) → бо, оскільки" }
  - { type: choice, text: "Ми залишилися вдома, ___ йшов дощ.", options: ["оскільки", "так як"], answer: 0, explain: "так як → оскільки" }
  - { type: fix, text: "Між іншим, ти вже снідав?", answer: "До речі, ти вже снідав?", explain: "між іншим («кстати») → до речі" }
  - { type: fix, text: "У годину пік метро переповнене.", answer: "У години пік метро переповнене.", explain: "година пік → години пік" }
  - { type: judge, text: "Протягом тижня йшли дощі.", correct: true, explain: "протягом — норма" }
  - { type: judge, text: "Залежно від результату ми ухвалимо рішення.", correct: true, explain: "залежно від — норма" }
  - { type: judge, text: "Так як ти запізнився, ми почали без тебе.", correct: false, fix: "Оскільки ти запізнився, ми почали без тебе.", explain: "так як (причина) → оскільки" }
  - { type: judge, text: "До речі, завтра вихідний.", correct: true, explain: "до речі — норма" }
  - { type: judge, text: "В даний час ми не наймаємо працівників.", correct: false, fix: "Нині ми не наймаємо працівників.", explain: "в даний час → нині" }
