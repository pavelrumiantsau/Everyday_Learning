# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 12 (course PDF §12.1–12.6). Written with Claude Code. Exercises are append-only.
id: uk-b-1207
part: 12
order: 7
title: "Русизмы и кальки: повторение"
source: "§12.6"
level: C1
rule: |
  **Как избавляться от калек (§12.6):**
  1. Ведите свой список ошибок и перечитывайте его раз в неделю (здесь это «Мои ошибки» и «Повторить ошибки»).
  2. Читайте и слушайте тексты, **созданные** на украинском, а не переведённые с русского.
  3. Проверяйте сомнительные слова по словарю и сервисам вроде «А як правильно».
  4. **Думайте целыми фразами:** не переводите слово за словом, а вспоминайте устойчивое украинское сочетание.

  В этом блоке — смешанные задания по всей Части 12: устойчивые сочетания, отдельные слова, пары, суржик.
pairs:
  - { wrong: "приймати участь", right: "брати участь" }
  - { wrong: "являтися", right: "бути, є" }
  - { wrong: "так як (причина)", right: "оскільки, бо" }
  - { wrong: "канєшно", right: "звичайно" }
examples:
  - { text: "Насамперед дякую всім, хто брав участь у заході." }
  - { text: "Загалом я вважаю, що ви маєте рацію." }
  - { text: "Здається, концерт скасували, тож доведеться повернутися додому." }
exercises:
  - { type: fix, text: "Ми приймали участь у міроприємстві.", answer: "Ми брали участь у заході.", explain: "брати участь; міроприємство → захід" }
  - { type: fix, text: "Даний проект являється важливим.", answer: "Цей проєкт є важливим.", also: ["Цей проєкт важливий."], explain: "даний → цей; являтися → бути; проєкт" }
  - { type: fix, text: "В першу чергу треба відмінити зустріч.", answer: "Насамперед треба скасувати зустріч.", also: ["Передусім треба скасувати зустріч."], explain: "в першу чергу → насамперед; відмінити → скасувати" }
  - { type: fix, text: "Я рахую, що ти вірно відповів.", answer: "Я вважаю, що ти правильно відповів.", explain: "рахувати → вважати; вірно → правильно" }
  - { type: fix, text: "Так як йшов дощ, ми залишилися вдома.", answer: "Оскільки йшов дощ, ми залишилися вдома.", also: ["Через те що йшов дощ, ми залишилися вдома."], explain: "так як → оскільки" }
  - { type: fix, text: "В цілому мені всьо равно.", answer: "Загалом мені все одно.", also: ["Загалом мені однаково."], explain: "в цілому → загалом; всьо равно → все одно" }
  - { type: fix, text: "Задайте питання лектору.", answer: "Поставте запитання лекторові.", also: ["Поставте запитання лектору."], explain: "ставити запитання" }
  - { type: fix, text: "Кажеться, музей знаходиться поруч.", answer: "Здається, музей розташований поруч.", also: ["Здається, музей поруч."], explain: "кажеться → здається; знаходиться → розташований" }
  - { type: spot, text: "Він получив диплом минулого року.", wrong: "получив", answer: "отримав", also: ["одержав", "здобув"], explain: "получати → отримувати" }
  - { type: spot, text: "Мені приходиться працювати у вихідні.", wrong: "приходиться", answer: "доводиться", explain: "приходиться → доводиться" }
  - { type: fix, text: "Між іншим, у мене є квиток.", answer: "До речі, у мене є квиток.", explain: "между прочим («кстати») — до речі" }
  - { type: spot, text: "Відкрий вікно, будь ласка.", wrong: "Відкрий", answer: "Відчини", explain: "окно — відчиняти" }
  - { type: spot, text: "Він бувший мер міста.", wrong: "бувший", answer: "колишній", explain: "бувший → колишній" }
  - { type: choice, text: "___ я хочу подякувати батькам.", options: ["Насамперед", "В першу чергу"], answer: 0, explain: "в первую очередь — насамперед" }
  - { type: choice, text: "Ціна змінюється ___ від попиту.", options: ["залежно", "в залежності"], answer: 0, explain: "залежно від" }
  - { type: choice, text: "Ми ___ заходів безпеки.", options: ["вжили", "прийняли"], answer: 0, explain: "вживати заходів" }
  - { type: choice, text: "Ця подія ___ важливу роль.", options: ["відіграла", "іграла"], answer: 0, explain: "відігравати роль" }
  - { type: choice, text: "___ року ми зібрали врожай.", options: ["Протягом", "На протязі"], answer: 0, explain: "протягом" }
  - { type: choice, text: "Він виступив ___ експерт.", options: ["як", "в якості"], answer: 0, explain: "в качестве — як" }
  - { type: choice, text: "Рада ___ бюджет.", options: ["ухвалила", "прийняла"], answer: 0, explain: "коллективный орган — ухвалювати" }
  - { type: judge, text: "Ви маєте рацію.", correct: true, explain: "мати рацію — норма" }
  - { type: judge, text: "Звичайно, я допоможу.", correct: true, explain: "звичайно — норма" }
