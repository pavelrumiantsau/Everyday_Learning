# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §12.4–12.5 and standard usage guides. Exercises are append-only.
id: uk-b-1206
part: 12
order: 6
title: "Суржик и вежливые формулы"
source: "§12.4–12.5"
level: B1
rule: |
  **Суржик в разговорной речи → литературно:**
  - *канєшно, конєчно* → ***звичайно, звісно, авжеж***
  - *даже* → ***навіть***; *вообщє* → ***взагалі***
  - *всьо равно* → ***все одно, однаково***
  - *ладно* → ***гаразд, добре***; *щас* → ***зараз***
  - *тіпа* → ***ніби, начебто, так би мовити***
  - *пока* (прощание) → ***бувай, бувайте, до зустрічі***
  - *получається* → ***виходить***; *шо* → ***що***; *ну і шо?* → ***ну то й що?***

  **Вежливые формулы:**
  - пожалуйста (просьба) → ***будь ласка***; (ответ на «спасибо») → ***нема за що, прошу***
  - добро пожаловать → ***ласкаво просимо***
  - приятного аппетита → ***смачного***
  - поздравляю с днём рождения → ***вітаю з днем народження***
  - доброе утро → ***добрий ранок / доброго ранку***
  - извините, можно вопрос? → ***перепрошую, можна запитати?***
tables:
  - head: ["Суржик", "Литературно"]
    rows:
      - ["канєшно", "звичайно, звісно, авжеж"]
      - ["даже", "навіть"]
      - ["всьо равно", "все одно, однаково"]
      - ["ладно", "гаразд, добре"]
      - ["пока (прощание)", "бувай, до зустрічі"]
      - ["получається", "виходить"]
pairs:
  - { wrong: "Канєшно, приходь!", right: "Звичайно, приходь!" }
  - { wrong: "Ну і шо?", right: "Ну то й що?" }
  - { wrong: "Пока!", right: "Бувай!" }
examples:
  - { text: "— Дякую! — Нема за що." }
  - { text: "Ласкаво просимо! Смачного!" }
  - { text: "Гаразд, до зустрічі!" }
exercises:
