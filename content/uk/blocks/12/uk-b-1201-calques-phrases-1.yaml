# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §12.1 (first half of the table) and standard usage guides
# (Антоненко-Давидович «Як ми говоримо», Пономарів «Культура слова»). Exercises are append-only.
id: uk-b-1201
part: 12
order: 1
title: "Кальки в устойчивых сочетаниях ①"
source: "§12.1"
level: B2
rule: |
  Речь уровня C1 отличает не столько грамматика, сколько **отсутствие калек** — сочетаний, переведённых с русского слово в слово. Левые варианты не всегда «запрещены», но правые звучат естественно и считаются нормой в словарях и редакторской практике.

  - ✗ *приймати участь* → ✓ ***брати участь***
  - ✗ *приймати міри* → ✓ ***вживати заходів***
  - ✗ *приймати до уваги* → ✓ ***брати до уваги***
  - ✗ *задавати питання* → ✓ ***ставити запитання***
  - ✗ *іграти роль* → ✓ ***відігравати роль***
  - ✗ *має місце* → ✓ ***відбувається, трапляється***
  - ✗ *мається на увазі* → ✓ ***ідеться про, маємо на увазі***
  - ✗ *прийшло в голову* → ✓ ***спало на думку***
  - ✗ *в першу чергу* → ✓ ***насамперед, передусім***
  - ✗ *в кінці кінців* → ✓ ***зрештою, врешті-решт***
  - ✗ *по крайній мірі* → ✓ ***принаймні***
  - ✗ *тим не менш* → ✓ ***проте, однак, все ж***

  Совет: не переводите слово за словом — вспоминайте целое украинское сочетание. *Приймати* по-украински — это «принимать гостей, ліки, закон», но не участие и не меры.
tables:
  - head: ["Калька", "Норма"]
    rows:
      - ["приймати участь", "брати участь"]
      - ["приймати міри", "вживати заходів"]
      - ["приймати до уваги", "брати до уваги"]
      - ["задавати питання", "ставити запитання"]
      - ["іграти роль", "відігравати роль"]
      - ["має місце", "відбувається, трапляється"]
      - ["мається на увазі", "ідеться про, маємо на увазі"]
      - ["прийшло в голову", "спало на думку"]
      - ["в першу чергу", "насамперед, передусім"]
      - ["в кінці кінців", "зрештою, врешті-решт"]
      - ["по крайній мірі", "принаймні"]
      - ["тим не менш", "проте, однак, все ж"]
pairs:
  - { wrong: "приймати участь", right: "брати участь" }
  - { wrong: "задавати питання", right: "ставити запитання" }
  - { wrong: "по крайній мірі", right: "принаймні" }
examples:
  - { text: "Наша команда бере участь у змаганнях." }
  - { text: "Уряд вживає заходів, щоб зупинити інфляцію." }
  - { text: "Насамперед хочу подякувати всім, хто прийшов." }
  - { text: "Зрештою ми домовилися." }
exercises:
  - { type: spot, text: "Ми приймали участь у конкурсі.", wrong: "приймали", answer: "брали", explain: "брати участь, не приймати" }
  - { type: fix, text: "Студенти приймають участь у конференції.", answer: "Студенти беруть участь у конференції.", explain: "брати участь у чому" }
  - { type: fix, text: "Уряд приймає міри проти інфляції.", answer: "Уряд вживає заходів проти інфляції.", explain: "вживати заходів — с родительным (міри — это меры измерения)" }
  - { type: choice, text: "Треба негайно ___ заходів.", options: ["вжити", "прийняти"], answer: 0, explain: "вжити заходів" }
  - { type: fix, text: "Прошу прийняти це до уваги.", answer: "Прошу взяти це до уваги.", explain: "брати (взяти) до уваги" }
  - { type: choice, text: "Ми обов'язково ___ ваші побажання до уваги.", options: ["візьмемо", "приймемо"], answer: 0, explain: "брати до уваги" }
  - { type: fix, text: "Можна задати питання?", answer: "Можна поставити запитання?", explain: "ставити запитання; запитання — то, на что отвечают (питання — проблема, тема)" }
  - { type: spot, text: "Журналіст задав кілька запитань.", wrong: "задав", answer: "поставив", explain: "ставити запитання, не задавати" }
  - { type: fix, text: "Ця подія іграла важливу роль.", answer: "Ця подія відігравала важливу роль.", also: ["Ця подія відіграла важливу роль."], explain: "відігравати роль" }
  - { type: choice, text: "Освіта ___ ключову роль у розвитку країни.", options: ["відіграє", "іграє"], answer: 0, explain: "відігравати роль" }
  - { type: fix, text: "На вулиці мала місце аварія.", answer: "На вулиці сталася аварія.", also: ["На вулиці трапилася аварія."], explain: "мати місце — калька; по-украински: сталася, трапилася, відбулася" }
  - { type: judge, text: "Засідання відбудеться завтра.", correct: true, explain: "відбуватися — естественно для событий" }
  - { type: judge, text: "Це має місце в багатьох країнах.", correct: false, fix: "Це трапляється в багатьох країнах.", explain: "має місце → трапляється, буває" }
  - { type: fix, text: "Мається на увазі нова програма.", answer: "Ідеться про нову програму.", also: ["Йдеться про нову програму.", "Маємо на увазі нову програму."], explain: "мається на увазі → ідеться про / маємо на увазі" }
  - { type: judge, text: "Що ви маєте на увазі?", correct: true, explain: "мати на увазі с подлежащим — норма; калька только безличное «мається»" }
  - { type: fix, text: "Мені прийшла в голову ідея.", answer: "Мені спала на думку ідея.", explain: "спасти на думку" }
  - { type: choice, text: "Мені раптом ___ на думку, що двері відчинені.", options: ["спало", "прийшло"], answer: 0, explain: "спало на думку" }
  - { type: fix, text: "В першу чергу треба поговорити з лікарем.", answer: "Насамперед треба поговорити з лікарем.", also: ["Передусім треба поговорити з лікарем."], explain: "в першу чергу → насамперед, передусім" }
  - { type: choice, text: "___ хочу подякувати організаторам.", options: ["Насамперед", "В першу чергу"], answer: 0, explain: "насамперед" }
  - { type: fix, text: "В кінці кінців ми домовилися.", answer: "Зрештою ми домовилися.", also: ["Врешті-решт ми домовилися.", "Кінець кінцем ми домовилися."], explain: "в кінці кінців → зрештою, врешті-решт" }
  - { type: choice, text: "___ він погодився.", options: ["Зрештою", "В кінці кінців"], answer: 0, explain: "зрештою" }
  - { type: fix, text: "Подзвони по крайній мірі мамі.", answer: "Подзвони принаймні мамі.", explain: "по крайній мірі → принаймні" }
  - { type: choice, text: "Прочитай ___ перший розділ.", options: ["принаймні", "по крайній мірі"], answer: 0, explain: "принаймні" }
  - { type: fix, text: "Тим не менш він прийшов.", answer: "Проте він прийшов.", also: ["Однак він прийшов.", "Все ж він прийшов.", "Утім він прийшов."], explain: "тим не менш → проте, однак, все ж" }
  - { type: choice, text: "Було пізно, ___ ми працювали далі.", options: ["проте", "тим не менш"], answer: 0, explain: "проте" }
  - { type: judge, text: "Ми брали участь у змаганнях.", correct: true, explain: "брати участь — норма" }
  - { type: judge, text: "Він прийняв участь у виборах.", correct: false, fix: "Він узяв участь у виборах.", explain: "брати (взяти) участь" }
  - { type: judge, text: "Дозвольте поставити вам запитання.", correct: true, explain: "ставити запитання — норма" }
