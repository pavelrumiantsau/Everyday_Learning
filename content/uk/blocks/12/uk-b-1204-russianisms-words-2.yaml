# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §12.2 (second half of the table) and standard usage guides.
# Exercises are append-only.
id: uk-b-1204
part: 12
order: 4
title: "Русизмы: отдельные слова ②"
source: "§12.2"
level: B2
rule: |
  - ✗ *відмінити* (= отменить) → ✓ ***скасувати***;
  - ✗ *вибачаюсь* → ✓ ***вибачте, перепрошую***;
  - ✗ *скучний* → ✓ ***нудний***;
  - ✗ *кажеться* → ✓ ***здається***;
  - ✗ *убідитися* → ✓ ***переконатися***;
  - ✗ *приходиться* → ✓ ***доводиться***;
  - ✗ *кушати* → ✓ ***їсти***;
  - ✗ *одіти куртку* → ✓ ***одягнути, вдягнути***;
  - ✗ *здача* (деньги) → ✓ ***решта***;
  - ✗ *відкрити / закрити двері* → ✓ ***відчинити / зачинити*** (*відкрити* — выставку, сезон, тайну).
tables:
  - head: ["Русизм", "Норма"]
    rows:
      - ["відмінити", "скасувати"]
      - ["вибачаюсь", "вибачте, перепрошую"]
      - ["скучний", "нудний"]
      - ["кажеться", "здається"]
      - ["убідитися", "переконатися"]
      - ["приходиться", "доводиться"]
      - ["кушати", "їсти"]
      - ["одіти куртку", "одягнути, вдягнути"]
      - ["здача", "решта"]
      - ["відкрити двері", "відчинити двері"]
pairs:
  - { wrong: "Концерт відмінили.", right: "Концерт скасували." }
  - { wrong: "Відкрий вікно.", right: "Відчини вікно." }
  - { wrong: "Візьміть здачу.", right: "Візьміть решту." }
examples:
  - { text: "Перепрошую, концерт скасували?" }
  - { text: "Здається, мені доводиться працювати й у вихідні." }
  - { text: "Відчини, будь ласка, вікно — тут нудно й душно." }
exercises:
  - { type: fix, text: "Концерт відмінили через дощ.", answer: "Концерт скасували через дощ.", explain: "отменить — скасувати" }
  - { type: spot, text: "Рейс відмінили.", wrong: "відмінили", answer: "скасували", explain: "отменить — скасувати" }
  - { type: fix, text: "Вибачаюсь за запізнення.", answer: "Перепрошую за запізнення.", also: ["Вибачте за запізнення."], explain: "вибачаюсь → перепрошую, вибачте" }
  - { type: fix, text: "Цей фільм дуже скучний.", answer: "Цей фільм дуже нудний.", explain: "скучний → нудний" }
  - { type: spot, text: "Мені скучно без тебе.", wrong: "скучно", answer: "нудно", also: ["сумно"], explain: "скучно → нудно / сумно" }
  - { type: fix, text: "Кажеться, буде дощ.", answer: "Здається, буде дощ.", explain: "кажеться → здається" }
  - { type: fix, text: "Я убідився, що він правий.", answer: "Я переконався, що він правий.", explain: "убідитися → переконатися" }
  - { type: fix, text: "Мені приходиться рано вставати.", answer: "Мені доводиться рано вставати.", explain: "приходиться → доводиться" }
  - { type: fix, text: "Діти, ідіть кушати!", answer: "Діти, ідіть їсти!", also: ["Діти, йдіть їсти!"], explain: "кушати → їсти" }
  - { type: fix, text: "Одінь куртку, бо холодно.", answer: "Одягни куртку, бо холодно.", also: ["Вдягни куртку, бо холодно.", "Одягніть куртку, бо холодно."], explain: "одіти → одягнути, вдягнути" }
  - { type: fix, text: "Візьміть здачу.", answer: "Візьміть решту.", explain: "здача → решта" }
  - { type: fix, text: "Відкрий, будь ласка, двері.", answer: "Відчини, будь ласка, двері.", explain: "двери, окна — відчиняти" }
  - { type: fix, text: "Закрий вікно, бо протяг.", answer: "Зачини вікно, бо протяг.", explain: "двери, окна — зачиняти" }
  - { type: judge, text: "Сьогодні відкрили нову виставку.", correct: true, explain: "відкрити виставку — норма" }
  - { type: judge, text: "Він відкрив мені свою таємницю.", correct: true, explain: "відкрити таємницю — норма" }
  - { type: choice, text: "Магазин ___ о дев’ятій.", options: ["відчиняють", "відкривають"], answer: 0, explain: "магазин, двери — відчиняти" }
  - { type: choice, text: "Збори ___ через карантин.", options: ["скасували", "відмінили"], answer: 0, explain: "отменить — скасувати" }
  - { type: choice, text: "___, можна запитати?", options: ["Перепрошую", "Вибачаюсь"], answer: 0, explain: "вибачаюсь → перепрошую" }
  - { type: choice, text: "Ця книжка зовсім ___.", options: ["нудна", "скучна"], answer: 0, explain: "скучный — нудний" }
  - { type: choice, text: "Ось ваша ___ — двадцять гривень.", options: ["решта", "здача"], answer: 0, explain: "сдача — решта" }
  - { type: choice, text: "Нам часто ___ працювати допізна.", options: ["доводиться", "приходиться"], answer: 0, explain: "приходиться → доводиться" }
  - { type: judge, text: "Тут дуже нудно.", correct: true, explain: "нудно — норма" }
  - { type: judge, text: "Вдягни шапку!", correct: true, explain: "вдягнути — норма" }
