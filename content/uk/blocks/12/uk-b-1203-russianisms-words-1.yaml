# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §12.2 (first half of the table) and standard usage guides.
# Exercises are append-only.
id: uk-b-1203
part: 12
order: 3
title: "Русизмы: отдельные слова ①"
source: "§12.2"
level: B2
rule: |
  - ✗ *являтися* → ✓ ***бути, є***: *Він є директором* (или просто *Він директор*);
  - ✗ *слідуючий* → ✓ ***наступний***;
  - ✗ *співпадати* → ✓ ***збігатися***;
  - ✗ *вірно* (= правильно) → ✓ ***правильно*** (*вірний* = верный, преданный);
  - ✗ *рахувати* (= считать, полагать) → ✓ ***вважати*** (*рахувати* — только считать числа);
  - ✗ *міроприємство* → ✓ ***захід***;
  - ✗ *получати* → ✓ ***отримувати, одержувати***;
  - ✗ *знаходитися* (о месте) → ✓ ***розташовуватися, міститися, перебувати*** (*знаходити* = находить);
  - ✗ *даний* («этот») → ✓ ***цей*** (*дані* = данные);
  - ✗ *бувший* → ✓ ***колишній***;
  - ✗ *любий* (= любой) → ✓ ***будь-який*** (*любий* = милый, дорогой).
tables:
  - head: ["Калька / русизм", "Норма", "Комментарий"]
    rows:
      - ["являтися", "бути, є", "Він є директором"]
      - ["співпадати", "збігатися", ""]
      - ["вірно (= правильно)", "правильно", "вірний = верный, преданный"]
      - ["рахувати (= считать)", "вважати", "рахувати — только числа"]
      - ["міроприємство", "захід", ""]
      - ["знаходитися (о месте)", "розташовуватися, міститися", "знаходити = находить"]
      - ["бувший", "колишній", ""]
      - ["любий (= любой)", "будь-який", "любий = милый, дорогой"]
pairs:
  - { wrong: "Він являється директором.", right: "Він є директором." }
  - { wrong: "Я рахую, що це правильно.", right: "Я вважаю, що це правильно." }
  - { wrong: "Школа знаходиться в центрі.", right: "Школа розташована в центрі." }
examples:
  - { text: "Я вважаю, що ти відповів правильно." }
  - { text: "Наступний захід відбудеться в колишній школі." }
  - { text: "Наші думки збігаються." }
exercises:
  - { type: fix, text: "Він являється директором школи.", answer: "Він є директором школи.", also: ["Він директор школи."], explain: "являтися → бути, є" }
  - { type: spot, text: "Слідуюча зупинка — вокзал.", wrong: "Слідуюча", answer: "Наступна", explain: "слідуючий → наступний" }
  - { type: fix, text: "Наші думки співпадають.", answer: "Наші думки збігаються.", explain: "співпадати → збігатися" }
  - { type: choice, text: "Дати ___.", options: ["збігаються", "співпадають"], answer: 0, explain: "співпадати → збігатися" }
  - { type: fix, text: "Ти вірно відповів.", answer: "Ти правильно відповів.", explain: "вірно (= правильно) → правильно" }
  - { type: judge, text: "Він вірний друг.", correct: true, explain: "вірний = преданный — норма" }
  - { type: fix, text: "Я рахую, що він правий.", answer: "Я вважаю, що він правий.", explain: "рахувати (= полагать) → вважати" }
  - { type: judge, text: "Дитина вже вміє рахувати до десяти.", correct: true, explain: "рахувати — считать числа: норма" }
  - { type: fix, text: "У школі пройшло міроприємство.", answer: "У школі відбувся захід.", also: ["У школі пройшов захід."], explain: "міроприємство → захід" }
  - { type: choice, text: "Завтра відбудеться культурний ___.", options: ["захід", "міроприємство"], answer: 0, explain: "мероприятие — захід" }
  - { type: fix, text: "Я получив твій лист.", answer: "Я отримав твій лист.", also: ["Я одержав твій лист.", "Я отримав твого листа."], explain: "получати → отримувати" }
  - { type: spot, text: "Він получає гарну зарплату.", wrong: "получає", answer: "отримує", also: ["одержує"], explain: "получати → отримувати" }
  - { type: fix, text: "Музей знаходиться в центрі міста.", answer: "Музей розташований у центрі міста.", also: ["Музей міститься в центрі міста.", "Музей розташований в центрі міста."], explain: "знаходитися (о месте) → розташовуватися, міститися" }
  - { type: judge, text: "Я знайшов свої ключі.", correct: true, explain: "знаходити = находить — норма" }
  - { type: fix, text: "Даний документ не підписаний.", answer: "Цей документ не підписаний.", explain: "даний («этот») → цей" }
  - { type: judge, text: "Ми проаналізували всі дані.", correct: true, explain: "дані = данные — норма" }
  - { type: fix, text: "Це мій бувший однокласник.", answer: "Це мій колишній однокласник.", explain: "бувший → колишній" }
  - { type: choice, text: "Він ___ військовий.", options: ["колишній", "бувший"], answer: 0, explain: "бывший — колишній" }
  - { type: fix, text: "Візьми любу книжку.", answer: "Візьми будь-яку книжку.", explain: "любий (= любой) → будь-який" }
  - { type: judge, text: "Мій любий синочку!", correct: true, explain: "любий = милый, дорогой — норма" }
  - { type: choice, text: "Можеш прийти в ___ день.", options: ["будь-який", "любий"], answer: 0, explain: "любой — будь-який" }
  - { type: choice, text: "Я ___, що це гарна ідея.", options: ["вважаю", "рахую"], answer: 0, explain: "полагать — вважати" }
  - { type: choice, text: "Офіс ___ на третьому поверсі.", options: ["розташований", "знаходиться"], answer: 0, explain: "о месте — розташований" }
