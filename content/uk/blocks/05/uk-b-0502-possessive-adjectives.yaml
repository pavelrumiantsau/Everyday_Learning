# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §5.2 and standard grammar. Exercises are append-only.
id: uk-b-0502
part: 5
order: 2
title: "Притяжательные прилагательные (мамин, батьків)"
source: "§5.2"
level: B2
rule: |
  Притяжательные прилагательные образуются:
  - от слов мужского рода — суффиксами ***-ів (-їв)*** в начальной форме и ***-ов-, -ев- (-єв-)*** в остальных: *батьків — батькова — батькове — батькові; Андріїв — Андрієва; Ігорів — Ігорева*;
  - от слов на *-а, -я* — суффиксами ***-ин, -ін (-їн)***: *мамин, Ганнин, сестрин, бабусин, Зоїн, Маріїн*.

  В живой речи они **гораздо употребительнее**, чем в русском: *мамина сукня, батькова хата, бабусин борщ* звучит естественнее, чем *сукня мами*.

  Склоняются **по твёрдой группе**: *батькового, маминому, Ганниної*.
tables:
  - head: ["От слова", "м. р.", "ж. р.", "ср. р.", "мн."]
    rows:
      - ["батько", "батьків", "батькова", "батькове", "батькові"]
      - ["Андрій", "Андріїв", "Андрієва", "Андрієве", "Андрієві"]
      - ["мама", "мамин", "мамина", "мамине", "мамині"]
      - ["Зоя", "Зоїн", "Зоїна", "Зоїне", "Зоїні"]
pairs:
  - { wrong: "сукня мами (в разговоре)", right: "мамина сукня" }
  - { wrong: "мамова кімната", right: "мамина кімната" }
examples:
  - { text: "Мамина сукня висить у шафі." }
  - { text: "Ми поїхали до батькового брата." }
  - { text: "Бабусин борщ — найсмачніший." }
