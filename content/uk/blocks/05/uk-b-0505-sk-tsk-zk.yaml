# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §5.5 and Український правопис 2019. Exercises are append-only.
id: uk-b-0505
part: 5
order: 5
title: "Суффиксы -ськ-, -цьк-, -зьк- (козацький, паризький)"
source: "§5.5"
level: B2
strict: true
rule: |
  При образовании прилагательных с суффиксом *-ськ-* конечный согласный основы сливается с ним:

  - ***к, ч, ц → -цьк-***: *козак — козацький, ткач — ткацький, купець — купецький, Німеччина — німецький*;
  - ***г, ж, з → -зьк-***: *Париж — паризький, Прага — празький, Кавказ — кавказький, Запоріжжя — запорізький*;
  - ***х, ш, с → -ськ-***: *чех — чеський, товариш — товариський, Одеса — одеський, Черкаси — черкаський*.

  Остальные согласные просто присоединяют *-ськ-*: *харківський, львівський, луцький*.

  **Исключения:** в заимствованиях сочетания остаются, если иначе слово трудно узнать: *казах — казахський, тюрк — тюркський*.
tables:
  - head: ["Конец основы", "Суффикс", "Примеры"]
    rows:
      - ["к, ч, ц", "-цьк-", "козацький, ткацький, німецький"]
      - ["г, ж, з", "-зьк-", "празький, паризький, кавказький"]
      - ["х, ш, с", "-ськ-", "чеський, товариський, одеський"]
pairs:
  - { wrong: "парижський", right: "паризький" }
  - { wrong: "козакський", right: "козацький" }
  - { wrong: "одесський", right: "одеський" }
examples:
  - { text: "Ми слухали козацькі пісні в одеському театрі." }
  - { text: "Празький годинник — символ міста." }
  - { text: "Я вивчаю німецьку мову." }
