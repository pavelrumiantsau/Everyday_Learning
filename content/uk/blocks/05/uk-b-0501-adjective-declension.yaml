# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §5.1 and standard grammar. Exercises are append-only.
id: uk-b-0501
part: 5
order: 1
title: "Прилагательные: твёрдая и мягкая группа"
source: "§5.1"
level: B1
rule: |
  Украинские прилагательные имеют **стянутые окончания** (*нова*, а не *новая*); полные формы (*синєє море*) встречаются только в поэзии. Белорусский тут не поможет: там *новая, новае*.

  **Мягкая группа** — небольшой закрытый список на *-ній* и несколько других: ***синій, давній, сусідній, вечірній, зимній, літній, осінній, середній, третій, задній, передній, верхній***. Остальные — **твёрдые** (*новий, наступний, нічний*).

  - **Родительный женского рода — *-ої / -ьої*** (рус. *-ой*): *без нової книги, біля сусідньої хати*.
  - **Местный мужского и среднего рода** — две формы: *у новому / у новім, у синьому / у синім*.
  - В мягкой группе перед окончанием пишется *ь* или *-ій*: *синя, синю, синьою, синє, сині*.
tables:
  - head: ["Падеж", "м. р.", "ж. р.", "ср. р.", "мн. ч."]
    rows:
      - ["Н.", "новий / синій", "нова / синя", "нове / синє", "нові / сині"]
      - ["Р.", "нового / синього", "нової / синьої", "нового / синього", "нових / синіх"]
      - ["Д.", "новому / синьому", "новій / синій", "новому / синьому", "новим / синім"]
      - ["З.", "= Н. или Р.", "нову / синю", "нове / синє", "= Н. или Р."]
      - ["О.", "новим / синім", "новою / синьою", "новим / синім", "новими / синіми"]
      - ["М.", "(на) новому, новім / синьому, синім", "(на) новій / синій", "как м. р.", "(на) нових / синіх"]
pairs:
  - { wrong: "без новой книги", right: "без нової книги" }
  - { wrong: "синії очі", right: "сині очі" }
  - { wrong: "сусідна хата", right: "сусідня хата" }
examples:
  - { text: "У неї сині очі й довге волосся." }
  - { text: "Ми чекаємо на вечірній потяг біля сусідньої станції." }
  - { text: "Без нової книжки я не поїду." }
exercises:
  - { type: choice, text: "У неї ___ очі.", options: ["сині", "синії"], answer: 0, explain: "стянутая форма: сині" }
  - { type: choice, text: "Я купив ___ куртку.", options: ["синю", "синью"], answer: 0, explain: "мягкая группа: З. в. ж. р. синю" }
  - { type: choice, text: "Я не можу жити без ___ книги.", options: ["нової", "новой"], answer: 0, explain: "Р. в. ж. р.: -ої (рус. -ой)" }
  - { type: choice, text: "Ми живемо біля ___ хати.", options: ["сусідньої", "сусідної"], answer: 0, explain: "сусідній — мягкая группа: -ьої" }
  - { type: choice, text: "Ми чекаємо ___ потягу.", options: ["вечірнього", "вечірного"], answer: 0, explain: "вечірній — мягкая группа" }
  - { type: choice, text: "Ми відпочивали ___ порою.", options: ["літньою", "літною"], answer: 0, explain: "літній — мягкая группа" }
  - { type: choice, text: "Надворі ___ листя.", options: ["осіннє", "осінне"], answer: 0, explain: "осінній — мягкая группа" }
  - { type: choice, text: "Він сидить у ___ ряду.", options: ["третьому", "третєму"], answer: 0, explain: "третій — мягкая группа" }
  - { type: choice, text: "Він живе в ___ будинку.", options: ["сусідньому", "сусідному"], answer: 0, explain: "сусідній — мягкая группа" }
  - { type: choice, text: "Сідайте на ___ сидіння.", options: ["заднє", "задне"], answer: 0, explain: "задній — мягкая группа" }
  - { type: choice, text: "Мені потрібен ___ розмір.", options: ["середній", "середний"], answer: 0, explain: "середній — мягкая группа" }
  - { type: choice, text: "Я знайшов ___ лист від бабусі.", options: ["давній", "давний"], answer: 0, explain: "давній — мягкая группа" }
  - { type: choice, text: "Ця сукня зовсім ___.", options: ["нова", "новая"], answer: 0, explain: "стянутая форма: нова" }
  - { type: choice, text: "Перед нами ___ море.", options: ["синє", "синєє"], answer: 0, explain: "синєє — только в поэзии" }
  - { type: cloze, text: "Ми живемо в ___ будинку.", answer: "новому", also: ["новім"], hint: "новий", explain: "М. в.: новому / новім" }
  - { type: cloze, text: "Я пишу ___ ручкою.", answer: "синьою", hint: "синій", explain: "мягкая группа: О. в. ж. р. -ьою" }
  - { type: cloze, text: "Книжка лежить на ___ полиці.", answer: "верхній", hint: "верхній", explain: "мягкая группа: М. в. ж. р. -ій" }
  - { type: cloze, text: "Я виходжу на ___ зупинці.", answer: "наступній", hint: "наступний", explain: "твёрдая группа: М. в. ж. р. -ій" }
  - { type: cloze, text: "Мені подобається ___ погода.", answer: "літня", hint: "літній", explain: "мягкая группа: ж. р. -я" }
  - { type: cloze, text: "Я познайомився з ___ сусідом.", answer: "новим", hint: "новий", explain: "О. в. м. р.: -им" }
  - { type: cloze, text: "Ми гуляли ___ вулицями.", answer: "нічними", hint: "нічний", explain: "твёрдая группа: О. мн. -ими" }
  - { type: cloze, text: "До ___ зупинки ще далеко.", answer: "наступної", hint: "наступний", explain: "Р. в. ж. р.: -ої" }
  - { type: judge, text: "Я не знайшов нової книжки.", correct: true, explain: "Р. в. ж. р.: нової" }
  - { type: judge, text: "Це подарунок від новой подруги.", correct: false, fix: "Це подарунок від нової подруги.", explain: "Р. в. ж. р.: -ої" }
  - { type: judge, text: "У неї синії очі.", correct: false, fix: "У неї сині очі.", explain: "стянутая форма: сині" }
