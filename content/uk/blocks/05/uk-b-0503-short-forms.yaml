# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §5.3 and standard grammar. Exercises are append-only.
id: uk-b-0503
part: 5
order: 3
title: "Краткие формы: он болен → він хворий"
source: "§5.3"
level: B2
rule: |
  Русские краткие формы в украинском обычно передаются **полными**: *он болен — він хворий, дом пуст — дім порожній, он занят — він зайнятий, я голоден — я голодний*.

  **Краткие формы живы лишь у нескольких слов мужского рода:** ***винен, певен, повен, рад, годен, згоден*** — рядом с полными *винний, певний, повний, радий, годний, згодний*. В народной поэзии встречаются *зелен, дрібен*.

  Часто русская краткая форма требует **другого слова**: *ты прав — ти маєш рацію (ти правий)*, *он уверен — він упевнений*, *магазин закрыт — магазин зачинений*, *мы свободны — ми вільні*, *она довольна — вона задоволена*.
tables:
  - head: ["Русский", "Українська"]
    rows:
      - ["он болен", "він хворий"]
      - ["он занят", "він зайнятий"]
      - ["ты прав", "ти маєш рацію / ти правий"]
      - ["я уверен", "я впевнений / я певен"]
      - ["я согласен", "я згоден / я згодний"]
      - ["магазин закрыт", "магазин зачинений"]
pairs:
  - { wrong: "він болен", right: "він хворий" }
  - { wrong: "я голоден", right: "я голодний" }
  - { wrong: "ми свободні", right: "ми вільні" }
examples:
  - { text: "Сьогодні брат хворий, тому він удома." }
  - { text: "Я згоден з тобою, ти маєш рацію." }
  - { text: "Я певен, що він прийде." }
exercises:
