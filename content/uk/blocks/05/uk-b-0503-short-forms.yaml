  - { type: fix, text: "Я голоден.", answer: "Я голодний.", explain: "полная форма: голодний" }
  - { type: fix, text: "Вона довольна.", answer: "Вона задоволена.", explain: "задоволений" }
  - { type: fix, text: "Я готов.", answer: "Я готовий.", explain: "полная форма: готовий" }
  - { type: fix, text: "Він уверен у собі.", answer: "Він упевнений у собі.", also: ["Він впевнений у собі."], explain: "упевнений (впевнений)" }
  - { type: fix, text: "Ми свободні.", answer: "Ми вільні.", explain: "вільний" }
  - { type: choice, text: "Він сьогодні ___.", options: ["хворий", "болен"], answer: 0, explain: "полная форма: хворий" }
  - { type: choice, text: "Ця сумка мені ___.", options: ["потрібна", "нужна"], answer: 0, explain: "потрібний (рус. нужный)" }
