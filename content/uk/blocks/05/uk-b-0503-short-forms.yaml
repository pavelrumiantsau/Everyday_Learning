  - { type: choice, text: "Я з тобою ___.", options: ["згоден", "согласен"], answer: 0, explain: "живая краткая форма: згоден (или згодний)" }
  - { type: choice, text: "Він ___ у цьому.", options: ["винен", "виноват"], answer: 0, explain: "живая краткая форма: винен (или винний)" }
  - { type: choice, text: "Я ___, що він прийде.", options: ["певен", "уверен"], answer: 0, explain: "живая краткая форма: певен (или впевнений)" }
  - { type: choice, text: "Келих ___ вина.", options: ["повен", "полон"], answer: 0, explain: "живая краткая форма: повен (или повний)" }
  - { type: fix, text: "Він дуже занят.", answer: "Він дуже зайнятий.", explain: "полная форма: зайнятий" }
  - { type: fix, text: "Він хвор.", answer: "Він хворий.", explain: "полная форма: хворий" }
  - { type: fix, text: "Магазин закрит.", answer: "Магазин зачинений.", also: ["Магазин зачинено."], explain: "полная форма: зачинений (двери, магазин — зачиняти)" }
  - { type: fix, text: "Ти прав.", answer: "Ти маєш рацію.", also: ["Ти правий."], explain: "ти маєш рацію / ти правий" }
