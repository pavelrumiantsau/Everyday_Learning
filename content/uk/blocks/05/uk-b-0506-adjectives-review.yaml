# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Review of Part 5 (course PDF §5.6 «Типичные ошибки»). Written with Claude Code. Exercises are append-only.
id: uk-b-0506
part: 5
order: 6
title: "Прилагательное: повторение и типичные ошибки"
source: "§5.6"
level: B2
rule: |
  Типичные ошибки русскоязычных в прилагательном (§5.6):

  - ✗ *самий кращий* → ✓ ***найкращий***;
  - ✗ *більш кращий, більш вищий* → ✓ ***кращий, вищий*** (две степени не смешиваются);
  - ✗ *вищий чим я* → ✓ ***вищий за мене / від мене / ніж я***;
  - ✗ *найбільш кращий* → ✓ ***найкращий***;
  - ✗ *він болен / він хвор* → ✓ ***він хворий***;
  - ✗ *старше мене на два года* → ✓ ***старший за мене на два роки***.

  Плюс то, что было в блоках этой части: родительный *нової* (не *новой*), мягкая группа (*синій, сусідній, третій*), притяжательные (*мамин, батьків*), суффиксы *-цьк-, -зьк-*.
pairs:
  - { wrong: "самий кращий", right: "найкращий" }
  - { wrong: "вищий чим я", right: "вищий за мене" }
  - { wrong: "він болен", right: "він хворий" }
examples:
  - { text: "Це найкращий день у році." }
  - { text: "Моя сестра старша за мене на два роки." }
  - { text: "Мамина подруга живе в сусідньому будинку." }
exercises:
  - { type: fix, text: "Це самий високий будинок у місті.", answer: "Це найвищий будинок у місті.", explain: "превосходная — най-: найвищий" }
  - { type: fix, text: "Цей торт більш смачніший.", answer: "Цей торт смачніший.", also: ["Цей торт більш смачний."], explain: "две степени не смешиваются" }
  - { type: fix, text: "Вона розумніша чим я.", answer: "Вона розумніша за мене.", also: ["Вона розумніша від мене.", "Вона розумніша, ніж я."], explain: "за / від / ніж, не «чим»" }
  - { type: fix, text: "Сестра болна.", answer: "Сестра хвора.", explain: "полная форма: хвора" }
  - { type: fix, text: "Брат старше мене на три года.", answer: "Брат старший за мене на три роки.", also: ["Брат на три роки старший за мене."], explain: "старший за мене; три роки" }
  - { type: spot, text: "Я не знайшов новой книжки.", wrong: "новой", answer: "нової", explain: "Р. в. ж. р.: -ої" }
  - { type: spot, text: "Ми живемо в сусідному будинку.", wrong: "сусідному", answer: "сусідньому", explain: "сусідній — мягкая группа" }
  - { type: spot, text: "Він сидить у третєму ряду.", wrong: "третєму", answer: "третьому", explain: "третій — мягкая группа" }
  - { type: fix, text: "Це самий смачний борщ.", answer: "Це найсмачніший борщ.", explain: "превосходная — най-, без «самий»" }
  - { type: spot, text: "Ми слухали козакську пісню.", wrong: "козакську", answer: "козацьку", explain: "к + ськ → цьк" }
  - { type: spot, text: "Мені подобається парижський стиль.", wrong: "парижський", answer: "паризький", explain: "ж + ськ → зьк" }
  - { type: spot, text: "Він сьогодні болен.", wrong: "болен", answer: "хворий", explain: "полная форма: хворий" }
  - { type: choice, text: "Це ___ сукня.", options: ["мамина", "мамова"], answer: 0, explain: "от слов на -а: -ин-" }
  - { type: choice, text: "Він вищий ___ мене.", options: ["за", "чим"], answer: 0, explain: "вищий за мене" }
  - { type: choice, text: "У неї ___ очі.", options: ["сині", "синії"], answer: 0, explain: "стянутая форма" }
  - { type: choice, text: "Це ___ рішення.", options: ["найкраще", "саме краще"], answer: 0, explain: "превосходная — най-" }
  - { type: cloze, text: "Ця дорога ___ за ту.", answer: "довша", hint: "довгий", explain: "довгий — довший: г перед -ш- выпадает" }
  - { type: cloze, text: "Ми зупинилися біля ___ хати.", answer: "батькової", hint: "батько", explain: "притяжательное: батькова" }
  - { type: cloze, text: "Я пишу ___ ручкою.", answer: "синьою", hint: "синій", explain: "мягкая группа: -ьою" }
  - { type: cloze, text: "Це ___ місто в країні.", answer: "найбільше", hint: "великий, превосходная", explain: "най- + більший" }
  - { type: judge, text: "Мій брат вищий від мене.", correct: true, explain: "вищий від мене — норма" }
  - { type: judge, text: "Я згоден з тобою.", correct: true, explain: "згоден — живая краткая форма" }
  - { type: judge, text: "Цей фільм більш цікавіший.", correct: false, fix: "Цей фільм цікавіший.", explain: "две степени не смешиваются" }
