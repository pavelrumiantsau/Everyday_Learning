# Ukrainian grammar block (docs/UK-GRAMMAR-PLAN.md §5). Format: packages/core/src/uk-schema.ts → UkBlock.
# Written with Claude Code from the course PDF §5.4 and §5.6 and standard grammar. Exercises are append-only.
id: uk-b-0504
part: 5
order: 4
title: "Степени сравнения: найкращий, вищий за мене"
source: "§5.4"
level: B2
rule: |
  **Сравнительная степень** — суффиксы ***-іш-*** и ***-ш-***: *новіший, добріший, тепліший, сильніший; молодший, старший*. Перед *-ш-* суффиксы *-к-, -ок-, -ек-* выпадают, а согласные меняются:
  - *г, ж, з + ш → жч*: *дорогий — дорожчий, дужий — дужчий, вузький — вужчий, близький — ближчий*;
  - *с + ш → щ*: *високий — вищий*;
  - *к + ш* после согласного *→ ч* или *ш*: *важкий — важчий, легкий — легший, тонкий — тонший*.

  **Другой корень:** *добрий — кращий (ліпший), поганий — гірший, великий — більший, малий — менший*. Составная форма: *більш (менш) вдалий*.

  **Превосходная** — ***най-*** + сравнительная: *найкращий, найвищий*; усиление: *якнайкращий, щонайкращий*. Составная: *найбільш вдалий*. ***Самий*** для превосходной **не употребляется**.

  **С чем сравниваем** — три конструкции: ***вищий за брата, вищий від брата, вищий, ніж брат***. Русская модель «выше, чем…» → *вищий, чим брат* — **ошибка**.
tables:
  - head: ["Исходная", "Сравнительная", "Превосходная"]
    rows:
      - ["новий", "новіший", "найновіший"]
      - ["дорогий", "дорожчий", "найдорожчий"]
      - ["високий", "вищий", "найвищий"]
      - ["легкий", "легший", "найлегший"]
      - ["добрий", "кращий (ліпший)", "найкращий"]
      - ["великий", "більший", "найбільший"]
pairs:
  - { wrong: "самий кращий", right: "найкращий" }
  - { wrong: "більш кращий", right: "кращий" }
  - { wrong: "вищий чим я", right: "вищий за мене" }
  - { wrong: "старше мене на два года", right: "старший за мене на два роки" }
examples:
  - { text: "Мій брат вищий за мене, але молодший." }
  - { text: "Говерла — найвища гора України." }
  - { text: "Краще пізно, ніж ніколи." }
exercises:
  - { type: cloze, text: "Цей будинок ___ за той.", answer: "новіший", hint: "новий", explain: "суффикс -іш-" }
  - { type: cloze, text: "Сьогоднішній день ___ за вчорашній.", answer: "тепліший", hint: "теплий", explain: "суффикс -іш-" }
  - { type: cloze, text: "Мій брат ___ за мене.", answer: "молодший", hint: "молодий", explain: "суффикс -ш-" }
  - { type: cloze, text: "Ця сумка ___ за ту.", answer: "дорожча", hint: "дорогий", explain: "г + ш → жч" }
  - { type: cloze, text: "Ця дорога ___ за ту.", answer: "вужча", hint: "вузький", explain: "з + ш → жч (-к- выпадает)" }
  - { type: cloze, text: "Наш будинок ___ до школи, ніж ваш.", answer: "ближчий", hint: "близький", explain: "з + ш → жч (-к- выпадает)" }
  - { type: cloze, text: "Він ___ за брата.", answer: "вищий", hint: "високий", explain: "с + ш → щ" }
  - { type: cloze, text: "Ця валіза ___ за ту.", answer: "важча", hint: "важкий", explain: "к + ш после согласного → ч" }
  - { type: cloze, text: "Цей рюкзак ___ за той.", answer: "легший", hint: "легкий", explain: "к + ш → ш (-к- выпадает)" }
  - { type: cloze, text: "Ця нитка ___ за ту.", answer: "тонша", hint: "тонкий", explain: "к + ш → ш" }
  - { type: cloze, text: "Цей варіант ___.", answer: "кращий", also: ["ліпший"], hint: "добрий", explain: "другой корень: кращий / ліпший" }
  - { type: cloze, text: "Погода стала ___.", answer: "гіршою", hint: "поганий", explain: "другой корень: гірший" }
  - { type: cloze, text: "Наша квартира ___ за вашу.", answer: "більша", hint: "великий", explain: "другой корень: більший" }
  - { type: cloze, text: "Ця кімната ___ за ту.", answer: "менша", hint: "малий", explain: "другой корень: менший" }
  - { type: cloze, text: "Він ___ за всіх у класі.", answer: "сильніший", hint: "сильний", explain: "суффикс -іш-" }
  - { type: cloze, text: "Це ___ день у моєму житті.", answer: "найкращий", hint: "добрий, превосходная", explain: "най- + кращий" }
  - { type: cloze, text: "Говерла — ___ гора України.", answer: "найвища", hint: "високий, превосходная", explain: "най- + вищий" }
  - { type: cloze, text: "Ми шукаємо ___ рішення.", answer: "якнайкраще", also: ["щонайкраще"], hint: "якнай- + кращий", explain: "усиление: якнайкращий" }
  - { type: choice, text: "Він вищий ___ брата.", options: ["за", "чим"], answer: 0, explain: "вищий за / від кого, ніж хто; не «чим»" }
  - { type: choice, text: "Вона старша ___ мене на два роки.", options: ["за", "чим"], answer: 0, explain: "старша за мене" }
  - { type: choice, text: "Краще пізно, ___ ніколи.", options: ["ніж", "чим"], answer: 0, explain: "при сравнении — ніж" }
  - { type: choice, text: "Він розумніший ___ мене.", options: ["від", "чим"], answer: 0, explain: "розумніший від мене / за мене" }
  - { type: fix, text: "Це самий кращий фільм.", answer: "Це найкращий фільм.", explain: "превосходная — через най-, без «самий»" }
  - { type: fix, text: "Цей варіант більш кращий.", answer: "Цей варіант кращий.", explain: "две степени не смешиваются" }
  - { type: fix, text: "Він старше мене на два года.", answer: "Він старший за мене на два роки.", also: ["Він на два роки старший за мене."], explain: "старший за мене; два роки" }
  - { type: fix, text: "Ти вищий чим я.", answer: "Ти вищий за мене.", also: ["Ти вищий від мене.", "Ти вищий, ніж я."], explain: "за / від / ніж, не «чим»" }
  - { type: fix, text: "Це найбільш кращий результат.", answer: "Це найкращий результат.", explain: "найбільш + кращий — смешение степеней" }
  - { type: judge, text: "Це найбільш вдалий варіант.", correct: true, explain: "составная превосходная — норма" }
