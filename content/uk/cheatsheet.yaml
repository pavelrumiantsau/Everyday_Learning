# Cheat sheet: the course PDF's Appendix A «15 правил, которые дают больше всего», each rule linked to its blocks.
# Format: packages/core/src/uk-schema.ts → UkCheatSheet. Shown in the Mini App («Шпаргалка»).
- rule: "Звонкие не оглушаются, г — фрикативный"
  example: "хліб [хл’іб], гора"
  blocks: [uk-b-0104, uk-b-0101]
- rule: "у / в, і / й, з / із / зі — по благозвучию"
  example: "вона в школі, брат у школі; мама й тато"
  blocks: [uk-b-0206, uk-b-0207, uk-b-0208]
- rule: "г, к, х → з, ц, с перед -і"
  example: "на нозі, в руці"
  blocks: [uk-b-0204]
- rule: "Обращение — в звательном падеже"
  example: "пане Андрію, Олено"
  blocks: [uk-b-0410]
- rule: "Дательный -ові у одушевлённых"
  example: "братові, Іванові Петровичу"
  blocks: [uk-b-0404]
- rule: "Родительный -а / -у"
  example: "стола, але університету"
  blocks: [uk-b-0405, uk-b-0406]
- rule: "Род отдельных слов не как в русском"
  example: "сильний біль, великий собака"
  blocks: [uk-b-0401]
- rule: "Превосходная — через най-; сравнение — за / від / ніж"
  example: "найкращий; вищий за мене"
  blocks: [uk-b-0504]
- rule: "После 2–4 — именительный множественного"
  example: "два роки, три дні"
  blocks: [uk-b-0602]
- rule: "Приставное н- после предлога; свій; який"
  example: "до нього; книга, яку я читаю"
  blocks: [uk-b-0701, uk-b-0702, uk-b-0703]
- rule: "Синтетическое будущее; ходімо вместо «давайте»"
  example: "читатиму; почнімо"
  blocks: [uk-b-0805, uk-b-0807]
- rule: "Деепричастие совершенного вида на -вши; без настоящих причастий"
  example: "прочитавши; чинний закон"
  blocks: [uk-b-0812, uk-b-0809]
- rule: "Общий вопрос — с чи"
  example: "Чи ти прийдеш?"
  blocks: [uk-b-0905]
- rule: "Русское «по» → за, з, на, через"
  example: "за законом, іспит з фізики"
  blocks: [uk-b-0903, uk-b-1002]
- rule: "Управление и кальки"
  example: "дякую вам; брати участь"
  blocks: [uk-b-1001, uk-b-1201]
