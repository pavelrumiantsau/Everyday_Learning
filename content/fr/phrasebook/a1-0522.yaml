# French survival phrases (PLAN §3.5). Text: Tatoeba sentences copied verbatim (id at the end of each line); meanings and
# notes in English, written with Claude Code. Phrases sort before vocab/, so they are the first French cards (from April 2027).
- { id: fr-p-0522, type: phrase, cefr: A1, text: "Comment t'appelles-tu ?", meaning: { en: "What's your name? (informal)" }, note: { en: "informal; formal: Comment vous appelez-vous ?" } }  # tatoeba:451070
- { id: fr-p-0523, type: phrase, cefr: A1, text: "Je m'appelle Tom.", meaning: { en: "My name is Tom." }, note: { en: "je m'appelle = I am called (s'appeler)" } }  # tatoeba:3138573
- { id: fr-p-0524, type: phrase, cefr: A1, text: "Enchanté.", meaning: { en: "Nice to meet you. (said by a man)" }, note: { en: "a woman writes Enchantée (same sound)" } }  # tatoeba:590113
- { id: fr-p-0525, type: phrase, cefr: A1, text: "Comment allez-vous ?", meaning: { en: "How are you? (formal)" }, note: { en: "informal: Ça va ? / Comment vas-tu ?" } }  # tatoeba:11578
- { id: fr-p-0526, type: phrase, cefr: A1, text: "Ça va ?", meaning: { en: "How are you? / All right?" }, note: { en: "answer: Ça va (bien), merci." } }  # tatoeba:14970
