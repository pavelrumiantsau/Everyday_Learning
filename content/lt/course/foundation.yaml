# Lithuanian foundation course: from zero to the A2 state exam (Basic–I category). Plan: docs/EXTENSION-PLAN.md §6.
# Format: packages/core/src/course.ts → Course. Only learners with `lt.course: foundation` follow it; the original plan never does.
# Units point to existing ids; a word may appear in one unit only. Unit ids are stable (progress is stored by them).
# Content per unit (phase E/H): 40–70 words, 6–8 phrases, 1–2 lessons, 2 texts, dialogues, a writing and two speaking tasks.
# Gap words still to add (phase E, ids lt-w-6001+): u01 Lietuva, lietuvis, lietuvė, rusė, inžinierius, malonu, lietuviškai,
#   rusiškai, viso gero; u02 euras; u03 paprastai; u04 namai, aukštas «этаж» (the existing aukštas is «высокий»);
#   u05 gramas, batai, prekybos centras; u06 oro uostas, sustojimas.
id: lt-foundation
units:
  # --- Stage 0: sounds (6 micro-lessons, alongside unit 1) ---
  - { id: s01, stage: sounds, title: "Алфавит и как назвать своё имя по буквам", can_do: ["Называю буквы литовского алфавита", "Произношу своё имя и фамилию по буквам"] }
  - { id: s02, stage: sounds, title: "Долгие и краткие гласные: a/ą, e/ę/ė, i/į/y, u/ų/ū", can_do: ["Слышу разницу между долгими и краткими гласными"] }
  - { id: s03, stage: sounds, title: "ie, uo и дифтонги ai, ei, au, ui", can_do: ["Правильно читаю ie, uo, ai, ei, au, ui"] }
  - { id: s04, stage: sounds, title: "č, š, ž, c, dz, dž, ch", can_do: ["Читаю и пишу č, š, ž, c, dz, dž, ch"] }
  - { id: s05, stage: sounds, title: "Мягкие согласные: буква i после согласной", can_do: ["Читаю мягкие согласные: lietus, geriau"] }
  - { id: s06, stage: sounds, title: "Ударение и литовские буквы на клавиатуре", can_do: ["Знаю, что ударение подвижное, и вижу его в словах", "Набираю ą č ę ė į š ų ū ž на телефоне и компьютере"] }

