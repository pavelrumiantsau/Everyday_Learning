id: lt-r-0034
cefr: B2
title: "Kuršių nerija"
topic: "Куршская коса"
source: generated
text: |
  Kuršių nerija – siaura, beveik šimto kilometrų ilgio smėlio juosta tarp Baltijos jūros ir Kuršių marių. Šiaurinė jos dalis priklauso Lietuvai, pietinė – Rusijos Kaliningrado sričiai. 2000 metais nerija buvo įtraukta į UNESCO pasaulio paveldo sąrašą kaip unikalus gamtos ir žmogaus sukurtas kraštovaizdis.

  Neriją sukūrė vėjas ir jūra. Prieš kelis šimtus metų žmonės iškirto čia augusius miškus, ir smėlis pradėjo judėti. Kopos slinko per kaimus ir juos palaidojo – smėlyje dingo net keliolika gyvenviečių. Tik XIX amžiuje pradėta sodinti medžius ir tvirtinti kopas. Šiandien didžiąją nerijos dalį vėl dengia pušynai, bet aukščiausios kopos tebėra atviros ir primena dykumą.

  Vasarą Nidoje, Juodkrantėje ir Preiloje pilna poilsiautojų. Vieni atvyksta dėl plačių paplūdimių ir švaraus oro, kiti – dėl kultūros. Nidoje stovi namelis, kuriame vasaras leido vokiečių rašytojas Thomas Mannas, o Juodkrantėje galima pasivaikščioti Raganų kalnu, kur tarp medžių stovi dešimtys medinių skulptūrų.

  Tačiau nerijos grožis trapus. Gamtininkai perspėja, kad per didelis turistų srautas kenkia kopoms: nuo kiekvieno žingsnio smėlis pajuda, o reti augalai sunyksta. Todėl į daugelį kopų lipti draudžiama, vaikščioti galima tik specialiais takais, o įvažiavimas į neriją automobiliu yra mokamas.

  Nerijos gyventojai nuo seno vertėsi žvejyba. Iki šiol Nidoje galima pamatyti tradicinius žvejų namelius, dažytus ruda ir mėlyna spalvomis, o ant stogų – medines vėtrunges. Tai spalvingos vėliavėlės, pagal kurias kadaise buvo galima atpažinti, iš kurio kaimo yra valtis.

  Kas kartą užlipus ant Parnidžio kopos ir pamačius, kaip saulė leidžiasi į marias, sunku patikėti, kad šį kraštovaizdį kadaise beveik sunaikino patys žmonės. Galbūt būtent todėl nerija moko svarbios pamokos: gamtą lengva prarasti, o atkurti ją – labai sunku.
