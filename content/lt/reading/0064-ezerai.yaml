id: lt-r-0064
cefr: C1
title: "Ežerų kraštas po turistų antplūdžio"
topic: "озёра Аукштайтии и туризм"
source: generated
text: |
  Lietuvoje yra beveik trys tūkstančiai ežerų, didesnių nei pusė hektaro, o daugiausia jų – rytinėje šalies dalyje, Aukštaitijoje. Molėtų, Ignalinos, Zarasų apylinkės vasarą virsta poilsiautojų rojumi: miškų apsupti ežerai, kalvos, siauri keliukai, vedantys į sodybas, kurių kiemuose kūrenamos pirtys.

  1974 metais čia įkurtas pirmasis Lietuvos nacionalinis parkas – Aukštaitijos. Jo tikslas buvo išsaugoti ne tik gamtą, bet ir tradicinius kaimus, senąją medinę architektūrą, vandens malūnus. Nuo Ladakalnio, vienos žinomiausių parko apžvalgos vietų, matyti keli ežerai vienu metu, ir šis vaizdas dažnai puikuojasi turizmo leidiniuose.

  Tačiau populiarumas turi savo kainą. Savaitgaliais prie ežerų sunku rasti vietos automobiliui, paplūdimiuose lieka šiukšlių, o vakarais tylą drumsčia garsi muzika. Dar didesnė problema – statybos. Sklypai prie vandens brangsta, ir nors pakrantėse statyti griežtai ribojama, vis daugiau krantų atsiduria už privačių tvorų. Vietos gyventojai skundžiasi, kad prie ežero, kuriame vaikystėje maudydavosi, dabar nebegali prieiti.

  Gamtininkai pabrėžia ir mažiau matomą žalą. Iš sodybų nuotekų ir laukų į ežerus patenka maisto medžiagų, todėl kai kurie ežerai pamažu užželia, o vanduo praranda skaidrumą. Iš tolo ežeras gali atrodyti gražus, bet jo ekosistema jau būna pažeista.

  Ar įmanoma suderinti turizmą ir gamtos apsaugą? Kai kurios savivaldybės įrengia viešas maudyklas ir pažintinius takus, kad poilsiautojai nesirinktų bet kur ant kranto, o sodybų šeimininkai vis dažniau kalba apie lėtąjį turizmą: mažiau lankytojų, bet ilgesnės viešnagės ir daugiau pagarbos vietai. Galbūt tai vienintelis būdas, kad ežerų kraštas išliktų toks, dėl kurio į jį ir važiuojama.
