id: lt-r-0101
cefr: C1
title: "Lino ir medžio kalba"
topic: "литовский дизайн"
source: generated
text: |
  Jei paklaustumėte užsieniečio apie lietuvišką dizainą, jis greičiausiai nežinotų, ką atsakyti. Lietuva neturi tokio ryškaus įvaizdžio kaip skandinaviškas dizainas, tačiau per pastaruosius du dešimtmečius šalyje užaugo nauja dizainerių karta, kuri vis dažniau pastebima tarptautinėse parodose.

  Daugelis jų semiasi įkvėpimo iš tradicijų. Linas, kadaise auginamas beveik kiekviename ūkyje, vėl tapo madingas: iš jo siuvami drabužiai, gaminama patalynė, staltiesės. Tautiniai raštai – juostų ornamentai, verbų spalvos – perkuriami šiuolaikiškai, kartais vos atpažįstamai.

  Kita stipri kryptis – minimalizmas ir tvarumas. Jauni dizaineriai kuria baldus iš vietinės medienos, drabužius iš perdirbtų medžiagų, o mažos dirbtuvės gamina ribotais kiekiais, užuot konkuravusios su masine gamyba. Daugelis jų prekiauja internetu ir randa pirkėjų visame pasaulyje.

  Vis dėlto kelias nelengvas. Lietuvos rinka maža, gamyba brangi, o pirkėjai, įpratę prie pigių tarptautinių tinklų, ne visada pasiruošę mokėti daugiau už vietinį produktą. Dizaineriai skundžiasi ir tuo, kad valstybė dizainą vis dar laiko greičiau kultūros, o ne ekonomikos sritimi, todėl jam skiriama mažai dėmesio.

  Galbūt lietuviško dizaino tapatybė dar tik formuojasi. Tačiau jau dabar matyti jo bruožai: santūrumas, natūralios medžiagos ir pagarba rankų darbui. Tai, kas kadaise buvo nepritekliaus ženklas, šiandien tampa vertybe.
