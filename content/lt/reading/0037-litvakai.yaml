title: "Litvakai – Lietuvos žydai"
topic: "литваки: евреи Литвы"
source: generated
text: |
  Šimtmečius Lietuvoje gyveno didelė žydų bendruomenė. Lietuvos žydai, vadinami litvakais, garsėjo savo išsilavinimu ir mokslu, o Vilnius buvo vadinamas Šiaurės Jeruzale. XVIII amžiuje čia gyveno garsus rabinas ir mokslininkas Vilniaus Gaonas, kurio darbai iki šiol studijuojami visame pasaulyje.

  Prieš Antrąjį pasaulinį karą žydai sudarė didelę Lietuvos miestų ir miestelių gyventojų dalį. Jie vertėsi prekyba, amatais, dirbo gydytojais ir mokytojais, leido laikraščius ir knygas jidiš bei hebrajų kalbomis. Daugelyje miestelių šalia katalikų bažnyčios stovėjo ir sinagoga.

  Holokaustas šią bendruomenę beveik sunaikino. Nacistinės Vokietijos okupacijos metais buvo nužudyta apie 95 procentai Lietuvos žydų – vienas didžiausių procentų visoje Europoje. Skaudi tiesa ta, kad žudynėse dalyvavo ir dalis vietos gyventojų. Kartu buvo ir tokių, kurie, rizikuodami savo ir savo šeimų gyvybe, slėpė žydus. Šie žmonės vadinami Pasaulio tautų teisuoliais.

  Ilgą laiką apie šias temas Lietuvoje buvo kalbama mažai – sovietmečiu istorija buvo nutylima arba iškraipoma. Nuo nepriklausomybės atkūrimo situacija pamažu keičiasi: statomi paminklai, tyrinėjama istorija, mokyklose apie Holokaustą kalbama atviriau. Kasmet rugsėjo 23-iąją minima Lietuvos žydų genocido aukų atminimo diena.

  Vilniuje apie žydų istoriją galima daug sužinoti Vilniaus Gaono žydų istorijos muziejuje, o netoli miesto esančiuose Paneriuose stovi memorialas. Ten Holokausto metais buvo nužudyta dešimtys tūkstančių žmonių, daugiausia žydų. Kasmet šias vietas lanko mokiniai, turistai ir aukų palikuonys iš viso pasaulio.

  Šiandien apie litvakų paveldą primena atnaujintos sinagogos, muziejai ir garsūs litvakų kilmės žmonės visame pasaulyje – rašytojai, mokslininkai, menininkai. Pažinti šią istoriją svarbu ne tik dėl praeities, bet ir dėl ateities: ji primena, kokia trapi gali būti visuomenė, kurioje leidžiama plisti neapykantai.
