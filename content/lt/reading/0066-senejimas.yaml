id: lt-r-0066
cefr: C1
title: "Senstanti visuomenė"
topic: "старение общества и пенсии"
source: generated
text: |
  Lietuvos visuomenė sensta sparčiau nei daugumos Europos šalių. Gimstamumas mažas, jauni žmonės dažnai išvyksta, o vidutinė gyvenimo trukmė, nors ir lėtai, ilgėja. Jau maždaug kas penktas gyventojas yra vyresnis nei šešiasdešimt penkerių metų, ir ši dalis toliau didės.

  Pensijų sistema tokiems pokyčiams buvo menkai pasirengusi. Dabartiniams pensininkams pensijos mokamos iš dirbančiųjų įmokų, todėl kuo mažiau dirbančiųjų tenka vienam pensininkui, tuo sunkiau sistemai išsilaikyti. Dėl to pensinis amžius buvo palaipsniui keliamas ir šiais metais pasiekė šešiasdešimt penkerius metus tiek vyrams, tiek moterims.

  Be to, nuo 2019 metų jaunesni nei keturiasdešimties metų dirbantieji automatiškai įtraukiami į antrosios pakopos pensijų kaupimą: dalis atlyginimo kaupiama asmeninėje sąskaitoje, o valstybė prideda nedidelę paskatą. Žmogus gali atsisakyti, tačiau daugelis lieka sistemoje, net gerai nesuprasdami, kaip ji veikia.

  Ekonomistai pabrėžia, kad senėjimas – ne vien finansų klausimas. Vyresnio amžiaus žmonės galėtų ilgiau likti darbo rinkoje, tačiau jiems dažnai trukdo darbdavių stereotipai ir menkos galimybės persikvalifikuoti. Kita vertus, vis daugiau senjorų lanko trečiojo amžiaus universitetus, mokosi kalbų, keliauja – senatvė pamažu nustoja būti vien ramybės ir laukimo metais.

  Tikriausiai svarbiausias klausimas – solidarumas tarp kartų. Jaunimas baiminasi, kad mokės už kitų pensijas, o pats senatvėje gaus mažai. Vyresnieji primena, kad būtent jie kūrė šalį sunkiausiais metais. Atsakymas, matyt, ne vienos kartos pergalė, o susitarimas, kurį visuomenei teks nuolat atnaujinti.
