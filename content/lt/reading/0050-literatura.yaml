id: lt-r-0050
cefr: B2
title: "Nuo „Metų“ iki knygų mugės"
topic: "литовская литература и книгоноши"
source: generated
text: |
  Lietuvių grožinė literatūra, palyginti su kaimyninių šalių literatūra, gana jauna. Pirmuoju tikru jos kūriniu laikoma Kristijono Donelaičio poema „Metai“, parašyta XVIII amžiuje Mažojoje Lietuvoje. Joje vaizduojamas valstiečių gyvenimas per keturis metų laikus – nuo pavasario darbų iki žiemos vargų. Poema buvo išleista tik 1818 metais, praėjus daugiau nei trims dešimtmečiams po autoriaus mirties.

  Ypač sunki lietuviškai knygai buvo XIX amžiaus antroji pusė. 1864 metais Rusijos imperijos valdžia uždraudė spausdinti lietuviškus tekstus lotyniškais rašmenimis. Draudimas truko keturiasdešimt metų. Knygos buvo spausdinamos Prūsijoje, o į Lietuvą jas slapta nešė knygnešiai, rizikuodami būti suimti ir ištremti į Sibirą. Kovo 16-ąją Lietuvoje minima Knygnešio diena.

  Spaudos draudimo metais gimė ir moderni lietuvių poezija. Maironio eilėraščių rinkinys „Pavasario balsai“ tapo tautinio atgimimo simboliu, o daugelį jo eilėraščių žmonės dainuoja iki šiol. Tuo metu Žemaitė rašė apsakymus apie kaimo gyvenimą – be jokių pagražinimų, su humoru ir aštriu žvilgsniu.

  XX amžius lietuvių rašytojams atnešė naujų išbandymų. Balys Sruoga, kalintas nacių koncentracijos stovykloje Štuthofe, parašė knygą „Dievų miškas“. Apie baisius dalykus joje pasakojama su karčia ironija. Sovietmečiu knyga ilgai negalėjo būti išleista. Nemažai rašytojų pasitraukė į Vakarus ir kūrė emigracijoje.

  Su Lietuva susijęs ir Nobelio premijos laureatas Czesławas Miłoszas. Jis gimė Šeteniuose, netoli Kėdainių, ir studijavo Vilniuje, nors rašė lenkiškai.

  Atkūrus nepriklausomybę, lietuvių literatūra tapo laisvesnė ir įvairesnė. Rašytojai atvirai kalba apie tremtį, pokario partizanus ir sovietmečio kasdienybę, o jų knygos vis dažniau verčiamos į kitas kalbas.

  Šiandien lietuviai vis dar daug skaito. Kiekvieną vasarį Vilniuje vyksta knygų mugė – didžiausia Baltijos šalyse. Į ją per kelias dienas atvyksta dešimtys tūkstančių lankytojų, o prie populiarių autorių stendų nusidriekia ilgos eilės. Galbūt tai knygnešių palikimas: knyga, dėl kurios kadaise buvo rizikuojama laisve, čia iki šiol vertinama ypatingai.
