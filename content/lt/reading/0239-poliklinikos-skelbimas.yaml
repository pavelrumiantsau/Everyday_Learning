text: |
  Gerbiami pacientai,

  nuo lapkričio 1 d. pas šeimos gydytoją galima užsiregistruoti telefonu 1824 arba internete. Registratūra dirba darbo dienomis nuo 7 iki 19 val.

  Jeigu turite aukštą temperatūrą arba kosulį, prašome neateiti į polikliniką be registracijos – pirmiausia paskambinkite gydytojui.

  Nepamirškite atsinešti asmens dokumento.

  Sveikatos!
  Poliklinikos administracija
