    options: ["Jie trukdo susikaupti", "Jie per brangūs", "Jie greitai sugenda"]
    answer: 0
  - q: "Ką siūlo draudimo priešininkai?"
    options: ["Uždrausti telefonus ir namuose", "Mokyti jaunimą atsakingai naudotis technologijomis", "Nupirkti visiems mokiniams planšetes"]
    answer: 1
  - q: "Kas, autoriaus nuomone, yra svarbiausia?"
    options: ["Griežtos bausmės", "Spintelės telefonams", "Suaugusiųjų pavyzdys"]
    answer: 2
