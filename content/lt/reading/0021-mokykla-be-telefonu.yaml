id: lt-r-0021
cefr: B2
title: Mokykla be telefonų?
topic: телефоны в школе
source: generated
text: |
  Vis daugiau mokyklų Europoje riboja mobiliųjų telefonų naudojimą. Kai kur mokiniai ryte telefonus palieka specialiose spintelėse ir atsiima juos tik po pamokų, kitur telefonus leidžiama laikyti kuprinėje, bet draudžiama išsiimti per pamokas ir pertraukas. Tokie sprendimai sukelia karštų diskusijų tarp tėvų, mokytojų ir pačių mokinių.

  Draudimo šalininkai tvirtina, kad telefonai trukdo susikaupti. Mokinys, kas kelias minutes gaunantis pranešimų, sunkiai įsigilina į sudėtingą užduotį. Mokytojai pastebi, kad per pertraukas vaikai, užuot bendravę tarpusavyje, sėdi įnikę į ekranus. Be to, anot psichologų, socialiniuose tinkluose dažnai prasideda patyčios, kurios vėliau persikelia ir į klasę.

  Priešininkai atsako, kad draudimai problemos neišsprendžia. Jų nuomone, jaunimą reikia mokyti atsakingai naudotis technologijomis, o ne apsimesti, kad telefonų nėra. Telefone yra žodynas, skaičiuotuvas, kalendorius ir galimybė greitai susisiekti su tėvais. Kai kurie tėvai nerimauja, kad, nutikus nelaimei, negalės pasiekti savo vaiko.

  Diskusijose dalyvauja ir patys mokiniai. Kai kurie jų pripažįsta, kad be telefono per pertrauką iš pradžių buvo nuobodu, tačiau netrukus jie vėl pradėjo žaisti stalo tenisą, kalbėtis ar tiesiog eiti į lauką. Kiti skundžiasi, kad suaugusieji jiems nepasitiki ir priima sprendimus jų neatsiklausę. Anot jų, taisyklės būtų veiksmingesnės, jeigu jas kurtų kartu su mokiniais.

  Mokyklose, kuriose telefonai buvo apriboti, rezultatai kol kas skiriasi. Vienur mokytojai džiaugiasi ramesnėmis pamokomis ir gyvesnėmis pertraukomis, kitur mokiniai tiesiog išmoko telefonus slėpti. Panašu, kad vien taisyklių nepakanka: svarbiausia, ar suaugusieji patys rodo gerą pavyzdį. Juk sunku reikalauti iš vaiko nežiūrėti į ekraną, jei tėvai vakarienės metu skaito naujienas telefone.

  Kaip manote jūs – ar telefonai mokykloje turėtų būti uždrausti?
