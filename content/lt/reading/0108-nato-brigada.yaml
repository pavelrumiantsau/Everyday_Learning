id: lt-r-0108
cefr: C1
title: "Svečiai, atvykę pasilikti"
topic: "войска НАТО и немецкая бригада в Литве"
source: generated
text: |
  Dar prieš dešimtmetį sakinys „Lietuvoje nuolat dislokuota vokiečių brigada“ daugeliui būtų skambėjęs kaip politinė fantastika. Šiandien tai realybė. Nuo 2017 metų Lietuvoje veikia NATO priešakinių pajėgų batalioninė kovinė grupė, kuriai vadovauja Vokietija, o 2023 metais Berlynas paskelbė apie dar ambicingesnį žingsnį – nuolatinės brigados dislokavimą. Tai pirmas toks atvejis Vokietijos pokario istorijoje.

  Sprendimą lėmė ne sentimentai, o pasikeitusi saugumo aplinka. Rusijai pradėjus plataus masto karą prieš Ukrainą, tapo akivaizdu, kad atgrasymas turi būti ne simbolinis, o realus: kariai turi būti čia, o ne laukti signalo už tūkstančio kilometrų.

  Įdomu, kad visuomenė vokiečių karius sutiko itin palankiai. Istorijos šešėlių, žinoma, netrūksta, tačiau šiuolaikinė Vokietija suvokiama visų pirma kaip sąjungininkė, o ne kaip skaudžios praeities priminimas. Kur kas daugiau diskusijų sukelia praktiniai klausimai: kas pastatys kareivines ir poligonus, kur gyvens karių šeimos, kuriose mokyklose mokysis jų vaikai ir kiek visa tai kainuos valstybės biudžetui.

  Kritikai perspėja, kad augančios gynybos išlaidos gali būti dengiamos kitų sričių – švietimo, sveikatos apsaugos – sąskaita. Vis dėlto vyrauja nuomonė, kad saugumas yra visų kitų dalykų prielaida: be jo nei mokyklos, nei ligoninės neturėtų ateities.

  Galbūt didžiausias šios istorijos paradoksas tas, kad sėkmingas atgrasymas lieka nematomas. Apie jį nerašoma antraštėse, jo neįmanoma pamatyti ar pačiupinėti. Ir jei sąjungininkų kariams niekada neteks kautis, tai ir bus geriausias įrodymas, kad jie čia buvo reikalingi.
