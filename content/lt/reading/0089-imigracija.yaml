id: lt-r-0089
cefr: C1
title: "Iš emigracijos į imigracijos šalį"
topic: "трудовая иммиграция"
source: generated
text: |
  Dar prieš dešimtmetį Lietuva buvo laikoma emigracijos šalimi: daugiau žmonių išvykdavo, nei atvykdavo. Šiandien padėtis kitokia. Statybvietėse, sunkvežimių kabinose, kavinėse ir sandėliuose vis dažniau dirba atvykėliai iš Ukrainos, Baltarusijos, Centrinės Azijos ar Indijos.

  Pagrindinė priežastis – darbo jėgos trūkumas. Visuomenė sensta, dalis jaunų žmonių emigravo, o ekonomika auga. Ypač trūksta tolimųjų reisų vairuotojų, statybininkų, suvirintojų, slaugytojų. Darbdaviai tvirtina, kad be užsieniečių kai kurios įmonės tiesiog negalėtų veikti.

  Tačiau imigracija kelia ir klausimų. Dalis gyventojų baiminasi, kad pigi darbo jėga stabdys atlyginimų augimą, kiti nerimauja dėl kultūrinių skirtumų ar saugumo. Šias baimes sustiprino 2021 metų krizė prie Baltarusijos sienos, kai Minsko režimas sąmoningai nukreipė tūkstančius migrantų į Lietuvą. Pasienyje skubiai pastatyta tvora, o diskusijos apie migraciją tapo kur kas aštresnės.

  Ekspertai pabrėžia, kad svarbiausia – integracija. Atvykėliams reikia galimybių mokytis lietuvių kalbos, suprasti įstatymus, rasti būstą nebūdami apgauti, o jų vaikams – mokyklų, pasirengusių priimti kitakalbius. Kol kas daug kas daroma paskubomis, o didelė dalis darbo tenka nevyriausybinėms organizacijoms.

  Lietuva iš esmės renkasi, kokia šalimi ji nori būti. Šalis, kurios piliečiai patys dešimtmečiais kūrė gyvenimą svetur, gali geriau nei kas kitas suprasti, ką reiškia būti svetimam.
