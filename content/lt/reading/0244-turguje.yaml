text: |
  Šeštadienio rytą su mama einame į Halės turgų. Čia viskas šviežia ir dažnai pigiau negu prekybos centre.

  Pirmiausia perkame daržovių: du kilogramus bulvių, kelis agurkus ir tris didelius pomidorus. Paskui mama ieško gero sūrio. Ji visada perka sūrį iš tos pačios moters, kuri atvažiuoja iš kaimo. Pas ją sūris kainuoja aštuonis eurus už kilogramą.

  Aš labiausiai mėgstu vaisių eilę. Vasarą čia galima nusipirkti lietuviškų braškių ir vyšnių. Grįžtame namo su dviem sunkiais krepšiais, bet labai patenkinti.
