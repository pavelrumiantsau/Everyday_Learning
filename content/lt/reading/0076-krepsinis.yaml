title: "Antroji religija"
topic: "баскетбол в Литве"
source: generated
text: |
  Užsieniečiai mėgsta juokauti, kad Lietuvoje yra dvi religijos – katalikybė ir krepšinis. Juokas juokais, bet kai žaidžia rinktinė, gatvės ištuštėja, o barai prisipildo žmonių su geltonai, žaliai ir raudonai dryžuotais šalikais.

  Meilė krepšiniui prasidėjo dar tarpukariu. 1937 ir 1939 metais Lietuvos rinktinė tapo Europos čempione – nemažai tam prisidėjo iš Amerikos atvykę lietuvių kilmės žaidėjai. Mažai valstybei, kurios kaimynai buvo kur kas galingesni, šios pergalės turėjo ypatingą simbolinę reikšmę.

  Sovietmečiu krepšinis tapo savotiška tautinio pasipriešinimo forma. Kauno „Žalgirio“ pergalės prieš Maskvos CSKA devintajame dešimtmetyje buvo išgyvenamos kaip daugiau nei sportas: tai buvo mažos tautos pergalė prieš imperijos centrą. Arvydas Sabonis, Šarūnas Marčiulionis ir kiti tos kartos žaidėjai tapo tikrais didvyriais.

  Simboliškiausia akimirka – 1992 metų Barselonos olimpinės žaidynės. Ką tik nepriklausomybę atkūrusios valstybės rinktinei trūko net pinigų kelionei, tačiau jai padėjo amerikiečių roko grupė „Grateful Dead“. Lietuviai iškovojo bronzos medalius, kovoje dėl jų įveikę buvusius sovietinės rinktinės draugus, o ryškiaspalviai marškinėliai su šokinėjančiu skeletu tapo legenda.

  Šiandien krepšinis Lietuvoje – ir verslas, ir pramoga, ir tapatybės dalis. Vis dėlto kai kurie sporto specialistai kritikuoja, kad vienos šakos populiarumas nustelbia kitas, o lėšos dažnai atitenka profesionalams, užuot skatinus visų vaikų fizinį aktyvumą. Bet kol kone kiekviename kieme kabo krepšys, sunku tikėtis, kad ši aistra kada nors atvės.
