id: lt-r-0007
cefr: B1
title: Turguje
topic: рынок
source: generated
text: |
  Šeštadienio rytą aš dažnai einu į Halės turgų. Ten visada daug žmonių, bet man patinka jo triukšmas ir kvapai. Daržovės ir vaisiai turguje šviežesni nei parduotuvėje, o kainos dažnai panašios.

  Pirmiausia visada einu prie vienos ūkininkės, iš kurios jau seniai perku bulves ir morkas. Ji mane pažįsta ir kaskart paklausia, kaip man sekasi. Šį šeštadienį paprašiau dviejų kilogramų bulvių ir kilogramo svogūnų. „Iš viso keturi eurai“, – pasakė ji ir dar padovanojo man krapų.

  Paskui sustojau prie prekystalio su obuoliais. Pardavėjas pasiūlė paragauti. Obuoliai buvo saldūs ir traškūs, bet kaina man pasirodė per didelė. „Gal galėtumėte truputį nuleisti kainą?“ – paklausiau. Jis nusišypsojo ir sutiko parduoti tris kilogramus už penkis eurus.

  Grįždamas namo užsukau į nedidelę kepyklą ir nusipirkau šviežios juodos duonos. Turguje praleidau beveik dvi valandas, bet visai nepavargau. Man tai – geriausia savaitgalio pradžia. Jei turėčiau daugiau laiko, į turgų eičiau ir darbo dienomis.
