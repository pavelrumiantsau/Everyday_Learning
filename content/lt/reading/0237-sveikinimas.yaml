text: |
  Mieloji Rasa,

  sveikinu Tave su gimtadieniu! Linkiu Tau daug sveikatos, laimės ir meilės. Tegul visi Tavo norai išsipildo!

  Ačiū, kad visada esi šalia, kai man reikia pagalbos. Esi geriausia draugė, kokią tik galima turėti.

  Iki susitikimo šeštadienį!

  Apkabinu,
  Tavo Jurga
