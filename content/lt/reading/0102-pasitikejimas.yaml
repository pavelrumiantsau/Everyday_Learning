id: lt-r-0102
cefr: C1
title: "Kyšis, pažintys ir pasitikėjimas"
topic: "коррупция и доверие к институтам"
source: generated
text: |
  Apklausos kasmet rodo panašų vaizdą: lietuviai labiausiai pasitiki ugniagesiais, kariuomene ir gelbėtojais, o mažiausiai – Seimu ir politinėmis partijomis. Toks nepasitikėjimas turi gilias šaknis. Sovietmečiu valdžia buvo svetima ir priešiška, o kyšis gydytojui ar valdininkui – įprastas būdas ką nors pasiekti.

  Po nepriklausomybės atkūrimo padėtis pamažu gerėjo. Daugybė paslaugų perkelta į internetą, todėl sumažėjo progų duoti kyšį: deklaraciją galima pateikti ar dokumentus užsisakyti nebendraujant su valdininku. Tarptautiniuose korupcijos suvokimo indeksuose Lietuva per pastaruosius dešimtmečius gerokai pakilo.

  Vis dėlto skandalai nedingsta. 2019 metais visuomenę sukrėtė vadinamasis čekiukų skandalas: paaiškėjo, kad dalis savivaldybių tarybų narių išlaidų kompensavimui pateikdavo abejotinus čekius. Nors daugelis sumų buvo nedidelės, žala pasitikėjimui buvo didžiulė.

  Ekspertai pabrėžia, kad korupcija – ne tik dideli kyšiai. Tai ir pažintys, kai darbas gaunamas per draugus, ir mažos dovanėlės, kurias daugelis laiko mandagumo ženklu. Kol visuomenė tokius dalykus toleruoja, vieni įstatymai pakeisti gali nedaug.

  Pasitikėjimas institucijomis kuriamas lėtai, o prarandamas akimirksniu. Todėl kiekvienas skaidrus sprendimas, net ir mažas, yra investicija į ateitį – ne tik politikų, bet ir mūsų visų.
