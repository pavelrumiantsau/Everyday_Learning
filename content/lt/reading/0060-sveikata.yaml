id: lt-r-0060
cefr: C1
title: "Gyventi ilgiau – bet kaip?"
topic: "здоровье и образ жизни"
source: generated
text: |
  Lietuviai gyvena ilgiau nei prieš kelis dešimtmečius, tačiau vidutinė tikėtina gyvenimo trukmė vis dar viena mažiausių Europos Sąjungoje. Dar labiau stebina kitas skaičius: vyrai vidutiniškai gyvena maždaug dešimčia metų trumpiau nei moterys – toks skirtumas yra vienas didžiausių Europoje.

  Priežasčių ieškoma ne tik ligoninėse. Gydytojai pabrėžia, kad didelę dalį ankstyvų mirčių lemia gyvensena: rūkymas, nesveika mityba, per mažas fizinis aktyvumas ir, žinoma, alkoholis. Dar prieš dešimtmetį pagal suvartojamo alkoholio kiekį Lietuva buvo tarp pirmaujančių pasaulyje.

  Tuomet valstybė ėmėsi griežtų priemonių. Uždrausta alkoholio reklama, sutrumpintas prekybos laikas, o amžius, nuo kurio galima jo įsigyti, padidintas iki dvidešimties metų. Sprendimai sukėlė audringų diskusijų: verslas skundėsi nuostoliais, dalis visuomenės piktinosi, kad valstybė elgiasi su suaugusiais kaip su vaikais. Vis dėlto statistika rodo, kad suvartojimas sumažėjo, o kartu sumažėjo ir su alkoholiu susijusių mirčių.

  Kita vertus, draudimai sprendžia tik dalį problemos. Daugelis žmonių vis dar kreipiasi į gydytoją tik tada, kai skauda, o profilaktinių patikrų vengia – iš įpročio, baimės ar dėl laiko stokos. Valstybė apmoka kelias ligų prevencijos programas, bet jomis pasinaudoja toli gražu ne visi, kam jos skirtos.

  Pastaraisiais metais pastebimas ir priešingas reiškinys. Miestuose daugėja bėgimo klubų, maratonų dalyvių, sporto salių, o sveika gyvensena jaunimui tampa savotišku statuso ženklu. Tiesa, kritikai pastebi, kad tai labiau išsilavinusių ir pasiturinčių žmonių mada, o didžiausia rizika vis dar tenka tiems, kurie neturi nei laiko, nei pinigų rūpintis savimi.

  Todėl, specialistų teigimu, sveikata – ne vien asmeninis pasirinkimas. Ji priklauso ir nuo to, ar žmogus turi galimybę sveikai maitintis, saugiai judėti po miestą, laiku patekti pas gydytoją. Kitaip tariant, tai ir socialinės lygybės klausimas.
