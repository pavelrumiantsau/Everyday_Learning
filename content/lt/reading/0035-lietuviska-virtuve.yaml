id: lt-r-0035
cefr: B2
title: "Nuo cepelinų iki naujosios virtuvės"
topic: "литовская кухня: традиции и новое"
source: generated
text: |
  Paklausus užsieniečio, ką jis žino apie lietuvišką virtuvę, dažniausiai išgirsite vieną žodį – cepelinai. Šie dideli bulvių tešlos kukuliai su mėsos įdaru, patiekiami su spirgučiais ir grietine, iš tiesų yra vienas žinomiausių patiekalų. Tačiau lietuvių virtuvė kur kas įvairesnė.

  Bulvės į Lietuvą atkeliavo tik XVIII amžiuje, bet greitai tapo pagrindiniu maistu. Iš jų gaminamas ir bulvių plokštainis – kugelis, ir bulviniai blynai, ir vėdarai. Vasarą populiariausia – ryškiai rožinė šaltibarščių sriuba iš burokėlių, kefyro ir agurkų, dažniausiai valgoma su karštomis bulvėmis. Senesni patiekalai primena laikus, kai valgyta tai, kas užauginta savame ūkyje: ruginė duona, grybai, uogos, medus, rūkyta mėsa.

  Per pastaruosius dešimtmečius Lietuvos restoranuose daug kas pasikeitė. Jauni virėjai atranda senus receptus ir juos perkuria: vietoj riebių padažų – lengvesni, vietoj didelių porcijų – nedideli, bet išradingi patiekalai. Vis dažniau naudojami vietiniai, sezoniniai produktai – laukinės žolelės, žuvis iš Baltijos jūros ar ežerų, ūkininkų sūriai.

  Kai kurie vyresni žmonės į tokias naujoves žiūri skeptiškai: jų nuomone, tikri cepelinai turi būti tokie, kokius virdavo močiutė. Tuo tarpu jaunimas mielai ragauja ir tradicinių, ir naujų patiekalų, o savaitgaliais noriai lankosi ūkininkų turguose.

  Ypatinga vieta lietuvių stalo tradicijose tenka šakočiui. Šis aukštas pyragas su daugybe „šakų“ kepamas ant iešmo prie atviros ugnies, sluoksnis po sluoksnio. Šakotis dažniausiai puošia vestuvių ir kitų didelių švenčių stalus, o užsieniečiai jį dažnai parsiveža kaip suvenyrą.

  Valgis Lietuvoje – ne tik maistas, bet ir bendravimo proga. Per šventes stalai lūžta nuo patiekalų, o svečiui dažnai siūloma „dar truputį“ – net jei jis jau sotus. Taigi, jeigu būsite pakviesti į lietuvių namus, geriau ateikite alkani.
