text: |
  Klaipėda – vienintelis Lietuvos jūrų uostas ir kartu miestas, kurio istorija smarkiai skiriasi nuo likusios šalies. Beveik septynis šimtmečius jis vadinosi Memeliu ir priklausė vokiškam pasauliui: XIII amžiuje čia pilį pastatė Livonijos ordinas, vėliau miestas tapo Prūsijos, o nuo 1871 metų – Vokietijos imperijos dalimi.

  Kartu tai buvo Mažosios Lietuvos dalis – krašto, kuriame gyveno ir lietuviškai kalbančių gyventojų. Būtent Prūsijoje buvo išspausdinta pirmoji lietuviška knyga, o Kristijonas Donelaitis parašė „Metus“ – pirmąją lietuvių grožinės literatūros poemą. Spaudos draudimo metais Mažojoje Lietuvoje spausdintos knygos slapta keliaudavo per sieną.

  1923 metais, pasinaudojus po Pirmojo pasaulinio karo susidariusia tarptautine painiava, Klaipėdos kraštas buvo prijungtas prie Lietuvos. Tačiau 1939 metų kovą nacistinė Vokietija privertė Lietuvą jį atiduoti. Po Antrojo pasaulinio karo dauguma vokiečių pabėgo ar buvo iškeldinti, o miestą apgyvendino atvykėliai iš Lietuvos ir kitų Sovietų Sąjungos respublikų.

  Dėl to Klaipėda iki šiol jaučiasi kitokia. Senamiestyje išlikę fachverkiniai namai primena vokišką praeitį, Teatro aikštėje stovi Taravos Anikės skulptūra, sukurta pagal čia gimusio poeto Simono Dacho eilėraštį, o gatvėse girdėti daugiau rusų kalbos nei daugelyje kitų Lietuvos miestų.

  Ilgą laiką šis daugiasluoksnis paveldas buvo nutylimas: sovietmečiu vokiška praeitis buvo nepageidaujama, o po nepriklausomybės – nepatogi. Šiandien klaipėdiečiai vis drąsiau pripažįsta ją savo istorijos dalimi. Galbūt miesto tapatybė ir slypi šioje įvairovėje – kaip uosto, į kurį visada plaukdavo laivai iš skirtingų kraštų.
