text: |
  Šeštadienis. Rasa ir Eglė sėdi kavinėje. Eglė labai nori valgyti, o Rasa nori tik gerti.

  – Laba diena! Ką jums? – klausia padavėjas.
  – Norėčiau sriubos ir arbatos, – sako Eglė.
  – O aš norėčiau kavos su pienu, – sako Rasa.

  Sriuba labai skani, o kava karšta. Po valandos Eglė sako:
  – Prašau sąskaitos.

  Pietūs kainuoja dvylika eurų. Rasa moka kortele.
