title: "Vilniaus senamiestis"
topic: "Старый город Вильнюса"
source: generated
text: |
  Vilniaus senamiestis – vienas didžiausių išlikusių senamiesčių Rytų ir Vidurio Europoje. 1994 metais jis buvo įtrauktas į UNESCO pasaulio paveldo sąrašą. Siauros gatvelės, jaukūs kiemeliai ir dešimtys bažnyčių primena, kad šis miestas šimtmečius buvo daugelio kultūrų ir religijų susitikimo vieta.

  Vilniaus istorija prasidėjo ant kalvos, kur ir šiandien stovi Gedimino pilies bokštas. Pasak legendos, kunigaikštis Gediminas susapnavo geležinį vilką, kuris staugė ant kalno. Žynys sapną išaiškino taip: čia turi būti įkurtas miestas, apie kurį sklis garsas po visą pasaulį. Nuo tada geležinis vilkas tapo vienu Vilniaus simbolių.

  Senamiestyje galima pamatyti įvairių architektūros stilių – gotikos, renesanso, klasicizmo, tačiau labiausiai Vilnius garsėja baroku. Šv. Onos bažnyčia, sukurta iš raudonų plytų, atrodo tarsi nėriniai, o baroko bažnyčių bokštai matomi iš beveik bet kurios miesto vietos. Aušros vartuose saugomas stebuklingu laikomas Dievo Motinos paveikslas, prie kurio meldžiasi ir katalikai, ir stačiatikiai.

  Senamiestis – ne tik muziejus po atviru dangumi. Čia gyvena žmonės, veikia kavinės, galerijos, universitetas. Vilniaus universitetas, įkurtas 1579 metais, yra vienas seniausių Vidurio ir Rytų Europoje. Jo kiemeliuose ir šiandien vyksta paskaitos, o turistai stebisi senovinėmis freskomis.

  Šalia senamiesčio įsikūręs Užupis – buvęs apleistas kvartalas, kurį menininkai pavertė savotiška „respublika“ su savo konstitucija. Joje, be kita ko, parašyta, kad kiekvienas turi teisę būti laimingas, o kartais – ir nelaimingas.

  Vis dėlto senamiestis turi problemų. Dėl augančių nuomos kainų ir trumpalaikės nuomos turistams dalis gyventojų išsikelia, o kai kurios gatvės vakare tampa tuščios. Todėl miesto valdžia ieško būdų, kaip išsaugoti gyvą senamiestį, o ne tik gražias dekoracijas turistų nuotraukoms.
