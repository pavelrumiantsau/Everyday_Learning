title: "Mano metų laikai"
topic: "времена года"
source: generated
text: |
  Aš mėgstu rudenį. Rugsėjį ir spalį Lietuvoje dar šilta, o medžiai geltoni ir raudoni. Savaitgalį mes einame į mišką grybauti. Lapkritį dažnai lyja, dienos trumpos, bet man patinka vakare sėdėti namie ir skaityti.

  Mano vyras mėgsta žiemą. Gruodį ir sausį sninga, ir jis slidinėja. Jo gimtadienis sausio penktą dieną, todėl žiema jam – šventė.

  Vasarą mes važiuojame prie jūros. Liepą ir rugpjūtį ten karšta, o vanduo šiltas.
