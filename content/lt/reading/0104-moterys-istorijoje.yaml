title: "Pusė istorijos"
topic: "женщины в истории Литвы"
source: generated
text: |
  Mokykliniuose vadovėliuose Lietuvos istorija ilgai buvo pasakojama kaip kunigaikščių, karvedžių ir politikų istorija. Moterys juose pasirodydavo nebent kaip žmonos ar motinos: Birutė – kaip Kęstučio žmona ir Vytauto motina, Barbora Radvilaitė – kaip tragiškos meilės istorijos herojė. Tokiame pasakojime moteris tarsi stovi šalia istorijos, o ne ją kuria.

  Tačiau, įdėmiau pažvelgus, vaizdas pasirodo kur kas sudėtingesnis. Spaudos draudimo metais būtent motinos, sėdėdamos prie verpimo ratelio, dažnai mokydavo vaikus skaityti iš draudžiamų lietuviškų knygų. Žemaitė, pradėjusi rašyti jau būdama brandaus amžiaus, savo apsakymuose negailestingai atskleidė kaimo moters dalią. Rašytoja ir visuomenininkė Gabrielė Petkevičaitė-Bitė, būdama vyriausia Steigiamojo Seimo narė, pirmininkavo pirmajam jo posėdžiui.

  Verta priminti, kad Lietuvos moterys balsavimo teisę gavo vos atkūrus valstybę ir jau 1920 metais rinko Steigiamąjį Seimą – kur kas anksčiau nei, pavyzdžiui, prancūzės ar šveicarės. Vis dėlto formali lygybė ne visada virsdavo tikra: tarpukariu politikoje moterų buvo vos kelios, o sovietmečiu deklaruota lygybė dažniausiai reiškė, kad moteris turėjo dirbti ir gamykloje, ir namie.

  Šiandien moteris prezidentė ar premjerė Lietuvoje jau niekam nebekelia nuostabos. Tačiau istorikai vis dar atranda pamirštų vardų – gydytojų, mokytojų, partizanų ryšininkių, moterų, per Holokaustą gelbėjusių žydus. Jų biografijų sugrąžinimas į bendrą pasakojimą – ne madingas politinio korektiškumo gestas, o paprasčiausias teisingumas. Istorija, kurioje nematyti pusės visuomenės, yra ne neutrali, o tiesiog neišsami.
