title: "Dvidešimt metų Europos Sąjungoje"
topic: "Литва в Евросоюзе"
source: generated
text: |
  2003 metų referendume už narystę Europos Sąjungoje balsavo daugiau nei devyniasdešimt procentų jame dalyvavusių Lietuvos piliečių, o 2004 metų gegužės 1-ąją šalis tapo visateise Bendrijos nare. Po kelerių metų, prisijungus prie Šengeno erdvės, išnyko ir pasų patikra kelionėse po didžiąją Europos dalį.

  Per du dešimtmečius pokyčiai tapo tokie įprasti, kad jų beveik nebepastebime. Europos lėšomis nutiesti keliai, renovuotos mokyklos ir ligoninės, pastatyti vandenvalos įrenginiai. Studentai išvažiuoja mokytis pagal mainų programas, ūkininkai gauna išmokas, o įmonės be muitų parduoda savo produkciją didžiulėje rinkoje.

  Narystė suteikė ir galimybę daryti įtaką. 2013 metų antrąjį pusmetį Lietuva pirmininkavo Europos Sąjungos Tarybai. Tuomet Vilniuje vyko Rytų partnerystės susitikimas, kuriame Ukraina turėjo pasirašyti asociacijos sutartį. Prezidentui Viktorui Janukovyčiui jos atsisakius, Kijeve kilo protestai, vėliau pavadinti Euromaidanu, – įvykiai, pakeitę viso regiono istoriją.

  Vis dėlto narystė turi ir kitą pusę. Atsivėrus darbo rinkoms, šimtai tūkstančių žmonių išvyko uždarbiauti į Vakarus. Dalis visuomenės skundžiasi, kad sprendimai priimami toli Briuselyje, o vietos ypatumai neretai ignoruojami. Euroskeptikų balsai Lietuvoje palyginti tylūs, bet jie skamba.

  Šiandien daugeliui jaunų lietuvių sunku įsivaizduoti gyvenimą be laisvo judėjimo ir bendros valiutos. Jiems Europa – ne tolima svajonė, o kasdienybė. Galbūt kaip tik tai ir yra geriausias įrodymas, kad prieš dvidešimt metų priimtas sprendimas buvo teisingas.
