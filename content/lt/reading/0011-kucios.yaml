id: lt-r-0011
cefr: B1
title: Kūčios
topic: Сочельник (Кучюс) в литовской семье
source: generated
text: |
  Kūčios – vakaras prieš Kalėdas – yra viena svarbiausių metų švenčių Lietuvoje. Tą vakarą visa šeima susirenka prie bendro stalo. Mano močiutė kasmet pradeda ruoštis iš anksto: ji tvarko namus, perka produktus ir kepa kūčiukus.

  Ant Kūčių stalo turi būti dvylika patiekalų. Mėsos tą vakarą nevalgome, todėl patiekalai gaminami iš žuvies, grybų ir daržovių. Dažniausiai ant stalo būna silkė, grybai, spanguolių kisielius ir, žinoma, kūčiukai su aguonų pienu. Kūčiukai – tai maži sausainėliai, o aguonų pienas gaminamas iš sumaltų aguonų, vandens ir medaus.

  Po staltiese močiutė visada pakloja šiek tiek šieno. Jis primena, kad Jėzus gimė tvarte. Prie stalo paliekame vieną tuščią vietą su lėkšte – ji skirta artimiesiems, kurių jau nėra tarp mūsų. Vakarienę pradedame, kai danguje pasirodo pirmoji žvaigždė. Prieš valgį visi dalijasi kalėdaičiais ir linki vieni kitiems sveikatos.

  Man Kūčios – ramiausias metų vakaras. Niekas neskuba, niekas nežiūri televizoriaus, visi kalbasi ir prisimena senus laikus. Vaikystėje laukdavau ne tiek dovanų, kiek močiutės kūčiukų. Dabar pagal jos receptą kūčiukus kepu ir aš.
