text: |
  – Labas, Jonai! Ką veiki savaitgalį?
  – Šeštadienį žaidžiu krepšinį su draugais. O ką?
  – Sekmadienį einu į kiną. Rodo naują lietuvišką filmą. Gal nori kartu?
  – Su malonumu! Man labai patinka lietuviški filmai. Kada?
  – Filmas prasideda septintą valandą vakaro. Susitinkame prie kino teatro šeštą trisdešimt?
  – Gerai! Po filmo galime eiti į kavinę.
  – Puiki mintis! Iki sekmadienio!
