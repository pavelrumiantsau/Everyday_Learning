title: "Daugiau nei garai"
topic: "банная культура"
source: generated
text: |
  Lietuviui pirtis – ne vien vieta nusiprausti. Tai ritualas, susitikimas su draugais, kartais net savotiška terapija. Kaimo sodybose pirtys dažnai statomos prie ežero ar upės, kad po karščio būtų galima šokti į šaltą vandenį, o žiemą – išsivolioti sniege.

  Pirties tradicija Lietuvoje labai sena. Seniau ji buvo laikoma švaria, beveik šventa vieta: čia neretai gimdydavo moterys, gydydavo ligonius, o prieš dideles šventes visa šeima eidavo išsiperti. Pirtyje nederėdavo keiktis ar kalbėti apie blogus dalykus.

  Svarbiausias pirties įrankis – vanta, surišta iš beržo, ąžuolo ar liepos šakų. Ja plakamasi, kad pagerėtų kraujotaka, o lapų kvapas primena vasarą net vidury žiemos. Pastaraisiais metais atgimė ir pirties ceremonijos: specialiai apmokyti pirtininkai, naudodami žolelių arbatas, eterinius aliejus ir garų bangas, veda kelių valandų procedūras, primenančias meditaciją.

  Kai kurie į šią madą žiūri skeptiškai. Anot jų, paprasta senelių pirtis virto brangiu verslu su turistams sugalvotais ritualais. Kiti atsako, kad tradicija gyva tik tada, kai keičiasi, – juk ir mūsų protėviai pirtį kūrė pagal savo meto poreikius.

  Gydytojai primena saiką. Nors pirtis gali padėti atsipalaiduoti, žmonėms, sergantiems širdies ligomis, ji gali būti pavojinga. O alkoholis ir pirtis – itin bloga kombinacija, nors būtent šis derinys, deja, kai kurių vis dar laikomas tikra lietuviška tradicija.
