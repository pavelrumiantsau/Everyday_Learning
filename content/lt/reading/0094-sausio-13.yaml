title: "Naktis prie televizijos bokšto"
topic: "события 13 января 1991 года"
source: generated
text: |
  1991 metų sausio 13-osios naktį sovietų kariuomenės tankai ir desantininkai šturmavo Vilniaus televizijos bokštą bei Radijo ir televizijos komitetą. Prie jų budėjo tūkstančiai beginklių žmonių, kurie susikibę rankomis bandė apginti nepriklausomybę, paskelbtą vos prieš kelis mėnesius. Tą naktį žuvo keturiolika civilių, šimtai buvo sužeisti.

  Smurtas nepasiekė tikslo. Žinia apie įvykius per kelias valandas apskriejo pasaulį, o prie Aukščiausiosios Tarybos rūmų susirinko dešimtys tūkstančių žmonių, pasiryžusių ginti parlamentą. Aplink pastatą iškilo barikados iš betono blokų, sunkvežimių ir smėlio maišų. Žmonės ištisas naktis budėjo prie laužų, giedojo, meldėsi ir nesiskirstė. Šturmas taip ir neįvyko.

  Sausio įvykiai tapo lūžio tašku. Vakarų šalys, iki tol atsargiai vertinusios Lietuvos siekius, ėmė garsiau smerkti Maskvą, o po kelių savaičių Islandija pirmoji pripažino Lietuvos nepriklausomybę. Sovietų valdžiai neliko jokių moralinių argumentų.

  Teisingumo teko laukti ilgai. Tik 2019 metais Lietuvos teismas už sausio įvykius nuteisė kelias dešimtis buvusių sovietų pareigūnų ir kariškių, tačiau dauguma jų teisti už akių ir bausmių taip ir neatliko.

  Kasmet sausio 13-ąją languose dega žvakės, o žmonės prisega neužmirštuolės ženkliuką – mažą mėlyną gėlelę, tapusią atminimo simboliu. Ji primena paprastą, bet nepatogią tiesą: laisvė, kuri šiandien atrodo savaime suprantama, kadaise buvo apginta plikomis rankomis.
