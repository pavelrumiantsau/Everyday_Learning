questions:
  - q: "Kokią dalį Lietuvos gyventojų sudaro vyresni nei 65 metų žmonės?"
    options: ["Maždaug kas dešimtas", "Maždaug kas penktas", "Maždaug pusė"]
    answer: 1
  - q: "Su kokiomis problemomis susiduria kaimuose gyvenantys senjorai?"
    options: ["Jiems sunku nuvykti pas gydytoją ir su kuo nors pabendrauti", "Jie negauna pensijos", "Jiems draudžiama dirbti"]
    answer: 0
  - q: "Kaip, pasak teksto, keičiasi darbdavių požiūris?"
    options: ["Jie nenori samdyti vyresnių žmonių", "Jie reikalauja, kad visi anksčiau išeitų į pensiją", "Jie supranta, kad vyresni darbuotojai yra patirties šaltinis"]
    answer: 2
