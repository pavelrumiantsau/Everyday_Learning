id: lt-r-0022
cefr: B2
title: Senėjanti visuomenė
topic: стареющее общество
source: generated
text: |
  Lietuva, kaip ir dauguma Europos šalių, sparčiai sensta. Maždaug kas penktas šalies gyventojas jau yra vyresnis nei 65 metų, o gimstamumas per pastarąjį dešimtmetį sumažėjo. Demografai perspėja, kad po kelių dešimtmečių dirbančiųjų gali nebeužtekti, kad būtų išlaikyta pensijų sistema.

  Senėjimas keičia ne tik ekonomiką, bet ir kasdienį gyvenimą. Vis daugiau senjorų gyvena vieni, ypač kaimuose, iš kurių jaunimas seniai išvažiavęs. Jiems sunku nuvykti pas gydytoją, nusipirkti vaistų ar tiesiog su kuo nors pasikalbėti. Savivaldybės ir savanoriai stengiasi padėti: organizuojamas maisto pristatymas, veikia pagalbos telefonu linijos, kuriose savanoriai kalbasi su vienišais žmonėmis.

  Didelė našta tenka ir šeimoms. Neretai vidutinio amžiaus žmonės vienu metu rūpinasi ir savo vaikais, ir sergančiais tėvais, todėl jiems pritrūksta ne tik laiko, bet ir jėgų. Globos namuose vietų nepakanka, o slaugytojų, galinčių ateiti į namus, trūksta ypač mažesniuose miestuose. Todėl vis garsiau kalbama, kad valstybė turėtų daugiau investuoti į pagalbą namuose.

  Kita vertus, šiuolaikiniai senjorai nebėra tokie, kokius juos įsivaizdavome anksčiau. Daugelis jų aktyviai keliauja, lanko trečiojo amžiaus universitetus, mokosi naudotis išmaniaisiais telefonais ir net dirba ilgiau, nei reikalauja įstatymas. Darbdaviai pamažu supranta, kad vyresnio amžiaus darbuotojai – ne našta, o patirties šaltinis.

  Ekspertų teigimu, visuomenė turėtų kuo greičiau prisitaikyti prie šių pokyčių. Reikia daugiau prieinamų viešųjų erdvių, patogesnio transporto ir lankstesnių darbo sąlygų. Galbūt svarbiausia – keisti požiūrį: senatvė neturėtų būti laikoma vien problema. Juk kiekvienas iš mūsų kada nors taps senjoru, todėl kurdami draugiškesnę aplinką jiems, kuriame ją ir sau.
