title: "Kai buvau vaikas"
topic: "детские воспоминания"
source: generated
text: |
  Kai buvau vaikas, kiekvieną vasarą važiuodavau pas senelius į kaimą. Senelis keldavosi labai anksti ir eidavo į lauką dirbti. Senelė kepdavo duoną ir virdavo skanias sriubas.

  Aš su broliu žaisdavau kieme, o vakare eidavome maudytis į upę. Kartais senelis pasiimdavo mus žvejoti. Televizoriaus seneliai neturėjo, todėl vakarais skaitydavome knygas arba klausydavomės senelės pasakų.

  Dabar seneliai jau seniai negyvena kaime, bet aš dažnai prisimenu tas vasaras.
