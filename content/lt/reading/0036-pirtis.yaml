id: lt-r-0036
cefr: B2
title: "Pirties tradicija"
topic: "баня (пирт)"
source: generated
text: |
  Daugelyje Lietuvos sodybų šalia gyvenamojo namo stovi nedidelis medinis pastatas – pirtis. Senovėje pirtis buvo ne tik vieta nusiprausti. Joje gimdydavo moterys, gydydavo ligonius, džiovindavo linus ir net rinkdavosi pasikalbėti. Neatsitiktinai sakoma, kad pirtis – tai lietuvio vaistinė.

  Tikra pirtis kūrenama malkomis. Kai krosnis įkaista, ant įkaitusių akmenų pilamas vanduo, ir patalpą užpildo karšti garai. Pirtininkai naudoja vantas – beržo, ąžuolo ar liepos šakelių ryšulius, kuriais švelniai plakamas kūnas. Tikima, kad taip gerėja kraujotaka, o kūnas atsikrato įtampos. Po karštos pirties būtina atvėsti: vasarą šokama į ežerą ar tvenkinį, o žiemą – tiesiog į sniegą.

  Pirties kultūra šiandien išgyvena tikrą atgimimą. Atsirado pirties meistrų, kurie rengia ypatingas ceremonijas su žolelių arbatomis, eteriniais aliejais ir net muzika. Jie tvirtina, kad pirtis padeda ne tik kūnui, bet ir sielai: telefonas lieka už durų, o žmogus pagaliau turi laiko pabūti su savimi ir artimaisiais.

  Vis dėlto gydytojai primena, kad pirtis tinka ne kiekvienam. Žmonėms, sergantiems širdies ligomis ar turintiems aukštą kraujospūdį, reikėtų pasitarti su gydytoju. Taip pat nereikėtų eiti į pirtį išgėrus alkoholio ar iškart po sočių pietų.

  Pirties tradicijas turi ir kaimyninės šalys – suomiai garsėja sauna, rusai – bania. Lietuviška pirtis nuo jų skiriasi nedaug, tačiau pirtininkai pabrėžia savitą ritualą: čia svarbu ne kuo didesnis karštis, o lėtas, ramus buvimas, vantos kvapas ir pokalbiai tarp kaitinimosi.

  Nors šiuolaikiniuose butuose tikros pirties neįsirengsi, daugelis miestiečių jos pasiilgsta. Todėl savaitgaliais jie važiuoja į kaimą pas gimines arba nuomojasi sodybas su pirtimis. Juk pasikaitinus, atvėsus ežere ir susėdus prie arbatos puodelio, sunku rasti geresnį poilsį.
