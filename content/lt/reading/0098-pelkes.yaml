id: lt-r-0098
cefr: C1
title: "Leisti vandeniui sugrįžti"
topic: "болота и осушение"
source: generated
text: |
  Dar prieš šimtmetį pelkės, šlapžemės ir užliejamos pievos dengė gerokai didesnę Lietuvos dalį nei šiandien. Sovietmečiu jos buvo laikomos nenaudinga žeme, kurią reikia „sutvarkyti“. Prasidėjo plataus masto melioracija: iškasti tūkstančiai kilometrų griovių, ištiesintos upelių vagos, o pelkės nusausintos ir paverstos dirbamais laukais.

  Tik vėliau paaiškėjo, kiek daug kainavo šis sutvarkymas. Pelkės veikia kaip milžiniška kempinė: per liūtis sulaiko vandenį, o sausros metu jį atiduoda. Be to, durpėse sukaupti didžiuliai anglies kiekiai. Nusausintos pelkės ima irti ir išskirti anglies dvideginį, todėl iš klimato sąjungininkių virsta taršos šaltiniu.

  Laimei, Lietuvoje išliko ir nepaliestų pelkių. Čepkelių rezervatas pietų Lietuvoje – viena didžiausių pelkių šalyje, kurioje gyvena retos paukščių ir augalų rūšys. Rudenį čia sustoja tūkstančiai migruojančių gervių.

  Pastaraisiais metais gamtininkai ėmėsi pelkių atkūrimo projektų: užtveria melioracijos griovius, kad vanduo sugrįžtų į nusausintas teritorijas. Tačiau toks darbas kelia ginčų su žemės savininkais ir ūkininkais, kurie baiminasi prarasti dirbamą žemę ar pajamas.

  Pelkių istorija – tai pamoka apie žmogaus santykį su gamta. Tai, kas vienai kartai atrodė nereikalinga, kitai gali tapti neįkainojama. Ir kartais protingiausia, ką galime padaryti, – tiesiog leisti vandeniui sugrįžti.
