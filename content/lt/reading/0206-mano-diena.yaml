topic: "мой день"
source: generated
text: |
  Mano vardas Jonas. Aš dirbu banke. Mano diena prasideda anksti. Ryte, septintą valandą, aš geriu kavą ir valgau pusryčius. Aštuntą valandą einu į darbą. Darbas prasideda devintą ir baigiasi penktą valandą.

  Vakare aš esu namie. Aš žiūriu televizorių arba skaitau knygą. Pirmadienį ir trečiadienį vakare mokausi anglų kalbos.

  Šeštadienį ir sekmadienį aš nedirbu. Miegu ilgai, o paskui einu į parką.
