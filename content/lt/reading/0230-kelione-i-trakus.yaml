title: "Kelionė į Trakus"
topic: "поездка в Тракай"
source: generated
text: |
  Praeitą savaitgalį mes su draugais važiavome į Trakus. Trakai yra mažesni už Vilnių, bet labai gražūs. Čia yra daug ežerų, o didžiausias ir garsiausias – Galvės ežeras. Ant salos stovi senoji Trakų pilis.

  Diena buvo saulėta ir šilta. Mes plaukiojome valtimi, vaikščiojome aplink ežerą ir valgėme kibinus. Mano draugė sakė, kad Trakų kibinai skanesni negu Vilniuje.

  Trakai – viena gražiausių vietų Lietuvoje. Kitą vasarą būtinai važiuosime ten dar kartą.
