id: lt-r-0024
cefr: B2
title: "Būstas – svajonė ar našta?"
topic: "жильё: купить или снимать"
source: generated
text: |
  Vilniuje, Kaune ir Klaipėdoje būsto kainos per pastarąjį dešimtmetį smarkiai išaugo. Atlyginimai taip pat kilo, tačiau daugeliui jaunų žmonių nusipirkti nuosavą butą vis tiek atrodo sunkiai pasiekiamas tikslas. Norint gauti paskolą, bankas paprastai reikalauja pradinio įnašo – dažniausiai ne mažiau kaip penkiolikos procentų būsto kainos. Sukaupti tokią sumą nuomojantis butą ir mokant nemažą nuomos mokestį nėra paprasta.

  Todėl vis daugiau jaunų šeimų renkasi kitokius sprendimus. Vieni perka butus priemiesčiuose, kur kainos mažesnės, nors kasdien tenka ilgiau važiuoti į darbą. Kiti ilgiau gyvena su tėvais arba dalijasi butu su draugais. Treti apskritai atsisako minties apie nuosavą būstą ir sako, kad nuoma jiems suteikia daugiau laisvės: prireikus galima lengvai persikelti į kitą miestą ar net šalį.

  Lietuvoje tradiciškai manoma, kad nuosavas būstas yra saugumo pagrindas. Sovietmečiu butai buvo skiriami, o po nepriklausomybės atkūrimo daugelis gyventojų juos privatizavo, todėl nuosavą būstą turinčių žmonių dalis šalyje yra viena didžiausių Europoje. Vakarų Europoje, pavyzdžiui, Vokietijoje, nuomotis butą visą gyvenimą laikoma visiškai normaliu dalyku.

  Nuomininkai dažnai skundžiasi ir kitomis problemomis. Nuomos sutartys kartais sudaromos žodžiu, todėl savininkas gali bet kada pakelti kainą arba paprašyti išsikraustyti. Be to, daugelis savininkų nenori išnuomoti buto šeimoms su vaikais ar augintiniais. Teisininkai pataria visada pasirašyti rašytinę sutartį ir joje aiškiai nurodyti, kas moka už remontą ir kaip iš anksto reikia pranešti apie sutarties nutraukimą.

  Ekonomistai nesutaria, ar kainos toliau kils. Vieni tvirtina, kad statoma per mažai naujų namų, todėl paklausa ir toliau viršys pasiūlą. Kiti primena, kad padidėjus palūkanoms paskolos brangsta, o pirkėjų mažėja. Dar kiti atkreipia dėmesį į tai, kad plintant nuotoliniam darbui gyventi pačiame miesto centre nebėra būtina.

  Vienaip ar kitaip, klausimas „pirkti ar nuomotis?“ šiandien turi kur kas daugiau atsakymų nei prieš dvidešimt metų. O ką rinktumėtės jūs?
