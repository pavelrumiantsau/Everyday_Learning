id: lt-r-0063
cefr: C1
title: "Keturios dienos vietoj penkių?"
topic: "четырёхдневная рабочая неделя"
source: generated
text: |
  Penkių dienų darbo savaitė atrodo tokia natūrali, tarsi būtų egzistavusi visada. Iš tiesų ji įsitvirtino tik XX amžiuje, o anksčiau žmonės dirbdavo šešias dienas per savaitę ir gerokai daugiau valandų. Todėl kai kurie ekonomistai klausia: jei darbo laikas trumpėjo anksčiau, kodėl jis negalėtų trumpėti ir toliau?

  Pastaraisiais metais keturių dienų savaitė išbandyta keliose šalyse. Islandijoje, Didžiojoje Britanijoje ir kitur vykusiuose eksperimentuose darbuotojai dirbo mažiau valandų už tą patį atlyginimą. Daugelis įmonių pranešė, kad našumas nesumažėjo, o kai kur net išaugo: pailsėję žmonės rečiau sirgo, mažiau blaškėsi ir rečiau keitė darbą.

  Skeptikai vis dėlto atkreipia dėmesį į kelias problemas. Pirma, eksperimentuose dažniausiai dalyvavo biurų darbuotojai, kurių darbą lengviau pertvarkyti. Gydytojas, pardavėjas ar autobuso vairuotojas negali tiesiog suspausti penkių dienų darbo į keturias – tektų samdyti daugiau žmonių, o tai brangu. Antra, į eksperimentus savanoriškai jungėsi įmonės, kurios ir taip tikėjo sėkme, todėl rezultatai gali būti pernelyg optimistiški.

  Lietuvoje diskusija kol kas atsargi. Trumpesnė darbo savaitė jau taikoma kai kuriems viešojo sektoriaus darbuotojams, auginantiems mažus vaikus, o kai kurios IT įmonės savo noru siūlo laisvus penktadienius, kad pritrauktų specialistų. Tačiau darbdavių organizacijos perspėja, kad šaliai, kurioje trūksta darbo jėgos, toks sprendimas gali būti per brangus.

  Galbūt svarbiausia šios diskusijos nauda – ne konkretus dienų skaičius, o pats klausimas, ką laikome darbo rezultatu. Jei vertinamos ne prie kompiuterio praleistos valandos, o tai, kas iš tiesų nuveikta, darbas savaime tampa lankstesnis – nesvarbu, ar darbo dienų savaitėje keturios, ar penkios.
