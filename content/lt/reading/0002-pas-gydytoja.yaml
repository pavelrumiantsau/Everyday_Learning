id: lt-r-0002
cefr: B1
title: Pas gydytoją
topic: визит к врачу
source: generated
text: |
  Jau kelias dienas man skauda gerklę ir galvą. Pas gydytojus einu retai, bet šį kartą jaučiausi tikrai blogai, todėl nusprendžiau užsiregistruoti pas šeimos gydytoją. Paskambinau į polikliniką, bet šią savaitę laisvų laikų nebuvo. Tada užsiregistravau internetu – ketvirtadieniui, devintai valandai ryto.

  Gydytoja buvo jauna ir labai maloni. Ji paklausė, kiek laiko sergu ir ar turiu temperatūros. Paskui apžiūrėjo mano gerklę ir pasiklausė plaučių. Pasakė, kad tai paprastas peršalimas ir nieko pavojingo nėra. Vis dėlto ji paprašė kasdien matuoti temperatūrą.

  Gydytoja patarė daugiau ilsėtis, gerti šiltą arbatą su medumi ir kelias dienas neiti į darbą. Ji išrašė man nedarbingumo pažymėjimą penkioms dienoms. Be to, patarė vaistinėje nusipirkti vaistų nuo gerklės skausmo. Jeigu po savaitės nepagerės, turėsiu vėl ateiti.

  Grįžęs namo, iš karto atsiguliau į lovą ir parašiau vadovui, kad kelias dienas nedirbsiu. Vakare žmona išvirė vištienos sriubos, ir man jau buvo šiek tiek geriau. Juk sveikata svarbesnė už darbą.
