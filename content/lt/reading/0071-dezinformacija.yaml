id: lt-r-0071
cefr: C1
title: "Elfai prieš trolius"
topic: "дезинформация и медиаграмотность"
source: generated
text: |
  Netikra naujiena plinta greičiau nei jos paneigimas – šią tiesą šiandien žino kiekvienas žurnalistas. Socialiniai tinklai sukurti taip, kad labiausiai būtų skleidžiama tai, kas sukelia stiprias emocijas: pyktį, baimę, pasipiktinimą. Tiesa dažnai būna nuobodesnė ir sudėtingesnė, todėl lenktynes pralaimi.

  Lietuvai dezinformacija – ne abstrakti problema. Jau daugiau nei dešimtmetį šalis yra kryptingų informacinių atakų taikinys: skleidžiamos netikros žinios apie NATO karius, iškraipoma istorija, bandoma kiršinti tautines bendrijas. Kartais pakanka vienos suklastotos nuotraukos, kad per kelias valandas ji pasiektų dešimtis tūkstančių žmonių.

  Į tai atsakyta neįprastai. 2014 metais susibūrė savanoriai, pasivadinę elfais – tarsi priešprieša internetiniams troliams. Jie stebi socialinius tinklus, demaskuoja netikras paskyras ir praneša apie melagingus įrašus. Vėliau prie jų darbo prisidėjo žurnalistai, analitikai ir valstybės institucijos, o lietuvių elfų pavyzdys sulaukė dėmesio ir užsienyje.

  Vis dėlto ekspertai sutaria, kad vien demaskuoti melą nepakanka. Daug svarbiau išmokyti žmones patiems kritiškai vertinti informaciją: patikrinti šaltinį, palyginti kelias žiniasklaidos priemones, atkreipti dėmesį į datą ir kontekstą. Todėl medijų raštingumas vis dažniau įtraukiamas į mokyklų programas.

  Tačiau atsparumas manipuliacijoms – ne vien žinių klausimas. Lengviausiai melu patikime tada, kai jis patvirtina tai, ką ir taip manėme. Todėl pats sunkiausias įgūdis – suabejoti ne tik priešininkų, bet ir savo pačių įsitikinimais.
