id: lt-r-0069
cefr: C1
title: "Svečiai savo šalyje?"
topic: "язык жестов и доступность"
source: generated
text: |
  Lietuvoje gyvena keli tūkstančiai kurčiųjų, kuriems gimtoji kalba yra ne lietuvių, o lietuvių gestų kalba. Daugeliui girdinčiųjų tai netikėta: įprasta manyti, kad gestai – tik pagalbinė priemonė, kuria kurtieji „rodo“ žodžius. Iš tiesų gestų kalba turi savo gramatiką, žodyną, tarmes ir net humorą, kurio neįmanoma pažodžiui išversti.

  1995 metais Seimas pripažino lietuvių gestų kalbą gimtąja kurčiųjų kalba. Tai buvo vienas pirmųjų tokių sprendimų Europoje. Vis dėlto teisinis pripažinimas savaime nepanaikina kasdienių kliūčių. Kurčiasis, norintis apsilankyti pas gydytoją, notarą ar valstybės įstaigoje, dažnai turi iš anksto užsisakyti vertėją, o vertėjų trūksta, ypač mažesniuose miestuose. Per pandemiją atsirado ir naujų problemų: veido kaukės paslėpė lūpas, iš kurių dalis kurčiųjų yra įpratusi skaityti.

  Prieinamumas – platesnė sąvoka, apimanti ne tik kurčiuosius. Žmogui, sėdinčiam neįgaliojo vežimėlyje, kelionę gali sužlugdyti vienas laiptelis, akliesiems – interneto svetainė, kurios negali perskaityti ekrano skaitymo programa. Pastaraisiais metais atsiranda vis daugiau pandusų, garsinių šviesoforų, subtitruojamų laidų, tačiau dažnai tai daroma tik tada, kai to reikalauja įstatymas ar Europos Sąjungos lėšos.

  Neįgaliųjų organizacijos pabrėžia, kad svarbiausia keisti ne vien pandusus, o požiūrį. Kol prieinamumas laikomas malone, o ne teise, žmonės su negalia ir toliau jausis svečiais savo pačių šalyje.
