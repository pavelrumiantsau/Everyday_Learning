text: |
  Mes gyvename Kaune, naujame name. Mūsų butas nėra didelis, bet jis labai šviesus. Bute yra trys kambariai: svetainė, miegamasis ir vaikų kambarys. Virtuvė maža, bet patogi.

  Svetainėje yra didelis langas, sofa, stalas ir kėdės. Vakare mes sėdime svetainėje ir kalbame. Vaikų kambaryje yra dvi lovos, nes mes turime du vaikus.

  Mūsų kaimynai labai malonūs. Mums čia patinka.
