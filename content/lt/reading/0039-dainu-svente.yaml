cefr: B2
title: "Dainų šventė"
topic: "Праздник песни"
source: generated
text: |
  Kas kelerius metus Vilniuje susirenka dešimtys tūkstančių dainininkų, šokėjų ir muzikantų iš visos Lietuvos ir užsienio lietuvių bendruomenių. Tai Dainų šventė – viena svarbiausių tautos tradicijų. Pirmoji tokia šventė įvyko 1924 metais Kaune, o 2024 metais buvo iškilmingai paminėtas jos šimtmetis.

  Šventės tradicija būdinga visoms trims Baltijos šalims. 2003 metais UNESCO ją paskelbė žodinio ir nematerialaus žmonijos paveldo šedevru. Tai reiškia, kad pasaulis pripažįsta: šie masiniai chorai ir šokių kolektyvai yra unikalus kultūros reiškinys, kurį verta saugoti ateities kartoms.

  Pasiruošimas šventei trunka kelerius metus. Chorai ir šokių kolektyvai mokyklose, miesteliuose ir kaimuose repetuoja tas pačias dainas ir šokius, o vėliau specialios komisijos atrenka geriausius. Todėl dalyvauti šventėje – didelė garbė. Daug šeimų didžiuojasi, kad šventėje dainavo ir jų seneliai, ir tėvai, ir vaikai.

  Ypač svarbi šventės reikšmė buvo sovietmečiu. Nors programa buvo griežtai kontroliuojama, dainuojant lietuviškas dainas bendrame chore žmonės jautė, kad tauta gyva. Vėliau, Sąjūdžio laikais, dainos tapo tikru pasipriešinimo ginklu – ne be priežasties Baltijos šalių laisvės kova kartais vadinama dainuojančia revoliucija.

  Kulminacija – baigiamasis koncertas Vingio parke. Ant didžiulės estrados stovi tūkstančiai choristų tautiniais drabužiais, o tūkstančiai žiūrovų dainuoja kartu. Kai skamba gerai žinomos dainos, daugelis neslepia ašarų.

  Kritikų netrūksta: vieni sako, kad šventė per brangi, kiti – kad repertuaras per daug senamadiškas. Vis dėlto kiekvieną kartą, kai tūkstančiai balsų susilieja į vieną, atrodo, kad šis šimtmečio senumo renginys vis dar kalba šiuolaikiniams lietuviams.
