questions:
  - q: "Kodėl tarpukario Kaune architektūra buvo tokia svarbi?"
    options: ["Ji padėjo jaunai valstybei parodyti, kad ji gali būti moderni ir europietiška", "Nes Kaunas norėjo tapti turistų centru", "Nes Vilnius uždraudė statybas"]
