  - q: "Kas nutiko daugeliui pastatų sovietmečiu?"
    options: ["Jie buvo kruopščiai restauruoti", "Jie buvo pritaikyti kitoms reikmėms, o interjerai sunaikinti", "Jie buvo perkelti į Vilnių"]
    answer: 1
  - q: "Kokią problemą iškėlė UNESCO statusas?"
