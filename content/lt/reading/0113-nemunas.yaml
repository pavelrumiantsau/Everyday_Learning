id: lt-r-0113
cefr: C1
title: "Upė, kuri skiria ir jungia"
topic: "Неман"
source: generated
text: |
  Nemunas – ne tik ilgiausia Lietuvos upė, bet ir vienas svarbiausių tautos simbolių. Prasidėjęs Baltarusijoje, jis teka per visą Lietuvą, kurį laiką skiria ją nuo Kaliningrado srities, o galiausiai, išsišakojęs į deltą, įsilieja į Kuršių marias. Neatsitiktinai jis dažnai vadinamas Lietuvos upių tėvu: prie jo krantų kūrėsi gyvenvietės, o jo vandenimis keliavo prekės, žmonės ir idėjos.

  Viduramžiais Nemunas buvo ir gynybos linija. Jo slėnyje iki šiol stūkso piliakalniai, o vėlesniais amžiais ant aukštų krantų iškilo pilys ir dvarai – Raudonės, Panemunės ir kiti, šiandien traukiantys turistus. Žemupyje upė ilgai skyrė Lietuvą nuo kryžiuočių valdų, tačiau kartu ir jungė: vėliau ja vyko gyva prekyba su Prūsija ir Karaliaučiumi.

  Sovietmečiu santykis su upe tapo grynai utilitarinis. Netoli Kauno pastačius hidroelektrinę, susidarė didžiulis tvenkinys – Kauno marios, po kurių vandeniu atsidūrė ištisi kaimai. Pažanga buvo matuojama kilovatais, o prarastos sodybos ir kapinės liko tik senųjų gyventojų atmintyje.

  Šiandien Nemunas grįžta į žmonių gyvenimą kitaip – kaip poilsio vieta. Plaukiojama baidarėmis, pakrantėse rengiami festivaliai, Kaune ir kituose miestuose tvarkomos ilgai apleistos krantinės. O Nemuno deltoje pavasario potvyniai kasmet vis dar užlieja kelius, primindami, kad upė nepaklūsta žmogaus planams.

  Ko gero, Nemuno istorija atspindi, kaip keitėsi pats žmogaus santykis su gamta: nuo pagarbos ir baimės per užkariavimą iki atsargaus, dar ne visai išmokto sugyvenimo.
