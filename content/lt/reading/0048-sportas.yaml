id: lt-r-0048
cefr: B2
title: "Ne vien krepšinis"
topic: "спорт в Литве кроме баскетбола"
source: generated
text: |
  Kai užsienietis išgirsta apie Lietuvos sportą, jis dažniausiai pagalvoja apie krepšinį. Tačiau nedidelė šalis gali didžiuotis ir kitų sporto šakų čempionais, kurių vardai žinomi visame pasaulyje.

  Vienas garsiausių Lietuvos sportininkų – disko metikas Virgilijus Alekna. Jis du kartus iš eilės, 2000 ir 2004 metais, tapo olimpiniu čempionu. Sporto tradicija šeimoje nenutrūko: jo sūnus Mykolas 2024 metais pagerino disko metimo pasaulio rekordą ir tais pačiais metais Paryžiaus olimpinėse žaidynėse iškovojo sidabro medalį.

  Dar vieną nepamirštamą akimirką lietuviams padovanojo plaukikė Rūta Meilutytė. 2012 metais Londone penkiolikmetė mergina netikėtai laimėjo olimpinį auksą 100 metrų plaukimo krūtine rungtyje. Vėliau ji kuriam laikui pasitraukė iš sporto, tačiau sugrįžo ir 2023 metais vėl tapo pasaulio čempione, pagerinusi pasaulio rekordą. Jos sėkmė paskatino tūkstančius vaikų užsirašyti į plaukimo būrelius visoje Lietuvoje.

  Žinoma, krepšinis išlieka svarbiausias. Per didžiuosius turnyrus gatvės ištuštėja, o žmonės renkasi baruose ir aikštėse prie didelių ekranų. Lietuvos rinktinė yra tris kartus laimėjusi Europos čempionatą ir iškovojusi tris olimpinius bronzos medalius.

  Futbolas Lietuvoje populiarus, bet šalies rinktinė dar nė karto nepateko į pasaulio ar Europos čempionato finalinį turnyrą. Dėl to sirgaliai kartais juokauja, kad lietuviai tiesiog per aukšti futbolui ir per daug mėgsta, kai kamuolys skrenda į krepšį.

  Pastaraisiais metais sparčiai populiarėja bėgimas. Kiekvieną rudenį Vilniaus maratone dalyvauja tūkstančiai bėgikų, o daugelyje miestų vyksta mažesni bėgimai, kuriuose bėga ir vaikai, ir senjorai. Mėgėjai vis dažniau renkasi dviračius, plaukimą ar triatloną, o sporto klubai po darbo būna perpildyti.

  Sporto psichologai sako, kad nedidelei tautai sportininkų pergalės reiškia daug daugiau nei medaliai. Kai pasaulio čempionate plevėsuoja trispalvė, visa šalis bent trumpam pasijunta viena komanda.
