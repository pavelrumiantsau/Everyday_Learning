id: lt-r-0005
cefr: B1
title: Kaip aš mokausi lietuvių kalbos
topic: изучение литовского языка
source: generated
text: |
  Į Lietuvą atvykau prieš trejus metus. Iš pradžių lietuviškai mokėjau tik kelis žodžius: labas, ačiū ir atsiprašau. Darbe visi kalbėjo angliškai, todėl lietuvių kalbos man beveik nereikėjo.

  Vis dėlto netrukus supratau, kad be kalbos sunku jaustis kaip namie. Parduotuvėje, pas gydytoją ar kalbėdamasis su kaimynais norėjau suprasti, ką žmonės sako. Todėl užsirašiau į kursus. Du kartus per savaitę po darbo eidavau į pamokas.

  Lietuvių kalba nėra lengva. Joje daug linksnių, o veiksmažodžiai turi daug formų. Man, kaip rusakalbiui, padeda tai, kad gramatika daug kuo panaši į rusų kalbą. Tačiau kirčiai ir ilgieji balsiai man vis dar sunkūs.

  Dabar kasdien skiriu kalbai bent penkiolika minučių: kartoju žodžius, skaitau trumpus tekstus ir klausausi LRT radijo. Kartais žiūriu serialus su lietuviškais subtitrais. Mano tikslas – kitais metais laisvai kalbėti lietuviškai ir darbe, ir su draugais.
