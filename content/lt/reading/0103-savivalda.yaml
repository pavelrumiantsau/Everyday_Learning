title: "Politika prasideda kieme"
topic: "местное самоуправление и мэры"
source: generated
text: |
  Nuo 2015 metų Lietuvos gyventojai merus renka tiesiogiai. Iki tol merą rinkdavo savivaldybės taryba, todėl jis dažnai priklausydavo nuo partijų susitarimų. Reforma turėjo sustiprinti merų atsakomybę rinkėjams, ir iš dalies taip ir nutiko: merai tapo kur kas matomesni, o kai kurie – tikromis savo miestų žvaigždėmis.

  Tačiau tiesioginiai rinkimai turi ir kitą pusę. Kai kuriose savivaldybėse tas pats meras valdo jau ne vieną kadenciją, o jo įtaka apima beveik viską – nuo vietos laikraščio iki didžiausių darbdavių. Kritikai tokius merus ironiškai vadina vietos kunigaikščiais ir perspėja, kad be stiprios opozicijos ir nepriklausomos žiniasklaidos kyla piktnaudžiavimo pavojus.

  Savivaldos rinkimuose galima balsuoti ne tik už partijas, bet ir už visuomeninius rinkimų komitetus – vietos bendruomenių sukurtus judėjimus. Jie dažnai pelno rinkėjų simpatijas, nes atrodo artimesni žmonėms nei didžiosios partijos.

  Vis dėlto rinkėjų aktyvumas savivaldos rinkimuose neretai nedidelis: balsuoja mažiau nei pusė tų, kurie turi teisę. Daugelis mano, kad nuo jų balso mažai kas priklauso. Paradoksalu, bet būtent savivaldybė sprendžia klausimus, kurie kasdien paliečia kiekvieną: mokyklų, viešojo transporto, gatvių apšvietimo, atliekų išvežimo.

  Galbūt todėl pilietiškumas prasideda ne nuo didžiosios politikos, o nuo kiemo. Kas nors turi paklausti, kodėl neveikia žibintas ar kodėl autobusas nebevažiuoja, – ir pastebėti, kad atsakymas priklauso ir nuo to, už ką balsavome.
