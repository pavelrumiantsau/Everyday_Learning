title: "Išnuomotas butas"
topic: "съёмная квартира и поломки"
source: generated
text: |
  Prieš mėnesį išsinuomojome butą Vilniaus centre. Butas gražus ir šviesus, bet senas. Jau pirmą savaitę sugedo šaldytuvas, o virtuvėje neveikė viena lempa. Paskambinau savininkui. Jis buvo labai malonus ir kitą dieną atvažiavo su meistru. Meistras greitai sutaisė šaldytuvą ir pakeitė lempą.

  Kitas mūsų rūpestis – šildymas. Lapkritį bute buvo šalta, todėl nusipirkome šildytuvą. Savininkas pažadėjo, kad žiemą viskas bus gerai. Nuoma nedidelė – 500 eurų per mėnesį, todėl mes čia norime gyventi ilgai.
