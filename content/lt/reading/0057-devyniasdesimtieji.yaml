id: lt-r-0057
cefr: C1
title: "Laukiniai devyniasdešimtieji"
topic: "Литва в 1990-е"
source: generated
text: |
  Paskutinis praėjusio amžiaus dešimtmetis Lietuvoje dažnai vadinamas laukiniais devyniasdešimtaisiais. Tai buvo laikas, kai griuvo viena sistema, o kita dar tik kūrėsi, todėl taisyklės keitėsi greičiau, nei žmonės spėdavo prie jų prisitaikyti.

  Atkūrus nepriklausomybę, euforiją netrukus pakeitė kasdieniai rūpesčiai. Kainos šoktelėjo dešimtis kartų, o bankuose laikytos santaupos per kelis mėnesius nuvertėjo. Kurį laiką buvo atsiskaitoma laikinaisiais pinigais – talonais, liaudyje pramintais „vagnorkėmis“, ir tik 1993 metais įvestas litas pagaliau suteikė stabilumo jausmą.

  Tūkstančiai žmonių, netekusių darbo gamyklose, ėmėsi prekybos. Vilniaus Gariūnų turgus tapo vienu didžiausių Rytų Europoje: ten buvo vežami drabužiai iš Lenkijos ir Turkijos, elektronika, automobiliai. Vieniems turgus buvo išgyvenimo būdas, kitiems – pirmojo kapitalo šaltinis, iš kurio vėliau išaugo solidžios įmonės.

  Valstybės institucijos tuo metu buvo silpnos, ir tuštumą skubėjo užpildyti nusikalstamos grupuotės. Reketas, susišaudymai, sprogdinimai – laikraščių antraštės kartais priminė veiksmo filmą. Kartu vyko privatizacija: gyventojams buvo išdalyti investiciniai čekiai, už kuriuos buvo galima įsigyti valstybinių įmonių akcijų. Vieni jais pasinaudojo sumaniai, kiti juos pardavė už juokingą kainą, nesuvokdami jų vertės. O 1995 metų pabaigoje žlugus keliems stambiems bankams, daugelis vėl prarado santaupas.

  Šiandien apie tą dešimtmetį kalbama nevienareikšmiškai. Vyresnioji karta prisimena nesaugumą ir skurdą, tačiau dažnai priduria, kad tuomet jautė laisvę ir tikėjo, jog viskas įmanoma. Jaunimui devyniasdešimtieji tapo savotiška mada: jų estetika atgimsta muzikoje, drabužiuose, serialuose. Galbūt ši nostalgija ir rodo, kad visuomenė pagaliau pakankamai nutolo nuo to laiko, kad galėtų pažvelgti į jį be pykčio ir baimės.
