id: lt-r-0045
cefr: B2
title: "Pirkti, taisyti ar parduoti?"
topic: "покупки, секонд-хенд и привычки потребления"
source: generated
text: |
  Dar prieš dvidešimt metų naudotus drabužius dažniausiai pirkdavo tik tie, kurie neturėjo pinigų naujiems. Šiandien padėtis visai kitokia. Dėvėtų drabužių parduotuvėse galima sutikti ir studentų, ir gerai uždirbančių žmonių, o daiktų pardavimas internetu tapo įprastu dalyku.

  Vienas geriausių pavyzdžių – „Vinted“. Šią platformą 2008 metais Vilniuje sukūrė Milda Mitkutė ir Justas Janauskas. Iš pradžių tai buvo nedidelė svetainė, kurioje buvo galima parduoti ar išmainyti nebereikalingus drabužius. Dabar platforma veikia daugelyje Europos šalių, o 2019 metais ji tapo pirmuoju Lietuvos „vienaragiu“ – startuoliu, vertinamu daugiau nei milijardu dolerių.

  Lietuviai vis daugiau perka internetu. Siuntos dažnai keliauja ne į namus, o į paštomatus – spintelių tinklus, kurių rasi beveik prie kiekvieno prekybos centro. Tai patogu: siuntą galima pasiimti bet kuriuo paros metu. Tačiau patogumas turi ir kitą pusę – impulsyvius pirkinius, dėl kurių vėliau gailimasi, ir daugybę pakuočių.

  Kai kurie įpročiai keičiasi dėl valstybės sprendimų. 2016 metais Lietuvoje buvo įvesta užstato sistema: perkant gėrimą plastikiniame butelyje ar skardinėje, sumokamas nedidelis užstatas, kuris grąžinamas atnešus tuščią pakuotę į parduotuvę. Jau po kelerių metų buvo grąžinama daugiau kaip 90 procentų pakuočių, ir Lietuva tapo pavyzdžiu kitoms šalims.

  Vis populiaresnis ir daiktų taisymas. Atsiranda dirbtuvių, kuriose galima patiems sutaisyti dviratį ar pasisiūti drabužį, o jaunos šeimos vaikų daiktus dažnai perka iš kitų tėvų. Maisto švaistymą mažina ir programėlės, kuriose kavinės bei parduotuvės vakare pigiau parduoda per dieną likusį maistą.

  Keičiasi ir požiūris į maistą. Vis daugiau žmonių ūkininkų turguose perka vietinių ūkių produktus, o kai kurie užsisako daržovių dėžes tiesiai iš ūkio. Nors tokie produktai dažnai brangesni, pirkėjai sako, kad jiems svarbu žinoti, iš kur atkeliauja jų maistas.

  Vis dėlto reklama ir akcijos toliau ragina pirkti daugiau. Tad kiekvienam tenka pačiam atsakyti į paprastą klausimą: ar man tikrai reikia šio daikto?
