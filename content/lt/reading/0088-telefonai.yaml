id: lt-r-0088
cefr: C1
title: "Vaikystė ekrane"
topic: "смартфоны и детство"
source: generated
text: |
  Vos prieš penkiolika metų išmanusis telefonas vaiko rankose buvo retenybė. Šiandien daugelis pirmokų į mokyklą ateina su savo telefonu, o paaugliai prie ekranų praleidžia po kelias valandas per dieną. Tėvai jaučiasi įstrigę tarp dviejų baimių: kad be telefono vaikas bus atskirtas nuo draugų ir kad su telefonu jis bus atskirtas nuo tikrojo pasaulio.

  Psichologai ir pediatrai vis garsiau kalba apie pasekmes. Tyrimai sieja ilgą buvimą socialiniuose tinkluose su prastesniu miegu, nerimu ir menkesne saviverte, ypač tarp paauglių mergaičių. Kita vertus, dalis mokslininkų ragina nedaryti skubotų išvadų: ne visada aišku, ar telefonas sukelia problemas, ar žmonės, turintys problemų, tiesiog daugiau laiko praleidžia prie ekrano.

  Daugelis Europos šalių ėmė riboti telefonų naudojimą mokyklose, ir Lietuva – ne išimtis. Vienos mokyklos per pamokas telefonus surenka į specialias dėžes, kitos neleidžia jais naudotis net per pertraukas. Mokytojai pastebi, kad per pertraukas vaikai vėl ėmė žaisti ir kalbėtis, nors iš pradžių protestų netrūko.

  Vis dėlto vien draudimais problemos neišspręsi. Specialistai pabrėžia, kad didžiausią įtaką daro suaugusiųjų pavyzdys: sunku įtikinti vaiką padėti telefoną, jei tėvai vakarienės metu nenuleidžia akių nuo savųjų ekranų. Dar svarbiau – pasiūlyti alternatyvą: laiko gamtoje, sporto, bendrų pomėgių.

  Galbūt klausimas turėtų būti ne „kiek laiko vaikas praleidžia prie ekrano?“, o „ko jis nepatiria, kol žiūri į ekraną?“. Atsakymas į jį dažnai pasako daugiau nei bet kokia statistika.
