title: Vasario 16-oji
topic: День восстановления государства
source: generated
text: |
  Vasario 16-oji – Lietuvos valstybės atkūrimo diena. 1918 metų vasario 16 dieną Vilniuje dvidešimt Lietuvos Tarybos narių pasirašė Nepriklausomybės aktą. Jame buvo paskelbta, kad atkuriama nepriklausoma Lietuvos valstybė su sostine Vilniuje. Tarp signatarų buvo Jonas Basanavičius ir Antanas Smetona, vėliau tapęs pirmuoju Lietuvos prezidentu.

  Aktas buvo pasirašytas name Pilies gatvėje. Dabar ten veikia Signatarų namai – muziejus, kurį galima aplankyti. Ilgą laiką originalus aktas buvo laikomas dingusiu. Tik 2017 metais jį Berlyne, Vokietijos užsienio reikalų ministerijos archyve, surado profesorius Liudas Mažylis.

  Vasario 16-oji yra nedarbo diena. Gatvėse plevėsuoja trispalvės vėliavos – geltona, žalia ir raudona. Vyksta koncertai ir iškilmingi renginiai, o daug šeimų tiesiog eina pasivaikščioti po senamiestį. Sovietmečiu šios šventės viešai švęsti nebuvo galima, todėl vyresniems žmonėms ji ypač brangi.

  Nereikia jos painioti su kovo 11-ąja. Tą dieną 1990 metais Lietuva atkūrė nepriklausomybę po penkiasdešimties sovietų okupacijos metų.
