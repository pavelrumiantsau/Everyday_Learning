id: lt-r-0114
cefr: C1
title: "Reklamoje visada laimima"
topic: "азартные игры и реклама ставок"
source: generated
text: |
  Dar neseniai krepšinio transliacijų pertraukos atrodė panašiai: jaunas, sėkmingas vyras su telefonu rankoje džiaugsmingai šaukia, nes ką tik laimėjo lažybas. Reklamų kūrėjai puikiai žinojo, kam jos skirtos, – jauniems vyrams, kurie aistringai seka sportą ir mano jį išmaną geriau už kitus.

  Lošimų ir lažybų bendrovės ilgą laiką buvo vienos dosniausių sporto rėmėjų. Jų logotipai puikavosi ant sportininkų marškinėlių ir arenų sienose, o lažinimasis buvo pateikiamas kaip natūrali aistringo sirgaliaus gyvenimo dalis. Taip ilgainiui susiformavo įspūdis, kad lažintis – tai ne rizika, o savotiškas pomėgis, net intelektinis žaidimas.

  Tačiau su priklausomybėmis dirbantys specialistai piešia kitokį vaizdą. Internetu lošti galima bet kada ir bet kur, todėl azartas lengvai virsta priklausomybe, o ši – skolomis, melu artimiesiems ir sugriautomis šeimomis. Dažnai pamirštama, kad lošimų verslas iš esmės gyvena iš pralaimėjusiųjų: kad bendrovė uždirbtų, dauguma žaidėjų turi pralaimėti.

  Pastaraisiais metais lošimų reklama Lietuvoje vis griežčiau ribojama, o žmonės gali patys užsiregistruoti, kad jiems būtų apribota galimybė lošti. Verslo atstovai tvirtina, kad draudimai tik nustums žaidėjus į nelegalias svetaines. Argumentas ne be pagrindo, tačiau jis primena keistą logiką: jei problemos negalime išspręsti visiškai, geriau jos visai nespręsti.

  Galbūt svarbiausia tai, kad reklamoje visada rodomas laimėtojas. Šimtų pralaimėjusiųjų, tyliai slepiančių skolas nuo savo šeimų, joje nėra ir negali būti – jie paprasčiausiai netinka reklamai.
