id: lt-r-0058
cefr: C1
title: "Serganti Baltija"
topic: "экология Балтийского моря"
source: generated
text: |
  Lietuvai priklauso vos apie devyniasdešimt kilometrų Baltijos jūros kranto, tačiau jūra lietuvių tapatybėje užima kur kas daugiau vietos. Palangos paplūdimiai, Kuršių nerijos kopos, gintaras – visa tai daugeliui yra vasaros ir vaikystės simboliai. Retas susimąsto, kad pati Baltija yra viena labiausiai pažeidžiamų jūrų pasaulyje.

  Baltija sekli ir beveik uždara: su Šiaurės jūra ją jungia tik siauri Danijos sąsiauriai, todėl vanduo atsinaujina labai lėtai, per kelis dešimtmečius. Tai, kas patenka į jūrą, joje ir lieka. O patenka nemažai: upės neša trąšas iš laukų, nuotekas iš miestų, plastiko atliekas.

  Didžiausia problema – eutrofikacija. Azoto ir fosforo perteklius skatina dumblių augimą, o dumbliams žuvus ir pradėjus irti, sunaudojama daug deguonies. Taip susidaro vadinamosios mirties zonos – dugno plotai, kuriuose deguonies beveik nėra ir kur negali išgyventi nei žuvys, nei kiti gyvūnai. Vasarą kai kur prie kranto vanduo tampa žalias, o maudytis tenka uždrausti dėl melsvadumblių, galinčių sukelti alergiją ar apsinuodijimą.

  Prie šių problemų prisideda klimato kaita. Šiltėjantis vanduo dar palankesnis dumbliams, o vis stipresnės audros ardo krantą: po kai kurių audrų dalis paplūdimių tiesiog nuplaunama, todėl smėlį tenka papildyti dirbtinai.

  Vis dėlto ne viskas taip niūru. Baltijos šalys jau nuo praėjusio amžiaus aštuntojo dešimtmečio bendradarbiauja pagal Helsinkio konvenciją, griežtinami nuotekų valymo reikalavimai, ūkininkai skatinami tręšti saikingiau. Kai kur vandens kokybė jau pagerėjo, o ruoniai, kurių kadaise buvo likę vos keli tūkstančiai, vėl dažniau matomi ir prie Lietuvos krantų.

  Jūros ateitis priklauso ne tik nuo vyriausybių susitarimų. Kiekvienas, kuris sprendžia, kiek trąšų berti į savo daržą ar ką išmesti į kanalizaciją, bent šiek tiek prisideda prie to, ar Baltija bus sveikesnė.
