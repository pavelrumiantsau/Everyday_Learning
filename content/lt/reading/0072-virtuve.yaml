title: "Daugiau nei cepelinai"
topic: "литовская кухня вчера и сегодня"
source: generated
text: |
  Paklauskite užsieniečio, ką jis žino apie lietuvišką virtuvę, ir greičiausiai išgirsite du žodžius: cepelinai ir šaltibarščiai. Abu patiekalai gimė bulvių ir burokėlių šalyje, tačiau nė vienas jų nėra toks senas, kaip dažnai manoma. Bulvės Lietuvoje paplito tik XVIII–XIX amžiais, o iki tol valstiečių stalą sudarė ruginė duona, košės, žirniai, ropės ir pieno produktai.

  Lietuviška virtuvė niekada nebuvo uždara. Totoriai, karaimai, žydai, lenkai, vokiečiai paliko joje savo pėdsaką: karaimų kibinai tapo Trakų simboliu, o šakotis, kepamas sukant volą virš ugnies, turi giminaičių visoje Vidurio Europoje. Sovietmečiu daugelis regioninių receptų nunyko – valgyklų meniu buvo vienodas visoje imperijoje, o trūkstant produktų namų virtuvėje tekdavo improvizuoti.

  Pastarąjį dešimtmetį padėtis iš esmės pasikeitė. Jauni virėjai ėmė ieškoti įkvėpimo senuosiuose receptuose ir vietiniuose produktuose: miško grybuose, uogose, ožkų sūriuose, net pievų žolelėse. Restoranuose šie produktai patiekiami šiuolaikiškai, o neseniai į Lietuvą atėjęs „Michelin“ gidas sostinės virtuvę pristatė tarptautinei publikai.

  Kartu atgimsta ir pasididžiavimas paprastais patiekalais. Vilniuje rengiama šaltibarščių šventė, kurios metu miesto gatvės nusidažo rožine spalva, o internete ši sriuba tapo savotišku lietuvių tapatybės ženklu.

  Mitybos specialistai, tiesa, primena, kad tradicinė virtuvė nebūtinai sveika: riebūs, sotūs patiekalai buvo skirti sunkiai fiziškai dirbantiems žmonėms, o ne biure sėdintiems. Todėl gal ir neblogai, kad cepelinai šiandien valgomi ne kasdien, o kaip šventinis prisiminimas apie močiutės virtuvę.
