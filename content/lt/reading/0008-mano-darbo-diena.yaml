id: lt-r-0008
cefr: B1
title: Mano darbo diena
topic: рабочий день
source: generated
text: |
  Dirbu programuotoju vienoje nedidelėje įmonėje. Anksčiau kasdien važiuodavau į biurą, bet dabar du kartus per savaitę dirbu iš namų. Tokiomis dienomis keliuosi vėliau, nes nereikia gaišti laiko kelionei į darbą.

  Mano darbo diena prasideda devintą valandą. Pirmiausia išgeriu kavos, perskaitau laiškus ir peržiūriu savo užduotis. Dešimtą valandą vyksta trumpas komandos susitikimas internetu. Kiekvienas papasakoja, ką padarė vakar ir ką darys šiandien. Jei kas nors susiduria su problema, kolegos stengiasi padėti. Mūsų komandoje dirba šeši žmonės. Mes visi gerai sutariame.

  Pietų pertrauka būna pirmą valandą. Kai dirbu biure, pietaujame su kolegomis netoliese esančioje kavinėje, o namie dažniausiai pasigaminu ką nors paprasto. Po pietų man sunkiausia susikaupti, todėl svarbius darbus stengiuosi atlikti ryte.

  Dirbu iki šeštos. Baigęs darbą išjungiu kompiuterį ir einu pasivaikščioti, kad galva pailsėtų. Vakare gaminu vakarienę, skambinu tėvams arba susitinku su draugais. Rytoj vėl važiuosiu į biurą, nes vadovas nori aptarti naują projektą.
