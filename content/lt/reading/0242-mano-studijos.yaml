topic: "как я выбирала профессию"
source: generated
text: |
  Kai baigiau mokyklą, nežinojau, ką noriu studijuoti. Tėvai norėjo, kad studijuočiau mediciną, nes mano mama yra gydytoja. Bet man labiau patiko kalbos.

  Todėl įstojau į universitetą studijuoti anglų filologijos. Pirmame kurse buvo sunku, nors aš daug mokiausi. Ypač sunkūs buvo egzaminai, kuriuos laikėme žiemą ir vasarą.

  Trečiame kurse vienus metus studijavau Airijoje. Ten pagerinau savo anglų kalbą ir susiradau draugų iš viso pasaulio. Dabar dirbu vertėja ir esu labai patenkinta, kad pasirinkau kalbas.
