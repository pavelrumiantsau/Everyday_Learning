title: "Klaipėda – miestas prie jūros"
topic: "Клайпеда и море"
source: generated
text: |
  Klaipėda yra trečias pagal dydį Lietuvos miestas ir vienintelis šalies jūrų uostas. Miestas įsikūręs ten, kur Kuršių marios susijungia su Baltijos jūra. Uostas žiemą neužšąla, todėl laivai čia gali atplaukti ištisus metus.

  Klaipėdos istorija gerokai skiriasi nuo kitų Lietuvos miestų istorijos. 1252 metais Livonijos ordinas čia pastatė pilį, vadintą Memelburgu, ir beveik septynis šimtmečius miestas priklausė vokiečių valstybėms. Vokiškai jis vadinosi Memelis. Tik 1923 metais Klaipėdos kraštas buvo prijungtas prie Lietuvos, tačiau 1939 metais jį vėl užėmė Vokietija. Šią praeitį ir šiandien primena fachverkiniai senamiesčio namai, siauros gatvelės ir seni sandėliai prie Danės upės.

  Teatro aikštėje stovi Taravos Anikės skulptūra. Ji skirta poetui Simonui Dachui, kuris gimė Klaipėdoje ir, kaip manoma, parašė garsią dainą apie merginą iš Taravos.

  Uostas – svarbiausia miesto ekonomikos dalis. Per jį keliauja trąšos, grūdai, nafta ir konteineriai. 2014 metais Klaipėdoje pradėjo veikti suskystintų gamtinių dujų terminalas, pavadintas „Nepriklausomybe“. Jis leido Lietuvai pirkti dujas ne tik iš Rusijos, o 2022 metais rusiškų dujų šalis visai atsisakė.

  Vasarą Klaipėda virsta poilsio miestu. Keltu per kelias minutes galima persikelti į Smiltynę, kur prasideda Kuršių nerija, o netoliese esančioje Palangoje poilsiautojai būriais plūsta į paplūdimius. Kasmet liepos pabaigoje vyksta Jūros šventė – didžiausias miesto renginys su koncertais, mugėmis ir laivais, kuriuos galima aplankyti.

  Smiltynėje, senoje Kopgalio tvirtovėje, įsikūręs Lietuvos jūrų muziejus. Čia galima pamatyti senovinius laivus ir žvejų sodybą, o akvariumuose ir baseinuose – ruonius, pingvinus ir delfinus. Muziejus ypač mėgstamas šeimų su vaikais, todėl vasaros savaitgaliais prie kelto nusidriekia ilgos automobilių eilės.

  Vis dėlto klaipėdiečiai skundžiasi, kad jaunimas dažnai išvyksta studijuoti ir dirbti į Vilnių. Miestas stengiasi tapti patrauklesnis: atnaujinamos krantinės, statomi nauji gyvenamieji kvartalai, kuriamos darbo vietos jūrinėse technologijose. Klaipėdiečiai tikisi, kad jūra, kuri kadaise miestą išaugino, padės jam augti ir ateityje.
