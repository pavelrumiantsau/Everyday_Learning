questions:
  - q: "Kokią prognozę, pasak teksto, apvertė pokalbių robotai?"
    options: ["Kad automatizacija pirmiausia pakeis fizinį, o ne intelektinį darbą", "Kad kompiuteriai niekada nemokės versti", "Kad robotai neišmoks surinkti automobilių"]
    answer: 0
  - q: "Ką autorius nori parodyti pavyzdžiu apie skaičiuokles?"
    options: ["Kad buhalterių profesija išnyko", "Kad technologijos dažniau keičia darbo pobūdį, nei jį panaikina", "Kad skaičiuoklės dažnai klysta"]
    answer: 1
  - q: "Kodėl, autoriaus manymu, kritinis mąstymas tampa vertingesnis?"
    options: ["Nes mokyklos jo nebemoko", "Nes programos rašo per lėtai", "Nes dirbtinis intelektas gali įtikinamai klysti, ir žmogus turi tai atpažinti"]
    answer: 2
