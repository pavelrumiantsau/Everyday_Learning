id: lt-r-0059
cefr: C1
title: "Kas dirbs už mus?"
topic: "искусственный интеллект и работа"
source: generated
text: |
  Dar visai neseniai buvo manoma, kad automatizacija pirmiausia pakeis fizinį darbą: robotai surinks automobilius, o žmonėms liks kūrybinės ir intelektinės užduotys. Dirbtinio intelekto pokalbių robotai šią prognozę apvertė aukštyn kojomis. Paaiškėjo, kad kompiuteriui kur kas lengviau parašyti pranešimą spaudai ar išversti sutartį, nei sutvarkyti kambarį ar pakeisti čiaupą.

  Lietuvoje, kaip ir kitur, reakcijos labai skiriasi. Vieni darbdaviai džiaugiasi, kad rutininės užduotys atliekamos per kelias sekundes, ir svarsto, ar apskritai verta samdyti naujų darbuotojų. Vertėjai, tekstų rašytojai, klientų aptarnavimo specialistai nerimauja, kad jų profesijos gali sunykti greičiau, nei jie spės persikvalifikuoti. Ypač jautriai šis klausimas skamba mažos kalbos šalyje: kol programos lietuviškai rašė su klaidomis, vertėjai jautėsi saugūs, tačiau kokybė gerėja kasmet.

  Kita vertus, istorija rodo, kad technologijos retai panaikina darbą visiškai – dažniau jos pakeičia jo pobūdį. Atsiradus skaičiuoklėms, buhalteriai neišnyko, tik nustojo skaičiuoti stulpeliu. Panašiai ir dabar: daugelis specialistų dirbtinį intelektą naudoja kaip pagalbininką, kuris parengia juodraštį, o žmogus jį patikrina, pataiso ir prisiima atsakomybę už galutinį rezultatą.

  Būtent atsakomybė, ko gero, ir yra svarbiausias klausimas. Dirbtinis intelektas gali suklysti labai įtikinamai: išgalvoti faktą, šaltinį ar net teismo sprendimą. Todėl didėja ne tik gebėjimo naudotis šiais įrankiais, bet ir kritinio mąstymo vertė – mokėjimo atskirti, kur tekstas tik skamba įtikinamai, o kur jis iš tiesų teisingas.

  Švietimo sistema į šiuos pokyčius reaguoja lėtai. Mokytojai svarsto, kaip vertinti rašinius, kuriuos gali parašyti programa, o universitetai – kokių įgūdžių absolventams prireiks po dešimties metų. Aiškių atsakymų kol kas nėra, tačiau vienas dalykas akivaizdus: mokytis teks visą gyvenimą.
