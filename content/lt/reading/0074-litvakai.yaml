title: "Lietuvos Jeruzalės atmintis"
topic: "наследие литовских евреев"
source: generated
text: |
  Daugiau nei penkis šimtmečius Lietuvoje gyveno gausi žydų bendruomenė. Vilnius buvo vadinamas Lietuvos Jeruzale: čia veikė dešimtys sinagogų, mokyklų, spaustuvių, buvo leidžiami laikraščiai jidiš ir hebrajų kalbomis. Lietuvos žydai, vadinami litvakais, garsėjo išsimokslinimu ir racionaliu požiūriu į religiją, o XVIII amžiaus mokslininkas Vilniaus Gaonas iki šiol laikomas vienu žymiausių judaizmo autoritetų.

  Šis pasaulis buvo sunaikintas per kelerius metus. Antrojo pasaulinio karo metais, nacių okupacijos laikotarpiu, buvo nužudyta daugiau nei devyniasdešimt procentų Lietuvos žydų – vienas didžiausių nuostolių visoje Europoje. Paneriuose prie Vilniaus nušauta dešimtys tūkstančių žmonių. Skaudžiausia tai, kad žudynėse dalyvavo ir dalis vietos gyventojų.

  Sovietmečiu apie tai beveik nekalbėta: aukos vadintos tiesiog tarybiniais piliečiais, o jų tautinė tapatybė nutylėta. Po nepriklausomybės atkūrimo prasidėjo sunkus atminties darbas. Valstybės vadovai oficialiai atsiprašė žydų tautos, įsteigti muziejai, mokyklose vis daugiau kalbama apie Holokaustą. Vis dėlto kai kurių istorinių asmenybių vaidmuo iki šiol kelia aštrių ginčų.

  Pastaraisiais metais vis daugiau žmonių patys domisi, kas gyveno jų mieste ar miestelyje prieš karą. Tvarkomos apleistos žydų kapinės, atsiranda atminimo ženklų, o Vilniaus universitete mokomasi jidiš kalbos. Tai ne vien praeities tyrinėjimas: atmindama tuos, kurių nebėra, visuomenė geriau supranta ir pati save.
