id: lt-r-0012
cefr: B1
title: Kalėdų dovanos
topic: рождественские подарки и ярмарка
source: generated
text: |
  Kasmet gruodį sudarau dovanų sąrašą. Šiemet jame buvo dešimt žmonių: tėvai, sesuo, keli draugai ir kolegos. Seniau dovanas pirkdavau paskutinę dieną ir dažnai išleisdavau per daug pinigų. Todėl šį kartą nusprendžiau pradėti anksčiau.

  Pirmiausia paklausiau savęs, ko kiekvienam iš jų iš tikrųjų reikia. Mamai nupirkau šiltą šaliką, tėčiui – knygą apie Lietuvos istoriją. Seseriai, kuri labai mėgsta kavą, išsirinkau gražų puodelį ir pakelį kavos iš mažos kavinės senamiestyje. Kolegoms dovanų nepirkau: iškepiau imbierinių sausainių ir sudėjau juos į mažas dėžutes.

  Savaitgalį su draugais nuėjome į Kalėdų mugę Katedros aikštėje. Ten stovi didelė papuošta eglė, o aplink ją – mediniai nameliai, kuriuose parduodami rankų darbo žaislai, vilnonės kojinės, medus ir kiti skanėstai. Gėrėme karštą vyną, valgėme blynus ir fotografavomės prie eglės. Nors buvo šalta, nuotaika buvo puiki.

  Grįžęs namo supratau, kad per šventes svarbiausia ne brangios dovanos, o laikas, praleistas su artimais žmonėmis. Kitais metais norėčiau dovanų pirkti mažiau, o su draugais susitikti dažniau.
