title: "Startuolių Vilnius"
topic: "стартапы и технологии в Вильнюсе"
source: generated
text: |
  Dar prieš dvidešimt metų žodis „startuolis“ daugeliui lietuvių nieko nesakė. Šiandien Vilniuje veikia šimtai jaunų technologijų įmonių, o miestas save noriai pristato kaip vieną iš Europos startuolių centrų. Jose dirba ne tik lietuviai, bet ir specialistai iš viso pasaulio.

  Garsiausia sėkmės istorija – „Vinted“. 2008 metais Milda Mitkutė ir Justas Janauskas sukūrė paprastą svetainę, kurioje draugės galėjo mainytis drabužiais, kurių nebedėvi. Iš šios idėjos išaugo tarptautinė platforma, kuria naudojasi milijonai žmonių daugelyje Europos šalių. 2019 metais „Vinted“ tapo pirmuoju Lietuvos vienaragiu – įmone, kurios vertė viršija milijardą dolerių. Vėliau prie jos prisijungė ir kitos: kibernetinio saugumo bendrovė „Nord Security“, sukūrusi „NordVPN“, vienaragiu tapo 2022 metais.

  Lietuva ypač išgarsėjo finansinių technologijų srityje. Lietuvos bankas sukūrė palankias sąlygas naujoms įmonėms, todėl čia licencijas gavo daug užsienio bendrovių, tarp jų ir britų „Revolut“. Gavusi licenciją Lietuvoje, įmonė gali teikti paslaugas visoje Europos Sąjungoje.

  Kodėl startuoliai renkasi Vilnių? Dažniausiai minimos kelios priežastys: greitas internetas, nedaug biurokratijos, daug angliškai gerai kalbančių jaunų žmonių ir pragyvenimas, gerokai pigesnis nei Londone ar Berlyne. Be to, mieste yra keli universitetai, kurie kasmet parengia naujų programuotojų.

  Vis dėlto ne viskas taip paprasta. Įmonėms trūksta patyrusių specialistų, todėl jos darbuotojų ieško ir užsienyje. Biuruose vis dažniau girdima anglų kalba, o kai kurie vilniečiai skundžiasi, kad sostinėje sparčiai brangsta būstas. Be to, didelė dalis startuolių sėkmės nepasiekia ir per kelerius metus užsidaro – apie tai kalbama kur kas rečiau nei apie vienaragius.

  Nepaisant to, jaunų žmonių susidomėjimas nemažėja. Universitetuose organizuojami verslo idėjų konkursai, o sėkmingų įmonių įkūrėjai dažnai investuoja į naujus projektus. Net ir nepavykus pirmam bandymui, daugelis kuria naują įmonę – jau turėdami patirties ir žinodami, kokių klaidų vengti. Taip startuolių ekosistema pamažu auga pati iš savęs.
