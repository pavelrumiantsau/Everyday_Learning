questions:
  - q: "Kas, pasak teksto, daro Vilniaus senamiestį išskirtinį?"
    options: ["Skirtingų bendruomenių paliktų pėdsakų įvairovė", "Tai, kad jis visai naujas", "Tai, kad jame nėra bažnyčių"]
    answer: 0
  - q: "Kas nutiko senamiesčiui sovietmečiu?"
    options: ["Jis buvo kruopščiai restauruotas", "Didelė jo dalis buvo apleista, o gyventojai kėlėsi į mikrorajonus", "Jis buvo visiškai nugriautas"]
    answer: 1
  - q: "Kodėl urbanistai perspėja, kad senamiestis gali virsti dekoracija?"
    options: ["Nes fasadai per ryškiai nudažyti", "Nes jame per mažai turistų", "Nes butai nuomojami turistams, o nuolatinių gyventojų mažėja"]
    answer: 2
