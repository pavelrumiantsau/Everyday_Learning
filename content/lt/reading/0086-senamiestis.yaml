id: lt-r-0086
cefr: C1
title: "Senamiestis: dekoracija ar namai?"
topic: "Старый город Вильнюса"
source: generated
text: |
  Vilniaus senamiestis – vienas didžiausių išlikusių senamiesčių Vidurio ir Rytų Europoje, 1994 metais įtrauktas į UNESCO pasaulio paveldo sąrašą. Siauros gatvelės, vidiniai kiemai, gotikos, renesanso ir ypač baroko bažnyčios sukuria įspūdį, kad laikas čia teka lėčiau.

  Senamiestis visada buvo daugiakultūris. Šalia katalikų bažnyčių stovi stačiatikių cerkvės, liuteronų ir reformatų šventovės, o kadaise čia gyvavo didelis žydų kvartalas. Kiekviena bendruomenė paliko savo pėdsaką, ir būtent ši įvairovė daro Vilnių išskirtinį.

  Sovietmečiu didelė senamiesčio dalis buvo apleista: pastatai griuvo, o gyventojai kraustėsi į naujus mikrorajonus su patogumais. Atkūrus nepriklausomybę prasidėjo spartus atgimimas – restauruoti fasadai, atidaryti restoranai, galerijos, viešbučiai. Šalia esantis Užupis, kadaise turėjęs prastą reputaciją, pasiskelbė respublika su savo humoristine konstitucija ir tapo menininkų rajonu.

  Tačiau sėkmė turi ir šešėlinę pusę. Vis daugiau butų trumpam nuomojama turistams, todėl nuolatinių gyventojų mažėja, o kainos kyla. Vietiniai skundžiasi naktiniu triukšmu, o mažos parduotuvėlės užleidžia vietą suvenyrų kioskams. Urbanistai perspėja, kad senamiestis rizikuoja virsti dekoracija – gražia, bet negyva.

  Kaip išlaikyti pusiausvyrą tarp turizmo ir kasdienio gyvenimo? Kai kurie Europos miestai jau riboja trumpalaikę nuomą, ir Vilniuje diskutuojama apie panašias priemones. Juk senamiestį gyvą daro ne tik pastatai, bet ir žmonės, kurie jame gyvena.
