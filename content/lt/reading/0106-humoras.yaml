id: lt-r-0106
cefr: C1
title: "Iš ko juokiasi lietuviai"
topic: "литовский юмор и анекдоты"
source: generated
text: |
  Užsieniečiai lietuvius dažnai apibūdina kaip santūrius, net niūrokus žmones, kurie gatvėje nesišypso nepažįstamiesiems. Vis dėlto, pagyvenus čia ilgiau, paaiškėja, kad lietuviškas humoras egzistuoja – tik jis tylesnis, sausesnis ir neretai nukreiptas į save.

  Ko gero, populiariausias lietuviškas anekdotas pasakoja apie pragarą. Velnias vedžioja naujoką tarp katilų: prie kiekvieno stovi sargybinis, kad nusidėjėliai neišlįstų, o prie vieno – nė gyvos dvasios. „O čia kas?“ – klausia naujokas. „Lietuviai, – atsako velnias. – Jų saugoti nereikia: jei kuris nors bando išlipti, kiti patys jį įtraukia atgal.“

  Toks anekdotas – tikras savikritikos šedevras. Juo išjuokiamas pavydas, kurį patys lietuviai laiko viena savo ydų, tačiau juokiamasi ne piktai, o tarsi atpažįstant save veidrodyje. Panašiai pasakojami anekdotai apie užsispyrusius žemaičius, gudrius dzūkus ar amžinai besivaržančius vilniečius ir kauniečius: regioniniai stereotipai virsta žaidimu, kuriame įsižeisti būtų tiesiog juokinga.

  Sovietmečiu humoras buvo ir savotiška išgyvenimo priemonė. Politiniai anekdotai, pasakojami tik patikimiems draugams, leido bent akimirkai pasijusti laisvam. Satyrikai išmoko kritikuoti tarp eilučių – taip, kad cenzorius nesuprastų, o skaitytojas suprastų.

  Šiandien humoro vis daugiau girdėti televizijoje, internete ir komikų pasirodymuose. Kai kas dejuoja, kad jis tampa šiurkštesnis ir lėkštesnis. Galbūt. Tačiau tauta, mokanti pasijuokti iš savo silpnybių, paprastai būna kur kas stipresnė, nei pati mano.
