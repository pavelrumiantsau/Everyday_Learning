text: |
  Mano vardas Marija Jankauskienė. Esu gimusi 1985 metais Panevėžyje. Vaikystėje gyvenau su tėvais ir broliu nedideliame name prie upės. Mokykloje labai mėgdavau matematiką ir sportą.

  Kai baigiau mokyklą, išvažiavau studijuoti į Vilnių. Vilniaus universitete studijavau ekonomiką. 2010 metais ištekėjau, o po dvejų metų gimė mūsų sūnus Jonas.

  Dabar dirbu banke ir gyvenu Kaune. Laisvalaikiu mėgstu keliauti ir skaityti istorines knygas.
