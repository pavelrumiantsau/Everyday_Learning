id: lt-r-0031
cefr: B2
title: "Pas šeimos gydytoją"
topic: "здравоохранение и e-sveikata"
source: generated
text: |
  Lietuvoje kiekvienas gyventojas turėtų būti prisirašęs prie poliklinikos ir turėti savo šeimos gydytoją. Būtent pas jį pirmiausia kreipiamasi susirgus: šeimos gydytojas apžiūri pacientą, paskiria tyrimus, išrašo vaistus ir, jeigu reikia, siunčia pas specialistą – kardiologą, neurologą ar kitą gydytoją.

  Pastaraisiais metais daug kas persikėlė į internetą. Elektroninėje sveikatos sistemoje pacientas gali pamatyti savo tyrimų rezultatus, gydytojų išvadas ir išrašytus receptus. Popierinių receptų beveik nebeliko: vaistinėje užtenka parodyti asmens tapatybės kortelę, ir vaistininkas sistemoje randa, ką gydytojas paskyrė. Daugelyje poliklinikų pas gydytoją galima užsiregistruoti internetu, o kartais – net pasikonsultuoti nuotoliu, vaizdo skambučiu.

  Vis dėlto pacientai dažnai skundžiasi eilėmis. Pas šeimos gydytoją paprastai pavyksta patekti per kelias dienas, bet pas kai kuriuos specialistus tenka laukti savaites ar net mėnesius. Todėl nemažai žmonių renkasi privačias klinikas, kuriose už vizitą reikia susimokėti, tačiau laukti tenka gerokai trumpiau. Kiti, ypač gyvenantys užsienyje, suderina apsilankymus pas gydytojus su atostogomis tėvynėje.

  Medikai savo ruožtu primena, kad daugelio problemų galima išvengti. Reguliarūs profilaktiniai patikrinimai, sveika mityba ir judėjimas kainuoja kur kas mažiau nei gydymas. Valstybė apmoka kai kurias prevencines programas – pavyzdžiui, tam tikro amžiaus žmonės gali nemokamai pasitikrinti širdį ar dalyvauti ankstyvosios vėžio diagnostikos programose.

  Dar viena svarbi tema – gydytojų trūkumas regionuose. Jauni medikai dažniau renkasi didmiesčius, kur daugiau galimybių tobulėti ir didesni atlyginimai, todėl mažesnių miestų poliklinikose kartais dirba vos keli gydytojai. Valstybė bando šią problemą spręsti skirdama papildomas išmokas tiems, kurie sutinka dirbti atokesnėse vietovėse.

  Taigi sveikatos priežiūros sistema turi ir privalumų, ir trūkumų. Tačiau vienas patarimas tinka visiems: nelaukite, kol skausmas taps nepakeliamas, – kreipkitės į gydytoją laiku.
