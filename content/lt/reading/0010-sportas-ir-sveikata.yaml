id: lt-r-0010
cefr: B1
title: Sportas ir sveikata
topic: спорт и здоровье
source: generated
text: |
  Ilgą laiką sportas manęs visai nedomino. Po darbo būdavau pavargęs, todėl vakarus leisdavau ant sofos prie televizoriaus. Tačiau pernai pastebėjau, kad lipdamas laiptais greitai pavargstu. Be to, man vis dažniau skaudėdavo nugarą.

  Vieną dieną mano draugas Mantas pasiūlė kartu pradėti bėgioti. Iš pradžių nenorėjau, bet jis mane įtikino: kartu bus smagiau. Pirmą kartą nubėgome tik du kilometrus. Kitą dieną man skaudėjo visus raumenis! Mantas pasakė, kad tai normalu ir kad svarbiausia – nesustoti.

  Dabar bėgiojame tris kartus per savaitę parke prie upės, dažniausiai anksti ryte. Kartais tingiu, bet žinau, kad draugas manęs laukia, ir negaliu jo nuvilti. Per tris mėnesius numečiau keturis kilogramus. Žiemą, kai lauke bus šalta ir slidu, eisime į sporto salę.

  Pasikeitė ir kiti mano įpročiai. Stengiuosi anksčiau eiti miegoti, geriu daugiau vandens ir rečiau valgau saldumynus. Jaučiuosi daug geriau, o nugaros beveik nebeskauda. Niekada negalvojau, kad bėgiojimas man taip patiks.
