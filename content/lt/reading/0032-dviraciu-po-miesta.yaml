id: lt-r-0032
cefr: B2
title: "Dviračiu ar paspirtuku?"
topic: "город, велосипеды и самокаты"
source: generated
text: |
  Dar prieš dešimtmetį dviratininkų Vilniaus gatvėse buvo nedaug. Šiandien vaizdas visai kitas: nutiesta daug naujų dviračių takų, mieste galima išsinuomoti dviratį ar elektrinį paspirtuką, o nemažai darbuotojų į biurą atvažiuoja dviračiu. Panašiai keičiasi ir Kaunas, Klaipėda bei kiti miestai.

  Miestų valdžia pabrėžia, kad dviratis – ne tik sveika, bet ir ekologiška transporto priemonė. Kuo daugiau žmonių važiuoja dviračiais ar viešuoju transportu, tuo mažiau automobilių spūsčių ir užteršto oro. Be to, vietoj automobilių stovėjimo aikštelių atsiranda daugiau erdvės pėstiesiems, medžiams ir kavinių terasoms.

  Vis dėlto ne visi džiaugiasi. Vairuotojai skundžiasi, kad dėl naujų dviračių takų gatvės susiaurėjo, o stovėjimo vietų mieste mažėja. Pėstieji piktinasi paspirtukais, kurie lekia šaligatviais ir būna palikti bet kur – kartais tiesiog tako viduryje. Todėl savivaldybės nustato griežtesnes taisykles: ribojamas greitis, įrengiamos specialios paspirtukų statymo vietos.

  Didžiausias iššūkis – klimatas. Lietuvoje žiema ilga, o ruduo lietingas, todėl daugelis dviračius padeda į sandėlį jau spalį. Tačiau yra ir tokių, kurie mina pedalus ištisus metus: jie perka specialias padangas su dygliais, šiltas pirštines ir tvirtina, kad nėra blogo oro – yra tik netinkami drabužiai.

  Svarbų vaidmenį atlieka ir viešasis transportas. Vilniuje ir Kaune kursuoja elektriniai autobusai ir troleibusai, o bilietą galima nusipirkti mobiliąja programėle. Kai kurie gyventojai derina kelias transporto priemones: iki stotelės nuvažiuoja paspirtuku, toliau važiuoja autobusu, o paskutinius kelis šimtus metrų eina pėsčiomis.

  Galbūt ateities miestas bus toks, kuriame automobilis taps ne būtinybe, o tik viena iš galimybių. Kol kas lietuviai savo automobilių atsisakyti neskuba, tačiau jaunoji karta vis dažniau renkasi dviratį, paspirtuką arba tiesiog eina į darbą pėsčiomis.
