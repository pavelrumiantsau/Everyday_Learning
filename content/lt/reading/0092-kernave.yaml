cefr: C1
title: "Paskutiniai Europos pagonys"
topic: "Кернаве и языческое прошлое"
source: generated
text: |
  Prie Neries, keliasdešimt kilometrų nuo Vilniaus, stūkso penki piliakalniai, iš kurių atsiveria vienas gražiausių Lietuvos vaizdų. Tai Kernavė – vieta, kurią istorikai laiko viena ankstyvųjų Lietuvos valstybės sostinių. XIII amžiuje čia stovėjo medinės pilys, o papėdėje šurmuliavo amatininkų ir pirklių miestas.

  Lietuva buvo paskutinė pagoniška valstybė Europoje: krikštą ji oficialiai priėmė tik 1387 metais, o Žemaitija – dar vėliau. Ilgą laiką pagoniškas tikėjimas buvo ne tik religija, bet ir politinis pasirinkimas: krikštas grėsė priklausomybe nuo kaimynų, o Kryžiuočių ordinas karus su lietuviais pateisino misija atversti stabmeldžius. 1390 metais kryžiuočiai Kernavę sudegino, ir miestas nebeatsigavo.

  Šiandien Kernavė įtraukta į UNESCO pasaulio paveldo sąrašą, o archeologai čia vis dar randa naujų radinių: papuošalų, įrankių, ginklų. Kasmet vasarą vyksta gyvosios archeologijos dienos, kai lankytojai gali pamatyti, kaip senovėje buvo kalamas metalas, audžiami audiniai ar kepama duona.

  Pagonybės atgarsiai lietuvių kultūroje išliko iki šiol. Joninių naktį ieškoma paparčio žiedo, sutartinėse ir tautosakoje minimos senosios dievybės, o kai kurios bendruomenės bando atkurti senąjį baltų tikėjimą. Kritikai tokius bandymus vadina romantizuota rekonstrukcija, nes apie senuosius ritualus žinome nedaug.

  Vis dėlto susidomėjimas pagonybe rodo, kad žmonės ieško šaknų, senesnių nei bet kuri valstybė ar bažnyčia. Galbūt kaip tik todėl stovint ant Kernavės piliakalnio apima jausmas, kad istorija čia ne užrašyta, o gyva.
