id: lt-r-0004
cefr: B1
title: Susitikimas darbe
topic: совещание на работе
source: generated
text: |
  Pirmadienio rytą mūsų skyriuje vyko svarbus susitikimas. Jis prasidėjo lygiai devintą valandą. Vadovas norėjo aptarti naują projektą, kurį turime baigti iki vasaros. Visi susirinko didžiojoje posėdžių salėje, o du kolegos prisijungė internetu, nes dirba iš namų.

  Pirmiausia vadovas paaiškino projekto tikslą: per pusę metų turime sukurti naują programėlę mūsų klientams. Paskui kiekvienas pristatė savo idėjas. Kolegė Rūta pasiūlė iš pradžių apklausti klientus ir išsiaiškinti, ko jiems iš tikrųjų reikia. Man šis pasiūlymas pasirodė labai naudingas.

  Diskusija buvo ilga, ir ne visi sutiko vienas su kitu. Vis dėlto po dviejų valandų priėmėme sprendimą: pradėsime nuo apklausos, o programėlės dizainą aptarsime kitą mėnesį. Vadovas paskyrė užduotis kiekvienam komandos nariui. Aš atsakingas už duomenų analizę, todėl šią savaitę turėsiu daug darbo. Susitikimo pabaigoje vadovas padėkojo visiems už gerą darbą. Kitas susitikimas vyks po dviejų savaičių.
