text: |
  Mano vardas Paulius. Aš gyvenu Vilniuje, o dirbu centre. Iki darbo – penki kilometrai.

  Vasarą aš važiuoju į darbą dviračiu. Tai greita ir sveika. Žiemą dažnai sninga, todėl aš važiuoju autobusu. Autobusų stotelė yra netoli mano namų. Kelionė trunka dvidešimt minučių.

  Kartais mano žmona važiuoja į darbą mašina, bet centre sunku rasti vietą. Todėl ji dažnai eina pėsčiomis.
