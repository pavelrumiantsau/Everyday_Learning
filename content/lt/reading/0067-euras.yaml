id: lt-r-0067
cefr: C1
title: "Atsisveikinimas su litu"
topic: "евро в Литве спустя десять лет"
source: generated
text: |
  2015 metų sausio 1-ąją Lietuva tapo devynioliktąja euro zonos nare ir paskutinė iš Baltijos šalių įsivedė bendrą Europos valiutą. Daugiau nei dvidešimt metų galiojęs litas buvo daugiau nei pinigai: jis simbolizavo atkurtą valstybę ir sunkiai iškovotą stabilumą.

  Prieš įvedant eurą visuomenė buvo susiskaldžiusi. Šalininkai kalbėjo apie mažesnes skolinimosi palūkanas, patogumą keliaujant ir tvirtesnius ryšius su Vakarais. Skeptikai baiminosi, kad prekybininkai pasinaudos proga ir suapvalins kainas aukštyn. Iš dalies taip ir nutiko: kai kurių paslaugų, pavyzdžiui, kavinių ir kirpyklų, kainos šoktelėjo, nors bendra infliacija tais metais buvo nedidelė.

  Iš tiesų litas jau seniai buvo susietas su euru fiksuotu kursu, todėl savarankiškos pinigų politikos Lietuva neturėjo ir anksčiau. Įvedus eurą, bent jau įgyta balso teisė: Lietuvos banko vadovas dalyvauja priimant Europos centrinio banko sprendimus, o ne tik jiems paklūsta.

  Didžiausias išbandymas atėjo 2022 metais, kai kainos per metus išaugo beveik penktadaliu – labiau nei daugelyje kitų euro zonos šalių. Kai kas tuomet vėl prisiminė litą ir ėmė svarstyti, ar su savo valiuta nebūtų buvę lengviau. Dauguma ekonomistų atsakė neigiamai: infliaciją lėmė energijos kainų šuolis ir karas, o ne valiuta, be to, maža šalis su savo pinigais tokiu metu būtų buvusi dar labiau pažeidžiama.

  Šiandien daugeliui jaunų žmonių litas – tik vaikystės prisiminimas, o kelionės po Europą be valiutos keitimo atrodo savaime suprantamos. Ginčai dėl euro nurimo, tačiau jie primena paprastą tiesą: pinigai nėra vien ekonomika – tai ir tapatybės, ir pasitikėjimo klausimas.
