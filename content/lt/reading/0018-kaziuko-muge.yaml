cefr: B1
title: Kaziuko mugė
topic: ярмарка святого Казимира
source: generated
text: |
  Kovo pradžioje Vilniuje vyksta Kaziuko mugė – viena seniausių ir didžiausių mugių Lietuvoje. Ji vyksta per šventojo Kazimiero dieną, kovo 4-ąją, arba artimiausią savaitgalį. Šventasis Kazimieras yra Lietuvos globėjas, o mugė rengiama jau kelis šimtus metų.

  Per mugę senamiesčio gatvės pilnos žmonių. Amatininkai iš visos Lietuvos atveža savo darbų: medinių šaukštų, keramikos, pintų krepšių, lininių rankšluosčių. Galima nusipirkti medaus, sūrio, duonos ir, žinoma, riestainių. Vaikai perka mažus švilpukus, o suaugusieji ieško gražių dovanų namams.

  Svarbiausias mugės simbolis – Vilniaus verba. Tai iš džiovintų gėlių ir žolių surišta spalvinga puokštė. Verbų sekmadienį su verbomis einama į bažnyčią, o paskui jos puošia namus visus metus.

  Aš kasmet einu į mugę su draugais. Mums patinka ne tik apsipirkti, bet ir pasiklausyti muzikos, paragauti karšto vyno ir tiesiog pabūti tarp žmonių. Kaziuko mugė man reiškia, kad žiema jau baigiasi ir netrukus ateis pavasaris.
