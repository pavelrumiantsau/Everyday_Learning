text: |
  – Laba diena. Norėčiau užsisakyti kambarį dviem naktims.
  – Laba diena. Kada atvyksite?
  – Penktadienį vakare. Ar yra laisvų kambarių?
  – Taip, turime dviejų asmenų kambarį su vaizdu į jūrą. Kaina – 90 eurų už naktį su pusryčiais.
  – Puiku. Ar viešbutyje yra automobilių stovėjimo aikštelė?
  – Taip, ji nemokama. Pusryčiai būna nuo 7 iki 10 valandos.
  – Gerai, užsisakau. Mano pavardė Kovalenko.
  – Ačiū, ponia Kovalenko. Laukiame jūsų penktadienį!
