cefr: B1
title: Rudenį Vilniuje
topic: осень в городе
source: generated
text: |
  Ruduo Vilniuje prasideda gražiai. Rugsėjį dar būna šilta, medžiai parkuose pamažu gelsta, o savaitgaliais žmonės mėgsta vaikščioti po senamiestį. Kavinių terasos dar dirba, todėl galima išgerti kavos saulėje.

  Tačiau spalio pabaigoje oras pasikeičia. Dienos tampa trumpos, dažnai lyja, pučia šaltas vėjas. Ryte, kai einu į darbą, dar būna tamsu, o vakare grįžtu namo jau sutemus. Tokiu metu svarbu turėti šiltą striukę, gerą skėtį ir batus, kurie nepraleidžia vandens.

  Daugelis žmonių rudenį jaučiasi pavargę ir liūdni. Gydytojai pataria daugiau judėti, kasdien bent pusvalandį pabūti lauke ir valgyti daug daržovių bei vaisių. Aš rudenį stengiuosi nesėdėti namie: einu į baseiną, susitinku su draugais ir skaitau knygas.

  Lapkričio pabaigoje miestas vėl pagyvėja. Katedros aikštėje įžiebiama didelė Kalėdų eglė, gatvėse šviečia lemputės, ir visi pradeda laukti švenčių.
