questions:
  - q: "Kaip, pasak autoriaus, ilgą laiką buvo kalbama apie emigrantus?"
    options: ["Su priekaištu, nors dauguma išvyko dėl ekonominių priežasčių", "Su pavydu, nes jie daug uždirbdavo", "Apie juos beveik nekalbėta"]
    answer: 0
  - q: "Kokia problema minima kalbant apie antrąją emigrantų kartą?"
    options: ["Jie nenori lankyti šeštadieninių mokyklų", "Lietuvių kalba jiems dažnai lieka tik bendravimo su tėvais kalba", "Jie neturi draugų užsienyje"]
    answer: 1
  - q: "Kokią išvadą daro autorius?"
    options: ["Emigrantai turėtų negrįžti", "Grįžusieji visada greitai prisitaiko", "Emigrantai gali būti naudingi Lietuvai, jei valstybė į juos žiūrės kaip į partnerius"]
    answer: 2
