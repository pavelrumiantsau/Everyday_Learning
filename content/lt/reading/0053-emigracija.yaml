id: lt-r-0053
cefr: C1
title: "Išvykti ar sugrįžti?"
topic: "эмиграция и возвращение домой"
source: generated
text: |
  Per tris dešimtmečius po nepriklausomybės atkūrimo Lietuvos gyventojų sumažėjo beveik milijonu, o didžiąją šio praradimo dalį lėmė emigracija. Ypač daug žmonių išvyko įstojus į Europos Sąjungą ir per 2009 metų ekonominę krizę: Airija, Didžioji Britanija, Norvegija tapo antraisiais namais šimtams tūkstančių lietuvių. Ilgą laiką viešojoje erdvėje apie išvykusiuosius kalbėta su priekaištu, tarsi jie būtų išdavę tėvynę, nors dažniausiai žmones išstūmė paprasčiausias poreikis išlaikyti šeimą.

  Užsienyje susikūrė gyvos lietuvių bendruomenės. Šeštadieninėse mokyklose vaikai mokosi lietuvių kalbos, švenčiamos Joninės ir Vasario 16-oji, leidžiami laikraščiai, veikia tautinių šokių kolektyvai. Kita vertus, antrosios kartos emigrantams lietuvių kalba dažnai tampa tik namų kalba, kuria jie kalba su tėvais, o su draugais bendrauja angliškai ar norvegiškai. Kiek ilgai išsilaikys tokia tapatybė, sunku nuspėti.

  Pastaraisiais metais padėtis pasikeitė: į Lietuvą atvyksta daugiau žmonių, nei iš jos išvyksta. Nemažą dalį atvykėlių sudaro grįžtantys lietuviai – vieni pasiilgę artimųjų, kiti pastebėję, kad atlyginimų skirtumas nebėra toks didelis, o gyvenimo kokybė Lietuvoje gerokai pagerėjo. Grįžtantieji parsiveža ne tik santaupų, bet ir patirties, užsienio kalbų žinių, kitokio požiūrio į darbą ar valdžią.

  Vis dėlto sugrįžimas retai būna sklandus. Daugelis grįžusiųjų pasakoja, kad patyrė atvirkštinį kultūrinį šoką: tėvynė, kurią jie prisiminė, per dešimtmetį pasikeitė, o jie patys pasikeitė dar labiau. Vaikams, užaugusiems svetur, lietuviška mokykla kartais atrodo griežta ir svetima, be to, jiems ne visada lengva rašyti lietuviškai. Kai kurie prisipažįsta, kad nė vienoje iš dviejų šalių nebesijaučia visiškai savi.

  Todėl vis dažniau sakoma, kad emigracijos nereikėtų vertinti vien kaip netekties. Žmonės, gyvenantys keliose šalyse ir jungiantys skirtingas kultūras, gali tapti tiltu tarp Lietuvos ir pasaulio – jeigu tik valstybė sugebės juos ne smerkti, o kviesti bendradarbiauti.
