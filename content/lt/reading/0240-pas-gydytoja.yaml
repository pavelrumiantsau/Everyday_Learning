text: |
  – Laba diena. Kas jums skauda?
  – Jau tris dienas skauda gerklę ir galvą. Vakar vakare buvo 38 laipsniai.
  – Ar kosite?
  – Taip, ypač naktį.
  – Pažiūrėsiu jūsų gerklę… Tai peršalimas, ne gripas. Išrašysiu jums vaistų. Gerkite po vieną tabletę tris kartus per dieną. Ir patariu, kad gertumėte daug šiltos arbatos ir daugiau ilsėtumėtės.
  – Ar galiu eiti į darbą?
  – Ne, geriau tris dienas pabūkite namie. Jeigu po savaitės nepasveiksite, ateikite dar kartą.
  – Ačiū, gydytoja.
