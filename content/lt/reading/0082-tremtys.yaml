title: "Birželio keturioliktoji"
topic: "депортации и память о них"
source: generated
text: |
  1941 metų birželio 14-osios naktį į tūkstančių Lietuvos šeimų duris pasibeldė ginkluoti vyrai. Per kelias valandas žmonėms buvo liepta susikrauti būtiniausius daiktus, o paskui juos sugrūdo į gyvulinius vagonus ir išvežė į Sibirą. Tarp ištremtųjų buvo mokytojų, ūkininkų, karininkų, valdininkų, tačiau ir vaikų, kurie niekuo negalėjo būti „kalti“.

  Tai buvo tik pradžia. Po karo trėmimai atsinaujino, ir iki šeštojo dešimtmečio pradžios iš Lietuvos ištremta daugiau nei šimtas tūkstančių žmonių. Daugelis jų nebegrįžo: mirė nuo bado, šalčio ir ligų, o išgyvenusiems ilgai nebuvo leidžiama sugrįžti į gimtinę.

  Sovietmečiu apie tai buvo galima kalbėti tik pašnibždomis. Dalia Grinkevičiūtė, paauglystėje ištremta prie Laptevų jūros, savo prisiminimus užrašė slapta, o rankraštis buvo rastas tik po daugelio metų. Šiandien jos liudijimas skaitomas mokyklose, o lietuvių kilmės amerikiečių rašytojos Rūtos Šepetys romanas apie tremtį pasiekė milijonus skaitytojų visame pasaulyje.

  Birželio 14-oji dabar minima kaip Gedulo ir vilties diena. Geležinkelio stotyse, iš kurių kadaise išvažiavo ešelonai, uždegamos žvakės, skaitomi ištremtųjų vardai. Kai kurie klausia, ar nereikėtų pagaliau „paleisti praeities“. Tačiau istorikai pabrėžia, kad atmintis – ne kerštas, o įsipareigojimas: kol prisimename, kas nutiko, sunkiau patikėti tais, kurie bando istoriją perrašyti.

  Liudininkų lieka vis mažiau. Todėl vis svarbiau tampa jų pasakojimai, užrašyti dabar, kol dar yra kam papasakoti.
