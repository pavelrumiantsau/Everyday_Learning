id: lt-r-0001
cefr: B1
title: Naujas butas
topic: переезд в новую квартиру
source: generated
text: |
  Praėjusį mėnesį su žmona išsinuomojome naują butą. Senasis butas buvo per mažas, o iki darbo reikėjo važiuoti beveik valandą. Naujasis yra netoli centro, šalia didelio parko. Jame yra du kambariai, erdvi virtuvė ir balkonas.

  Persikraustyti nebuvo lengva. Daiktų turėjome daug daugiau, negu tikėjomės. Viską sudėjome į dėžes, o draugai padėjo jas nunešti į mašiną. Mūsų naujas butas yra ketvirtame aukšte, o name nėra lifto, todėl visą dieną nešiojome dėžes laiptais. Vakare buvome labai pavargę, bet laimingi.

  Dabar pamažu priprantame prie naujos aplinkos. Kaimynai labai malonūs: kitą dieną kaimynė iš penkto aukšto atnešė mums obuolių pyragą. Netoliese yra parduotuvė, vaistinė ir sporto klubas, todėl viską galima pasiekti pėsčiomis. Tiesa, nuoma nemaža – kas mėnesį mokame šešis šimtus eurų, o sąskaitas už elektrą ir šildymą mokame atskirai. Vis dėlto esame patenkinti savo sprendimu. Kitą savaitgalį pakviesime draugus į svečius ir pagaliau atšvęsime įkurtuves.
