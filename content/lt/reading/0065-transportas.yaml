id: lt-r-0065
cefr: C1
title: "Miestas žmonėms ar automobiliams?"
topic: "машины, велосипеды и общественный транспорт"
source: generated
text: |
  Dar prieš dvidešimt metų dviratininkas Vilniaus centre buvo retas reiškinys, o dviračių takų beveik nebuvo. Šiandien sostinėje ir kituose didžiuosiuose miestuose takų tinklas kasmet plečiasi, gatvėse zuja elektriniai paspirtukai, o į kai kurias senamiesčio gatves automobiliams įvažiuoti apskritai ribojama.

  Vis dėlto automobilis daugeliui lietuvių tebėra savotiškas laisvės ir statuso simbolis. Sovietmečiu jo tekdavo laukti metų metus, todėl nuosava mašina ilgai buvo laikoma tikru pasiekimu. Šiandien keliuose daug senų, iš Vakarų Europos atvežtų automobilių, kurie teršia orą labiau nei naujesni.

  Miestų planuotojai pabrėžia paradoksą: kuo daugiau plačių gatvių nutiesiama, tuo daugiau automobilių jomis važinėja. Spūstys nemažėja, tik persikelia kitur. Todėl vis daugiau Europos miestų renkasi priešingą kelią – siaurina eismo juostas, įrengia atskiras juostas autobusams, brangina automobilių stovėjimą centre ir investuoja į viešąjį transportą.

  Tokie sprendimai Lietuvoje sukelia karštų ginčų. Vairuotojai piktinasi, kad jiems sąmoningai gadinamas gyvenimas, ypač tiems, kurie gyvena priemiesčiuose, kur autobusai kursuoja retai, o iki darbo – keliolika kilometrų. Dviračių šalininkai atsako, kad miestas turi būti kuriamas žmonėms, o ne mašinoms, ir kad saugesnės gatvės naudingos visiems – nuo vaikų iki senjorų.

  Akivaizdu, kad vien draudimais žmonių įpročių nepakeisi. Kad žmogus paliktų automobilį namie, alternatyva turi būti iš tiesų patogi: autobusas – dažnas ir punktualus, dviračių takas – nenutrūkstantis ir saugus. Kol to nėra, didžioji dalis gyventojų ir toliau rinksis vairą, net jei teks valandą sėdėti spūstyje.
