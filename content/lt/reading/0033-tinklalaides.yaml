id: lt-r-0033
cefr: B2
title: "Tinklalaidės – naujasis radijas"
topic: "подкасты"
source: generated
text: |
  Dar neseniai radijas buvo pagrindinis būdas klausytis pokalbių ir laidų. Šiandien vis daugiau žmonių renkasi tinklalaides – garso įrašus, kurių galima klausytis bet kada: važiuojant į darbą, sportuojant ar tvarkant namus. Lietuvoje tinklalaidžių pasirinkimas sparčiai auga: yra laidų apie istoriją, mokslą, psichologiją, ekonomiką ir net apie lietuvių kalbą.

  Tinklalaidžių populiarumas paaiškinamas paprastai. Jos nemokamos, nereikalauja visiško dėmesio, o klausytojas pats renkasi, ko ir kada klausytis. Daugelis tinklalaidžių kūrėjų – ne profesionalūs žurnalistai, o savo srities žinovai: gydytojai, istorikai, programuotojai ar tiesiog įdomūs pasakotojai. Klausytojams patinka neformalus tonas, tarsi jie sėdėtų prie vieno stalo su pašnekovais.

  Tradicinis radijas taip pat prisitaikė. Visuomeninis transliuotojas LRT daugelį savo laidų skelbia internete, todėl praleistą laidą galima išklausyti vėliau. Kai kurios radijo stotys kuria laidas specialiai tinklalaidžių formatui, o populiariausi radijo vedėjai turi tūkstančius sekėjų socialiniuose tinkluose.

  Besimokantiems kalbos tinklalaidės – tikras lobis. Klausydamas gyvos, natūralios kalbos, žmogus pripranta prie tikro tempo, intonacijos ir kasdienių posakių, kurių vadovėliuose nerasi. Specialistai pataria pradėti nuo jau pažįstamų temų ir to paties epizodo klausytis kelis kartus: pirmą kartą – suvokti bendrą prasmę, antrą – išgirsti detales.

  Tinklalaidės keičia ir žurnalistiką. Kai kurie žinomi žurnalistai paliko tradicinę žiniasklaidą ir kuria savo laidas, kurias finansuoja patys klausytojai – mažais mėnesiniais įnašais. Tokiu būdu autoriai tampa nepriklausomi nuo reklamos užsakovų, tačiau kartu prisiima didesnę atsakomybę už tai, ką sako eteryje.

  Žinoma, kyla ir klausimų. Tinklalaidžių kūrėjų niekas netikrina, todėl kartu su vertinga informacija galima išgirsti ir netiesos. Taigi ir čia galioja ta pati taisyklė kaip skaitant naujienas: domėkitės, kas kalba, ir neskubėkite tikėti viskuo, ką išgirstate.
