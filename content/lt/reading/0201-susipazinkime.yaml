text: |
  Labas! Mano vardas Anna, o mano pavardė – Petrova. Aš esu rusė, iš Maskvos. Dabar aš gyvenu Vilniuje. Aš esu inžinierė.

  Mano vyras Ivanas yra gydytojas. Jis dirba ligoninėje. Mes turime sūnų. Jo vardas Maksimas, jis yra studentas.

  Mes kalbame rusiškai ir angliškai. Lietuviškai aš kalbu tik truputį, bet aš mokausi. Malonu susipažinti!
