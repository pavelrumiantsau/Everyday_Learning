id: lt-r-0110
cefr: C1
title: "Puokštės, kuprinės ir pirmasis skambutis"
topic: "начало учебного года (1 сентября)"
source: generated
text: |
  Rugsėjo 1-ąją Lietuvos miestų gatvės tarsi pražysta. Nuo pat ryto į mokyklas skuba vaikai su puokštėmis, šalia jų – susijaudinę tėvai, o labiausiai išsipuošę, žinoma, pirmokai, kuriems ši diena – tikra naujo gyvenimo tarpsnio pradžia. Mokyklų kiemuose vyksta šventiniai renginiai, skamba kalbos ir dainos, o kai kur dar išlikęs paprotys: abiturientas ant pečių nešioja pirmokę, skambinančią varpeliu, – tai ir yra pirmasis mokslo metų skambutis.

  Mokslo ir žinių diena – viena iš nedaugelio švenčių, kurias vienodai gerai prisimena kelios kartos. Dėl to apie ją kalbama ir su nostalgija, ir kritiškai. Kasmet įsiplieskia diskusijos apie gėles: mokytojai po šventės lieka su dešimtimis puokščių, kurios po kelių dienų nuvysta, o šeimoms tai – dar viena išlaidų eilutė. Todėl kai kurios mokyklos siūlo vietoj gėlių paaukoti labdarai ar padovanoti knygą mokyklos bibliotekai.

  Išlaidos apskritai tampa vis jautresne tema. Kuprinės, sąsiuviniai, sportinė apranga, kartais ir uniforma – mokslo metų pradžia daugeliui šeimų reiškia rimtą smūgį biudžetui. Nemokamas švietimas, kaip ironizuoja kai kurie tėvai, kainuoja nemažai.

  Vis dėlto būtų neteisinga šventę vertinti vien per išlaidų prizmę. Rugsėjo 1-oji – retas atvejis, kai visa visuomenė bent trumpam atsigręžia į mokyklą ir primena sau, kad švietimas yra bendras reikalas. Šventinėse kalbose kasmet netrūksta gražių žodžių mokytojams, tačiau pedagogų trūkumas daugelyje regionų niekur nedingsta. Tad klausimas tik vienas: ar šis dėmesys neišgaruoja jau kitą dieną – kartu su nuvytusiomis gėlėmis?
