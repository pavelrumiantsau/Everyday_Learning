id: lt-r-0099
cefr: C1
title: "Ekologiška – vadinasi, geriau?"
topic: "органическое земледелие"
source: generated
text: |
  Dar prieš kelis dešimtmečius ekologiški produktai Lietuvoje buvo egzotika, kurią buvo galima rasti nebent specializuotose parduotuvėse. Šiandien juos siūlo beveik kiekvienas prekybos centras, o ekologiškai ūkininkaujama nemažoje šalies žemės ūkio naudmenų dalyje.

  Ekologiškas ūkininkavimas reiškia, kad nenaudojamos sintetinės trąšos ir cheminiai pesticidai, o gyvuliams suteikiama daugiau erdvės. Šalininkai tvirtina, kad tokie produktai sveikesni, o ūkiai mažiau teršia dirvožemį ir vandenį. Europos Sąjunga ragina valstybes nares ekologiškų ūkių plotus gerokai padidinti.

  Tačiau vaizdas nėra toks paprastas. Ekologiški produktai brangesni, todėl daugeliui pirkėjų jie lieka prabanga. Kai kurie ekspertai abejoja, ar jie iš tiesų maistingesni, nors pripažįsta, kad juose mažiau pesticidų likučių. Be to, ekologiškų ūkių derlingumas paprastai mažesnis, todėl, norint pagaminti tiek pat maisto, reikia daugiau žemės.

  Lietuvoje kritikuojama ir tai, kad dalis ūkininkų ekologinius sertifikatus gauna daugiausia dėl išmokų: jų žemėje vyrauja pievos ir ganyklos, o rinkai pagaminama nedaug produkcijos. Tuo tarpu ekologiškų daržovių ar pieno augintojai skundžiasi, kad jiems sunku konkuruoti su pigiais importuotais produktais.

  Galbūt svarbiausia ne etiketė, o atstumas tarp ūkio ir stalo. Vis daugiau pirkėjų perka tiesiogiai iš ūkininkų – turguose ar užsisakydami produktų dėžes – ir taip ne tik gauna šviežesnį maistą, bet ir sužino, kas jį užaugino.
