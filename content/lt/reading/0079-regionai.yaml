title: "Dvi Lietuvos"
topic: "столица и регионы"
source: generated
text: |
  Vilnius per pastaruosius du dešimtmečius pasikeitė neatpažįstamai: stikliniai biurų pastatai, tarptautinės įmonės, gyvas kultūrinis gyvenimas. Sostinėje vidutinis atlyginimas gerokai viršija šalies vidurkį, o nedarbas – vienas mažiausių. Tačiau užtenka nuvažiuoti porą šimtų kilometrų, ir vaizdas visai kitas.

  Daugelyje mažesnių miestų ir rajonų gyventojų sparčiai mažėja, uždaromos mokyklos ir ligoninių skyriai, o jaunimas po studijų nebegrįžta. Ekonomistai tai vadina regionine atskirtimi, o žiniasklaidoje dažnai kalbama apie dvi Lietuvas – sėkmingą didmiesčių ir pamirštą provincijos.

  Atotrūkis matyti ne tik statistikoje, bet ir politikoje. Rinkimų rezultatai didmiesčiuose ir regionuose neretai labai skiriasi: vieni labiau balsuoja už pokyčius ir atvirumą pasauliui, kiti – už stabilumą ir socialines garantijas. Vis dažniau jaučiamas abipusis nesusikalbėjimas, kai kiekviena pusė mano, kad kita jos nesupranta ir nevertina.

  Valstybė bando mažinti skirtumus: į kelius, kultūros centrus, pramonės parkus investuojamos Europos Sąjungos lėšos. Tačiau kritikai pastebi, kad nauja aikštė ar fontanas neišlaikys žmonių, jei nebus gerai apmokamo darbo. Kaunui ir Klaipėdai pavyko pritraukti stambių investuotojų, bet mažesniems miestams tai pasiseka retai.

  Galbūt nuotolinis darbas atvers naują galimybę: dirbti Vilniaus įmonei galima gyvenant ir prie ežero Zarasų rajone. Vis dėlto tam reikia ne tik interneto, bet ir mokyklų, gydytojų, kultūros – visko, kas vietą daro tinkamą gyventi, o ne tik iš jos išvykti.
