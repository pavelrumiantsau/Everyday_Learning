id: lt-r-0047
cefr: B2
title: "Į mišką grybauti"
topic: "леса, грибы и ягоды"
source: generated
text: |
  Miškai dengia maždaug trečdalį Lietuvos teritorijos, todėl nenuostabu, kad jie užima svarbią vietą lietuvių gyvenime. Rudenį, vos tik pradeda lyti, šimtai žmonių ankstų rytą su krepšiais ir peiliukais traukia į mišką grybauti.

  Grybavimas – ne tik būdas prisirinkti maisto. Daugeliui tai tradicija, perduodama iš kartos į kartą: seneliai moko anūkus atpažinti grybus, rodo slaptas vietas ir pasakoja, kaip grybaudavo jų pačių vaikystėje. Labiausiai vertinami baravykai, taip pat populiarios voveraitės, raudonviršiai ir ūmėdės. Grybai verdami, kepami, džiovinami, marinuojami, o žiemą ant stalo atsiranda stiklainiai su vasaros ir rudens skoniu.

  Ypač garsi grybais pietryčių Lietuva – Dzūkija. Varėna net vadinama grybų sostine, o kasmet rugsėjį ten vyksta grybų šventė su mugėmis ir konkursais. Pakelėse galima sutikti žmonių, kurie parduoda ką tik surinktus grybus ir uogas. Vasarą miške renkamos mėlynės ir žemuogės, rudenį – bruknės, o pelkėse – spanguolės.

  Į daugumą Lietuvos miškų galima laisvai eiti, rinkti grybus ir uogas. Tačiau rezervatuose ir kai kuriose kitose saugomose teritorijose tai draudžiama. Be to, miške negalima laužyti medžių, kūrenti laužų tam neskirtose vietose ir palikti šiukšlių.

  Vis dėlto grybauti reikia atsakingai. Kasmet gydytojai praneša apie apsinuodijimus, dažniausiai todėl, kad žmonės surenka nežinomus ar netinkamus grybus. Pavojingiausia – blyškiagalvė musmirė, kurią nepatyrę grybautojai kartais supainioja su valgomais grybais. Todėl patariama rinkti tik tuos grybus, kuriuos tikrai pažįsti, o abejojant pasitarti su labiau patyrusiais.

  Kita miško grėsmė – erkės. Jos gali pernešti erkinį encefalitą ir Laimo ligą, tad specialistai rekomenduoja skiepytis, dėvėti uždarus drabužius ir grįžus namo apžiūrėti visą kūną.

  Nepaisant to, miškas lietuviams išlieka ramybės vieta. Čia ilsimasi nuo miesto triukšmo, vaikštoma, o kai kas tvirtina, kad geriausios mintys ateina būtent tyliai vaikštant tarp pušų su pilnu grybų krepšiu.
