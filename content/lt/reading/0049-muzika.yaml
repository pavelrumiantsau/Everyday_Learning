title: "Nuo sutartinių iki džiazo"
topic: "литовская музыка: от сутартинес до джаза"
source: generated
text: |
  Lietuviai dažnai vadinami dainuojančia tauta. Liaudies dainos per šimtmečius lydėjo visus gyvenimo įvykius: jos buvo dainuojamos dirbant laukuose, per vestuves, laidotuves ir kalendorines šventes. Tautosakininkai kaimuose yra užrašę dešimtis tūkstančių dainų.

  Ypatinga šio paveldo dalis – sutartinės. Tai daugiabalsės dainos, kurias paprastai atlieka kelios moterys: balsai susipina, kartojasi ir tarsi ginčijasi tarpusavyje. Iš pirmo karto jos gali skambėti neįprastai, net keistai, tačiau įsiklausęs imi jausti jų ritmą ir ramybę. 2010 metais sutartinės buvo įtrauktos į UNESCO nematerialaus kultūros paveldo sąrašą.

  Vienas seniausių lietuvių muzikos instrumentų – kanklės, styginis instrumentas, kuriuo grojama gnaibant stygas pirštais. Kanklėmis grojama ir šiandien: ansambliai atlieka ne tik liaudies, bet ir šiuolaikinę muziką, o kanklių pamokų galima imti daugelyje muzikos mokyklų.

  Lietuvių klasikinėje muzikoje svarbiausias vardas – Mikalojus Konstantinas Čiurlionis. Jis buvo ir kompozitorius, ir dailininkas, sukūręs simfonines poemas „Miške“ ir „Jūra“ bei šimtus paveikslų, kuriuose muzika tarsi virsta spalvomis. Čiurlionis mirė vos trisdešimt penkerių, bet jo kūryba iki šiol įkvepia menininkus.

  Nuo sovietmečio Lietuvoje stipri džiazo tradicija. Birštono ir Vilniaus džiazo festivaliai vyksta jau kelis dešimtmečius, o lietuvių džiazo muzikantai koncertuoja visoje Europoje. Sovietmečiu improvizacija daugeliui buvo ir laisvės forma – būdas pasakyti tai, ko nebuvo galima pasakyti žodžiais.

  Šiandien lietuvių muzikos scena labai įvairi: nuo roko ir elektroninės muzikos iki hiphopo ir populiariosios muzikos. Kasmet daug dėmesio sulaukia „Eurovizija“. Lietuva joje dalyvauja nuo 1994 metų, kai debiutinis pasirodymas baigėsi be jokių taškų. Geriausias rezultatas iki šiol – šeštoji vieta 2006 metais.

  Vis dėlto daugelis tvirtina, kad tikroji lietuvių muzikos širdis plaka ne scenose, o prie šeimos stalo, kai po vakarienės kas nors užtraukia dainą ir visi, net nemokantys dainuoti, prisijungia.
