questions:
  - q: "Nuo ko daugiausia priklauso konkursinis balas?"
    options: ["Nuo brandos egzaminų rezultatų", "Nuo tėvų pajamų", "Nuo pokalbio su dėstytojais"]
    answer: 0
  - q: "Kodėl nemažai studentų pradeda dirbti jau studijuodami?"
    options: ["Nes universitetai to reikalauja", "Nori užsidirbti pragyvenimui ir įgyti patirties", "Nes paskaitos vyksta tik savaitgaliais"]
    answer: 1
  - q: "Kodėl aukštosios mokyklos varžosi dėl stojančiųjų?"
    options: ["Nes daug jaunimo išvyksta studijuoti į užsienį", "Nes studijos tapo nemokamos", "Nes mažėja gimstamumas ir jaunimo"]
    answer: 2
