title: "Studentų metai"
topic: "университеты и студенты"
source: generated
text: |
  Vilniaus universitetas, įkurtas 1579 metais, yra vienas seniausių universitetų Vidurio ir Rytų Europoje. Šiandien Lietuvoje veikia keliolika universitetų ir beveik tiek pat kolegijų, o didžiausi studijų centrai yra Vilnius ir Kaunas.

  Į aukštąją mokyklą stojama pagal konkursinį balą, kuris daugiausia priklauso nuo brandos egzaminų rezultatų. Geriausiai egzaminus išlaikę abiturientai gauna valstybės finansuojamas vietas, o kiti už studijas moka patys. Todėl paskutiniai mokyklos metai daugeliui šeimų tampa tikru išbandymu: mokiniai lanko korepetitorius, o tėvai skaičiuoja, kiek kainuotų mokamos studijos.

  Bakalauro studijos dažniausiai trunka ketverius metus, magistrantūra – dar nuo pusantrų iki dvejų metų. Nemažai studentų jau nuo antro kurso pradeda dirbti: vieni nori užsidirbti pragyvenimui, kiti – įgyti patirties ir susirasti darbą dar prieš baigdami studijas. Dėstytojai kartais skundžiasi, kad dirbantys studentai praleidžia paskaitas, tačiau darbdaviai tokią patirtį vertina.

  Nemokamos studijos tenka ne visiems, todėl dalis studentų ima paskolą. Valstybinis studijų fondas teikia valstybės remiamas paskolas, kurias pradedama grąžinti tik po studijų. Geriausiai besimokantiems mokamos skatinamosios stipendijos, o studentai iš mažas pajamas gaunančių šeimų gali gauti socialinę stipendiją.

  Populiari ir „Erasmus“ programa. Semestrą ar du praleidę užsienio universitete, studentai grįžta geriau mokėdami kalbas, susiradę naujų draugų ir kitaip žiūrėdami į mokslą. Be to, į Lietuvą atvyksta vis daugiau užsienio studentų, ypač norinčių studijuoti mediciną ar informacines technologijas.

  Didžiausias iššūkis – demografija. Gimstamumas mažėja, jaunimo vis mažiau, todėl aukštosios mokyklos varžosi dėl kiekvieno stojančiojo. Kai kurie universitetai jau buvo sujungti, o diskusijos, ar mažai šaliai reikia tiek daug aukštųjų mokyklų, nesibaigia. Vieni mano, kad reikėtų mažiau, bet stipresnių universitetų, kiti bijo, kad regionuose neliks galimybių studijuoti.

  Vis dėlto studijų metai daugeliui išlieka ypatingu laiku: bendrabučiai, naktys prieš egzaminus, pirmieji savarankiško gyvenimo bandymai. Kaip juokauja patys studentai, per sesiją ramiai miega tik tie, kurie jau viską išlaikė.
