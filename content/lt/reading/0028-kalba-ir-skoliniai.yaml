cefr: B2
title: "Lietuvių kalba ir skoliniai"
topic: "литовский язык и заимствования"
source: generated
text: |
  Lietuvių kalba dažnai vadinama viena archajiškiausių gyvųjų indoeuropiečių kalbų: joje išliko daug senovinių formų, kurias kalbininkai lygina su sanskritu. Lietuviai savo kalba didžiuojasi, o ją saugoti padeda ir valstybė – Valstybinė lietuvių kalbos komisija rūpinasi terminais, rašyba ir kalbos norma.

  Tačiau kasdienėje kalboje vis daugiau skolinių iš anglų kalbos. Jaunimas, ypač dirbantis tarptautinėse įmonėse, nesunkiai sako „turim dedlainą“ ar „duok fidbeką“. Kalbininkai siūlo lietuviškus atitikmenis: vietoj „dedlaino“ – terminas, vietoj „fidbeko“ – grįžtamasis ryšys, vietoj „hešteigo“ – grotažymė. Kai kurie naujadarai prigyja greitai, kiti taip ir lieka tik žodynuose.

  Nuomonės apie skolinius labai skiriasi. Vieni mano, kad kalba – gyvas organizmas, kuris visada keitėsi ir skolinosi žodžius iš kaimynų: vokiečių, lenkų, rusų. Jų teigimu, per griežtos taisyklės tik atgraso žmones nuo taisyklingos kalbos. Kiti perspėja, kad maža kalba, kuria kalba apie tris milijonus žmonių, yra ypač pažeidžiama, todėl ją reikia sąmoningai puoselėti.

  Skolinių būta visais laikais. Daugelis žodžių, kuriuos šiandien laikome grynai lietuviškais, kadaise atkeliavo iš kitų kalbų: pavyzdžiui, „stiklas“ ir „muilas“ – iš slavų kalbų, „kunigas“ – iš germanų. Kalba juos prisitaikė, suteikė lietuviškas galūnes, ir šiandien niekas nebejaučia, kad jie svetimi. Galbūt po kelių dešimtmečių taip nutiks ir kai kuriems šiandieniniams anglicizmams.

  Ypač sudėtinga situacija emigrantų šeimose. Vaikai, augantys užsienyje, lietuviškai dažnai kalba tik su tėvais, o su draugais ir mokykloje – kita kalba. Todėl daugelyje šalių veikia lituanistinės mokyklos, kuriose savaitgaliais mokomasi lietuvių kalbos, istorijos ir tradicijų.

  Įdomu, kad pastaraisiais metais lietuvių kalbos mokosi vis daugiau užsieniečių, atvykusių gyventi į Lietuvą. Jie pripažįsta, kad kalba sunki – daug linksnių, sudėtingas kirčiavimas, galūnės keičiasi beveik kiekviename žodyje, – bet sako, kad be jos neįmanoma iš tikrųjų pažinti šalies. Galbūt tai geriausias įrodymas, kad lietuvių kalba turi ateitį.
