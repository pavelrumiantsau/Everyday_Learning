id: lt-r-0112
cefr: C1
title: "Gandras ant stulpo"
topic: "наблюдение за птицами и аисты"
source: generated
text: |
  Vargu ar rastume kitą paukštį, kuris lietuviams būtų toks artimas kaip baltasis gandras. Jis dažnai vadinamas nacionaliniu paukščiu, o pagal gandrų lizdų tankumą Lietuva – viena pirmaujančių pasaulio šalių. Kovo pabaigoje minimos Gandrinės – liaudies šventė, kai, kaip tikima, iš Afrikos sugrįžta gandrai.

  Senoji pasaulėžiūra gandrui skyrė ypatingą vietą. Buvo tikima, kad gandras, susukęs lizdą ant sodybos stogo, atneša laimę ir saugo namus nuo gaisro, o jo lizdą sugriovusiam žmogui gresia nelaimė. Šiandien gandrai lizdus vis dažniau suka ant elektros stulpų, todėl energetikai ant stulpų įrengia specialias platformas – tai savotiškas, technokratiškas pagarbos ženklas.

  Pastaraisiais dešimtmečiais paukščiai sulaukia vis daugiau ir mokslininkų, ir mėgėjų dėmesio. Ventės rage, Kuršių marių pakrantėje, veikia viena seniausių Europoje ornitologinių stočių, kurioje kasmet žieduojami tūkstančiai migruojančių paukščių. Paukščių stebėjimas, ilgai laikytas keistuolių užsiėmimu, virto populiariu laisvalaikio praleidimo būdu: žmonės su žiūronais ir fotoaparatais keliasi auštant, kad išvystų tilvikų būrius ar retai pasirodantį juodąjį gandrą.

  Šis pomėgis moko to, ko taip trūksta šiuolaikiniam žmogui, – kantrybės ir dėmesio. Valandą pastovėjus pelkės pakraštyje be telefono, pasaulis staiga pasirodo kur kas turtingesnis, nei atrodė.

  Tačiau idilė apgaulinga. Daugelio paukščių rūšių, ypač gyvenančių žemės ūkio kraštovaizdyje, gausa mažėja, nes nyksta pievos ir šlapynės. Gandras ant stulpo dar ilgai gali likti mielu kaimo simboliu, bet tik tol, kol aplink jį bus kuo maitintis.
