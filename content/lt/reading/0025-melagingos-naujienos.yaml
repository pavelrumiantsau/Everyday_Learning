id: lt-r-0025
cefr: B2
title: "Melagingos naujienos"
topic: "фейковые новости"
source: generated
text: |
  Kiekvieną dieną socialiniuose tinkluose pasirodo tūkstančiai žinučių, nuotraukų ir vaizdo įrašų. Dalis jų – tikros naujienos, tačiau nemažai yra iškraipytų arba visiškai išgalvotų. Melagingos naujienos plinta ypač greitai, nes dažniausiai jos sukelia stiprias emocijas: pyktį, baimę ar pasipiktinimą. Žmogus, pamatęs šokiruojančią antraštę, dažnai ja pasidalija, net neperskaitęs viso straipsnio.

  Lietuvoje dezinformacijos problema ypač aktuali. Specialistai pastebi, kad dalis melagingos informacijos sąmoningai skleidžiama siekiant sukelti nepasitikėjimą valstybės institucijomis ar supriešinti visuomenę. Su tuo kovoja ne tik valstybė, bet ir savanoriai – vadinamieji „elfai“, kurie internete ieško melagingų žinučių ir jas paneigia.

  Kaip atpažinti melagingą naujieną? Pirmiausia verta pasižiūrėti, kas ją paskelbė. Ar tai žinomas naujienų portalas, ar niekam negirdėta svetainė? Antra, reikėtų patikrinti, ar apie tą patį įvykį rašo ir kiti šaltiniai. Jeigu apie „sensaciją“ praneša tik vienas anoniminis puslapis, greičiausiai kažkas negerai. Trečia, naudinga atkreipti dėmesį į datą: kartais senos nuotraukos pateikiamos kaip naujos, o tikri faktai iškraipomi juos ištraukiant iš konteksto.

  Svarbu suprasti ir tai, kad socialiniai tinklai kiekvienam rodo tai, kas jam greičiausiai patiks. Taip susidaro vadinamasis informacinis burbulas: žmogus mato vien tas nuomones, kurioms jau pritaria, ir ilgainiui ima manyti, kad visi galvoja taip pat. Norint iš jo ištrūkti, verta retkarčiais pasiskaityti ir tų šaltinių, su kuriais nesutinkame.

  Plečiantis dirbtiniam intelektui, užduotis tampa dar sudėtingesnė. Šiandien galima sukurti įtikinamą vaizdo įrašą, kuriame politikas neva sako tai, ko niekada nesakė. Todėl vis daugiau mokyklų įtraukia medijų raštingumo pamokas, kuriose mokiniai mokosi kritiškai vertinti informaciją ir atskirti faktus nuo nuomonių.

  Galbūt paprasčiausia taisyklė tokia: prieš dalydamiesi žinute, sustokime bent minutei ir paklauskime savęs – ar tikrai esame tikri, kad tai tiesa?
