title: "Kaip mes susipažinome"
topic: "история знакомства"
source: generated
text: |
  Su savo vyru Jonu susipažinau prieš dešimt metų. Tada abu dirbome toje pačioje įmonėje, bet skirtinguose skyriuose. Vieną dieną valgykloje nebuvo laisvų vietų, ir Jonas paklausė, ar gali atsisėsti šalia manęs. Mes ilgai kalbėjomės apie darbą, keliones ir knygas.

  Po savaitės jis pakvietė mane į kiną. Filmas buvo nuobodus, bet po jo mes dar dvi valandas sėdėjome kavinėje. Po dvejų metų susituokėme. Dabar turime dvi dukteris ir šunį.
