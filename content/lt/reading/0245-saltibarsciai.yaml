text: |
  Šaltibarščiai (4 porcijoms)

  Reikės: 3 virtų burokėlių, 2 agurkų, 1 litro kefyro, 4 kiaušinių, krapų ir svogūnų laiškų, druskos.

  1. Kiaušinius išvirkite ir atvėsinkite.
  2. Burokėlius ir agurkus supjaustykite šiaudeliais.
  3. Supjaustykite krapus ir svogūnų laiškus.
  4. Viską sudėkite į puodą, įpilkite kefyro ir gerai išmaišykite. Pasūdykite.
  5. Sriubą patiekite šaltą su karštomis bulvėmis ir kiaušiniais.
