title: "Skundas internetinei parduotuvei"
topic: "жалоба в интернет-магазин"
source: generated
text: |
  Laba diena,

  prieš savaitę jūsų internetinėje parduotuvėje nusipirkau striukę (užsakymo Nr. 4521). Deja, striukė per maža – užsakiau M dydį, bet atsiuntėte S. Be to, viena kišenė yra suplyšusi.

  Norėčiau grąžinti striukę ir atgauti pinigus arba gauti naują M dydžio striukę. Čekį ir nuotraukas siunčiu kartu su šiuo laišku.

  Prašau atsakyti kuo greičiau.

  Su pagarba,
  Olga Ivanova
