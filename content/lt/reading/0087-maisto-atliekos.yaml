id: lt-r-0087
cefr: C1
title: "Šiukšlių dėžėje – pietūs"
topic: "пищевые отходы"
source: generated
text: |
  Kiekvienas Europos Sąjungos gyventojas per metus išmeta daugiau nei šimtą kilogramų maisto. Didžioji dalis šių atliekų susidaro ne parduotuvėse ar restoranuose, o namų ūkiuose: sugedę vaisiai, šaldytuve pamiršti likučiai, per daug nupirkta duona.

  Paradoksas akivaizdus: tuo pat metu, kai dalis maisto keliauja į šiukšlių dėžes, nemažai žmonių neišgali nusipirkti jo pakankamai. Be to, išmesto maisto kaina neapsiriboja pinigais. Jam užauginti, pagaminti ir atvežti sunaudota vandens, energijos ir žemės, o pūdamas sąvartyne jis išskiria šiltnamio efektą sukeliančių dujų.

  Lietuvoje su maisto švaistymu bando kovoti ir valstybė, ir visuomenė. Maisto bankas ir kitos organizacijos surenka iš prekybos tinklų produktus, kurių galiojimo laikas baigiasi, ir išdalija juos stokojantiems. Atsirado programėlių, kuriose restoranai ir kepyklos vakare pigiau parduoda nesuvalgytą maistą, o kai kuriuose miestuose veikia viešieji šaldytuvai, kuriuose kiekvienas gali palikti nereikalingų produktų.

  Vis dėlto didžiausias pokytis turi įvykti mūsų pačių virtuvėse. Specialistai pataria planuoti pirkinius, neapsipirkinėti išalkus, skirti užrašą „tinka vartoti iki“ nuo „geriausias iki“ ir išmokti gaminti iš likučių. Antrasis užrašas reiškia tik tai, kad po nurodytos datos produktas gali būti šiek tiek prastesnės kokybės, bet dažniausiai jis dar visiškai tinkamas.

  Tai, ką mūsų močiutės darė iš būtinybės, šiandien tampa sąmoningu pasirinkimu. Ir galbūt geriausia pradžia – ne didelės kampanijos, o paprastas klausimas prieš kiekvieną apsipirkimą: ar man to tikrai reikia?
