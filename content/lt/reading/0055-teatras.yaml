title: "Teatro šalis"
topic: "литовский театр и кино"
source: generated
text: |
  Užsienio kritikai Lietuvą kartais vadina teatro šalimi. Tai gali nustebinti: valstybė nedidelė, o jos režisierių spektakliai rodomi prestižiškiausiuose Europos teatro festivaliuose.

  Ryškiausias šios tradicijos vardas – Eimuntas Nekrošius. Jo spektakliai garsėjo ne žodžiais, o vaizdais: ledas, vanduo, ugnis, akmuo scenoje virsdavo metaforomis, kurias žiūrovas turėdavo iššifruoti pats. Šekspyro „Hamletas“, kuriame pagrindinį vaidmenį atliko roko muzikantas Andrius Mamontovas, tapo legenda – apie jį kalbama iki šiol, nors nuo premjeros praėjo beveik trys dešimtmečiai.

  Kodėl būtent teatras? Viena iš dažnai minimų priežasčių – sovietmetis. Kai atvirai kalbėti buvo pavojinga, scena tapo vieta, kur galima pasakyti daugiau, nei leido cenzūra: per užuominas, simbolius, nutylėjimus. Žiūrovai išmoko skaityti tarp eilučių, o režisieriai – kalbėti taip, kad suprastų tik tie, kam reikia. Šis įprotis ieškoti antrojo plano išliko ir vėliau.

  Kinui sekėsi sunkiau. Filmų gamyba brangi, rinka maža, o lietuvių kalba už šalies ribų suprantama nedaugeliui. Vis dėlto ir čia yra kuo didžiuotis. Jonas Mekas, karo metais pasitraukęs iš Lietuvos ir apsigyvenęs Niujorke, tapo vienu svarbiausių Amerikos avangardinio kino kūrėjų. Šarūno Barto filmai, lėti ir beveik be dialogų, ne kartą rodyti Kanų kino festivalyje.

  Pastarąjį dešimtmetį lietuviškų filmų lankomumas kino teatruose gerokai išaugo: kai kurios komedijos ir istorinės dramos surenka daugiau žiūrovų nei Holivudo filmai. Kritikai šį reiškinį vertina nevienodai – vieni džiaugiasi, kad žiūrovai sugrįžo prie savo kino, kiti apgailestauja, kad populiarumą dažniausiai pelno lengvi, greitai pamirštami filmai.

  Teatras tuo tarpu išlieka ištikimas savo publikai. Bilietai į populiarius spektaklius išperkami prieš kelis mėnesius, o salėse sėdi ne tik vyresnio amžiaus žiūrovai, bet ir daug jaunimo. Galbūt tai ir yra geriausias įrodymas, kad tradicija gyva.
