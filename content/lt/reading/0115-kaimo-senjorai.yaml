cefr: C1
title: "Antradienis prie autoparduotuvės"
topic: "стареющие деревни и социальная помощь"
source: generated
text: |
  Kiekvieną antradienį į nedidelį kaimą Rytų Lietuvoje atvažiuoja autoparduotuvė. Jos signalas – ne tik kvietimas nusipirkti duonos ir cukraus. Tai ir proga susitikti: prie mašinos susirenka keletas senolių, pasikalbama apie orus, sveikatą ir vaikus, gyvenančius Vilniuje ar Airijoje. Kitomis dienomis kai kurie iš jų gali neištarti nė žodžio.

  Tokių kaimų Lietuvoje daugėja. Jaunimas išvyko, mokykla uždaryta, o autobusas, jei apskritai dar kursuoja, pasirodo porą kartų per savaitę. Likę gyventojai – dažniausiai vienišos vyresnio amžiaus moterys – gyvena atokiose sodybose, iki kurių žiemą ne visada lengva privažiuoti.

  Valstybė ir savivaldybės bando reaguoti. Socialiniai darbuotojai lanko senjorus namuose, padeda nusipirkti vaistų, sutvarkyti dokumentus, o kartais tiesiog pasikalba. Daug kur veikia vadinamasis socialinis taksi, nuvežantis senjorus pas gydytoją. Tačiau darbuotojų trūksta, atlyginimai kuklūs, o atstumai dideli: kad aplankytų vos kelis žmones, darbuotojas per dieną kartais nuvažiuoja dešimtis kilometrų.

  Senelių globos namai dažnai pateikiami kaip savaime suprantama išeitis. Vis dėlto dauguma senų žmonių nori likti savo namuose – tarp savų daiktų, sode, kurį augino visą gyvenimą. Todėl ekspertai ragina ne tiek statyti naujas įstaigas, kiek investuoti į pagalbą namuose, kaimo bendruomenių iniciatyvas ir savanorystę.

  Kalbant apie senėjimą, dažniausiai skaičiuojami pinigai: pensijos, išlaidos, biudžetas. Tačiau vienatvė į statistiką sunkiai telpa. Galbūt visuomenės brandą geriausiai parodo ne tai, kiek ji išleidžia, o tai, ar kas nors pastebės, kad antradienį prie autoparduotuvės neatėjo viena iš įprastų pirkėjų.
