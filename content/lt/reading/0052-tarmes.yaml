questions:
  - q: "Kodėl daugelis tarmiškai kalbėjusių žmonių ėmė vengti tarmės viešumoje?"
    options: ["Nes mokykloje jų kalba buvo laikoma netaisyklinga ir iš jos šaipytasi", "Nes tarmiškai kalbėti buvo uždrausta įstatymu", "Nes jie patys nebesuprato savo tarmės"]
    answer: 0
  - q: "Kaip tekste vertinamas bendrinės kalbos susiformavimas?"
    options: ["Kaip klaida, sunaikinusi tarmes", "Kaip būtinas žingsnis, nors vėliau dėl jo nukentėjo tarmių prestižas", "Kaip vien žemaičių nuopelnas"]
    answer: 1
  - q: "Kokią mintį autorius išsako pabaigoje?"
    options: ["Tarmės jau visiškai išnyko", "Įstatymai išgelbėjo tarmes", "Požiūris į tarmes pagerėjo, bet neaišku, ar jas dar pavyks išsaugoti"]
    answer: 2
