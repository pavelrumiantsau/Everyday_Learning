id: lt-r-0052
cefr: C1
title: "Tarmės: gėda ar turtas?"
topic: "диалекты литовского языка"
source: generated
text: |
  Dar prieš kelis dešimtmečius vaikas, atvykęs iš Žemaitijos į Vilniaus mokyklą, neretai susidurdavo su pašaipomis: jo kalba buvo laikoma netaisyklinga, net kaimietiška. Mokytojai stropiai taisydavo kiekvieną „neteisingą“ žodį, todėl daugelis tarmiškai kalbėjusių žmonių išmoko savo gimtosios šnektos gėdytis ir vartoti ją nebent namuose, tarp savųjų.

  Šiandien požiūris pamažu keičiasi, tačiau tarmės nyksta greičiau nei bet kada anksčiau. Kalbininkai skiria dvi pagrindines lietuvių kalbos tarmes – aukštaičių ir žemaičių, o šios skyla į daugybę smulkesnių patarmių ir šnektų. Kai kurios jų skiriasi taip smarkiai, kad dzūkas ir šiaurės žemaitis, kalbėdami kiekvienas savaip, vienas kito kone nesuprastų.

  Bendrinė kalba, kurios mokomasi mokykloje, susiformavo XIX a. pabaigoje – XX a. pradžioje, daugiausia remiantis vakarų aukštaičių, ypač suvalkiečių, šnektomis. Ji buvo būtina: tautai, neturėjusiai savo valstybės, be bendros normos būtų buvę sunku kurti spaudą, mokyklas ir mokslą. Vis dėlto, įtvirtinus normą, tarmės ilgainiui imtos vertinti kaip kažkas antraeilio.

  Tarmių nykimą lemia ne vien mokykla. Kaimai tuštėja, jaunimas kraustosi į miestus ar emigruoja, o televizija ir internetas kasdien perša vienodą, standartizuotą kalbą. Kai miršta paskutiniai tam tikros šnektos vartotojai, kartu dingsta ir unikalūs žodžiai, posakiai, tarimo ypatybės – visa tai, ko neįmanoma visiškai atkurti iš įrašų.

  Pastaraisiais metais vis dėlto pastebimas atgimimas. Kai kurie žemaičiai netgi įrodinėja, kad jų tarmė yra atskira kalba, rengiami tarmių konkursai, kuriamos dainos, net reklamos tarmiškai. Kalbininkai ragina nepriešinti bendrinės kalbos ir tarmės, o laikyti jas viena kitą papildančiomis: oficialioje aplinkoje kalbėti bendrine kalba, o šeimoje ar su kraštiečiais – taip, kaip kalbėjo seneliai.

  Galbūt didžiausias pokytis įvyko ne įstatymuose, o žmonių galvose. Tarmiškai kalbantis žmogus vis rečiau sulaukia pašaipų ir vis dažniau – susidomėjimo. Lieka atviras klausimas, ar šis susidomėjimas nėra pavėluotas ir ar pavyks išsaugoti tai, kas dar išliko.
