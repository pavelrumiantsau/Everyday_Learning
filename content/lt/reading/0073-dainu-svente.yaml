id: lt-r-0073
cefr: C1
title: "Šimtas metų kartu dainuojant"
topic: "Праздник песни"
source: generated
text: |
  Kas kelerius metus Vilniaus Vingio parke susirenka dešimtys tūkstančių dainininkų, šokėjų ir muzikantų iš visos Lietuvos ir užsienio lietuvių bendruomenių. Dainų šventė – viena seniausių ir masiškiausių lietuvių tradicijų: pirmoji įvyko 1924 metais Kaune, o 2024-aisiais tradicija paminėjo šimtmetį.

  Kartu su latvių ir estų šventėmis ši tradicija 2003 metais pripažinta UNESCO žodinio ir nematerialaus žmonijos paveldo šedevru. Užsieniečius dažnai stebina ne tik mastas, bet ir tai, kad dauguma dalyvių – mėgėjai: mokytojai, inžinieriai, studentai, ištisus metus repetuojantys laisvalaikiu.

  Ypatinga šventės reikšmė atsiskleidė sovietmečiu. Oficialiai ji turėjo šlovinti tarybinę liaudį, todėl repertuare privalėjo būti partiją garbinančių kūrinių. Tačiau greta jų skambėjo ir lietuvių liaudies dainos, kurias dešimtys tūkstančių žmonių dainuodavo kartu, – tai buvo viena iš nedaugelio progų viešai pajusti tautinę bendrystę. Ne veltui Baltijos šalių išsivadavimas vėliau pavadintas Dainuojančia revoliucija.

  Šiandien šventė susiduria su kitais iššūkiais. Kolektyvams vis sunkiau pritraukti jaunimo, mažų miestelių choruose mažėja dainininkų, o jų vadovai dažnai dirba už simbolinį atlygį. Kai kurie kritikai teigia, kad renginys pernelyg sureikšmina praeitį ir per mažai atsiveria šiuolaikinei kultūrai.

  Vis dėlto kiekvieną kartą, kai Vingio parke tūkstančiai balsų užtraukia tą pačią dainą, net skeptikai pripažįsta, kad tokio bendrumo jausmo sunku patirti kitur. Galbūt dėl to tradicija ir išgyveno šimtmetį: ji atsako į poreikį, kurio nepatenkins jokia technologija, – būti kartu.
