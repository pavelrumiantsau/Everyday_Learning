id: lt-r-0041
cefr: B2
title: "Saugumas ir šauktiniai"
topic: "оборона и призыв"
source: generated
text: |
  Dar prieš dešimtmetį daugelis lietuvių apie kariuomenę galvojo retai. Situacija pasikeitė 2014 metais, kai Rusija aneksavo Krymą. Po metų Lietuvoje buvo atkurta privalomoji karo tarnyba, kuri buvo sustabdyta 2008 metais. Šiandien kasmet tūkstančiai jaunų vyrų, o savanoriškai ir moterų, atlieka pradinę karo tarnybą.

  Šauktiniai tarnauja maždaug devynis mėnesius. Per tą laiką jie išmoksta šaudyti, orientuotis miške, suteikti pirmąją pagalbą ir veikti komandoje. Kai kurie jaunuoliai tarnybos bijo ir bando jos išvengti, tačiau nemaža dalis tarnavusiųjų pripažįsta, kad kariuomenė juos užgrūdino ir išmokė disciplinos.

  Lietuva yra NATO ir Europos Sąjungos narė nuo 2004 metų. Narystė Aljanse reiškia, kad užpuolimo atveju kitos šalys narės privalo padėti. Lietuvoje nuolat dislokuoti sąjungininkų kariai, o pastaraisiais metais nuspręsta, kad šalyje bus nuolat dislokuota ir Vokietijos brigada. Anksčiau apie tai niekas nedrįso net svajoti.

  Išlaidos gynybai per pastaruosius metus gerokai išaugo. Perkami nauji šarvuočiai, oro gynybos sistemos, stiprinama pasienio apsauga. Kai kurie ekonomistai perspėja, kad tokios išlaidos atima pinigus iš švietimo ar sveikatos apsaugos. Kiti atsako, kad be saugumo nebus ir kitų dalykų – nei ekonomikos augimo, nei investicijų.

  Gynyba – ne vien kariuomenės reikalas. Vis daugiau civilių stoja į Šaulių sąjungą, lanko pirmosios pagalbos kursus, mokosi, ką daryti krizės atveju. Savivaldybės skelbia, kur yra artimiausios slėptuvės, o šeimos ruošia vadinamąsias išgyvenimo kuprines su vandeniu, maistu, vaistais ir dokumentų kopijomis.

  Tokia pilietinė parengtis daugeliui primena, kad laisvė nėra savaime suprantama. Kaip dažnai sakoma Lietuvoje, geriausias būdas išvengti karo – būti jam pasiruošusiems.
