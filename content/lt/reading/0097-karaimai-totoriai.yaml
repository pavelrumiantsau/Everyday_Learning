    options: ["Jie buvo jo asmeninė sargyba ir valstybės gynėjai", "Jie buvo pirkliai iš Venecijos", "Jie statė Trakų pilį"]
    answer: 0
  - q: "Kuo ypatingi karaimai?"
    options: ["Jie kalba arabiškai ir išpažįsta islamą", "Jų tikėjimas kilęs iš judaizmo, o kalba – tiurkų", "Jie atvyko iš Skandinavijos"]
