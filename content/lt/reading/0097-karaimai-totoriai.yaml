title: "Vytauto atkelti"
topic: "татары и караимы Литвы"
source: generated
text: |
  Trakuose turistai dažniausiai lanko salos pilį, bet daugelis nė nenutuokia, kad aplink ją esančiose gatvelėse gyvena viena mažiausių Europos tautų – karaimai. XIV ir XV amžių sandūroje Vytautas iš Krymo atkėlė karaimų ir totorių, kurie tapo jo asmenine sargyba ir ištikimais valstybės gynėjais.

  Karaimai išpažįsta savitą tikėjimą, kilusį iš judaizmo, tačiau kalba tiurkų kalba. Jų maldos namai – kenesa – iki šiol stovi Trakuose, o mediniai namai su trimis langais į gatvę tapo miesto simboliu. Šiandien Lietuvoje gyvena vos keli šimtai karaimų, ir jų kalba – viena labiausiai nykstančių pasaulyje.

  Totoriai, išpažįstantys islamą, per šimtmečius beveik visiškai perėmė vietos kalbas, tačiau išsaugojo tikėjimą ir papročius. Keliuose Lietuvos kaimuose stovi medinės mečetės, o totorių kapinės su arabiškais užrašais – vienas savičiausių šalies paminklų. Nuo Vytauto laikų čia gyvenantys totoriai yra viena seniausių musulmonų bendruomenių Šiaurės Europoje.

  Šių bendruomenių istorija paneigia mitą, kad Lietuva visada buvo vienalytė. Kartu ji rodo, kaip lengvai mažos tautos gali išnykti: užtenka kelių kartų, kurios nustoja kalbėti savo kalba. Karaimai bando to išvengti – organizuoja vasaros stovyklas vaikams, leidžia žodynus, kviečia jaunimą mokytis protėvių kalbos.

  Galbūt kibinai, kuriuos turistai perka Trakuose, – geriausias priminimas, kad kultūra išlieka tol, kol kas nors ją puoselėja. Net ir tada, kai ją puoselėja vos keli šimtai žmonių.
