id: lt-r-0078
cefr: C1
title: "Mokykla egzaminų šešėlyje"
topic: "школа, экзамены и реформы образования"
source: generated
text: |
  Kiekvieną birželį tūkstančiai abiturientų laiko brandos egzaminus, nuo kurių rezultatų priklauso, ar jie įstos į norimą studijų programą. Egzaminų sesija – tikras nacionalinis įvykis: apie užduotis diskutuojama žiniasklaidoje, o rezultatų laukia ne tik moksleiviai, bet ir jų tėvai.

  Vis dėlto vis garsiau klausiama, ar tokia sistema iš tiesų matuoja tai, ko prireiks gyvenime. Kritikai teigia, kad mokykla pernelyg orientuota į egzaminus: mokiniai išmoksta spręsti tam tikro tipo užduotis, bet ne mąstyti, ieškoti informacijos ar dirbti komandoje. Siekdami geresnių rezultatų, tėvai samdo korepetitorius, ir taip didėja atotrūkis tarp šeimų, kurios gali sau tai leisti, ir tų, kurios negali.

  Švietimo reformos keičia viena kitą beveik su kiekviena vyriausybe. Atnaujinamos ugdymo programos, keičiami vertinimo principai, pertvarkomas mokyklų tinklas. Mokytojai skundžiasi, kad nespėja prisitaikyti prie vienų pokyčių, kai jau skelbiami kiti, o patys pokyčiai dažnai planuojami nepasitarus su tais, kuriems juos teks įgyvendinti.

  Dar viena problema – mokytojų trūkumas. Ši profesija ilgai buvo menkai apmokama ir nepakankamai vertinama, todėl jaunų mokytojų ateina nedaug, o daugelis dirbančiųjų artėja prie pensinio amžiaus. Kai kuriose mokyklose fizikos ar informatikos pamokų tiesiog nėra kam vesti.

  Ekspertai sutaria, kad jokia reforma nepavyks be mokytojo. Galima keisti programas ir egzaminus, bet tikrasis pokytis įvyksta klasėje – ten, kur vienas žmogus sugeba įžiebti vaikui norą mokytis.
