title: "Silpniausia grandis"
topic: "кибербезопасность"
source: generated
text: |
  Kibernetinės atakos ilgai atrodė kaip kažkas iš filmų apie programišius su gobtuvais tamsiuose kambariuose. Tačiau Lietuvoje jos seniai tapo kasdienybe. 2022 metų vasarą, Lietuvai apribojus sankcionuotų prekių tranzitą į Kaliningradą, valstybės institucijų ir įmonių svetaines užplūdo vadinamosios DDoS atakos, atsakomybę už kurias prisiėmė prorusiška programišių grupuotė. Kai kurios svetainės kurį laiką neveikė, tačiau didesnės žalos išvengta.

  Ekspertai pabrėžia, kad tokie išpuoliai – tik matoma ledkalnio viršūnė. Kur kas pavojingesni tylūs įsilaužimai, kurių tikslas – ne sutrikdyti, o šnipinėti ar pasirengti smūgiui ateityje. Todėl įkurtas Nacionalinis kibernetinio saugumo centras, o Lietuva inicijavo Europos Sąjungos kibernetinių greitojo reagavimo komandų projektą.

  Vis dėlto didžiausia spraga, regis, slypi ne serveriuose, o mūsų įpročiuose. Kone kiekvienas yra gavęs žinutę apie neva vėluojantį siuntinį su nuoroda, kurią paspaudus prašoma įvesti banko duomenis. Telefonu skambinantys sukčiai apsimeta policininkais ar banko darbuotojais ir įtikinamai kuria skubos jausmą. Nukenčia ne tik naivūs senjorai, kaip dažnai manoma, bet ir išsilavinę, technologijas išmanantys žmonės, kurie tą akimirką tiesiog buvo pavargę ar išsiblaškę.

  Kibernetinis saugumas, kaip ir higiena, prasideda nuo paprastų dalykų: skirtingų slaptažodžių, dviejų veiksnių autentifikavimo, sveikos skepsio dozės. Tai nuobodu, nepatogu ir nė kiek neherojiška. Bet būtent tokie nuobodūs įpročiai, o ne brangiausios sistemos, dažniausiai ir nulemia, ar užpuolikui pavyks.

  Galima sakyti, kad šiuolaikinė valstybės gynyba prasideda ne tik prie sienos, bet ir kiekvieno iš mūsų telefone.
