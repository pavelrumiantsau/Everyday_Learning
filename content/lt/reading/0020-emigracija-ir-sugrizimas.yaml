id: lt-r-0020
cefr: B2
title: Emigracija ir sugrįžimas
topic: эмиграция и возвращение
source: generated
text: |
  Nuo nepriklausomybės atkūrimo iš Lietuvos emigravo šimtai tūkstančių žmonių. Daugiausia jų išvyko į Didžiąją Britaniją, Airiją ir Norvegiją, ieškodami geriau apmokamo darbo. Ilgą laiką emigracija buvo laikoma viena didžiausių šalies problemų: tuštėjo kaimai ir mažesni miestai, trūko gydytojų ir mokytojų, o daugelio šeimų nariai gyveno skirtingose šalyse.

  Pastaraisiais metais padėtis pasikeitė. Statistikos duomenimis, į Lietuvą kasmet sugrįžta daugiau žmonių, nei iš jos išvyksta. Grįžtančiųjų motyvai įvairūs. Vieni sako pavargę nuo gyvenimo svetimoje šalyje ir norintys, kad vaikai augtų arčiau senelių. Kitus paskatino didėjantys atlyginimai ir naujos darbo galimybės, ypač informacinių technologijų srityje. Be to, į Lietuvą vis dažniau atvyksta ir užsieniečiai – ne tik iš kaimyninių šalių, bet ir iš Azijos ar Lotynų Amerikos.

  Valstybė taip pat bando grįžimą paskatinti. Sukurtos interneto svetainės, kuriose galima rasti informacijos apie darbo pasiūlymus, mokesčius ir mokyklas, o kai kurios savivaldybės siūlo konsultacijas ką tik grįžusioms šeimoms. Vis dėlto dauguma grįžusiųjų prisipažįsta, kad svarbiausią sprendimą lėmė ne valstybės programos, o šeima, draugai ir jausmas, kad gyvenimas tėvynėje tapo patogesnis nei prieš dešimtmetį.

  Sugrįžti ne visada lengva. Grįžusieji pasakoja, kad teko iš naujo priprasti prie biurokratijos, ieškoti darželio vaikams ir įrodinėti savo patirtį darbdaviams, kurie ne visada vertina užsienyje įgytus įgūdžius. Vaikai, užaugę Airijoje ar Norvegijoje, kartais geriau kalba angliškai negu lietuviškai, todėl mokykloje jiems prireikia papildomos pagalbos.

  Sociologai pabrėžia, kad emigracija nebūtinai yra vien nuostolis. Žmonės, keletą metų pagyvenę kitose šalyse, parsiveža naujų idėjų, kalbų žinių ir drąsos kurti savo verslą. Todėl šiandien ekspertai vis dažniau kalba ne tik apie „protų nutekėjimą“, bet ir apie „protų apytaką“ – kai žinios ir patirtis keliauja abiem kryptimis.
