title: "Baltijos auksas"
topic: "янтарь"
source: generated
text: |
  Po stiprios audros Baltijos pakrantėje visada galima sutikti žmonių, palinkusių prie smėlio: jie ieško gintaro. Kartais pasiseka rasti tik mažą gabalėlį, kartais – kumščio dydžio grynuolį. Tačiau kiekvienas radinys turi istoriją, kuri prasidėjo prieš dešimtis milijonų metų.

  Gintaras – tai suakmenėję senovinių spygliuočių sakai. Tekėdami medžio kamienu, sakai kartais apgaubdavo vabzdžius, augalų sėklas ar net driežiukus, ir šie amžiams sustingdavo skaidrioje kapsulėje. Tokie intarpai mokslininkams yra neįkainojami: jie leidžia pamatyti, kaip atrodė seniai išnykę gyvūnai.

  Žmonės gintarą vertino nuo seniausių laikų. Romėnų imperijos laikais iš Baltijos pakrančių į pietus vedė vadinamasis Gintaro kelias, kuriuo prekeiviai gabeno šį brangų akmenį. XIX amžiuje Juodkrantėje, gilinant laivybos kanalą Kuršių mariose, buvo iškasta daugybė gintaro dirbinių, kuriuos archeologai vadina Juodkrantės lobiu.

  Gintaras glaudžiai susijęs ir su tautosaka. Legenda pasakoja apie jūrų deivę Jūratę, kuri įsimylėjo paprastą žveją Kastytį. Supykęs dievas Perkūnas sudaužė jos gintaro rūmus, ir nuo tada jūra išmeta į krantą jų nuolaužas.

  Šiandien gintaras – ir turistų suvenyras, ir menininkų medžiaga, ir pelningas verslas. Palangos gintaro muziejus, įsikūręs grafų Tiškevičių rūmuose, kasmet sulaukia daugybės lankytojų. Tiesa, rinkoje gausu ir klastočių, todėl pirkėjams patariama pasitikrinti, ar „Baltijos auksas“ iš tiesų nėra plastikas.
