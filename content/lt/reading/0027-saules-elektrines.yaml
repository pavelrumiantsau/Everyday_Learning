id: lt-r-0027
cefr: B2
title: "Saulės elektrinės ant stogų"
topic: "солнечная и ветровая энергия"
source: generated
text: |
  Dar prieš keletą metų saulės baterijos ant namų stogų Lietuvoje buvo retas vaizdas. Šiandien jų matyti beveik kiekviename priemiestyje. Energijos kainoms staiga išaugus, tūkstančiai gyventojų nusprendė patys gaminti elektrą. Tokie žmonės vadinami gaminančiais vartotojais: dienos metu jų elektrinės pagamina daugiau elektros, nei jiems reikia, o perteklius atiduodamas į bendrą tinklą.

  Valstybė šį procesą skatino, skirdama paramą saulės elektrinėms įsirengti. Be to, atsirado galimybė įsigyti elektrinės dalį nutolusiame saulės parke – tai patogu tiems, kurie gyvena daugiabučiuose ir neturi savo stogo. Taip atsinaujinančią energiją gali naudoti ir miesto gyventojai.

  Saulės energija turi akivaizdžių privalumų. Ji nekenkia aplinkai, mažina priklausomybę nuo importuojamo kuro ir ilgainiui leidžia sutaupyti. Vis dėlto yra ir trūkumų. Lietuvoje žiemą saulės šviesos mažai, todėl daugiausia elektros pagaminama vasarą, kai jos reikia mažiausiai. Energetikos specialistai pabrėžia, kad reikia daugiau būdų elektrai kaupti, pavyzdžiui, didelių baterijų.

  Kai kurie gyventojai jau žengė dar vieną žingsnį: įsirengė šilumos siurblius ir įsigijo elektromobilius. Tokiuose namuose saulės energija naudojama ne tik apšvietimui, bet ir šildymui bei kelionėms. Skaičiuojama, kad per keletą metų tokios investicijos gali atsipirkti, nors pradinė kaina nemaža ir ne kiekviena šeima gali sau tai leisti.

  Kartu su saule sparčiai plečiasi ir vėjo energetika. Baltijos jūroje planuojama statyti vėjo jėgaines, kurios galėtų pagaminti nemažą dalį šaliai reikalingos elektros. Tačiau ne visi tokiems projektams pritaria: pajūrio gyventojai nerimauja dėl kraštovaizdžio, o žvejai – dėl žuvų išteklių.

  Energetinė nepriklausomybė Lietuvai visada buvo ne tik ekonomikos, bet ir saugumo klausimas. Todėl diskusijos apie tai, iš kur gauti energijos, greičiausiai nesibaigs dar ilgai. O gal ir jūs svarstote įsirengti saulės elektrinę?
