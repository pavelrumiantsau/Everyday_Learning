text: |
  Kalbininkai iš viso pasaulio domisi lietuvių kalba dėl vienos priežasties: ji laikoma viena archajiškiausių gyvų indoeuropiečių kalbų. Tai reiškia, kad joje išliko daug bruožų, kurie kitose giminiškose kalbose seniai išnyko.

  Dažnai minimi stebinantys panašumai su senąja Indijos kalba – sanskritu. Lietuviški žodžiai „dievas“, „sūnus“, „avis“ sanskrito atitikmenis primena taip, kad net nespecialistas pastebi giminystę, nors šias kalbas skiria tūkstančiai kilometrų ir metų. Žinoma, lietuvių kalba nėra kilusi iš sanskrito: abi jos tiesiog išsaugojo daug bendros prokalbės bruožų.

  Archajiškumas matyti ir gramatikoje. Daiktavardžiai turi septynis linksnius, kai kuriose tarmėse dar vartojama dviskaita – speciali forma dviem asmenims ar daiktams žymėti, o laisvas, kilnojamas kirtis užsieniečiams kelia daug galvos skausmo. Kodėl kalba pakito palyginti nedaug? Viena dažnai minimų priežasčių – ilgas gyvenimas atokiau nuo didžiųjų prekybos kelių ir kalbų maišymosi centrų.

  Iš kadaise gausios baltų kalbų šeimos šiandien išliko tik dvi kalbos – lietuvių ir latvių. Prūsų kalba išnyko XVIII amžiuje, o kitų baltų genčių kalbas žinome tik iš pavienių žodžių ar vietovardžių. Šis likimas primena, kad ir senos kalbos nėra amžinos.

  Paradoksalu, bet būtent archajiškumas šiandien tampa iššūkiu. Kalbai reikia nuolat kurti naujų žodžių technologijoms, mokslui, kasdienybei – kitaip ji rizikuoja tapti muziejaus eksponatu. Senovė yra vertybė, tačiau gyva kalba turi gebėti kalbėti ir apie šiandieną.
