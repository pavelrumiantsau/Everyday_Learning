id: lt-r-0017
cefr: B1
title: Užgavėnės
topic: Масленица по-литовски
source: generated
text: |
  Užgavėnės – linksma žiemos pabaigos šventė. Ji švenčiama antradienį prieš Pelenų dieną, kai prasideda gavėnia – keturiasdešimties dienų pasninkas prieš Velykas. 2027 metais Užgavėnės bus vasario 9 dieną.

  Užgavėnių dieną vaikai ir suaugusieji persirengia: užsideda kaukes ir virsta velniais, raganomis, ožiais ar kitais keistais padarais. Persirengėliai vaikšto nuo namo prie namo, dainuoja, šoka ir prašo vaišių – blynų, saldainių ar pinigų.

  Svarbiausia šventės dalis – Lašininio ir Kanapinio kova. Lašininis yra storas ir mėgsta riebų maistą, o Kanapinis – liesas ir valgo pasninko valgius. Kova visada baigiasi tuo, kad laimi Kanapinis: prasideda pasninkas. Šventės pabaigoje sudeginama Morė – didelė šiaudinė lėlė. Tikima, kad kartu su ja išeina ir žiema.

  Per Užgavėnes būtina valgyti blynus. Sakoma, kad tą dieną reikia valgyti devynis ar net dvylika kartų, kad visus metus būtų sotu. Daugiausia žmonių susirenka Rumšiškėse, Lietuvos liaudies buities muziejuje, bet švenčiama ir kiekviename mieste.
