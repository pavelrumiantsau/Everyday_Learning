id: lt-r-0090
cefr: C1
title: "Miško broliai"
topic: "партизанская война 1944–1953"
source: generated
text: |
  1944 metais, sovietų kariuomenei antrą kartą okupavus Lietuvą, tūkstančiai vyrų ir moterų pasitraukė į miškus. Taip prasidėjo partizaninis karas, trukęs beveik dešimtmetį ir pareikalavęs dešimčių tūkstančių gyvybių. Partizanai tikėjosi, kad Vakarai netrukus įsikiš ir okupacija bus trumpalaikė.

  Miško broliai gyveno slėptuvėse – po žeme įrengtuose bunkeriuose, kurių įėjimai būdavo kruopščiai užmaskuoti. Jie leido pogrindžio laikraščius, priešinosi kolektyvizacijai ir trėmimams. 1949 metų vasario 16-ąją partizanų vadai pasirašė deklaraciją, kurioje skelbė siekiantys atkurti nepriklausomą demokratinę Lietuvą. Vėliau Seimas šį dokumentą pripažino teisės aktu, o partizanų vadą Joną Žemaitį-Vytautą – faktiniu valstybės vadovu.

  Kova buvo nelygi. Saugumas verbavo išdavikus, o žuvusių partizanų kūnai būdavo numetami miestelių aikštėse, kad juos atpažinę artimieji išsiduotų. Iki šeštojo dešimtmečio pradžios organizuotas pasipriešinimas buvo palaužtas, nors pavieniai partizanai slapstėsi dar ilgai.

  Sovietmečiu partizanai oficialiai vadinti banditais, ir ši propaganda kai kuriose šeimose paliko pėdsakų iki šiol. Šiandien jie laikomi laisvės kovotojais, jų atminimą saugo muziejai, filmai, rekonstruoti bunkeriai. Vis dėlto istorikai ragina neidealizuoti: kaip ir kiekviename kare, ir šiame būta žiaurumo, o daugelis civilių atsidūrė tarp dviejų ugnių.

  Galbūt todėl partizanų istorija tokia svarbi ir šiandien. Ji primena ne tik apie drąsą, bet ir apie sunkius pasirinkimus, kuriuos tenka daryti žmonėms, kai laisvė nėra savaime suprantama.
