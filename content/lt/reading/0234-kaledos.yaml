title: "Kalėdos mūsų šeimoje"
topic: "Рождество в семье"
source: generated
text: |
  Mūsų šeimoje Kūčios – svarbiausias metų vakaras. Gruodžio 24 dieną visa šeima susirenka pas senelius. Ant stalo būna dvylika patiekalų, bet mėsos nevalgome. Vaikai labiausiai laukia kūčiukų su aguonų pienu.

  Kalėdų rytą visi dovanoja vieni kitiems dovanas. Šiais metais mamai padovanojau šiltą šaliką, o tėčiui – knygą apie Lietuvos istoriją. Mano mažasis brolis norėtų gauti šunį, bet tėvai sako, kad jis dar per mažas.

  Man labai patinka šios šventės, nes visa šeima būna kartu.
