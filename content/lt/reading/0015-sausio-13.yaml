id: lt-r-0015
cefr: B1
title: Sausio 13-oji
topic: День защитников свободы
source: generated
text: |
  Sausio 13-ąją Lietuvoje minima Laisvės gynėjų diena. 1991 metų sausio 13-osios naktį sovietų kariuomenė Vilniuje puolė Televizijos bokštą ir Radijo ir televizijos komiteto pastatą. Prie jų budėjo tūkstančiai beginklių žmonių, kurie norėjo apginti ką tik atkurtą Lietuvos nepriklausomybę. Tą naktį žuvo keturiolika žmonių, šimtai buvo sužeisti.

  Tačiau žmonės neišsigando. Jie ir toliau budėjo prie bokšto ir prie Aukščiausiosios Tarybos rūmų, kūreno laužus, dainavo ir laikėsi už rankų. Sovietų valdžia tikėjosi, kad lietuviai pasiduos, bet įvyko priešingai: visas pasaulis pamatė, kas vyksta Vilniuje.

  Šiandien sausio 13-osios rytą daug žmonių languose uždega žvakes. Vilniuje dega atminimo laužai, o prie Televizijos bokšto ir Antakalnio kapinėse, kur palaidoti žuvusieji, žmonės neša gėles. Daug kas prisisega neužmirštuolę – mažą mėlyną gėlę. Jos vardas reiškia „nepamiršk“.

  Mano kaimynė tą naktį buvo prie bokšto. Kasmet ji apie tai pasakoja savo anūkams, kad jie žinotų, kokia brangi yra laisvė.
