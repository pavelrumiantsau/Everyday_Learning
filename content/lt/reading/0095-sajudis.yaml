title: "Sąjūdis: kai tauta prabilo"
topic: "Саюдис и путь к независимости"
source: generated
text: |
  1988 metų birželio 3-iąją Mokslų akademijos salėje susirinko grupė mokslininkų, rašytojų, menininkų ir filosofų. Jie įkūrė Lietuvos persitvarkymo sąjūdį – judėjimą, kuris oficialiai turėjo remti Michailo Gorbačiovo reformas. Vargu ar kas nors tą vakarą galėjo numatyti, kad po mažiau nei dvejų metų Lietuva paskelbs nepriklausomybę.

  Sąjūdis augo stulbinamu greičiu. Į mitingus Vingio parke ir Katedros aikštėje rinkosi šimtai tūkstančių žmonių. Pirmą kartą po kelių dešimtmečių viešai buvo kalbama apie tremtis, Molotovo–Ribentropo paktą, lietuvių kalbos teises. Rudenį ant Gedimino pilies bokšto vėl suplevėsavo trispalvė, o laikraščiai, kuriuos neseniai būtų uždraudusi cenzūra, buvo išperkami per kelias minutes.

  Ypatinga Sąjūdžio savybė buvo jo taikumas. Lyderiai nuosekliai vengė smurto, rėmėsi teise ir derybomis, o žmonės savo valią reiškė dainomis, plakatais ir rinkimais. 1990 metais Sąjūdžio remiami kandidatai laimėjo rinkimus į Aukščiausiąją Tarybą, o kovo 11-ąją ši priėmė Nepriklausomybės atkūrimo aktą. Tarybos pirmininku tapo muzikologas Vytautas Landsbergis.

  Vėliau judėjimas suskilo: buvę bendražygiai išsiskirstė į skirtingas partijas, o politika tapo kasdieniška ir dažnai nusivylimą kelianti. Kai kurie sąjūdiečiai su kartėliu sako, kad tuometinė vienybė buvo „trumpas stebuklas“.

  Vis dėlto Sąjūdžio laikai paliko svarbią pamoką: net ir didžiausią galią turinti sistema gali sugriūti, kai pakankamai daug žmonių vienu metu nustoja bijoti.
