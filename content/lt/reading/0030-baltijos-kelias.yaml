id: lt-r-0030
cefr: B2
title: "Baltijos kelias"
topic: "Балтийский путь, 23 августа 1989 г."
source: generated
text: |
  1989 metų rugpjūčio 23-iąją apie du milijonus žmonių Lietuvoje, Latvijoje ir Estijoje susikibo rankomis ir sudarė daugiau kaip 600 kilometrų ilgio gyvą grandinę nuo Vilniaus per Rygą iki Talino. Ši akcija, pavadinta Baltijos keliu, tapo vienu garsiausių taikaus pasipriešinimo pavyzdžių pasaulio istorijoje.

  Data buvo pasirinkta neatsitiktinai. Lygiai prieš penkiasdešimt metų Sovietų Sąjunga ir nacistinė Vokietija pasirašė Molotovo–Ribentropo paktą. Slaptuosiuose jo protokoluose buvo nuspręsta, kad Baltijos šalys atiteks Sovietų Sąjungai. Ilgą laiką Maskva neigė, kad tokie protokolai apskritai egzistavo, todėl Baltijos kelio dalyviai reikalavo pripažinti tiesą ir atkurti valstybių nepriklausomybę.

  Akciją organizavo Lietuvos Sąjūdis kartu su Latvijos ir Estijos liaudies frontais. Interneto ir mobiliųjų telefonų tada nebuvo, todėl informacija sklido per radiją, laikraščius ir iš lūpų į lūpas. Žmonės važiavo autobusais, automobiliais ir net traktoriais, kad užpildytų tuščias vietas kaimo keliuose. Septintą valandą vakaro visi penkiolika minučių stovėjo susikibę rankomis, daugelis verkė ir dainavo.

  Tuo metu nedaug kas tikėjo, kad po poros metų visos trys šalys bus laisvos. Vis dėlto Baltijos kelias parodė pasauliui, kad baltų tautos siekia nepriklausomybės vieningai ir be smurto. Lietuva paskelbė nepriklausomybės atkūrimą jau 1990 metų kovo 11-ąją, o 1991-aisiais ją pripažino dauguma pasaulio valstybių.

  Baltijos kelias įkvėpė ir kitus. Panašias gyvas grandines vėliau surengė žmonės kitose šalyse, siekdami atkreipti pasaulio dėmesį į savo problemas. 2009 metais Baltijos kelio dokumentai buvo įtraukti į UNESCO programos „Pasaulio atmintis“ registrą – kaip unikalus liudijimas apie tai, kaip taikiai galima kovoti už laisvę.

  Šiandien rugpjūčio 23-iąją prisimenamos ne tik Baltijos kelio metinės, bet ir totalitarinių režimų aukos. Daugelis šeimų saugo nuotraukas, kuriose jų tėvai ar seneliai stovi toje ilgoje grandinėje.
