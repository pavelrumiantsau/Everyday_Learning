id: lt-r-0075
cefr: C1
title: "Laivas, pavadintas „Nepriklausomybe“"
topic: "энергетическая независимость"
source: generated
text: |
  Dar visai neseniai Lietuva energetikoje buvo beveik visiškai priklausoma nuo vieno tiekėjo – Rusijos. Dujos ateidavo vienu vamzdynu, elektros tinklai buvo sujungti su Rusijos ir Baltarusijos sistema, o kainas neretai lėmė ne rinka, o politika. Tokia priklausomybė reiškė ne tik didesnes sąskaitas, bet ir nuolatinę grėsmę: bet kurią akimirką čiaupas galėjo būti užsuktas.

  Lūžis įvyko 2014 metais, kai Klaipėdos uoste pradėjo veikti suskystintųjų gamtinių dujų terminalas – laivas, simboliškai pavadintas „Independence“, tai yra „Nepriklausomybė“. Kritikai tuomet tvirtino, kad projektas per brangus ir nereikalingas. Tačiau 2022 metų pavasarį, prasidėjus Rusijos karui prieš Ukrainą, Lietuva tapo pirmąja Europos Sąjungos šalimi, visiškai atsisakiusia rusiškų dujų importo. Terminalas, anksčiau vadintas politine užgaida, staiga tapo strateginiu turtu.

  Kitas didelis žingsnis žengtas 2025 metų vasarį: Baltijos šalys atsijungė nuo posovietinės elektros sistemos ir prisijungė prie kontinentinės Europos tinklų. Projektas kainavo daugiau nei milijardą eurų, tačiau dauguma politikų jį laiko ne tik ekonomikos, bet visų pirma saugumo klausimu.

  Kartu sparčiai plečiasi atsinaujinanti energetika: laukuose dygsta vėjo jėgainės, ant namų stogų – saulės elektrinės. Daugelis gyventojų tapo ne tik elektros vartotojais, bet ir gamintojais, o ateities planuose – vėjo parkas Baltijos jūroje.

  Vis dėlto energetinė nepriklausomybė nėra galutinis taškas. Naujos jungtys ir jėgainės gali tapti sabotažo taikiniais, o žalioji pertvarka reikalauja investicijų, už kurias galiausiai sumoka vartotojai. Ekspertai pabrėžia, kad saugumas energetikoje – ne kartą pasiektas rezultatas, o nuolatinis darbas.
