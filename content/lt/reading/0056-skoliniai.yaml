id: lt-r-0056
cefr: C1
title: "Saugoti kalbą ar leisti jai keistis?"
topic: "заимствования и языковая политика"
source: generated
text: |
  Kiekviena gyva kalba skolinasi. Lietuvių kalboje gausu žodžių, atėjusių iš slavų, vokiečių, lotynų kalbų, ir dauguma jų jau seniai nebeatrodo svetimi: retas susimąsto, kad „knyga“ ar „muilas“ kadaise buvo skoliniai iš slavų kalbų.

  Šiandien didžiausias skolinių šaltinis – anglų kalba. Ypač jaunimo ir IT specialistų kalboje gausu žodžių, kurie tiesiog perimami su lietuviška galūne: „apdeitinti“, „šerinti“, „laikinti“. Dažnai tai daroma ne iš tingumo, o todėl, kad naujas reiškinys atsiranda greičiau, nei kas nors spėja jį pavadinti lietuviškai. Dalis tokių žodžių taip ir lieka žargonu, tačiau kai kurie pamažu skverbiasi į laikraščius ir net į oficialius dokumentus.

  Lietuvoje kalbos politika tradiciškai griežtesnė nei daugelyje Europos šalių. Valstybinė lietuvių kalbos komisija ne tik nustato normas, bet ir siūlo lietuviškus atitikmenis naujiems tarptautiniams žodžiams. Kai kurie jų prigijo taip sėkmingai, kad šiandien niekas nebeprisimena, jog kadaise teko rinktis: sakome „svetainė“, o ne „saitas“, o kompiuterio „pelę“ vadiname lietuviškai. Kiti pasiūlymai sutinkami su šypsena ir taip ir lieka žodynuose.

  Kritikai teigia, kad toks kalbos saugojimas primena kovą su vėjo malūnais: kalba keičiasi pagal tai, kaip ja kalba žmonės, o ne pagal komisijų nutarimus. Be to, nuolatinis taisymas gali atgrasyti žmones nuo viešo kalbėjimo – bijodami suklysti, jie verčiau tyli. Šalininkai atsako, kad maža kalba, kuria kalba vos keli milijonai žmonių, be sąmoningos priežiūros galėtų greitai prarasti savitumą, o daugelis lietuviškų atitikmenų atsirado būtent todėl, kad kažkas laiku juos pasiūlė.

  Atrodo, kad tiesa – kažkur per vidurį. Kalba neturi tapti muziejaus eksponatu, tačiau neturi virsti ir sąvartynu, į kurį be atrankos metama viskas, kas ateina iš ekrano. Svarbiausia galbūt ne draudimai, o pasirinkimo laisvė: kad kalbėtojas žinotų lietuvišką žodį ir pats spręstų, kada jį vartoti.
