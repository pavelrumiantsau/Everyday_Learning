id: lt-r-0019
cefr: B2
title: Nuotolinis darbas – laisvė ar spąstai?
topic: удалённая работа
source: generated
text: |
  Pandemijos metu tūkstančiai Lietuvos darbuotojų pirmą kartą pradėjo dirbti iš namų. Tuomet daugelis manė, kad tai laikina priemonė, tačiau praėjus keleriems metams nuotolinis darbas tapo įprastu reiškiniu. Kai kurios įmonės leidžia darbuotojams patiems nuspręsti, kur dirbti, o kitos reikalauja bent kelias dienas per savaitę praleisti biure.

  Nuotolinio darbo šalininkai pabrėžia, kad sutaupoma daug laiko, kuris anksčiau būdavo praleidžiamas kamščiuose. Dirbdamas namie žmogus gali lanksčiau planuoti savo dieną: nuvesti vaikus į mokyklą, pasportuoti per pietų pertrauką ar pasirūpinti sergančiu tėvu. Be to, įmonės, išsinuomojusios mažesnes patalpas, išleidžia mažiau pinigų.

  Vis dėlto kritikų netrūksta. Jų teigimu, dirbant nuotoliu silpnėja ryšiai tarp kolegų, o naujiems darbuotojams sunkiau įsilieti į kolektyvą. Psichologai perspėja, kad namuose išlaikyti ribą tarp darbo ir poilsio ne taip paprasta: nešiojamasis kompiuteris visada po ranka, todėl darbo diena neretai užsitęsia iki vėlyvo vakaro. Kai kurie darbuotojai prisipažįsta jaučiantys vienatvę ir pasiilgstantys paprasčiausių pokalbių prie kavos aparato.

  Įdomu, kad nuotolinis darbas keičia ir šalies žemėlapį. Kai kurie vilniečiai, supratę, kad į biurą važiuoti kasdien nebereikia, persikėlė į mažesnius miestus ar net į kaimus, kur būstas pigesnis, o gamta arčiau. Regionų merai tuo džiaugiasi, nes į jų savivaldybes sugrįžta jaunos šeimos. Tačiau be spartaus interneto ir patogaus susisiekimo su sostine toks gyvenimo būdas neįmanomas.

  Atrodo, kad daugelis darbdavių renkasi vidurio kelią – vadinamąjį hibridinį modelį. Darbuotojas kelias dienas dirba biure, o likusias – ten, kur jam patogiau. Tyrimai rodo, kad toks modelis patinka daugumai, nors jo sėkmė labai priklauso nuo vadovo gebėjimo pasitikėti komanda. Kuo labiau darbuotojai jaučiasi vertinami, tuo mažiau jiems reikia kontrolės.

  O jūs? Ar norėtumėte visada dirbti iš namų, ar vis dėlto pasiilgtumėte biuro?
