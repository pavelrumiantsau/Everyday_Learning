text: |
  Šeštadienį visoje Lietuvoje bus saulėta ir šilta. Dieną temperatūra pakils iki 22–25 laipsnių. Pajūryje pūs silpnas vėjas.

  Sekmadienį oras pasikeis. Ryte Vakarų Lietuvoje pradės lyti, o vakare lis visoje šalyje. Bus vėsiau – 15–18 laipsnių šilumos. Naktį temperatūra nukris iki 8 laipsnių.

  Patariame sekmadienį pasiimti skėtį.
