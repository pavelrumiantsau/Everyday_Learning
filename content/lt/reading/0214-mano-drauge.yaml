text: |
  Mano geriausia draugė – Jurga. Mes pažįstame viena kitą jau dešimt metų.

  Jurga aukšta, jos plaukai ilgi ir šviesūs, o akys mėlynos. Ji visada linksma ir draugiška. Jurga labai protinga: ji kalba keturiomis kalbomis. Ji yra gydytoja.

  Jos vyras Darius žemas, jis turi barzdą ir nešioja akinius. Darius ramus, bet labai įdomus žmogus. Jie turi dvi dukteris.
