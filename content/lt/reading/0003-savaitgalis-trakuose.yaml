id: lt-r-0003
cefr: B1
title: Savaitgalis Trakuose
topic: поездка на выходные
source: generated
text: |
  Praėjusį šeštadienį su draugais nuvažiavome į Trakus. Trakai – nedidelis miestas netoli Vilniaus, garsus savo ežerais ir pilimi. Iš Vilniaus ten galima nuvažiuoti traukiniu arba autobusu maždaug per pusvalandį. Mes pasirinkome traukinį, nes bilietas kainavo vos kelis eurus.

  Trakuose pirmiausia nuėjome prie ežero. Oras buvo puikus: švietė saulė, pūtė lengvas vėjas. Per tiltą perėjome į salą, kurioje stovi garsioji Trakų pilis. Prie pilies fotografavomės ir žiūrėjome į baltas jachtas ežere. Pilies viduje yra muziejus, todėl ten praleidome beveik dvi valandas. Sužinojome daug įdomių dalykų apie Lietuvos istoriją.

  Po ekskursijos buvome labai alkani. Užsukome į nedidelę kavinę ir paragavome kibinų – tai tradiciniai karaimų pyragėliai. Man labiausiai patiko kibinai su vištiena, o draugė išsirinko kibinus su daržovėmis. Kavinėje buvo daug turistų, bet laukti ilgai nereikėjo.

  Vakare traukiniu grįžome į Vilnių. Kelionė buvo trumpa, bet labai smagi. Kitą kartą norėtume išsinuomoti valtį ir paplaukioti ežere.
