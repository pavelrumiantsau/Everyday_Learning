id: lt-r-0014
cefr: B1
title: Žiema Vilniuje
topic: зима в городе
source: generated
text: |
  Šiemet žiema tikra: jau kelias savaites sninga, o termometras rytais rodo dvidešimt laipsnių šalčio. Kiemuose kiemsargiai kasa sniegą, o vaikai eina į mokyklą su šiltomis kepurėmis ir pirštinėmis.

  Aš žiemą mėgstu, nors šaltis kartais ir erzina. Savaitgaliais su draugais važiuojame slidinėti į Liepkalnį. Tai slidinėjimo trasa pačiame Vilniuje, todėl nereikia važiuoti į kalnus. Po slidinėjimo einame į kavinę ir geriame karštą šokoladą arba arbatą su medumi.

  Sausį vakarai ilgi: jau apie ketvirtą valandą pradeda temti. Todėl daugiau laiko praleidžiu namie. Skaitau knygas, žiūriu filmus lietuviškai ir verdu karštas sriubas. Vasarą mano mėgstamiausia sriuba yra šaltibarščiai, o žiemą dažniausiai verdu raugintų kopūstų sriubą.

  Kai kurie mano kolegos žiemą išvyksta į šiltus kraštus. Aš to nedarau. Man patinka, kai sniegas girgžda po kojomis, o miestas atrodo lyg iš pasakos. Be to, žinau, kad po ilgos žiemos pavasaris visada atrodo dar gražesnis.
