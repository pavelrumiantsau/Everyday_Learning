cefr: C1
title: "Nuo jūros iki jūros"
topic: "Великое княжество Литовское и Витаутас"
source: generated
text: |
  Mokyklose lietuviai mokosi, kad XV amžiaus pradžioje jų valstybė driekėsi nuo Baltijos iki Juodosios jūros. Didžioji Lietuvos Kunigaikštystė tuomet buvo viena didžiausių valstybių Europoje, o jos valdovas Vytautas Didysis iki šiol laikomas vienu ryškiausių tautos istorijos herojų.

  Ryškiausias jo valdymo epizodas – 1410 metų Žalgirio mūšis, kuriame jungtinė Lietuvos ir Lenkijos kariuomenė, vadovaujama Vytauto ir jo pusbrolio Jogailos, sumušė Kryžiuočių ordiną. Šis mūšis sustabdė ordino plėtrą į rytus, ir lietuviai jį iki šiol mini su pasididžiavimu. Ne veltui Kauno krepšinio klubas pavadintas būtent „Žalgiriu“.

  Tačiau istorikai primena, kad ši valstybė nebuvo „lietuviška“ šiuolaikine prasme. Didžiąją jos dalį sudarė rytų slavų žemės, o kanceliarijos kalba buvo ne lietuvių, o rusėnų. Todėl Kunigaikštystės paveldą savu laiko ir baltarusiai, ir ukrainiečiai, o kai kurie istorikai net siūlo ją vadinti daugiatautės valstybės pavyzdžiu, kuriame skirtingos tautos ir religijos gyveno greta.

  Vytauto gyvenimo pabaiga buvo dramatiška. Jis siekė karūnos, kuri būtų įtvirtinusi Lietuvos savarankiškumą, tačiau lenkų didikai, nenorėdami to leisti, perėmė karūną gabenusius pasiuntinius. Vytautas mirė 1430 metais taip ir netapęs karaliumi.

  Šiandien Vytautas – ir istorinė asmenybė, ir mitas. Tai, kaip lietuviai jį prisimena, pasako ne tik apie XV amžių, bet ir apie tai, kokios praeities mums reikia dabar: galingos, drąsios ir nepriklausomos.
