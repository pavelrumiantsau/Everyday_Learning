title: "Krepšinis – antroji religija"
topic: "баскетбол и национальная идентичность"
source: generated
text: |
  Sakoma, kad Lietuvoje yra dvi religijos: katalikybė ir krepšinis. Nors tai tik juokas, krepšinio svarba šaliai tikrai ypatinga. Kai žaidžia nacionalinė rinktinė, gatvės ištuštėja, o kavinėse ir baruose susirenka šimtai sirgalių, apsivilkusių žaliais marškinėliais.

  Krepšinio meilė turi ilgą istoriją. Tarpukario Lietuva laimėjo Europos čempionatus 1937 ir 1939 metais, ir krepšinis greitai tapo nacionaliniu žaidimu. Sovietmečiu Kauno „Žalgirio“ pergalės prieš Maskvos komandas buvo daugiau nei sportas – jos tapo tylaus pasipriešinimo simboliu. Tada išgarsėjo Arvydas Sabonis ir Šarūnas Marčiulionis, vėliau žaidę geriausioje pasaulio lygoje NBA.

  Ypač įsimintinos 1992 metų Barselonos olimpinės žaidynės. Vos atkūrusi nepriklausomybę Lietuva neturėjo pinigų kelionei, todėl rinktinei padėjo amerikiečių roko grupė „Grateful Dead“. Žaidėjai į aikštelę išėjo su ryškiais, įvairiaspalviais marškinėliais, o sugrįžo su bronzos medaliais. Daugeliui tai buvo pirmoji proga pajusti, kad maža šalis gali pasiekti daug.

  Šiandien krepšinio aikštelių rasi kone kiekviename kieme, o vaikai svajoja tapti profesionaliais žaidėjais. Kritikų nuomone, dėmesys krepšiniui kartais užgožia kitas sporto šakas, kurioms trūksta finansavimo ir žiūrovų. Kita vertus, krepšinis vienija žmones: per svarbias rungtynes kartu jaudinasi ir vaikai, ir senoliai, ir tie, kurie šiaip sportu visai nesidomi.

  Krepšinis svarbus ir ekonomikai. Didžiųjų rungtynių metu barai ir parduotuvės uždirba daugiau, o sėkmingi žaidėjai tampa reklamos veidais. Lietuvos krepšinio mokyklos garsėja visame pasaulyje: jaunieji žaidėjai iš Kauno ar Vilniaus dažnai išvyksta žaisti į Ispaniją, Italiją ar Jungtines Amerikos Valstijas, o kai kurie jų grįžta jau kaip treneriai ir perduoda patirtį naujai kartai.

  Galbūt todėl lietuviai taip skaudžiai išgyvena pralaimėjimus ir taip triukšmingai švenčia pergales. Krepšinis čia – ne vien žaidimas, o dalis tapatybės.
