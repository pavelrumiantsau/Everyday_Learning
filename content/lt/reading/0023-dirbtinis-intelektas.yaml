id: lt-r-0023
cefr: B2
title: Dirbtinis intelektas – pagalbininkas ar grėsmė?
topic: искусственный интеллект
source: generated
text: |
  Dar prieš kelerius metus pokalbių robotai atrodė kaip mokslinės fantastikos dalis, o šiandien jais naudojasi moksleiviai, žurnalistai ir programuotojai. Dirbtinis intelektas padeda išversti tekstą, parašyti laišką ar paaiškinti sudėtingą temą. Vis dėlto kartu su galimybėmis kyla ir nemažai klausimų.

  Mokytojai pastebi, kad kai kurie mokiniai namų darbus atlieka pasitelkę dirbtinį intelektą, patys beveik nieko neparašę. Todėl vienose mokyklose tokios programos draudžiamos, o kitose, priešingai, mokoma jomis naudotis protingai: tikrinti atsakymus, klausti papildomų klausimų ir niekada aklai nepasitikėti tuo, ką parašė mašina. Juk dirbtinis intelektas kartais klysta – ir daro tai labai įtikinamai.

  Darbo rinkoje taip pat vyksta pokyčiai. Kai kurios profesijos, pavyzdžiui, vertėjo ar klientų aptarnavimo specialisto, keičiasi ypač greitai. Optimistai tvirtina, kad technologijos perims nuobodžias užduotis ir žmonėms liks daugiau laiko kūrybai. Pesimistai baiminasi, kad dalis darbuotojų neteks darbo, o nauji darbai atsiras ne ten ir ne tiems, kam jų labiausiai reikia.

  Ne mažiau svarbus ir privatumo klausimas. Kalbėdamiesi su pokalbių robotu, žmonės neretai atskleidžia asmeninę informaciją: savo sveikatos problemas, darbo paslaptis ar net slaptažodžius. Specialistai pataria prieš rašant pagalvoti, ar tą patį papasakotumėte nepažįstamam žmogui gatvėje. Be to, verta žinoti, kad dirbtinis intelektas mokosi iš žmonių sukurtų tekstų, todėl gali perimti ir jų išankstines nuostatas.

  Europos Sąjunga jau priėmė dirbtinio intelekto aktą, kuriuo siekiama sumažinti rizikas ir apsaugoti žmonių teises. Tačiau įstatymai ne visada spėja paskui technologijas. Galbūt svarbiausias įgūdis ateityje bus ne programavimas, o kritinis mąstymas – gebėjimas atskirti tiesą nuo įtikinamai skambančios netiesos.

  O kaip jūs naudojatės dirbtiniu intelektu – ar jis jums padeda, ar kelia nerimą?
