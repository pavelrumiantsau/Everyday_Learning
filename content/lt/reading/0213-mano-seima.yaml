text: |
  Labas, Lina!

  Ačiū už laišką. Tu klausi apie mano šeimą. Mūsų šeima nedidelė. Mano tėtis Petras yra inžinierius, jam penkiasdešimt metų. Mama Daiva dirba mokykloje, ji yra mokytoja.

  Aš turiu brolį ir seserį. Brolis Lukas yra studentas, jam dvidešimt vieneri metai. Sesuo Ugnė dar maža, jai septyni metai. Dar mes turime šunį. Jo vardas Reksas.

  O kokia tavo šeima? Ar turi brolių ar seserų? Rašyk!

  Austėja
