text: |
  – Laba diena! Ar jau išsirinkote?
  – Dar ne. Ką rekomenduojate?
  – Šiandien labai skanūs cepelinai ir šviežia žuvis su daržovėmis.
  – Aš nevalgau mėsos. Ar cepelinai su mėsa?
  – Taip, bet turime ir su varške.
  – Puiku, prašau cepelinų su varške. O mano draugui – žuvies su daržovėmis.
  – Ką gersite?
  – Dvi stiklines obuolių sulčių, prašau. Ir ar galima vandens be dujų?
  – Žinoma. Desertui siūlau tinginį – tai tradicinis lietuviškas pyragas.
  – Gerai, paragausime!
