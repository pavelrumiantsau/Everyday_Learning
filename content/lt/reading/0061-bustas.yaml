id: lt-r-0061
cefr: C1
title: "Nuosavas būstas: svajonė ar spąstai?"
topic: "жильё: покупка или аренда"
source: generated
text: |
  Lietuvoje daugiau nei aštuoni iš dešimties gyventojų gyvena nuosavame būste – tai vienas didžiausių rodiklių Europoje. Šis paprotys turi istorinę priežastį: dešimtajame dešimtmetyje butai buvo privatizuoti už simbolinę kainą ar investicinius čekius, todėl daugelis šeimų beveik per naktį tapo savininkėmis.

  Nuo to laiko nuosavas būstas lietuvių sąmonėje tapo sėkmės ir saugumo matu. Nuomotis iki trisdešimties ar keturiasdešimties daugeliui vis dar atrodo kaip nesėkmės ženklas, nors Vakarų Europoje tai visiškai įprasta. Tėvai neretai ragina vaikus kuo greičiau imti paskolą, nes mokėti svetimam esą tas pats, kas mesti pinigus į balą.

  Tačiau pastarąjį dešimtmetį būsto kainos, ypač Vilniuje, augo kur kas sparčiau nei atlyginimai. Jauna pora, norinti įsigyti dviejų kambarių butą sostinėje, turi sukaupti nemenką pradinį įnašą, o paskolą grąžinti dažnai tenka dvidešimt ar trisdešimt metų. Ne vienas jaunas žmogus prisipažįsta, kad toks įsipareigojimas jį gąsdina: paskola pririša prie vienos vietos ir vieno darbo.

  Kita problema – senstantys sovietmečio daugiabučiai. Daugelis jų buvo pastatyti skubotai ir prastai apšiltinti, todėl žiemą gyventojai gauna didžiules sąskaitas už šildymą. Renovacijos programa padeda, tačiau vyksta lėtai: kad namas būtų atnaujintas, turi sutikti dauguma butų savininkų, o susitarti pavyksta ne visada.

  Ekonomistai ragina plėtoti civilizuotą nuomos rinką, kad žmogus galėtų rinktis, o ne būtų verčiamas skolintis. Šiuo metu nuomos sutartys dažnai neformalios, nuomininkai jaučiasi neapsaugoti, o savininkai nepasitiki nuomininkais. Kol taip yra, nuosavas butas lieka ne tiek pasirinkimas, kiek vienintelis būdas jaustis saugiai.
