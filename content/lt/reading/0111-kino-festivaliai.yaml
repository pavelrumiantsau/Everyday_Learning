  - q: "Kodėl autorius festivalius vadina vartais į kitas kultūras?"
    options: ["Nes juose rodomi tik lietuviški filmai", "Nes žiūrovas susiduria su kinu, kurio pats nebūtų pasirinkęs", "Nes festivaliai vyksta užsienyje"]
    answer: 1
  - q: "Kokią festivalių silpnybę mini autorius?"
    options: ["Kad jie vyksta per retai", "Kad juose per mažai filmų", "Kad jie gali virsti madingu renginiu, kuriame svarbiau nusifotografuoti nei įsigilinti į filmą"]
