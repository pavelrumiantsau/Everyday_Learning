id: lt-r-0009
cefr: B1
title: Viešasis transportas
topic: общественный транспорт
source: generated
text: |
  Vilniuje neturiu automobilio, todėl į darbą važiuoju autobusu arba troleibusu. Viešasis transportas mieste veikia gana gerai: autobusai važiuoja dažnai, o stotelėse galima pamatyti, po kiek minučių atvažiuos reikiamas autobusas.

  Bilietą perku telefono programėlėje. Tai labai patogu: nereikia ieškoti kasos ar grynųjų pinigų. Įlipęs į autobusą iš karto aktyvuoju bilietą, nes kontrolieriai tikrina gana dažnai. Važiuoti be bilieto neverta – bauda didelė.

  Praėjusią savaitę man nutiko nemaloni istorija. Stovėjau stotelėje ir laukiau troleibuso, bet jis vis neatvažiavo. Po dvidešimties minučių supratau, kad kažkas ne taip. Viena vyresnio amžiaus keleivė paaiškino, kad centre įvyko avarija ir troleibusai važiuoja kitu maršrutu. Ji patarė man važiuoti autobusu iki Katedros aikštės, o toliau eiti pėsčiomis.

  Padėkojau jai ir padariau taip, kaip ji patarė. Į darbą atvykau pavėlavęs pusvalandį, bet vadovas nepyko. Buvau tai moteriai labai dėkingas. Nuo tada kiekvieną rytą programėlėje patikrinu, ar transportas važiuoja be vėlavimų.
