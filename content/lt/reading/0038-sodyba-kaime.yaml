id: lt-r-0038
cefr: B2
title: "Iš miesto – į sodybą"
topic: "горожане переезжают в деревню"
source: generated
text: |
  Lietuvos kaimai ilgą laiką tuštėjo: jaunimas išvažiuodavo mokytis ir dirbti į didmiesčius ar užsienį, o seni vienkiemiai likdavo apleisti. Pastaraisiais metais vis dažniau pastebima priešinga tendencija – miestiečiai perka sodybas kaime ir ten praleidžia savaitgalius, o kai kurie persikelia gyventi visam laikui.

  Priežasčių yra kelios. Nuotolinis darbas leidžia dirbti iš bet kur, jei tik yra geras internetas. Sodybos kaime kainuoja kelis kartus pigiau nei butai sostinėje. O svarbiausia – daugelis nori ramybės, gryno oro ir savo daržo. Šeimos su vaikais tikina, kad kaime vaikai daugiau laiko praleidžia lauke ir mažiau žiūri į ekranus.

  Vis dėlto gyvenimas kaime nėra toks idiliškas, kaip atrodo iš nuotraukų socialiniuose tinkluose. Seną sodybą dažnai tenka iš esmės remontuoti: keisti stogą, šildymo sistemą, kasti šulinį. Iki artimiausios parduotuvės, mokyklos ar gydytojo gali būti keliolika kilometrų, todėl be automobilio neišsiversi. Žiemą keliai kartais užpustomi, o autobusai važiuoja retai.

  Vietiniai gyventojai į naujakurius žiūri įvairiai. Vieni džiaugiasi, kad kaime vėl girdėti vaikų balsai, o apleisti namai atgyja. Kiti skundžiasi, kad miestiečiai nesupranta kaimo gyvenimo ritmo: piktinasi gaidžio giedojimu ryte arba traktorių triukšmu per šienapjūtę.

  Kai kurie naujakuriai kaime ne tik gyvena, bet ir kuria verslus. Vieni įrengia svečių namus ir priima turistus, kiti augina ekologiškas daržoves, kepa duoną ar gamina sūrius ir parduoda juos miesto turguose. Taip atsiranda naujų darbo vietų, kurių kaime labai trūksta.

  Sociologai mano, kad šis judėjimas gali padėti atgaivinti regionus, jeigu valstybė investuos į kelius, internetą ir viešąsias paslaugas. O kol kas vis daugiau lietuvių svajoja apie tai, ką jų seneliai laikė kasdienybe, – apie savo namą su obelimi kieme ir pirtimi prie ežero.
