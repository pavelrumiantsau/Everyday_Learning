id: lt-r-0080
cefr: C1
title: "Geležinio vilko šalyje"
topic: "волки и фермеры"
source: generated
text: |
  Pasak legendos, kunigaikščiui Gediminui susapnavo geležinis vilkas, staugiantis ant kalvos, ir tai paskatino jį įkurti Vilnių. Vilkas lietuvių kultūroje visada buvo dviprasmiškas simbolis: stiprybės ir laisvės ženklas, bet kartu – pavojus, nuo kurio reikėjo saugoti bandą.

  Šis dvilypumas išliko iki šių dienų. Lietuvos miškuose gyvena keli šimtai vilkų, ir jų skaičius pastaruoju metu nemažėja. Ūkininkai, ypač auginantys avis, skundžiasi, kad plėšrūnai kasmet išpjauna dešimtis gyvulių, o žalos kompensacijos dažnai būna per mažos ir mokamos per vėlai. Kai kuriuose kaimuose žmonės sako bijantys vakare išleisti vaikus į lauką.

  Gamtosaugininkai atsako, kad vilkai atlieka svarbų vaidmenį ekosistemoje: reguliuoja elnių ir šernų populiacijas, kurios kitu atveju naikintų jaunus miškus ir pasėlius. Be to, išpuoliai prieš žmones itin reti, o daugelio ginčų būtų galima išvengti tinkamai apsaugojus bandas – elektriniais aptvarais ar sarginiais šunimis.

  Ilgą laiką vilkas Europos Sąjungoje buvo griežtai saugoma rūšis, todėl jų medžioklė Lietuvoje buvo ribojama metiniais limitais. Neseniai apsaugos statusas Europoje sušvelnintas, ir tai vėl įžiebė diskusiją: vieni džiaugiasi, kad bus lengviau ginti ūkius, kiti baiminasi, kad tai atvers kelią nekontroliuojamai medžioklei.

  Ši diskusija iš esmės ne apie vilkus, o apie tai, kaip žmogus nori dalytis erdve su laukine gamta. Kaip pastebi vienas biologas, vilkas nesirenka, ar jis bus legendos herojus, ar kenkėjas – tai sprendžiame mes.
