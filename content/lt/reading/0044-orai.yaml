id: lt-r-0044
cefr: B2
title: "Kai orai krečia pokštus"
topic: "экстремальная погода и климат"
source: generated
text: |
  Lietuvos klimatas visada buvo gana nuosaikus: ne per karštos vasaros, snieguotos žiemos, lietingi rudenys. Tačiau pastaraisiais dešimtmečiais orai vis dažniau krečia pokštus. Meteorologai pastebi, kad vidutinė metų temperatūra kyla, o karštų dienų vasarą daugėja.

  Žiemos tapo permainingesnės. Vieną savaitę spaudžia šaltis, kitą – lyja, o termometras rodo kelis laipsnius šilumos. Vaikai, kurie laukia sniego, kartais jo sulaukia tik kelioms dienoms per visą žiemą, o slidinėjimo trasose tenka gaminti dirbtinį sniegą.

  Ūkininkams ypač skaudžios sausros. 2018 metų vasarą dėl sausros Lietuvoje buvo paskelbta valstybės lygio ekstremalioji situacija: derlius buvo gerokai mažesnis, o gyvuliams trūko pašarų. O būna metų, kai, priešingai, ilgi lietūs trukdo laiku nuimti javus, ir grūdai supūva laukuose.

  Vasarą vis dažniau užeina karščio bangos. Karštomis dienomis miestuose tampa sunku kvėpuoti, ypač vyresnio amžiaus žmonėms. Gydytojai pataria gerti daugiau vandens ir vengti saulės vidurdienį. Anksčiau oro kondicionieriai Lietuvos butuose buvo retenybė, o dabar juos įsirengia vis daugiau šeimų.

  Vis dažniau pasitaiko ir stiprių vėtrų. Nuvirtę medžiai užtveria kelius, nutrūksta elektros laidai, ir tūkstančiai kaimo gyventojų kartais net kelias dienas lieka be elektros. Todėl energetikos bendrovės oro linijas palaipsniui keičia požeminiais kabeliais.

  Pavasarį Nemuno deltoje, ypač apie Rusnę, beveik kasmet kyla potvyniai. Vietiniai gyventojai prie jų pripratę: tuo metu į kai kurias sodybas galima nuplaukti tik valtimi. Tačiau mokslininkai perspėja, kad ateityje dėl kylančio jūros lygio ir stipresnių liūčių potvyniai gali tapti pavojingesni.

  Prisitaikyti prie naujų orų tenka visiems. Miestuose sodinama daugiau medžių, kurie vasarą suteikia pavėsį, statomi geriau apšiltinti pastatai, o ūkininkai renkasi sausrai atsparesnes kultūras. Kaip sako senas posakis, blogų orų nebūna – būna tik netinkami drabužiai. Deja, vien tinkamų drabužių šiandien jau nebeužtenka.
