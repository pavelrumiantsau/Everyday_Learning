text: |
  Mieli draugai!

  Kviečiame jus į mūsų vestuves, kurios vyks 2027 m. liepos 10 d. 15 val. Trakų pilies kieme. Po ceremonijos – vakarienė ir šokiai restorane „Ežeras“.

  Prašome iki birželio 1 d. atsakyti, ar galėsite atvykti. Jeigu norite mums ką nors padovanoti, geriausia dovana – jūsų buvimas kartu su mumis!

  Laukiame jūsų!
  Eglė ir Paulius
  Tel. +370 655 44321
