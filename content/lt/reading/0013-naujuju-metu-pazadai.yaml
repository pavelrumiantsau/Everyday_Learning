id: lt-r-0013
cefr: B1
title: Naujųjų metų pažadai
topic: новогодние обещания
source: generated
text: |
  Kiekvienų metų pabaigoje sau pažadu, kad naujaisiais metais būsiu geresnis. Deja, dažniausiai jau vasarį savo pažadus pamirštu. Šį kartą nusprendžiau elgtis kitaip: pažadų bus tik trys, ir aš juos užsirašysiu į sąsiuvinį.

  Pirmas pažadas – mokytis lietuvių kalbos kiekvieną dieną. Mokysiuosi bent dvidešimt minučių per dieną: kartosiu žodžius, skaitysiu tekstus ir su kolegomis kalbėsiu tik lietuviškai. Jei man pavyktų, metų pabaigoje galėčiau laisvai kalbėti ir suprasti beveik viską.

  Antras pažadas – daugiau sportuoti. Dar gruodį užsirašiau į sporto klubą netoli namų. Du kartus per savaitę eisiu į treniruotes, o savaitgaliais bėgiosiu parke. Trečias pažadas – rečiau žiūrėti į telefoną. Vakare padėsiu jį į kitą kambarį, o prieš miegą skaitysiu knygą.

  Žinau, kad nebus lengva. Todėl apie savo pažadus papasakojau draugui – jis kas mėnesį manęs paklaus, kaip man sekasi. Jei kada nors nepavyks, nepasiduosiu ir tiesiog pradėsiu iš naujo. Svarbiausia – ne tobulas rezultatas, o maži žingsniai kiekvieną dieną.
