id: lt-r-0062
cefr: C1
title: "Nuo Baltijos kelio iki savanorystės"
topic: "гражданское общество и волонтёрство"
source: generated
text: |
  1989 metų rugpjūčio 23-iąją apie du milijonus žmonių susikibo rankomis ir sudarė gyvą grandinę nuo Vilniaus iki Talino. Baltijos kelias iki šiol laikomas vienu įspūdingiausių taikaus pasipriešinimo pavyzdžių pasaulyje. Paradoksalu, bet po nepriklausomybės atkūrimo ilgą laiką buvo kalbama, kad pilietinė visuomenė Lietuvoje silpna: žmonės nepasitiki institucijomis, nedalyvauja bendruomenių veikloje ir retai savanoriauja.

  Tokį pasyvumą sociologai dažnai siejo su sovietmečio palikimu. Kai „visuomeninė veikla“ dešimtmečius reiškė privalomus susirinkimus ir talkas, žodis „savanoris“ kėlė įtarimą. Be to, ekonominių sunkumų metais daugelis tiesiog neturėjo jėgų rūpintis kuo nors daugiau nei savo šeima.

  Pastarąjį dešimtmetį vaizdas ėmė keistis. Prieš šventes prekybos centruose savanoriai renka maistą stokojantiems, jaunimas važiuoja tvarkyti miškų ir pakrančių, o po 2014 metų įvykių Ukrainoje gerokai išaugo Šaulių sąjunga, kurioje žmonės laisvu laiku mokosi ginti šalį.

  Bene ryškiausias pavyzdys – 2022-ųjų vasara. Per kelias dienas Lietuvos gyventojai suaukojo apie penkis milijonus eurų, kad nupirktų Ukrainai kovinį bepilotį orlaivį. Gamintojas galiausiai jį padovanojo, o surinkti pinigai buvo skirti kitai pagalbai Ukrainai. Ši istorija apskriejo pasaulio žiniasklaidą ir daugeliui lietuvių tapo pasididžiavimo šaltiniu.

  Vis dėlto kritikai primena, kad pilietiškumas – ne vien vienkartiniai gražūs gestai. Paaukoti telefonu kur kas lengviau nei kas mėnesį dalyvauti bendruomenės susirinkimuose ar ilgus metus padėti vienišai kaimynei. Tikrasis išbandymas – ar susitelkimo banga virs ilgalaikiu įpročiu, kai krizė pasibaigs ir dėmesys nuslūgs.
