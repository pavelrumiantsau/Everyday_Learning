title: "Kaip aš mokiausi lietuvių kalbos"
topic: "как я учила литовский"
source: generated
text: |
  Aš esu Olga. Į Lietuvą atvažiavau 2022 metais. Tada aš nekalbėjau lietuviškai, mokėjau tik žodžius „labas“ ir „ačiū“. Darbe visi kalbėjo lietuviškai, ir aš nieko nesupratau.

  Todėl aš pradėjau mokytis. Pirmus metus lankiau kursus du kartus per savaitę. Namie skaičiau knygas vaikams ir žiūrėjau lietuviškus filmus. Buvo sunku, ypač gramatika: septyni linksniai!

  Dabar aš kalbu lietuviškai gana gerai ir noriu laikyti egzaminą.
