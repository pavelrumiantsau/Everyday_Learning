title: "Naujas paltas"
topic: "покупка пальто"
source: generated
text: |
  Ruduo. Lauke jau šalta, todėl Eglė nori pirkti naują paltą. Šeštadienį ji eina į prekybos centrą.

  Parduotuvėje yra daug paltų: juodi, pilki, rudi, mėlyni. Eglei patinka raudonas paltas.
  – Ar galiu pasimatuoti? – klausia Eglė.
  – Žinoma, – sako pardavėja.

  Raudonas paltas gražus, bet labai brangus – du šimtai eurų. Kitas paltas pilkas ir pigesnis – šimtas eurų. Eglė perka pilką paltą ir dar mėlyną kepurę.
