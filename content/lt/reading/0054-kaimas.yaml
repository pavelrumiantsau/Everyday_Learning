id: lt-r-0054
cefr: C1
title: "Ar išliks lietuviškas kaimas?"
topic: "жизнь в деревне сегодня"
source: generated
text: |
  Lietuvių kultūroje kaimas visada užėmė ypatingą vietą. Iš kaimo gyvenimo kilo didelė dalis klasikinės literatūros, liaudies dainų ir švenčių papročių. Tačiau šiandien kaime gyvena tik maždaug trečdalis šalies gyventojų, ir šis skaičius toliau mažėja.

  Atkūrus nepriklausomybę, kolūkiai buvo išformuoti, o žemė grąžinta buvusiems savininkams ar jų paveldėtojams. Iš pradžių atrodė, kad atgims smulkių ūkių kraštas, apie kurį svajojo tarpukario kartos. Deja, daugeliui naujųjų ūkininkų trūko ir technikos, ir lėšų, ir patirties. Per kelis dešimtmečius didelė dalis žemės sukoncentruota stambiuose ūkiuose, kurie, pasitelkę modernią techniką, užaugina didžiulius grūdų kiekius – nemaža jų dalis eksportuojama.

  Paradoksalu, bet kuo našesnis žemės ūkis, tuo mažiau jam reikia žmonių. Vienas traktorininkas šiandien atlieka darbą, kuriam anksčiau būtų prireikę dešimčių rankų. Jaunimas, nematydamas perspektyvų, išvyksta mokytis į miestus ir retai begrįžta. Uždaromos mokyklos, paštai, parduotuvės, o likusiems gyventojams, dažniausiai senjorams, tenka važiuoti dešimtis kilometrų iki artimiausios ambulatorijos.

  Vis dėlto kaimas nemiršta – jis keičiasi. Daugelis miestiečių įsigyja sodybas, kuriose leidžia savaitgalius ir atostogas. Pandemijos metu, kai darbas persikėlė į internetą, kai kurios šeimos ryžosi kraustytis į kaimą visam laikui. Kuriasi kaimo turizmo sodybos, amatų dirbtuvės, ekologiški ūkiai, siūlantys savo produkciją tiesiai pirkėjams.

  Tokie naujakuriai neretai susiduria su vietinių nepasitikėjimu: jie kitaip leidžia laiką, kitaip žiūri į gamtą ir kaimynystę. Kita vertus, būtent jie atgaivina apleistus namus, kuria darbo vietas ir organizuoja renginius, į kuriuos susirenka visas kaimas.

  Taigi klausimas, ar kaimas išliks, galbūt suformuluotas netiksliai. Tikriausiai išliks – tik ne toks, kokį jį prisimename iš senelių pasakojimų, o mažiau susijęs su žemės darbais ir labiau – su gyvenimo būdu, kurį žmogus pasirenka sąmoningai.
