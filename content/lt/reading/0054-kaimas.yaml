questions:
  - q: "Kodėl smulkių ūkių kraštas, apie kurį svajota, taip ir neatsirado?"
    options: ["Naujiesiems ūkininkams trūko technikos, lėšų ir patirties", "Žemė nebuvo grąžinta savininkams", "Valstybė uždraudė smulkius ūkius"]
    answer: 0
  - q: "Kokį paradoksą mini autorius?"
    options: ["Kaime gyvena vis daugiau žmonių, bet ūkių mažėja", "Kuo našesnis žemės ūkis, tuo mažiau jam reikia darbuotojų", "Grūdų užauginama daugiau, nei galima parduoti"]
    answer: 1
  - q: "Kaip autorius atsako į pavadinime iškeltą klausimą?"
    options: ["Kaimas netrukus išnyks", "Kaimas liks toks pat kaip senelių laikais", "Kaimas tikriausiai išliks, bet kaip pasirinktas gyvenimo būdas, o ne vien žemės darbų vieta"]
    answer: 2
