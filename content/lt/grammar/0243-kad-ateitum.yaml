id: lt-g-0243
cefr: A2
order: 243
track: foundation
title: "Чтобы: noriu, kad tu ateitum; patariu, kad…"
explanation:
  ru: |
    **Kad** значит и «что», и «чтобы». Разницу показывает глагол:
    - **kad + обычное время** = «что»: *Žinau, kad tu grįši.* — Знаю, что ты вернёшься.
    - **kad + условное наклонение** = «чтобы»: *Noriu, kad tu ateitum.* — Хочу, чтобы ты пришёл.

    После слов «хочу, прошу, советую, желаю» — условное:
    - *Prašau, kad paskambintumėte rytoj.* — Прошу, чтобы вы позвонили завтра.
    - *Gydytojas pataria, kad daugiau vaikščiočiau.* — Врач советует, чтобы я больше ходил пешком.
    - *Linkiu, kad greitai pasveiktum.* — Желаю, чтобы ты быстро выздоровел.

    **Цель** («чтобы»): *Einu į parduotuvę, kad nupirkčiau duonos.* Если лицо то же, проще с инфинитивом: *Einu į parduotuvę nupirkti duonos.*
comparison:
  ru: |
    Как русское «чтобы» + прошедшее время («чтобы ты пришёл»): по-литовски *kad* + условное наклонение — *kad tu ateitum*.
examples:
  - { text: "Nenoriu, kad tu ateitum.", translation: "Я не хочу, чтобы ты приходила.", source: "tatoeba:3946397" }
  - { text: "Aš norėčiau, kad tu būtum čia.", translation: "Я хотел бы, чтобы ты была здесь.", source: "tatoeba:9626169" }
  - { text: "Aš žinau, kad tu grįši.", translation: "Я знаю, что ты вернёшься.", source: "tatoeba:10752901" }
  - { text: "Aš žinau, kad jis išeis.", translation: "Я знаю, что он уйдёт.", source: "tatoeba:10723099" }
