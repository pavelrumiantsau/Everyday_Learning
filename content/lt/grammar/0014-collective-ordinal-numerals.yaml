id: lt-g-0014
cefr: B1
order: 14
title: "Числительные: dveji metai, trečias aukštas, даты и время"
explanation:
  ru: |
    **Собирательные числительные** нужны с существительными, у которых **нет единственного числа**: *metai* (год/годы), *marškiniai*, *kelnės*, *durys*, *akiniai*, *žirklės*, *vartai*. С ними нельзя сказать *du metai* — только **dveji metai**.
    - м. р.: vieneri, **dveji, treji, ketveri, penkeri**, šešeri, septyneri, aštuoneri, devyneri
    - ж. р.: vienerios, **dvejos, trejos, ketverios, penkerios**…

    Они склоняются и согласуются: им. *dveji metai*, род. *dvejų metų*, вин. **dvejus metus**, тв. *dvejais metais*; ж. р.: *dvejos durys*, вин. **dvejas duris**. С 10 и дальше — как обычно, родительный: *dešimt metų*. В составных — последнее слово: *dvidešimt **vieneri** metai*.

    Возраст говорят так же: *Man **penkeri** (metai)*, *trejų metų vaikas* — «трёхлетний ребёнок».

    **Порядковые числительные** — обычные прилагательные: *pirmas, antras, **trečias**, ketvirtas, penktas, šeštas, septintas, aštuntas, devintas, dešimtas*; ж. р. *pirma, antra, trečia*… Склоняются как *naujas* (а *trečias* — как *žalias*): *trečiame aukšte* (на третьем этаже), *trečioje eilėje*.

    **Время:**
    - *Kelinta valanda?* — ***Trečia*** (valanda). — «Три часа».
    - *Kelintą / kurią valandą?* — ***Trečią*** (valandą). — «В три» (винительный).
    - *pusė **trečios*** — «половина третьего» (родительный ж. р.).

    **Даты:** месяц в родительном + порядковое. «Какое сегодня число» — местоименная форма: *Šiandien spalio **penktoji***. «Когда?» — винительный: *spalio **penktą** (dieną)*. Пишется *spalio 5 d.*
comparison:
  ru: |
    Собирательные похожи на русские *двое, трое* (*двое суток, трое ножниц*), но в литовском они **обязательны** с любым словом без единственного числа и полностью склоняются: «два года» — ***dveji** metai*, «прожил два года» — *gyveno **dvejus** metus*.

    Главное отличие во времени: по-русски «в три часа» — количественное, а по-литовски **порядковое**: *trečią valandą* — буквально «в третий час» (как русское «в котором часу?»). «Половина третьего» — дословно ***pusė trečios***. Дата — «пятого октября» → *spalio penktą*: месяц стоит в родительном **впереди**, а число — в винительном.
examples:
  - { text: "Karas truko dvejus metus.", translation: "Война длилась два года.", source: "tatoeba:1517074" }
  - { text: "Valgykloje yra dvejos durys.", translation: "В столовой две двери.", source: "tatoeba:10836910" }
  - { text: "Aš gyvenau trečiame aukšte.", translation: "Я жил на третьем этаже.", source: "tatoeba:13417862" }
  - { text: "Ateik antrą valandą.", translation: "Приходи в два часа.", source: "tatoeba:12286362" }
  - { text: "Šiandien kovo penktoji.", translation: "Сегодня пятое марта.", source: "tatoeba:4627907" }
