id: lt-g-0244
cefr: A2
order: 244
track: foundation
title: "Как мне: man šalta, liūdna, nuobodu, gaila, baisu"
explanation:
  ru: |
    Состояние человека — как в русском: **кому** (дательный) + слово на **-a** (средний род):
    - *Man šalta.* — Мне холодно. *Man karšta.* — Мне жарко.
    - *Man liūdna.* — Мне грустно. *Man linksma.* — Мне весело.
    - *Man nuobodu.* — Мне скучно. *Man baisu.* — Мне страшно.
    - *Man gera.* — Мне хорошо. *Man bloga.* — Мне плохо (нехорошо, тошнит).
    - *Man gaila.* — Мне жаль. *Man gėda.* — Мне стыдно.

    Время показывает *būti*: *Man **buvo** šalta.* — Мне было холодно. *Rytoj **bus** šilta.* — Завтра будет тепло.

    Погода — так же, только без «кому»: *Šalta. Šilta. Karšta.*
comparison:
  ru: |
    Устроено так же, как русское «мне холодно, мне скучно». Слова тоже похожи по смыслу один к одному: *man liūdna* — «мне грустно».
examples:
