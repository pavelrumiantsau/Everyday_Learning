id: lt-g-0238
cefr: A2
order: 238
track: foundation
title: "Условное наклонение: norėčiau, galėtume, būtų; jeigu turėčiau…"
explanation:
  ru: |
    «Бы» по-литовски — особые окончания глагола (*tariamoji nuosaka*). От инфинитива без *-ti*:
    - aš **-čiau**, tu **-tum**, jis/ji **-tų**, mes **-tume**, jūs **-tumėte**, jie/jos **-tų** (вместо *-ti*)
    - norėti → norė**čiau**, norė**tum**, norė**tų**, norė**tume**, norė**tumėte**
    - būti → **būčiau**, būtum, **būtų**; galėti → **galėčiau**, galėtume; eiti → **eičiau**

    Когда нужно:
    - **вежливо**: *Norėčiau kavos. Ar galėtumėte padėti?*
    - **желание, совет**: *Būtų gerai pailsėti.* — Хорошо бы отдохнуть.
    - **нереальное условие** с *jeigu / jei*: *Jeigu **turėčiau** laiko, **važiuočiau** prie jūros.* — Если бы у меня было время, я бы поехал на море.

    Например: *važiuoti → važiuočiau, važiuotume*; *matyti → matyčiau*.
comparison:
  ru: |
    Русское «бы» — отдельное слово, литовское «бы» спрятано в окончании: *norėčiau* = «я хотел бы». В условии «бы» стоит в обеих частях: *jeigu turėčiau…, važiuočiau…*
examples:
  - { text: "Tai būtų puiku.", translation: "Это было бы прекрасно.", source: "tatoeba:11932071" }
  - { text: "Tai būtų gerai.", translation: "Это было бы хорошо.", source: "tatoeba:12092501" }
  - { text: "Kuo norėtum būti?", translation: "Кем бы ты хотел стать?", source: "tatoeba:4923406" }
  - { text: "O kur tu norėtum?", translation: "А куда бы ты хотел?", source: "tatoeba:13730144" }
  - { text: "Ar tu norėtum šuns?", translation: "Ты бы хотел собаку?", source: "tatoeba:11815491" }
