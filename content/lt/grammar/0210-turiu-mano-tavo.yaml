id: lt-g-0210
cefr: A1
order: 210
track: foundation
title: "У меня есть: turiu brolį; mano, tavo, jo, jos"
explanation:
  ru: |
    «У меня есть» по-литовски — глагол **turėti** («иметь»): *Aš **turiu** brolį.* — У меня есть брат.
    - aš **turiu**, tu **turi**, jis/ji **turi**, mes **turime**, jūs **turite**, jie/jos **turi**

    После *turėti* — винительный падеж: *turiu brolį, seserį, sūnų, dukterį, katę, šunį*.
    С отрицанием — родительный: *Aš **neturiu** brolio.* — У меня нет брата.

    **Чей?** Притяжательные слова не меняются:
    - **mano** — мой, моя; **tavo** — твой; **jo** — его; **jos** — её
    - **mūsų** — наш; **jūsų** — ваш; **jų** — их

    *Mano brolis, mano sesuo, mano vaikai* — одно и то же *mano*.
comparison:
  ru: |
    По-русски «у меня есть», по-литовски «я имею»: *turiu*. А *mano, tavo, jo, jos* — как русские «его», «её»: не меняются ни по роду, ни по падежу.
examples:
  - { text: "Aš turiu seserį.", translation: "У меня есть сестра.", source: "tatoeba:12220383" }
  - { text: "Aš turiu šunį ir katę.", translation: "У меня есть собака и кошка.", source: "tatoeba:13207217" }
  - { text: "Aš neturiu brolio.", translation: "У меня нет брата.", source: "tatoeba:3954170" }
  - { text: "Jis neturi automobilio.", translation: "У него нет машины.", source: "tatoeba:13070247" }
  - { text: "Tavo duktė dirba?", translation: "Твоя дочь работает?", source: "tatoeba:9754299" }
