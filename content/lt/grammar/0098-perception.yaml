  - type: cloze
    text: "Pamačiau ją ___ gatve."
    answer: "einant"
    hint: "eiti → -ant"
    translation: "Я увидел, как она идёт по улице."
  - type: cloze
    text: "Ar girdėjai, ___ šuo loja?"
    answer: "kaip"
