    text: "Vakar aš ___ visą knygą, todėl galiu ją tau duoti."
    answer: "perskaičiau"
    hint: "perskaityti, прош. вр."
    translation: "Вчера я прочитал всю книгу, поэтому могу дать её тебе."
  - type: cloze
    text: "Kai aš ___ laišką, paskambino draugas."
    answer: "rašiau"
    hint: "rašyti — процесс"
    translation: "Когда я писал письмо, позвонил друг."
  - type: cloze
    text: "Rytoj aš ___ tau žinutę."
    answer: "parašysiu"
    hint: "parašyti, буд. вр."
    translation: "Завтра я напишу тебе сообщение."
  - type: cloze
    text: "Vaikas ___ visą pyragą!"
