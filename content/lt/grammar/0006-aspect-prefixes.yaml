    translation: "Ребёнок съел весь пирог!"
  - type: cloze
    text: "Ar tu jau ___ vaistus?"
    answer: "išgėrei"
    hint: "išgerti, прош. вр."
    translation: "Ты уже выпил лекарство?"
  - type: cloze
    text: "Visą vakarą mes ___ televizorių."
    answer: "žiūrėjome"
    also: ["žiūrėjom"]
    hint: "žiūrėti — процесс"
    translation: "Весь вечер мы смотрели телевизор."
  - type: cloze
    text: "Jie ___ naują namą per vienerius metus."
    answer: "pastatė"
