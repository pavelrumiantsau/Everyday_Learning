id: lt-g-0093
cefr: B1
order: 93
title: "Сколько: daug, nemažai, dauguma, daugelis, keli, keletas"
explanation:
  ru: |
    **daug / mažai / nemažai / kiek** + родительный: *daug **žmonių**, mažai **laiko**, nemažai **pinigų**, kiek **metų**?*

    **dauguma** — большинство, **daugelis** — многие; оба + род. п., глагол обычно в **ед. ч.**:
    - ***Dauguma** žmonių taip **mano**.* · ***Daugelis** apie tai **kalbėjo**.*

    **Несколько** — два слова:
    - ***keli / kelios*** — согласуется как прилагательное: *keli draugai, kelios dienos, kelių žmonių, kelias minutes*
    - ***keletas*** + род. п. (вин. ***keletą***): *keletas draugų, turiu keletą klausimų*
    - с *metai* и другими словами только во мн. ч. — ***keleri***: *prieš **kelerius** metus*

    И противоположности: ***nė vienas*** — ни один, ***visi*** — все.
comparison:
  ru: |
    «Большинство» (*dauguma*) — часть целого, «многие» (*daugelis*) — просто много. «Несколько дней» можно сказать двумя способами: *kelias dienas* или *keletą dienų*.
examples:
  - { text: "Taip galvoja dauguma.", translation: "Так думает большинство.", source: "tatoeba:13265445" }
  - { text: "Taip galvoja dauguma žmonių.", translation: "Так думает большинство людей.", source: "tatoeba:13265450" }
  - { text: "Apie tai daugelis kalbėjo.", translation: "Об этом многие говорили.", source: "tatoeba:12173384" }
  - { text: "Tu moki keletą kalbų.", translation: "Ты владеешь несколькими языками.", source: "tatoeba:12967222" }
  - { text: "Aš nemažai mačiau.", translation: "Я много чего видел.", source: "tatoeba:8217172" }
exercises:
