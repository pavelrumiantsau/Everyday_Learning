  - type: cloze
    text: "Prieš ___ metus čia buvo miškas."
    answer: "kelerius"
    hint: "keleri (metai) → вин. п."
    translation: "Несколько лет назад здесь был лес."
  - type: cloze
    text: "Šiandien turiu labai ___ laiko."
    answer: "mažai"
    hint: "мало"
    translation: "Сегодня у меня очень мало времени."
  - type: cloze
    text: "___ kainuoja šitas bilietas?"
    answer: "Kiek"
    hint: "сколько"
    translation: "Сколько стоит этот билет?"
