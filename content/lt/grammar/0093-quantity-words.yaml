    text: "Parke buvo ___ žmonių."
    answer: "daug"
    also: ["nemažai"]
    hint: "много"
    translation: "В парке было много людей."
  - type: cloze
    text: "___ studentų išlaikė egzaminą."
    answer: "Dauguma"
    also: ["Daugelis"]
    hint: "большинство"
    translation: "Большинство студентов сдали экзамен."
  - type: cloze
    text: "Lauksiu tavęs ___ minutes."
    answer: "kelias"
    hint: "keli → вин. п. ж. р."
    translation: "Я подожду тебя несколько минут."
  - type: cloze
    text: "Turiu ___ klausimų."
    answer: "keletą"
    hint: "keletas → вин. п."
    translation: "У меня есть несколько вопросов."
  - type: cloze
    text: "___ mano, kad tai tiesa."
