id: lt-g-0256
cefr: A1
order: 256
track: foundation
title: "ie, uo и дифтонги ai, ei, au, ui"
explanation:
  ru: |
    Некоторые пары гласных читаются **одним слогом**:

    - **ie** — как «иэ» слитно: *pienas, diena, šiandien*
    - **uo** — как «уо» слитно: *duona, ruduo, šuo*
    - **ai** — «ай»: *laikas, gerai*
    - **ei** — «эй»: *eiti, eik*
    - **au** — «ау»: *Kaunas, laukas*
    - **ui** — «уй»: *muilas* (мыло)

    Не разбивайте их на два слога: *die-na*, а не *di-e-na*.
comparison:
  ru: |
    *ai, ei, au* похожи на русские «ай, эй, ау» в «чай, эй, мяу». *ie* и *uo* — новые звуки: начните с «и» / «у» и плавно перейдите к «э» / «о», не останавливаясь.
examples:
  - { text: "Kur pienas?", translation: "Где молоко?", source: "tatoeba:3931784" }
  - { text: "Vėl ruduo.", translation: "Опять осень.", source: "tatoeba:10752837" }
  - { text: "Tai šuo!", translation: "Это собака!", source: "tatoeba:13401994" }
  - { text: "Gali eiti.", translation: "Можешь идти.", source: "tatoeba:12509972" }
