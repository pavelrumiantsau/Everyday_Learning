id: lt-g-0087
cefr: B1
order: 87
title: "Есть и бывает: yra – būna – buvo – būdavo"
explanation:
  ru: |
    У глагола *būti* в настоящем времени **две формы**, и они различаются так же, как русские «есть» и «бывает».

    - ***yra*** — есть, сейчас, конкретно: *Šiandien **yra** šalta.* · *Mieste **yra** daug žmonių.*
    - ***būna*** — бывает, обычно, регулярно: *Žiemą **būna** šalta.* · *Kartais taip **būna**.*
      - спрягается полностью: *būnu, būni, būna, būname, būnate*: *Kur **būni** vakarais?* — где ты обычно бываешь вечерами?

    В прошедшем — так же пара:
    - ***buvo*** — было (один раз, конкретно): *Vakar **buvo** šalta.*
    - ***būdavo*** — бывало (повторялось): *Vaikystėje vasaros **būdavo** karštos.*
comparison:
  ru: |
    Совпадает с русским «есть — бывает», «было — бывало». Ошибка — сказать *Žiemą yra šalta* о том, что повторяется каждый год: лучше ***būna***.
examples:
  - { text: "Kartais taip būna.", translation: "Иногда это так.", source: "tatoeba:11568231" }
  - { text: "Tai ne dažnai būna.", translation: "Это не часто бывает.", source: "tatoeba:12958527" }
  - { text: "Kokie orai būna žiemą?", translation: "Зимой какая бывает погода?", source: "tatoeba:2157653" }
  - { text: "Rudenį tai dažnai būdavo.", translation: "Это часто бывало осенью.", source: "tatoeba:12480884" }
  - { text: "Taip būdavo, ir ne sykį.", translation: "Такое бывало, и не раз.", source: "tatoeba:13036597" }
