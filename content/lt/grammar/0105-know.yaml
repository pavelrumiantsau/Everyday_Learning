id: lt-g-0105
cefr: B1
order: 105
title: "Знать: žinoti, pažinti, mokėti, išmanyti; узнать: sužinoti, atpažinti"
explanation:
  ru: |
    Русское «знать» — четыре литовских глагола:

    - ***žinoti*** (žino, žinojo) — знать **факт, информацию**: *Žinau, kur jis gyvena.* · *Ar žinai, kiek valandų?*
    - ***pažinti*** (pažįsta, pažino) — знать **человека или место** (быть знакомым): *Pažįstu jį seniai.* · *Gerai pažįstu Vilnių.*
      - ***susipažinti*** su kuo — познакомиться: *Malonu susipažinti!*
    - ***mokėti*** — знать **язык**, уметь: *Moku tris kalbas.*
    - ***išmanyti*** + вин. — **разбираться**: *Jis išmano kompiuterius.*

    «Узнать» — тоже по-разному:
    - ***sužinoti*** — узнать **новость**: *Sužinojau, kad…*
    - ***atpažinti*** — узнать **в лицо**: *Neatpažinau tavęs!*
comparison:
  ru: |
    «Я его знаю» = *Aš jį **pažįstu*** (не *žinau*). «Знаю английский» = *Moku anglų kalbą*. «Не узнал тебя» = *Neatpažinau tavęs*, а «узнал, что…» = *Sužinojau, kad…*.
examples:
  - { text: "Aš ją pažįstu.", translation: "Я её знаю.", source: "tatoeba:9233631" }
  - { text: "Aš abu pažįstu.", translation: "Я знаю обоих.", source: "tatoeba:12195928" }
  - { text: "Ką tu žinai?", translation: "Что ты знаешь?", source: "tatoeba:2728961" }
  - { text: "Ji jau žino.", translation: "Она уже знает.", source: "tatoeba:12202073" }
