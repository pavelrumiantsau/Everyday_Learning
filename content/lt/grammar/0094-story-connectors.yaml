id: lt-g-0094
cefr: B1
order: 94
title: "Рассказ по порядку: iš pradžių, paskui, tuo metu, staiga, galiausiai"
explanation:
  ru: |
    Чтобы пересказать историю или прочитанное (это задание есть на B2), нужны слова порядка событий:

    - ***iš pradžių*** — сначала · ***pirmiausia*** — прежде всего
    - ***paskui / po to / tada*** — потом, затем
    - ***tuo metu*** — в это время · ***tuo tarpu*** — тем временем, а между тем
    - ***staiga*** — вдруг, внезапно
    - ***netrukus*** — вскоре · ***vėliau*** — позже
    - ***galiausiai*** — в итоге, в конце концов · ***pagaliau*** — наконец-то

    ⚠️ ***paskui*** + винительный значит «за кем-то»: *Eik **paskui mane**.* — Иди за мной.
comparison:
  ru: |
    Почти один к одному с русским. Различайте: *iš pradžių* (сначала — в начале истории) и *pradėk **iš pradžių*** (начни сначала — заново); *galiausiai* (в итоге) и *pagaliau* (наконец-то, с облегчением).
examples:
  - { text: "Iš pradžių jis varžėsi.", translation: "Сначала он стеснялся.", source: "tatoeba:12654183" }
  - { text: "Paskui ji atvažiavo.", translation: "Потом она приехала.", source: "tatoeba:13004475" }
  - { text: "Staiga pradėjo lyti.", translation: "Внезапно пошёл дождь.", source: "tatoeba:8080724" }
  - { text: "Galiausiai jie pasidavė.", translation: "В итоге они сдались.", source: "tatoeba:13389011" }
  - { text: "Eik paskui mane.", translation: "Иди за мной.", source: "tatoeba:12195796" }
exercises:
  - type: cloze
    text: "___ viskas atrodė paprasta."
    answer: "Iš pradžių"
    hint: "сначала"
    translation: "Сначала всё казалось простым."
  - type: cloze
    text: "Pavalgėme, o ___ išėjome pasivaikščioti."
    answer: "paskui"
    also: ["tada", "po to"]
    hint: "потом"
    translation: "Мы поели, а потом пошли гулять."
  - type: cloze
    text: "Sėdėjome tyliai, ir ___ kažkas pasibeldė."
    answer: "staiga"
    hint: "вдруг"
    translation: "Мы сидели тихо, и вдруг кто-то постучал."
  - type: cloze
    text: "Aš gaminau vakarienę, o vyras ___ tvarkė kambarį."
    answer: "tuo metu"
    also: ["tuo tarpu"]
