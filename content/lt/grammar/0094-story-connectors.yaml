    translation: "Я готовила ужин, а муж в это время убирал комнату."
  - type: cloze
    text: "Ilgai ginčijomės, bet ___ susitarėme."
    answer: "galiausiai"
    also: ["pagaliau"]
    hint: "в итоге"
    translation: "Мы долго спорили, но в итоге договорились."
  - type: cloze
    text: "Dabar neturiu laiko – paskambinsiu ___."
    answer: "vėliau"
    hint: "позже"
    translation: "Сейчас нет времени — позвоню позже."
  - type: cloze
    text: "Šuo bėgo ___ šeimininką."
    answer: "paskui"
    hint: "за (кем)"
    translation: "Собака бежала за хозяином."
  - type: cloze
    text: "Lėktuvas pakilo ir ___ dingo debesyse."
    answer: "netrukus"
    hint: "вскоре"
    translation: "Самолёт взлетел и вскоре исчез в облаках."
