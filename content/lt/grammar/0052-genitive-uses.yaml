    text: "Nubėk į parduotuvę ___."
    answer: "duonos"
    hint: "duona → род. п. (за чем?)"
    translation: "Сбегай в магазин за хлебом."
  - type: cloze
    text: "Vaikai išėjo į mišką ___."
    answer: "grybų"
    hint: "grybai → род. п. мн. ч."
    translation: "Дети пошли в лес за грибами."
  - type: cloze
    text: "Tai mano ___ automobilis."
    answer: "brolio"
    hint: "brolis → род. п. (чей?)"
    translation: "Это машина моего брата."
  - type: cloze
    text: "Jis aukšto ___."
    answer: "ūgio"
    hint: "ūgis → род. п."
    translation: "Он высокого роста."
  - type: cloze
    text: "Šiandien ji geros ___."
    answer: "nuotaikos"
    hint: "nuotaika → род. п."
    translation: "Сегодня она в хорошем настроении."
  - type: cloze
    text: "___ metų vasara buvo karšta."
