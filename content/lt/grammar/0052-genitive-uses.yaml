id: lt-g-0052
cefr: B1
order: 52
title: "Родительный падеж: чей, за чем, какой (Tomo, einu duonos, geros nuotaikos)"
explanation:
  ru: |
    Кроме отрицания, *nėra* и количества (урок о родительном падеже), у родительного есть ещё несколько частых ролей:

    - **чей? какой?** — принадлежность и определение: ***Tomo** tėvai* — родители Тома, ***lietuvių** kalba* — литовский язык, ***vasaros** atostogos* — летний отпуск, ***miesto** centras* — центр города. Родительный стоит **перед** словом, к которому относится.
    - **за чем?** — цель после глаголов движения, **без предлога**: *Einu **duonos**.* — иду за хлебом; *Jie nuėjo **alaus**.* — пошли за пивом; *eiti **grybų**, **uogų*** — пойти по грибы, по ягоды.
    - **описание человека:** *Jis **aukšto ūgio**.* — он высокого роста; *vidutinio amžiaus* — средних лет; *Ji **geros nuotaikos**.* — она в хорошем настроении; *geros širdies žmogus* — добрый человек.
    - **время:** ***šių metų** pavasarį* — этой весной, ***praėjusios savaitės** pabaigoje* — в конце прошлой недели, *iki **kitų metų*** — до следующего года.
    - **глаголы желания, страха, ожидания, поиска:** *norėti, bijoti, laukti, ieškoti, prašyti, reikėti* + род. п.: *Vaikas bijo **tamsos**.*
comparison:
  ru: |
    Многое как в русском («родители Тома», «высокого роста»). Отличия: «пошёл **за** хлебом» → *nuėjo **duonos*** (без предлога); «**в** хорошем настроении» → *geros **nuotaikos*** (родительный вместо предлога); «литовский язык» → *lietuvių kalba* — буквально «язык литовцев».
examples:
  - { text: "Jie nuėjo alaus.", translation: "Они пошли за пивом.", source: "tatoeba:12755361" }
  - { text: "Tomo tėvai yra mokytojai.", translation: "Родители Тома — учителя.", source: "tatoeba:12119861" }
  - { text: "Jis yra geros širdies žmogus.", translation: "Он добросердечный человек.", source: "tatoeba:10348092" }
  - { text: "Ji yra blogos nuotaikos.", translation: "Она в плохом настроении.", source: "tatoeba:3592162" }
  - { text: "Reikės iki kitų metų palaukti.", translation: "Надо будет подождать до следующего года.", source: "tatoeba:13235333" }
