    hint: "века"
    translation: "Вильнюс впервые упомянут в начале XIV века."
  - type: cloze
    text: "Šis namas pastatytas praėjusio amžiaus devintajame ___."
    answer: "dešimtmetyje"
    hint: "десятилетии (dešimtmetis)"
    translation: "Этот дом построен в восьмидесятые годы прошлого века."
  - type: cloze
    text: "Sprendimas priimtas ___ į gyventojų nuomonę."
