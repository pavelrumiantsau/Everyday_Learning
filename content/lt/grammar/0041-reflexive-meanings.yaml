id: lt-g-0041
cefr: B1
order: 41
title: "Возвратные глаголы: что значит -si"
explanation:
  ru: |
    Частица **-si** (в конце или внутри глагола: *praustis, nusiprausti*) даёт несколько значений:

    - **действие на себя:** *praustis* (мыться), *rengtis* (одеваться), *šukuotis* (причёсываться)
    - **взаимное действие:** *susitikti* (встретиться), *bučiuotis* (целоваться), *sveikintis* (здороваться), *ginčytis* (спорить)
    - **действие само по себе:** *Durys **atsidarė**.* — Дверь открылась. *Kompiuteris **išsijungė**.*
    - **для себя:** *nusipirkti* (купить себе), *užsisakyti* (заказать себе)
    - **чувства и состояния:** *džiaugtis, jaudintis, juoktis*

    **Несовпадения с русским:**
    - в литовском **без -si**, в русском с «-ся»: ***bijoti*** — бояться, ***patikti*** — нравиться, ***rūpėti*** — беспокоить, волновать (*man rūpi* — меня волнует)
    - в литовском **с -si**, в русском без: ***klausytis*** — слушать (музыку, радио), ***mokytis*** — учить (что-то сам)
comparison:
  ru: |
    Большинство глаголов с -si совпадают с русскими на «-ся», но запомни ловушки: *bijau* (боюсь), *man patinka* (мне нравится) — без -si; *klausausi muzikos* (слушаю музыку) — с -si.
examples:
  - { text: "Tomas išsivalė dantis ir nusiprausė veidą.", translation: "Том почистил зубы и помыл лицо.", source: "tatoeba:3192490" }
  - { text: "Aš mačiau, kaip jie bučiuojasi.", translation: "Я видел, как они целуются.", source: "tatoeba:13171374" }
  - { text: "Lifto durys atsidarė.", translation: "Двери лифта открылись.", source: "tatoeba:13493753" }
  - { text: "Jie abu juokiasi.", translation: "Они оба смеются.", source: "tatoeba:10300492" }
  - { text: "Jie jaudinasi.", translation: "Они волнуются.", source: "tatoeba:12168552" }
