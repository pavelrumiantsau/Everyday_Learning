id: lt-g-0115
cefr: B1
order: 115
title: "Местный падеж: virtuvėje, darbe, vaikystėje, XX amžiuje, laikraščiuose"
explanation:
  ru: |
    Местный падеж (*kur? kada?*) — без предлога. Окончания: *-e* (mieste), *-yje* (brolyje), *-oje* (knygoje), *-ėje* (virtuvėje), *-uje* (turguje); мн. ч. *-uose, -ose, -ėse, -yse*.

    **1. Место — «где?»**, и там, где по-русски «на»:
    - *mieste, kaime, parduotuvėje, lovoje*
    - ***virtuvėje*** — на кухне, ***darbe*** — на работе, ***koncerte*** — на концерте, ***susirinkime*** — на собрании, *trečiame **aukšte*** — на третьем этаже, *gatvėje* — на улице

    *ant* + род. п. — только «на поверхности»: *ant stalo, ant sienos*. «На кухне» — не *ant virtuvės*.

    **2. Время — периоды жизни и истории:** *vaikystėje, jaunystėje, senatvėje*, *ateityje, praeityje*, *XX **amžiuje***, *metų **pradžioje** / **pabaigoje***. А дни, сезоны и месяцы — винительный: *pirmadienį, žiemą, gegužę*.

    **3. Внутри чего-то нематериального:** *širdyje, sapne* (во сне), *akyse* (в глазах), *gerose rankose*, *laikraščiuose / internete rašoma* (в газетах / в интернете пишут), *gyventi taikoje*.

    Куда? — *į* + вин. п.: *einu **į** parduotuvę* → *esu **parduotuvėje***.
comparison:
  ru: |
    Местный падеж — это русский предложный с «в»: *mieste* — «в городе». Отличие: литовский не делит «в» и «на» — «на работе, на кухне, на концерте» тоже местный падеж. Русское «на» превращается в *ant* только тогда, когда что-то лежит или стоит **сверху**.
examples:
  - { text: "Padėk man virtuvėje.", translation: "Помоги мне на кухне.", source: "tatoeba:12793181" }
  - { text: "Kaip sekasi darbe?", translation: "Как на работе дела?", source: "tatoeba:13396836" }
  - { text: "Aš jaunystėje rūkiau.", translation: "Я курил в молодости.", source: "tatoeba:10254804" }
  - { text: "Blogiausia jau praeityje.", translation: "Худшее позади.", source: "tatoeba:12425644" }
  - { text: "Ką rašo laikraščiuose?", translation: "Что пишут в газетах?", source: "tatoeba:12226635" }
