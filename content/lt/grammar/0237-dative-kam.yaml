id: lt-g-0237
cefr: A2
order: 237
track: foundation
title: "Кому? Дательный падеж: draugui, mamai, vaikams; dėkoju jums"
explanation:
  ru: |
    **Дательный падеж** (*naudininkas*) отвечает на вопрос **kam?** — кому?

    Окончания в единственном числе:
    - *-as* → **-ui**: draugas → draug**ui**; *-is, -ys* → **-iui**: brolis → brol**iui**
    - *-us* → **-ui**: sūnus → sūn**ui**
    - *-a* → **-ai**: mama → mam**ai**; *-ė* → **-ei**: Eglė → Egl**ei**
    - *sesuo* → **seseriai**, *duktė* → **dukteriai**, *šuo* → **šuniui**
    - мн. ч.: **-ams / -iams / -oms / -ėms**: draugams, broliams, mamoms, Eglėms

    Кому нужно дательный:
    - **давать, дарить, писать, звонить, помогать, говорить** кому: *duoti, dovanoti, rašyti, skambinti, padėti, sakyti*
    - **возраст, нравится, нужно**: *Man 30 metų. Mamai patinka gėlės. Broliui reikia pagalbos.*
    - **ловушка:** *dėkoti* + **дательный** — *Dėkoju **jums**!* (по-русски «благодарю **вас**» — винительный)
comparison:
  ru: |
    Почти как в русском: «дать другу», «позвонить маме». Ловушка — *dėkoti kam*: «благодарить **кого**» по-литовски «благодарить **кому**»: *dėkoju tau*.
examples:
  - { text: "Vėl paskambink man.", translation: "Перезвони мне.", source: "tatoeba:11497190" }
  - { text: "Prašau, duok man meniu.", translation: "Пожалуйста, дайте мне меню.", source: "tatoeba:11588146" }
  - { text: "Prašau padėkite man.", translation: "Пожалуйста, помогите мне.", source: "tatoeba:2225624" }
  - { text: "Kiek metų jūsų tėvams?", translation: "Сколько лет вашим родителям?", source: "tatoeba:10718284" }
  - { text: "Mūsų tėvams ji patiko.", translation: "Нашим родителям она нравилась.", source: "tatoeba:12582910" }
