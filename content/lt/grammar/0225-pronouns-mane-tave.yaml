id: lt-g-0225
cefr: A1
order: 225
track: foundation
title: "Меня, тебя, его: mane, tave, jį, ją; Aš tavęs nesuprantu"
explanation:
  ru: |
    **Кого?** — личные местоимения в винительном падеже:
    - aš → **mane**, tu → **tave**, jis → **jį**, ji → **ją**
    - mes → **mus**, jūs → **jus**, jie → **juos**, jos → **jas**
    - *Aš tave myliu.* — Я тебя люблю. *Ar tu mane supranti?* — Ты меня понимаешь?

    **С отрицанием** — родительный падеж (то же правило, что *negeriu kavos*):
    - aš → **manęs**, tu → **tavęs**, jis → **jo**, ji → **jos**, mes → **mūsų**, jūs → **jūsų**, jie/jos → **jų**
    - *Aš **tavęs** nesuprantu.* — Я тебя не понимаю. *Jis **manęs** nemato.* — Он меня не видит.

    Напоминание: **кому?** — *man, tau, jam, jai, mums, jums, jiems, joms* (*Man patinka…, Man reikia…*).
comparison:
  ru: |
    Как «меня, тебя, его, её» в русском. Ловушка — отрицание: по-русски «не понимаю **тебя**», по-литовски форма меняется: *nesuprantu **tavęs***.
examples:
  - { text: "Aš tave myliu.", translation: "Я тебя люблю.", source: "tatoeba:624348" }
  - { text: "Aš jį matau.", translation: "Я его вижу.", source: "tatoeba:12203620" }
  - { text: "Aš ją myliu.", translation: "Я люблю её.", source: "tatoeba:624345" }
  - { text: "Aš jus myliu.", translation: "Я вас люблю.", source: "tatoeba:12299941" }
  - { text: "Aš girdžiu tik tave.", translation: "Я слышу только тебя.", source: "tatoeba:3990864" }
