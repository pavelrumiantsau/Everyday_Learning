id: lt-g-0034
cefr: B1
order: 34
title: "Предлоги и падежи: be, prie, į, po, su…"
explanation:
  ru: |
    Каждый предлог требует своего падежа. Главные:

    **Родительный (ko?):**
    - **be** — без: *be cukraus*
    - **iš** — из: *iš Vilniaus*
    - **nuo** — от, с: *nuo ryto*
    - **prie** — у, возле: *prie durų*; за (столом): *prie stalo*
    - **iki** — до: *iki pirmadienio*
    - **dėl** — из-за, по поводу: *dėl lietaus*
    - **už** — за (позади): *už namo*
    - **po** — после: *po pietų*
    - **tarp** — между: *tarp namų*

    **Винительный (ką?):**
    - **į** — в (куда): *į parduotuvę*
    - **per** — через, в течение: *per gatvę, per savaitę*
    - **pro** — мимо, сквозь: *pro langą*
    - **prieš** — перед, против; назад: *prieš metus*
    - **apie** — о: *apie darbą*
    - **po** — по (повсюду): *po miestą*

    **Творительный (kuo?):**
    - **su** — с: *su draugu*
    - **po** — под: *po stalu*

    Обрати внимание на **po**: с разными падежами — разный смысл.
comparison:
  ru: |
    Ловушки для русскоговорящих: *prie stalo* — «за столом» (не «у стола»), *apie* + вин. п. («о работе» — *apie darbą*), *dėl* — и «из-за», и «по поводу». Место (где?) обычно передаётся без предлога — местным падежом: *parduotuvėje* — «в магазине».
examples:
  - { text: "Aš neisiu be tavęs.", translation: "Я не пойду без тебя.", source: "tatoeba:10005418" }
  - { text: "Ji stovi prie durų.", translation: "Она стоит у двери.", source: "tatoeba:13221398" }
  - { text: "Krepšys po stalu.", translation: "Корзина под столом.", source: "tatoeba:10665592" }
  - { text: "Ką matai pro langą?", translation: "Что ты видишь из окна?", source: "tatoeba:3571493" }
  - { text: "Visa tai dėl tavęs.", translation: "Всё это из-за тебя.", source: "tatoeba:12178331" }
exercises:
  - type: cloze
    text: "Kava be ___, prašau."
    answer: "cukraus"
    hint: "cukrus → be + род. п."
    translation: "Кофе без сахара, пожалуйста."
  - type: cloze
    text: "Katė miega po ___."
    answer: "lova"
    hint: "lova → po + твор. п. (под)"
    translation: "Кошка спит под кроватью."
  - type: cloze
    text: "Po ___ eisime pasivaikščioti."
    answer: "pietų"
    hint: "pietūs → po + род. п. (после)"
    translation: "После обеда пойдём погулять."
  - type: cloze
    text: "Einame į ___."
    answer: "parduotuvę"
    hint: "parduotuvė → į + вин. п."
    translation: "Идём в магазин."
  - type: cloze
    text: "Automobilis stovi už ___."
    answer: "namo"
    hint: "namas → už + род. п. (за)"
    translation: "Машина стоит за домом."
  - type: cloze
    text: "Jis daug kalbėjo apie savo ___."
    answer: "darbą"
    hint: "darbas → apie + вин. п."
    translation: "Он много говорил о своей работе."
  - type: cloze
    text: "Į kiną einu su ___."
    answer: "draugu"
    hint: "draugas → su + твор. п."
    translation: "В кино я иду с другом."
  - type: cloze
    text: "Visą dieną vaikščiojome po ___."
    answer: "miestą"
    hint: "miestas → po + вин. п. (по)"
    translation: "Весь день мы гуляли по городу."
