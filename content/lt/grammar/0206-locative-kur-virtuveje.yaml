id: lt-g-0206
cefr: A1
order: 206
track: foundation
title: "Где? Местный падеж: mieste, virtuvėje, Lietuvoje"
explanation:
  ru: |
    На вопрос **kur?** — «где?» — литовцы отвечают **местным падежом** (*vietininkas*). Предлог не нужен: одно окончание значит «в» или «на».

    Окончания в единственном числе:
    - *-as* → **-e**: miestas → mieste, butas → bute, parkas → parke, kaimas → kaime
    - *-ys, -is* → **-yje**: kambarys → kambaryje
    - *-ius* → **-iuje**: Vilnius → Vilniuje
    - *-a* → **-oje**: mokykla → mokykloje, Lietuva → Lietuvoje
    - *-ė* → **-ėje**: virtuvė → virtuvėje, kavinė → kavinėje, parduotuvė → parduotuvėje

    Запомнить:
    - **namie** или **namuose** — дома
    - **darbe** — на работе

    Вопрос *Kur tu gyveni?* — «Где ты живёшь?» — *Gyvenu Vilniuje.*

    А «куда?» — другой вопрос и другой падеж: *į* + винительный (*einu į parką*), это в юните «Город и транспорт».
comparison:
  ru: |
    По-русски «в городе», «на работе», «на кухне» — нужен предлог, и он бывает разный. По-литовски предлога нет, «в» и «на» одинаково передаёт окончание: *mieste, darbe, virtuvėje*.
examples:
  - { text: "Ji virtuvėje.", translation: "Она на кухне.", source: "tatoeba:3627151" }
  - { text: "Aš esu mieste.", translation: "Я в городе.", source: "tatoeba:13412456" }
  - { text: "Aš esu kavinėje.", translation: "Я в кафе.", source: "tatoeba:12161895" }
  - { text: "Kur jūs gyvenate?", translation: "Где вы живёте?", source: "tatoeba:6006469" }
  - { text: "Jis gyvena kaime.", translation: "Он живёт в деревне.", source: "tatoeba:12871414" }
