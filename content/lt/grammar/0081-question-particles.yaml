id: lt-g-0081
cefr: B1
order: 81
title: "Вопросы: ar, ar ne?, argi, nejaugi, kažin ar"
explanation:
  ru: |
    **ar** — вопрос «да или нет» (как русское «ли»): ***Ar** tu namie?* В разговоре *ar* часто опускают, оставляя интонацию: *Tu namie?*

    То же ***ar*** в косвенном вопросе = «ли»: *Nežinau, **ar** jis ateis.* — Не знаю, придёт ли он.

    **ar … ar** / **… ar …** — выбор («или» в вопросе): *Kava **ar** arbata?*

    Хвостики «не так ли?, правда?»: ***ar ne?*** или ***argi ne?***: *Šalta, ar ne?*

    Удивление и сомнение:
    - ***argi*** — «разве»: ***Argi** tu nežinai?*
    - ***nejaugi / nejau*** — «неужели»: ***Nejaugi** jau vakaras?*
    - ***kažin ar*** — «вряд ли / интересно, … ли»: ***Kažin ar** jis ateis.*
    - ***juk*** в вопросе — «ведь, же»: *Tu **juk** moki plaukti?*
comparison:
  ru: |
    Русское «или» в вопросе — это ***ar***, а не *arba*: «Чай или кофе?» = *Arbata **ar** kava?* (*arba* — «или» в утверждении: *Ateisiu rytoj arba poryt.*)
examples:
  - { text: "Šįryt vėsu, ar ne?", translation: "Сегодня утром прохладно, не так ли?", source: "tatoeba:12131551" }
  - { text: "Tu juokauji, ar ne?", translation: "Ты шутишь, не так ли?", source: "tatoeba:11532315" }
  - { text: "Tai visai ne staigmėna, argi ne?", translation: "Это совсем не удивительно, не так ли?", source: "tatoeba:1587673" }
  - { text: "Tu juk moki plaukti?", translation: "Ты же умеешь плавать?", source: "tatoeba:11505417" }
