id: lt-g-0260
cefr: A2
order: 260
track: foundation
title: "Экзамен A1–A2: части, баллы и как готовиться"
explanation:
  ru: |
    **Экзамен по государственному языку** базовой и I категории (A1–A2) проводит NŠA. Один экзамен даёт **A1 или A2**. Регистрация — на eksternams.nsa.smm.lt не позже чем за 7 дней; цену и даты проверьте там же.

    **Три части:**
    - **Чтение и письмо** (на компьютере): задания 1–4 — уровень A1 (22 балла), задания 5–9 — A2 (28 баллов)
    - **Аудирование**: задания 1–2 — A1 (10 баллов), 3–4 — A2 (10 баллов); каждая запись звучит **два раза**
    - **Говорение**: беседа с экзаменатором, 3 ситуации по 0–3 балла + 0–1 балл за беседу (всего 10)

    **Сколько нужно:** в каждой части — **60 %**. Чтение и письмо: A1 — от 13 из 22, A2 — от 17 из 28 (и A1 в этой же части). Аудирование: от 6 из 10 для каждого уровня. Говорение: A1 — от 5 баллов, и хотя бы две ситуации на 2; A2 — от 6 баллов, и две ситуации вместе на 5 (например, 3 + 2). **Итог A2 — только если все три части сданы на A2.**

    **Как готовиться в приложении:**
    - **Чтение:** сначала прочитайте вопросы, потом ищите ответ в тексте. Незнакомое слово часто не мешает ответить.
    - **Письмо:** выполните **каждый пункт задания** и держитесь нужного числа слов. Пишите простыми фразами, которые вы точно знаете. Буквы *ą, č, ę, ė, į, š, ų, ū, ž* обязательны.
    - **Аудирование:** в первый раз слушайте общий смысл, во второй — проверяйте ответы.
    - **Говорение:** отвечайте полными фразами. Не поняли — переспросите по-литовски, это нормально и не снижает оценку.

    Ниже — фразы, чтобы переспросить экзаменатора. Потом — три пробных экзамена: **A1** и два **A2**.
