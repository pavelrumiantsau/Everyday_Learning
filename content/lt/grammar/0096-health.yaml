id: lt-g-0096
cefr: B1
order: 96
title: "Здоровье: man skauda galvą, sergu gripu, jaučiuosi geriau"
explanation:
  ru: |
    **skaudėti** (skauda, skaudėjo) — болеть (о части тела): кому — дательный, **что — винительный**!
    - *Man skauda **galvą** / **dantį** / **pilvą** / **koją**.*

    **sirgti** (serga, sirgo) — болеть (быть больным), чем — творительный: *Sergu **gripu**.*
    - ***susirgti*** — заболеть · ***pasveikti*** — выздороветь: *Greitai pasveik!*
    - ***peršalti*** — простудиться · ***kosėti*** — кашлять

    **jaustis** (jaučiasi, jautėsi) — чувствовать себя:
    - *Kaip jautiesi?* — *Jaučiuosi **geriau** / blogai / pavargęs.*

    **Температура:** *Turiu temperatūros.* — У меня температура (родительный, «немного температуры»).
comparison:
  ru: |
    Главная ловушка: «у меня болит голова» = *Man skauda **galvą*** — винительный, не *galva*. «У меня температура» — ***turiu temperatūros*** (род. п.), а «болеть гриппом» — как в русском, творительный.
examples:
  - { text: "Man skauda galvą.", translation: "Голова у меня болит.", source: "tatoeba:2153648" }
  - { text: "Man skauda koją.", translation: "У меня болит нога.", source: "tatoeba:10752129" }
  - { text: "Mano tėvas serga.", translation: "Мой отец болен.", source: "tatoeba:12300464" }
  - { text: "Kaip tu jautiesi?", translation: "Как ты себя чувствуешь?", source: "tatoeba:8719288" }
  - { text: "Ar tu gerai jautiesi?", translation: "Ты хорошо себя чувствуешь?", source: "tatoeba:8047654" }
