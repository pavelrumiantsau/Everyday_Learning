id: lt-g-0232
cefr: A2
order: 232
track: foundation
title: "Повелительное наклонение: eik, eikite, eikime; nedaryk; nesijaudink"
explanation:
  ru: |
    Повторим: от инфинитива убираем *-ti* и добавляем:
    - **-k** — ты: *eik, važiuok, uždaryk*
    - **-kite** — вы: *eikite, važiuokite, uždarykite*
    - **-kime** — давай(те), мы: *eikime, važiuokime, valgykime* (в разговоре коротко: *einam!*)

    **Запрет** — *ne-* слитно: *nedaryk, neikite, nevažiuokime*.

    **Возвратные** глаголы: *-kis* (ты), *-kitės* (вы): *praustis → prauskis, prauskitės*; *atsisėsti → atsisėsk, atsisėskite*. С отрицанием *-si-* уходит вперёд: *jaudintis → **nesijaudink*** — не волнуйся.

    **Вежливо** — *prašom* / *prašau* + инфинитив: *Prašom užeiti.* — Заходите, пожалуйста. *Prašau palaukti.* — Подождите, пожалуйста.

    Исключения: *būk, duok, bėk*.
comparison:
  ru: |
    Форма *-kime* — как русское «пойдём(те)», «давайте поедем»: *eikime, važiuokime*. Запрет как в русском: *nedaryk* — «не делай».
examples:
  - { text: "Eikime namo!", translation: "Пошли домой!", source: "tatoeba:11992651" }
  - { text: "Nekalbėk.", translation: "Помалкивай.", source: "tatoeba:6742562" }
  - { text: "Nekalbėkite.", translation: "Помалкивайте.", source: "tatoeba:10255066" }
  - { text: "Neik viena.", translation: "Не выходи одна.", source: "tatoeba:11847980" }
  - { text: "Būk šalia.", translation: "Будь рядом.", source: "tatoeba:12141309" }
