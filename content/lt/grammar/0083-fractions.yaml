    translation: "Цены выросли на десять процентов."
  - type: cloze
    text: "Dabar ___ penkių."
    answer: "pusė"
    hint: "4:30"
    translation: "Сейчас половина пятого."
  - type: cloze
    text: "Prieš ___ metų persikėlėme į Kauną."
    answer: "pusantrų"
    hint: "полтора (metai — мн. ч.)"
    translation: "Полтора года назад мы переехали в Каунас."
