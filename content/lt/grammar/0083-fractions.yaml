    translation: "Оставь мне половину пирога."
  - type: cloze
    text: "Kelionė truko ___ valandos."
    answer: "pusantros"
    hint: "полтора (valanda — ж. р.)"
    translation: "Поездка длилась полтора часа."
  - type: cloze
    text: "Iki stotelės – ___ kilometro."
    answer: "pusantro"
    hint: "полтора (kilometras — м. р.)"
    translation: "До остановки — полтора километра."
  - type: cloze
