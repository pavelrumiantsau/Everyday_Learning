id: lt-g-0083
cefr: B1
order: 83
title: "Доли: pusė, pusantro, trečdalis, ketvirtis, procentai"
explanation:
  ru: |
    После всех долей существительное стоит в **родительном** падеже.

    **pusė** — половина: *pusė obuolio*; в вин. п. ***pusę***: *Palik man pusę.* · *laukiu pusę valandos* (полчаса)
    - время: ***pusė trijų*** = половина третьего (2:30)

    **pusantro / pusantros** — полтора / полторы:
    - м. р.: ***pusantro*** *metro, kilometro, mėnesio*
    - ж. р.: ***pusantros*** *valandos, dienos*
    - с *metai* (только мн. ч.): ***pusantrų*** *metų*

    **-dalis** — доли: ***trečdalis*** (треть), ***ketvirtis*** (четверть), *penktadalis, dešimtadalis*; мн. ч. *du trečdaliai, trys ketvirtadaliai*.

    **Проценты и десятичные:** *dešimt **procentų*** (род. мн.), *šimtu procentų* (на сто процентов); *2,5* = *du **kablelis** penki* (запятая = *kablelis*).
comparison:
  ru: |
    «Полтора» зависит от рода, как в русском (полтора / полторы): *pusantro metro*, но *pusantros valandos*. А «на десять процентов» — творительный без предлога: *pakilo **dešimčia** procentų*.
examples:
  - { text: "Man palik pusę.", translation: "Оставь мне половину.", source: "tatoeba:12161733" }
  - { text: "Mano sūnui pusantrų metų.", translation: "Моему сыну полтора года.", source: "tatoeba:10321083" }
  - { text: "Darbą aš pasiekiu per pusantros valandos.", translation: "Я добираюсь до работы за полтора часа.", source: "tatoeba:9146789" }
  - { text: "Aš suvalgiau ketvirtį pyrago.", translation: "Я съел четверть пирога.", source: "tatoeba:2586470" }
  - { text: "Devyniasdešimt procentų darbo atliko Tomas.", translation: "Девяносто процентов работы сделал Том.", source: "tatoeba:9131006" }
exercises:
