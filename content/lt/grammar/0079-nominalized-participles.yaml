id: lt-g-0079
cefr: B2
order: 79
title: "Причастия как существительные: pradedantieji, nukentėjusieji, miegamasis, mylimoji"
explanation:
  ru: |
    Как и в русском (*начинающие, пострадавшие, любимая*), причастия и прилагательные могут работать как существительные. В литовском для этого берут **местоименную (полную) форму** — ту же, что в *gerasis, geroji*.

    **Окончания:** м. р. ***-ysis / -asis***, ж. р. ***-ji / -oji***; мн. ч. ***-ieji / -osios***.
    - *pradedantysis* (начинающий) → мн. ч. ***pradedantieji***, дат. ***pradedantiesiems***
    - *susirinkusieji* (собравшиеся), *nukentėjusieji* (пострадавшие), *išgyvenusieji* (выжившие), *besimokantieji* (учащиеся)
    - *mylimasis / **mylimoji*** (любимый / любимая), тв. п. ***mylimąja***

    **Комнаты и места:** ***miegamasis*** (спальня), ***valgomasis*** (столовая) — мест. п. *miegamajame, valgomajame*.

    **Даты** — порядковое числительное в той же форме: *gegužės **pirmoji*** (первое мая), *kovo **vienuoliktoji***.

    Тот же приём в выражении ***vadinamasis*** — «так называемый»: *vadinamasis žmogiškasis faktorius*.
comparison:
  ru: |
    Ошибка — взять краткую форму: «начинающие» = ***pradedantieji***, а не *pradedantys*; «первое мая» = *gegužės **pirmoji***, а не *pirma*.
examples:
  - { text: "Mes pradedantieji.", translation: "Мы начинающие.", source: "tatoeba:11692183" }
  - { text: "Mes išgyvenusieji.", translation: "Мы выжившие.", source: "tatoeba:3938148" }
  - { text: "Čia yra miegamasis.", translation: "Здесь спальня.", source: "tatoeba:12337910" }
  - { text: "Pabučiuok mane, mylimoji!", translation: "Поцелуй меня, любимая!", source: "tatoeba:10905340" }
  - { text: "Balandžio pirmoji.", translation: "Первое апреля.", source: "tatoeba:12762133" }
