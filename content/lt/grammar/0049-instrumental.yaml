id: lt-g-0049
cefr: B1
order: 49
title: "Творительный падеж: tapo rašytoju, važiuoju autobusu, rytais"
explanation:
  ru: |
    Творительный (*įnagininkas*, вопрос *kuo?*) в литовском шире, чем в русском, и часто стоит **без предлога**.

    **1. Кем стать, работать, считаться:**
    - *tapti* — *Jis tapo **rašytoju**.* *Ji tapo **direktore**.*
    - *dirbti* — *Dirbu **sodininku**.* (работаю садовником)
    - *laikyti* (считать), *vadinti* (называть), *išrinkti* (избрать): *Tomą laiko **didžiu pianistu**.*
    - но в настоящем времени после *būti* — именительный: *Jis **yra** mokytojas.*

    **2. Чем, на чём (средство)** — без предлога: *važiuoti **autobusu, traukiniu, dviračiu***, *rašyti **pieštuku***, *valgyti **šaukštu***, *kalbėti **lietuvių kalba***. Предлог *su* — только «вместе с кем»: *su draugu*.

    **3. После глаголов:** *domėtis*, *didžiuotis*, *džiaugtis*, *rūpintis*, *žavėtis* — *kuo*; *tikėti* и *pasitikėti* (верить, доверять) — тоже *kuo*: *Tikiu **tavimi**.*

    **4. Время и путь:** *rytais, vakarais, savaitgaliais* — по утрам, по вечерам, по выходным; *eiti **keliu**, **pakrante*** — идти по дороге, по берегу.

    Окончания ед. ч.: *-as → **-u*** (rašytoju), *-is/-ys → **-iu*** (traukiniu), *-us → **-umi*** (sūnumi), *-a → **-a***, *-ė → **-e***; мн. ч.: **-ais** (m), **-omis / -ėmis** (f).
comparison:
  ru: |
    Ловушки: «ехать **на** автобусе» — *važiuoti **autobusu*** (без *su*!); «верить **в** тебя» — *tikėti **tavimi***; «писать ручкой» совпадает — *rašyti tušinuku*, но ~~su tušinuku~~ — ошибка, *su* означает только компанию.
examples:
  - { text: "Jis tapo rašytoju.", translation: "Он стал писателем.", source: "tatoeba:11450766" }
  - { text: "Aš dirbu sodininku.", translation: "Я работаю садовником.", source: "tatoeba:6918399" }
  - { text: "Aš važiuoju autobusu.", translation: "Я еду на автобусе.", source: "tatoeba:12144560" }
  - { text: "Aš tikiu tavimi.", translation: "Я верю в тебя.", source: "tatoeba:2153711" }
  - { text: "Tomą laiko didžiu pianistu.", translation: "Тома считают великим пианистом.", source: "tatoeba:10781087" }
