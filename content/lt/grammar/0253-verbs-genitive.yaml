id: lt-g-0253
cefr: A2
order: 253
track: foundation
title: "Глаголы с родительным падежом: laukti, ieškoti, bijoti, klausti, prašyti"
explanation:
  ru: |
    Некоторые глаголы требуют **родительного падежа**, даже без отрицания. Для русскоязычных это ловушка: по-русски часто винительный.

    - **laukti** — ждать: *laukiu autobuso, laukiu tavęs*
    - **ieškoti** — искать: *ieškau darbo* (по-русски «ищу работу»)
    - **bijoti** — бояться: *bijau šunų*
    - **klausti** — спрашивать кого: *paklausk mokytojo* (по-русски «спроси учителя»)
    - **prašyti** — просить чего / у кого: *prašau pagalbos, paprašė jo pinigų*
    - **mokytis** — учить (язык, предмет): *mokausi lietuvių kalbos*
    - **reikėti** — быть нужным: *man reikia pagalbos*
    - **trūkti** — не хватать: *man trūksta laiko*
    - **linkėti** — желать: *linkiu sėkmės*

    Вопрос к ним — ***Ko?*** — *Ko lauki? Ko ieškai? Ko bijai?*
comparison:
  ru: |
    Совпадает с русским только частично («жду автобуса», «боюсь собак»). Запомните отличия: *ieškoti darbo* («искать работу»), *klausti mokytojo* («спросить учителя»), *mokytis kalbos* («учить язык»).
examples:
  - { text: "Aš laukiu jos.", translation: "Я жду её.", source: "tatoeba:12289295" }
  - { text: "Ar ieškai darbo?", translation: "Ищешь работу?", source: "tatoeba:12525631" }
  - { text: "Aš bijau vorų.", translation: "Я боюсь пауков.", source: "tatoeba:1665778" }
  - { text: "Ji paprašė jo pagalbos.", translation: "Она попросила его о помощи.", source: "tatoeba:12740774" }
  - { text: "Tomas ieško paso.", translation: "Том ищет паспорт.", source: "tatoeba:12171367" }
