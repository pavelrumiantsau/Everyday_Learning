id: lt-g-0251
cefr: A2
order: 251
track: foundation
title: "Рецепты и инструкции: supjaustykite, išvirkite, įdėkite"
explanation:
  ru: |
    В рецептах и инструкциях пишут **повелительным на «вы»** (*-kite*) или просто **инфинитивом**:
    - *Supjaustykite svogūną.* = *Supjaustyti svogūną.* — Нарезать лук.

    Частые глаголы:
    - **supjaustyti** — нарезать, **išvirti** — сварить, **iškepti** — испечь, пожарить
    - **įdėti** — положить, **įpilti** — налить, **sumaišyti** — смешать
    - **įkaitinti** — разогреть (*orkaitę* — духовку), **pasūdyti** — посолить

    Меры: *šaukštas* — столовая ложка, *šaukštelis* — чайная ложка, *stiklinė* — стакан, *žiupsnelis* — щепотка, *gramas*.
    После меры — родительный: *du šaukštai cukraus, stiklinė pieno, žiupsnelis druskos*. Время: *kepti 20 minučių*.
comparison:
  ru: |
    Как в русских рецептах: «нарезать, посолить, варить 20 минут» — по-литовски тот же инфинитив (*supjaustyti, pasūdyti*) или вежливое «вы» (*supjaustykite*).
examples:
  - { text: "Supjaustykite mėsą.", translation: "Порежьте мясо.", source: "tatoeba:13205725" }
  - { text: "Supjaustyk mėsą.", translation: "Порежь мясо.", source: "tatoeba:13205726" }
  - { text: "Įpilk vyno iš butelio.", translation: "Налей вина из бутылки.", source: "tatoeba:13529113" }
  - { text: "Supjaustyk pyragą gabalėliais.", translation: "Разрежь пирог на части.", source: "tatoeba:2586451" }
  - { text: "Sumaišyk raudonus ir mėlynus dažus.", translation: "Смешай красную и синюю краски.", source: "tatoeba:11338328" }
