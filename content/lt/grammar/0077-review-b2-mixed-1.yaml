id: lt-g-0077
cefr: B2
order: 77
title: "Повторение B2: skaitydamas, grįžęs, lyjant, parašyta, sakė sergąs"
explanation:
  ru: |
    Смешанная тренировка форм, которые в B2-текстах встречаются на каждом шагу. Главный вопрос — **кто действует и когда**.

    **Тот же субъект:**
    - одновременно → **полупричастие** *-damas / -dama*: ***Skaitydamas** užmigau.*
    - раньше главного действия → **причастие** *-ęs / -usi*: ***Grįžęs** namo, paskambinau mamai.* · *Jis **nepavalgęs** išėjo.*

    **Другой субъект** (или безличное) → **деепричастие** *-ant / -int / -us* (субъект в дательном):
    - ***Lyjant** ėjome namo.* · *Saulei **tekant** išvažiavome.* · *Mums **grįžus**, jau temo.*

    **Пассив** → *-tas / -ta* (результат), *-mas / -ma* (процесс): *Tai **parašyta** arabiškai.* · *Čia alus **neparduodamas**.*

    **Чужие слова** → косвенная речь *-ąs / -ęs*: *Jis sakė **sergąs**.* = сказал, что болеет.
comparison:
  ru: |
    В русском одно деепричастие на все случаи (*читая, вернувшись*), а в литовском выбор зависит от субъекта: «вернувшись (я), я позвонил» — *grįžęs*, а «когда мы вернулись, (уже) темнело» — *mums grįžus*.
examples:
  - { text: "Skaitydamas aš užmigau.", translation: "Читая книгу, я уснул.", source: "tatoeba:9666470" }
  - { text: "Jis nepavalgęs išėjo.", translation: "Он ушел, не поев.", source: "tatoeba:8458423" }
  - { text: "Studentas, nieko nepasakęs, išėjo.", translation: "Студент ушёл, ничего не сказав.", source: "tatoeba:10824115" }
  - { text: "Tomas lyjant ėjo namo.", translation: "Том шёл домой под дождём.", source: "tatoeba:11057810" }
  - { text: "Tai parašyta arabiškai.", translation: "Это написано на арабском.", source: "tatoeba:13568875" }
