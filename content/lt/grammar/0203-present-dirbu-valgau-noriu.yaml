    answer: "valgo"
    hint: "valgyti"
    translation: "Они обедают дома."
  - type: cloze
    text: "Mes ___ vandenį."
    answer: "geriame"
    also: ["geriam"]
    hint: "gerti"
    translation: "Мы пьём воду."
