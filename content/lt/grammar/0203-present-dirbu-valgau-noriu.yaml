    text: "Aš ___ banke."
    answer: "dirbu"
    hint: "dirbti"
    translation: "Я работаю в банке."
  - type: cloze
    text: "Tu ___ arbatą?"
    answer: "geri"
    hint: "gerti"
    translation: "Ты пьёшь чай?"
  - type: cloze
    text: "Jis ___ sriubą."
    answer: "valgo"
    hint: "valgyti"
    translation: "Он ест суп."
  - type: cloze
    text: "Mes ___ kavinėje."
    answer: "dirbame"
    also: ["dirbam"]
    hint: "dirbti"
    translation: "Мы работаем в кафе."
  - type: cloze
    text: "Ką jūs ___?"
    answer: "geriate"
    also: ["geriat"]
    hint: "gerti"
    translation: "Что вы пьёте?"
  - type: cloze
    text: "Aš ___ valgyti."
    answer: "noriu"
    hint: "norėti"
    translation: "Я хочу есть."
  - type: cloze
