  - type: cloze
    text: "___ žmogus turi teisę klysti."
    answer: "Kiekvienas"
    hint: "каждый"
    translation: "Каждый человек имеет право ошибаться."
  - type: cloze
    text: "Ar ___ supratai?"
    answer: "viską"
    hint: "всё (вин. п.)"
    translation: "Ты всё понял?"
