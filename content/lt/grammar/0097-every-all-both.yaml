  - type: cloze
    text: "Lijo ___ dieną."
    answer: "visą"
    hint: "весь (вин. п.)"
    translation: "Дождь шёл весь день."
  - type: cloze
    text: "___ studentai atėjo į paskaitą."
    answer: "Visi"
    hint: "все"
    translation: "Все студенты пришли на лекцию."
  - type: cloze
    text: "Mano ___ seserys gyvena Kaune."
    answer: "abi"
