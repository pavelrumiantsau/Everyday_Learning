id: lt-g-0097
cefr: B1
order: 97
title: "Каждый, весь, оба, любой: kiekvienas, visas, visi, abu / abi, bet kuris"
explanation:
  ru: |
    - ***kiekvienas / kiekviena*** — каждый: *kiekvieną dieną, kiekvienas žmogus, kiekviena detalė*
    - ***visas / visa*** — весь, целый: *visą dieną, visa šeima* · ***visi / visos*** — все: *Visi atėjo.* · ***viskas*** — всё
    - ***abu*** (м. р.) / ***abi*** (ж. р.) — оба / обе: *abu broliai, abi seserys*
      - род. ***abiejų***, дат. ***abiem***, вин. *abu / abi*, тв. *abiem*
    - ***bet kuris / bet kuri*** — любой (на выбор): *Paimk bet kurį.*
    - регулярность: ***kas*** + вин. п.: *kas savaitę, kas mėnesį*; одним словом — *kasdien, kasmet*

    Все они склоняются как прилагательные (кроме *viskas* — как *kas*).
comparison:
  ru: |
    «Весь день» — *visą dieną* (вин. п., без предлога), «каждое утро» — *kiekvieną rytą*. «Оба» различает род, как в русском: *abu* / *abi* = «оба» / «обе».
examples:
  - { text: "Taip galvoja kiekvienas.", translation: "Так думает каждый.", source: "tatoeba:2630687" }
  - { text: "Svarbi kiekviena detalė.", translation: "Важна каждая деталь.", source: "tatoeba:8354542" }
  - { text: "Snigo visą naktį.", translation: "Шёл снег всю ночь.", source: "tatoeba:630615" }
  - { text: "Aš juos abu myliu.", translation: "Я их обоих люблю.", source: "tatoeba:12730409" }
  - { text: "Mes abi tai matėme.", translation: "Мы обе это видели.", source: "tatoeba:3951634" }
exercises:
