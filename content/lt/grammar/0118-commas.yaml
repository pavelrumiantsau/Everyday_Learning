id: lt-g-0118
cefr: B2
order: 118
title: "Запятые: kad, nes, kuris, deja — и где запятой нет (ir, galbūt, kaip)"
explanation:
  ru: |
    Для письма на B2 хватит нескольких правил.

    **Запятая нужна:**
    - перед придаточным: ***, kad** / **, nes** / **, kai** / **, jei** / **, nors** / **, kol** / **, ar** (ли)*: *Manau, kad taip. Valgyk, nes atšals.* Придаточное в середине — с двух сторон: *Katė, **kurią** tu radai, yra mano.*
    - перед *bet, o, tačiau* между частями: *Ji nori, **bet** negali.*
    - после вводных слов: ***Žinoma**, **deja**, **beje**, **be to**, **mano nuomone**, **pavyzdžiui***.
    - при обращении: ***Tomai**, grįžk!*
    - развёрнутый оборот с *-damas*, причастием или деепричастием — обычно выделяют: *Tomas, **žiūrėdamas filmą**, užmigo.* Одно слово без зависимых (*skaitydamas*) обычно не выделяют.

    **Запятой нет:**
    - перед одиночным ***ir*** — даже между двумя частями: *Saulė nusileido **ir** pasidarė vėsu.*
    - после ***galbūt, turbūt, tikriausiai, gal*** — по-литовски это не вводные слова: *Galbūt jis teisus.*
    - в сравнении с *kaip, lyg* без глагола: *baltas **kaip** sniegas*.
    - после *Todėl, Tačiau* в начале предложения — обычно без запятой.
comparison:
  ru: |
    Придаточные, обращения и большинство вводных слов — как в русском. Три отличия, где русская привычка даёт лишнюю запятую: «Солнце село**,** и стало прохладно» → *Saulė nusileido ir pasidarė vėsu*; «Он**,** наверное**,** прав» → *Jis turbūt teisus*; «белый**,** как снег» → *baltas kaip sniegas*.
examples:
  - { text: "Manau, kad taip.", translation: "По-моему, так.", source: "tatoeba:12690524" }
  - { text: "Valgyk, nes atšals.", translation: "Ешь, а то остынет.", source: "tatoeba:10305380" }
  - { text: "Katė, kurią tu radai, yra mano.", translation: "Кошка, которую ты нашёл, моя.", source: "tatoeba:10864475" }
  - { text: "Deja, negaliu.", translation: "К сожалению, не могу.", source: "tatoeba:12201986" }
  - { text: "Tomas, žiūrėdamas filmą, užmigo.", translation: "Том уснул, когда смотрел фильм.", source: "tatoeba:12511476" }
