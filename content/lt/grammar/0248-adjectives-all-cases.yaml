id: lt-g-0248
cefr: A2
order: 248
track: foundation
title: "Прилагательные во всех падежах: naujame name, su geru draugu"
explanation:
  ru: |
    Прилагательное стоит в том же роде, числе и падеже, что и существительное. Образцы (им. — род. — дат. — вин. — твор. — мест.):

    **geras** (м. р.): gero — geram — gerą — geru — gerame; мн. ч.: geri — gerų — geriems — gerus — gerais — geruose
    **gera** (ж. р.): geros — gerai — gerą — gera — geroje; мн. ч.: geros — gerų — geroms — geras — geromis — gerose

    **gražus**: gražaus — gražiam — gražų — gražiu — gražiame; **graži**: gražios — gražiai — gražią — gražia — gražioje
    **didelis**: didelio — dideliam — didelį — dideliu — dideliame; **didelė**: didelės — didelei — didelę — didele — didelėje

    Ориентир: окончание прилагательного часто «рифмуется» с существительным: *naujame name, didelėje parduotuvėje, su naujais batais*.
comparison:
  ru: |
    Как в русском: «в новом доме», «с хорошим другом» — прилагательное повторяет падеж. Окончания отличаются, но система та же.
examples:
  - { text: "Aš turiu naują knygą.", translation: "У меня есть новая книга.", source: "tatoeba:12901043" }
  - { text: "Aš su naujais batais.", translation: "Я в новых ботинках.", source: "tatoeba:12792458" }
  - { text: "Aš tapau nauju žmogumi.", translation: "Я стал новым человеком.", source: "tatoeba:10674111" }
  - { text: "Aš išmokau naują žodį.", translation: "Я выучил новое слово.", source: "tatoeba:13336155" }
