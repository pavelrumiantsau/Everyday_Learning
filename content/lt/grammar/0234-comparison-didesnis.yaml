id: lt-g-0234
cefr: A2
order: 234
track: foundation
title: "Сравнение: didesnis, geriausias; už mane, negu aš; geriau, šilčiau"
explanation:
  ru: |
    **Больше, лучше** — прилагательное на **-esnis** (м. р.) / **-esnė** (ж. р.):
    - didelis → **didesnis**, geras → **geresnis**, gražus → **gražesnis**, jaunas → **jaunesnis**
    - о возрасте людей: **vyresnis** — старше, **jaunesnis** — моложе

    **Самый** — **-iausias** / **-iausia**, часто с *pats / pati*:
    - geras → **geriausias**, gražus → **gražiausias**
    - *t → č, d → dž*: aukštas → **aukščiausias**, didelis → **didžiausias**
    - *pats geriausias* — самый лучший

    **Чем кто-то:**
    - **už** + винительный: *vyresnis **už mane***, *didesnis už Kauną*
    - или **negu / nei** + именительный: *vyresnis **negu aš***

    **Наречия:** gerai → **geriau** → geriausiai; daug → **daugiau**; mažai → **mažiau**; šilta → **šilčiau** (*Šiandien šilčiau nei vakar.*)
comparison:
  ru: |
    Похоже на русское «-ее» и «-ейший»: *didesnis* — «больший», *didžiausias* — «величайший». Новое — *už + вин. п.*: *vyresnis už mane* = «старше меня».
examples:
  - { text: "Aš jaunesnis už jus.", translation: "Я моложе вас.", source: "tatoeba:10539642" }
  - { text: "Tu vyresnis už Tomą?", translation: "Ты старше Тома?", source: "tatoeba:11974908" }
  - { text: "Tai geriausias alus.", translation: "Это лучшее пиво.", source: "tatoeba:13089720" }
  - { text: "Kuris pats geriausias?", translation: "Который самый лучший?", source: "tatoeba:11918100" }
  - { text: "Koks yra geresnis?", translation: "Какой лучше?", source: "tatoeba:12285955" }
