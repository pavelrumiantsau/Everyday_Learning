id: lt-g-0209
cefr: A1
order: 209
track: foundation
title: "Куда, откуда, на чём: į parką, iš darbo, važiuoju autobusu"
explanation:
  ru: |
    **Идти и ехать:**
    - **eiti** — идти (пешком): einu, eini, eina, einame, einate, eina
    - **važiuoti** — ехать: važiuoju, važiuoji, važiuoja, važiuojame, važiuojate, važiuoja

    **Куда?** — **į** + винительный падеж: *į parką, į mokyklą, į darbą, į Vilnių*. Одно *į* — и «в», и «на»: *į darbą* — на работу.

    **Откуда?** — **iš** + родительный падеж: *iš darbo, iš mokyklos, iš Vilniaus, iš Lietuvos*.

    Особые слова: **namo** — домой, **namie** — дома.

    **На чём?** — творительный падеж **без предлога**:
    - *-as* → **-u**: autobusas → autobus**u**
    - *-ys, -is* → **-iu**: traukinys → traukin**iu**, dviratis → dvirač**iu** (t перед *i* → č)
    - *mašina* → mašin**a** (на письме так же, как именительный)
    - пешком — **pėsčiomis**

    *Aš važiuoju į darbą autobusu.* — Я еду на работу на автобусе.
comparison:
  ru: |
    По-русски «на автобусе» — с предлогом. По-литовски предлога нет, только окончание: *autobusu* — как русское «автобусом» («ехать автобусом» тоже говорят и по-русски).
examples:
  - { text: "Ji eina į parką.", translation: "Она идёт в парк.", source: "tatoeba:11485184" }
  - { text: "Jis važiuoja į darbą.", translation: "Он едет на работу.", source: "tatoeba:13016824" }
  - { text: "Aš važiuoju autobusu.", translation: "Я еду на автобусе.", source: "tatoeba:12144560" }
  - { text: "Tu važiuoji traukiniu?", translation: "Ты едешь на поезде?", source: "tatoeba:9991491" }
  - { text: "Jis grįžta iš teatro.", translation: "Он возвращается из театра.", source: "tatoeba:13829205" }
