id: lt-g-0217
cefr: A1
order: 217
track: foundation
title: "Обращение и вежливые просьбы: Jonai! Gal galėtumėte…?"
explanation:
  ru: |
    **Звательная форма** (*šauksmininkas*) — когда обращаемся к человеку. Имена меняются:
    - *-as* → **-ai**: Jonas → **Jonai**, Tomas → **Tomai**
    - *-is* → **-i**: Kęstutis → **Kęstuti**
    - *-ius* → **-iau**: Paulius → **Pauliau**
    - *-ė* → **-e**: Eglė → **Egle**
    - *-a* — без изменений: Rasa → **Rasa**
    - *ponas* → **pone**: *Laba diena, pone Jonai!* — *ponia* не меняется: *ponia Rasa*

    **Вежливая просьба:**
    - ***Gal galėtumėte** padėti?* — Не могли бы вы помочь?
    - *Ar negalėtumėte…?* — то же, ещё мягче

    **Если не поняли** (на экзамене это нормально и даже нужно!):
    - *Gal galėtumėte **pakartoti**?* — Не могли бы вы повторить?
    - *Kalbėkite **lėčiau**, prašau.* — Говорите медленнее, пожалуйста.
    - *Ką reiškia «…»?* — Что значит «…»?
    - *Atsiprašau, nesupratau.* — Извините, я не понял(а).
comparison:
  ru: |
    Звательная форма похожа на разговорное русское «Мам!», «Петь!», только в литовском она обязательна: к Йонасу обращаются *Jonai*, а не *Jonas*.
examples:
  - { text: "Ačiū, Tomai.", translation: "Спасибо, Том.", source: "tatoeba:10460678" }
  - { text: "Ar jūs negalėtumėte padėti?", translation: "Не могли бы вы помочь?", source: "tatoeba:12621655" }
  - { text: "Ar negalėtumėte kalbėti lėčiau?", translation: "Вы не могли бы говорить помедленнее?", source: "tatoeba:1501606" }
  - { text: "Prašau, kalbėk lėčiau.", translation: "Говори медленнее, пожалуйста.", source: "tatoeba:10877109" }
  - { text: "Palaukite!", translation: "Подождите!", source: "tatoeba:7946856" }
