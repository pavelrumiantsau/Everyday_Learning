id: lt-g-0259
cefr: A1
order: 259
track: foundation
title: "Ударение и литовские буквы на клавиатуре"
explanation:
  ru: |
    **Ударение** в литовском может стоять на любом слоге и **меняться** в разных формах слова. Иногда только оно различает слова: ***nãmo*** — «дома» (род. п. от *namas*), ***namõ*** — «домой». На карточках слов ударный слог отмечен знаком (*nãmas, gerà, kalbė́ti*); три вида знаков показывают ещё и тон, но сначала достаточно запомнить, **какой слог ударный**. Слушайте 🔊 и повторяйте вслух.

    **Литовские буквы на клавиатуре** — экзамен пишут на компьютере, поэтому научитесь набирать их сразу:
    - **телефон**: долгое нажатие на букву (*a → ą*, *s → š*, *e → ę, ė*) или литовская раскладка
    - **компьютер**: добавьте раскладку **Lithuanian** (macOS: Настройки → Клавиатура → Источники ввода; Windows: Параметры → Язык). В стандартной литовской раскладке буквы стоят в ряду цифр: 1 **ą**, 2 **č**, 3 **ę**, 4 **ė**, 5 **į**, 6 **š**, 7 **ų**, 8 **ū**, а **ž** — на клавише «=».

    В упражнениях курса ответ без «хвостиков» и «галочек» засчитывается как ошибка — как на экзамене.
comparison:
  ru: |
    В русском ударение тоже подвижное («рука — руки»), но буквы его не показывают. Литовские знаки ударения есть только в словарях и учебниках, в обычных текстах их нет.
examples:
  - { text: "Eik namo!", translation: "Иди домой!", source: "tatoeba:10793988" }
  - { text: "Grįžk namo.", translation: "Возвращайся домой.", source: "tatoeba:5207321" }
  - { text: "Grįžti namo.", translation: "Вернуться домой.", source: "tatoeba:11648123" }
