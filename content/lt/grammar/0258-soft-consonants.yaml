id: lt-g-0258
cefr: A1
order: 258
track: foundation
title: "Мягкие согласные: šiandien, geriau, žiūri"
explanation:
  ru: |
    Перед **e, ę, ė, i, į, y** согласные звучат **мягко** сами собой: *lietus, gerai, kitas*.

    Перед **a, o, u, ą, ų, ū** мягкость показывает буква **i** — она **не читается** отдельно, а только смягчает согласную (как русские «я, ё, ю»):
    - *šiandien* — «шян-», *geriau* — «-ряу», *kiaušinis* — «кяу-»
    - *žiūri* — «жю-», *dviračiu* — «-чю»

    Значит, *ia* после согласной ≈ «я», *iu* ≈ «ю», *io* ≈ «ё».
comparison:
  ru: |
    Это та же система, что в русском «ня — на»: русское «я» после согласной делает её мягкой. Литовский пишет то же самое двумя буквами: *ia*.
examples:
  - { text: "Tu žiūri?", translation: "Ты смотришь?", source: "tatoeba:12189208" }
  - { text: "Visi žiūri.", translation: "Все наблюдают.", source: "tatoeba:9711200" }
  - { text: "Jūsų geriau.", translation: "Ваше лучше.", source: "tatoeba:10883020" }
