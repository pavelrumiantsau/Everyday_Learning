id: lt-g-0257
cefr: A1
order: 257
track: foundation
title: "Согласные: č, š, ž, c, dz, dž, ch, h"
explanation:
  ru: |
    - **č** — «ч», но твёрже: *čia* (здесь), *ačiū*
    - **š** — «ш»: *šuo, šalta*
    - **ž** — «ж»: *žmona, žiema*
    - **c** — «ц»: *cukrus, centras*
    - **dz** — «дз» одним звуком: *dzūkai* (жители юга Литвы)
    - **dž** — «дж» одним звуком: *džiaugiuosi* (радуюсь), *džinsai*
    - **ch** — «х» (в заимствованиях): *chemija, choras*
    - **h** — мягкий выдох, как в английском *hello*: *humoras*

    Буква без «галочки» — другой звук и другое слово: **s**/**š**, **z**/**ž**, **c**/**č**. Пишите галочки всегда.
comparison:
  ru: |
    *č, š, ž* — это русские «ч, ш, ж», только литовские *š* и *ž* чуть мягче русских «ш», «ж». *h* — не русское «х»: это лёгкий выдох.
examples:
  - { text: "Čia retai lyja.", translation: "Здесь редко бывает дождь.", source: "tatoeba:11740495" }
  - { text: "Aš labai džiaugiuosi.", translation: "Я очень рад.", source: "tatoeba:11537386" }
  - { text: "Aš ne šuo.", translation: "Я не собака.", source: "tatoeba:13296616" }
