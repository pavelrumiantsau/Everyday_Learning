id: lt-g-0211
cefr: A1
order: 211
track: foundation
title: "Множественное число: broliai, draugai, knygos, seserys"
explanation:
  ru: |
    **Именительный падеж множественного числа** (кто? что? — много):
    - *-as* → **-ai**: draugas → draugai, vaikas → vaikai, tėvas → **tėvai** (это ещё и «родители»)
    - *-is, -ys* → **-iai**: brolis → broliai, kambarys → kambariai
    - *-us* → **-ūs**: sūnus → sūnūs
    - *-a* → **-os**: mama → mamos, knyga → knygos
    - *-ė* → **-ės**: lietuvė → lietuvės, kėdė → kėdės
    - *-is* (женский род) → **-ys**: akis → akys, naktis → naktys
    - запомнить: sesuo → **seserys**, duktė → **dukterys**

    Глагол при *jie, jos* — та же форма, что при *jis, ji*: *Broliai dirba.* — Братья работают.

    Есть слова только во множественном числе: *durys* (дверь), *kelnės* (брюки), *marškiniai* (рубашка), *pietūs* (обед).
comparison:
  ru: |
    Как и в русском, «брюки» — только во множественном: *kelnės*. А вот «дверь» и «рубашка» по-литовски тоже множественные: *durys, marškiniai*.
examples:
  - { text: "Mes broliai.", translation: "Мы братья.", source: "tatoeba:3953627" }
  - { text: "Jos seserys.", translation: "Они сёстры.", source: "tatoeba:12144571" }
  - { text: "Tai draugai.", translation: "Это друзья.", source: "tatoeba:11555818" }
  - { text: "Kur yra tėvai?", translation: "Где родители?", source: "tatoeba:12119876" }
  - { text: "Jūs broliai?", translation: "Вы братья?", source: "tatoeba:3953626" }
