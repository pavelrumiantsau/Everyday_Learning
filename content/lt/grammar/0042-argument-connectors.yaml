    translation: "Подводя итог, можно утверждать, что преимуществ больше, чем недостатков."
  - type: cloze
    text: "Tai brangu. ___, verta pabandyti."
    answer: "Vis dėlto"
    hint: "всё-таки"
    translation: "Это дорого. И всё-таки стоит попробовать."
