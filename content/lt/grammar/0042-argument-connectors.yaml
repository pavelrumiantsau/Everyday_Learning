    translation: "По-моему, это решение неправильное."
  - type: cloze
    text: "___ pirma, reikia apskaičiuoti išlaidas."
    answer: "Visų"
    hint: "прежде всего"
    translation: "Прежде всего нужно подсчитать расходы."
