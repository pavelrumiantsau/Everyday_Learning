id: lt-g-0042
cefr: B2
order: 42
title: "Как построить рассуждение: visų pirma, be to, kita vertus"
explanation:
  ru: |
    Для эссе, письма или устного ответа на B2 пригодятся связующие слова:

    - **начать:** *Visų pirma*, *Pirmiausia* (прежде всего); *Mano nuomone*, *Manau, kad…*
    - **добавить:** *Be to* (кроме того), *Taip pat* (также), *Negana to* (более того), *Antra, … Trečia, …*
    - **противопоставить:** *Tačiau* (однако), *Vis dėlto* (всё-таки), *Kita vertus* (с другой стороны), *Nors…* (хотя)
    - **привести пример:** *Pavyzdžiui* (например), *Tarkime* (допустим)
    - **причина и следствие:** *Todėl*, *Dėl to* (поэтому), *Taigi* (итак, значит)
    - **подвести итог:** *Apibendrinant* (подводя итог), *Galiausiai* (в конце концов), *Taigi*

    После вводных слов в начале предложения обычно ставится **запятая**: *Be to, … Kita vertus, … Apibendrinant, …* (но *Todėl* и *Tačiau* часто пишутся без неё).
comparison:
  ru: |
    Почти все — прямые соответствия русским: *be to* = «кроме того», *kita vertus* = «с другой стороны», *apibendrinant* = «подводя итог». Используй 3–4 таких слова в каждом письменном тексте — это один из критериев уровня B2.
examples:
  - { text: "Visų pirma, išmok formulę mintinai.", translation: "Первым делом, выучи формулу наизусть.", source: "tatoeba:13719852" }
  - { text: "Be to, aš nemoku šokti.", translation: "Кроме того, я не умею танцевать.", source: "tatoeba:13555862" }
  - { text: "Tačiau būna išimtys.", translation: "Однако бывают исключения.", source: "tatoeba:12097495" }
  - { text: "Pavyzdžiui, dabar jūra rami.", translation: "Например, сейчас море спокойно.", source: "tatoeba:11077921" }
  - { text: "Taigi, pradėkime!", translation: "Итак, начнём!", source: "tatoeba:11851197" }
