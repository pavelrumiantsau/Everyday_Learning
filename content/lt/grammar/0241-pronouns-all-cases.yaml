id: lt-g-0241
cefr: A2
order: 241
track: foundation
title: "Личные местоимения во всех падежах: manęs, man, mane, manimi"
explanation:
  ru: |
    Полная таблица (им. — род. — дат. — вин. — твор. — мест.):
    - **aš**: manęs — man — mane — manimi — manyje
    - **tu**: tavęs — tau — tave — tavimi — tavyje
    - **jis**: jo — jam — jį — juo — jame; **ji**: jos — jai — ją — ja — joje
    - **mes**: mūsų — mums — mus — mumis — mumyse
    - **jūs**: jūsų — jums — jus — jumis — jumyse
    - **jie**: jų — jiems — juos — jais — juose; **jos**: jų — joms — jas — jomis — jose

    С предлогами:
    - **be** + род.: *be manęs* — без меня
    - **pas** + вин.: *pas mane* — ко мне, у меня
    - **apie** + вин.: *apie tave* — о тебе
    - **su** + твор.: *su manimi, su juo, su ja* — со мной, с ним, с ней

    Не путайте: «мой, твой» — *mano, tavo* (не меняются), а «меня, тебя» в родительном — *manęs, tavęs*.
comparison:
  ru: |
    Почти как русские «меня, мне, мной»: *manęs, man, manimi*. «Со мной» — *su manimi*, «ко мне» — *pas mane* (винительный, как «к» + «меня»).
examples:
  - { text: "Eik be manęs.", translation: "Иди без меня.", source: "tatoeba:10754946" }
  - { text: "Tu apie mane?", translation: "Ты обо мне?", source: "tatoeba:10876878" }
  - { text: "Tai pas mane.", translation: "Это ко мне.", source: "tatoeba:13332606" }
  - { text: "Mes su tavimi.", translation: "Мы с тобой.", source: "tatoeba:10761017" }
  - { text: "Šok su juo!", translation: "Танцуй с ним!", source: "tatoeba:10847372" }
