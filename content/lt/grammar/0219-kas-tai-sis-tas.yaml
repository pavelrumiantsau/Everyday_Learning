id: lt-g-0219
cefr: A1
order: 219
track: foundation
title: "Kas tai? Tai… ; šis, ši, tas, ta; Ar čia yra…?"
explanation:
  ru: |
    **Tai** — «это». Слово не меняется:
    - *Kas tai?* — Что это? Кто это?
    - *Tai mano duktė.* — Это моя дочь. *Tai mano kava?* — Это мой кофе?

    **Этот, эта, тот, та** — меняются по роду и числу:
    - **šis** (м. р.), **ši** (ж. р.) — этот, эта (близко): *šis namas, ši gatvė*
    - **tas** (м. р.), **ta** (ж. р.) — тот, та (дальше): *tas namas, ta gatvė*
    - мн. ч.: *šie, šios*; *tie, tos*

    **Есть ли здесь…?** — *Ar čia yra…?* Ответ: *Taip, yra.* / *Ne, nėra.*
    - *Ar čia yra taksi?* — Здесь есть такси?
    - Отрицание с родительным падежом: *Čia nėra **banko**.* — Здесь нет банка.

    **Где…?** — *Kur yra paštas?* — Где почта?
comparison:
  ru: |
    *Tai* — как русское «это» в «это мой брат»: не меняется. А *šis / ši* различают род, как «этот / эта».
examples:
  - { text: "Kas tai?", translation: "Что это?", source: "tatoeba:1666684" }
  - { text: "Tai mano duktė.", translation: "Это моя дочь.", source: "tatoeba:3188746" }
  - { text: "Tai mano kava?", translation: "Это мой кофе?", source: "tatoeba:8215103" }
  - { text: "Ši lova nepatogi.", translation: "Эта кровать неудобная.", source: "tatoeba:4905287" }
