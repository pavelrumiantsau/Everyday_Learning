id: lt-g-0239
cefr: A2
order: 239
track: foundation
title: "Творительный падеж: su draugu, su mama; dirbu mokytoju"
explanation:
  ru: |
    **Творительный падеж** (*įnagininkas*) — вопрос **kuo? su kuo?** (кем? чем? с кем?).

    Окончания в единственном числе:
    - *-as* → **-u**: draugas → draug**u**; *-is, -ys* → **-iu**: brolis → brol**iu**
    - *-us* → **-umi**: sūnus → sūn**umi**
    - *-a* → **-a**: mama → mam**a** (на письме как именительный); *-ė* → **-e**: draugė → draug**e**
    - *sesuo* → **seserimi**, *duktė* → **dukterimi**
    - мн. ч.: **-ais / -iais / -omis / -ėmis**: su draugais, su knygomis

    Когда нужен:
    - **su** + твор. — с кем, с чем: *su draugu, su mama, kava su pienu*
    - **кем работаю, кем стать**: *dirbu mokytoju, noriu tapti gydytoju*
    - **на чём еду, на каком языке**: *autobusu, lietuvių kalba*

    Но «я — учитель» в настоящем времени — именительный: *Aš esu mokytojas.*
comparison:
  ru: |
    Как русский творительный: «с другом», «работаю учителем». Только «с» здесь — *su*, а у *mama* форма на письме не меняется: *su mama*.
examples:
  - { text: "Aš kalbu su drauge.", translation: "Я говорю с подругой.", source: "tatoeba:12321148" }
  - { text: "Mes likome su mama.", translation: "Мы остались с мамой.", source: "tatoeba:12892748" }
  - { text: "Aš valgau su broliu.", translation: "Я ем с братом.", source: "tatoeba:12499740" }
  - { text: "Aš dirbu mokytoju valstybinėje mokykloje.", translation: "Я работаю учителем в государственной школе.", source: "tatoeba:11523575" }
  - { text: "Jis keturiasdešimt metų dirbo gydytoju.", translation: "Он сорок лет проработал врачом.", source: "tatoeba:10164056" }
