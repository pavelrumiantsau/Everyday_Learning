id: lt-g-0205
cefr: A1
order: 205
track: foundation
title: "Когда? pirmadienį, ryte, vakare; Kelinta valanda?"
explanation:
  ru: |
    **Дни недели.** На вопрос «когда?» день недели стоит в винительном падеже: окончание *-is* → **-į**.
    - pirmadienis → **pirmadienį** — в понедельник
    - antradienį, trečiadienį, ketvirtadienį, penktadienį, šeštadienį, **sekmadienį**
    - так же: *kiekvieną dieną* — каждый день

    **Части дня:**
    - **ryte** — утром, **dieną** — днём, **vakare** — вечером, **naktį** — ночью
    - и слова без изменений: *šiandien* — сегодня, *rytoj* — завтра, *vakar* — вчера, *dabar* — сейчас

    **Который час?** Часы называют **порядковыми числительными женского рода** (*valanda* — женского рода):
    - *Kelinta dabar valanda?* — Который сейчас час? — *Dabar **trečia** valanda.* — Сейчас три часа.
    - 1–12: pirma, antra, trečia, ketvirta, penkta, šešta, septinta, aštunta, devinta, dešimta, vienuolikta, dvylikta

    **Во сколько?** — то же в винительном падеже: *Kelintą valandą?* — ***Trečią** valandą.* — В три часа.

    Половина — как по-русски «полтретьего»: *pusė trečios* — половина третьего (2:30).
comparison:
  ru: |
    По-русски «в понедельник» — с предлогом, по-литовски предлога нет: просто *pirmadienį*. А «половина третьего» устроено одинаково: *pusė trečios*.
examples:
  - { text: "Aš sekmadienį nedirbu.", translation: "Я в воскресенье не работаю.", source: "tatoeba:12327604" }
  - { text: "Jūs sekmadienį dirbate?", translation: "Вы в воскресенье работаете?", source: "tatoeba:12157250" }
  - { text: "Aš dirbu naktį.", translation: "Я работаю ночью.", source: "tatoeba:13191409" }
  - { text: "Kelinta dabar valanda?", translation: "Сколько сейчас времени?", source: "tatoeba:9107223" }
  - { text: "Kelintą valandą atvyksti?", translation: "Во сколько ты будешь?", source: "tatoeba:3138027" }
