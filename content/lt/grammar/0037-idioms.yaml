id: lt-g-0037
cefr: B2
order: 37
title: "Фразеологизмы и пословицы"
explanation:
  ru: |
    Устойчивые выражения делают речь живой. Многие похожи на русские, но слова в них другие — учи их целиком.

    **Пословицы:**
    - ***Ką pasėsi, tą ir pjausi.*** — Что посеешь, то и пожнёшь.
    - ***Obuolys nuo obels netoli rieda.*** — Яблоко от яблони недалеко падает (букв. «катится»).
    - ***Kas ieško, tas randa.*** — Кто ищет, тот находит.
    - ***Kiekviena pradžia sunki.*** — Лиха беда начало.
    - ***Vilką mini – vilkas čia.*** — Лёгок на помине (букв. «волка вспомнишь — волк здесь»).
    - ***Ne mano kiaulės, ne mano pupos.*** — Моя хата с краю, не моё дело.
    - ***Ranka ranką plauna.*** — Рука руку моет.

    **Выражения:**
    - ***kaip du vandens lašai*** — как две капли воды
    - ***laikyti liežuvį už dantų*** — держать язык за зубами
    - ***imti į širdį*** — принимать близко к сердцу: *Neimk į širdį!*
    - ***iki ausų*** — по уши: *iki ausų įsimylėjęs, darbų iki ausų*
    - ***nei žuvis, nei mėsa*** — ни рыба ни мясо
    - ***turėti galvoje*** — иметь в виду: *Ką turi galvoje?*
    - ***riesti nosį*** — задирать нос
comparison:
  ru: |
    Часть выражений совпадает с русскими дословно (*kaip du vandens lašai*, *laikyti liežuvį už dantų*), часть — только по смыслу. Не переводи русские идиомы дословно: «лёгок на помине» по-литовски — *Vilką mini – vilkas čia*.
