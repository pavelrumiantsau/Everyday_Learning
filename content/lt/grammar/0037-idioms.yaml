  - { text: "Obuolys nuo obels netoli rieda.", translation: "Яблоко от яблони недалеко падает.", source: "tatoeba:2724984" }
  - { text: "Kas ieško, tas ras.", translation: "Кто ищет, тот найдёт.", source: "tatoeba:10265239" }
