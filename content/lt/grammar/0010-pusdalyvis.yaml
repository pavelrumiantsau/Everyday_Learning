id: lt-g-0010
cefr: B1
order: 10
title: "Полупричастие (pusdalyvis): skaitydamas, skaitydama"
explanation:
  ru: |
    *Pusdalyvis* (полупричастие) — это «делая»: второе действие, которое **тот же человек** выполняет **одновременно** с главным. *Skaitydama laišką, ji verkė* — она читала и плакала; читает и плачет одна и та же «она».

    **Образование** — от инфинитива: убираем **-ti** и добавляем окончание по роду и числу **подлежащего**:
    - м. р.: **-damas** — skaityti → **skaitydamas**, eiti → **eidamas**, būti → **būdamas**
    - ж. р.: **-dama** — skaitydama, eidama, būdama
    - мн. ч. м. р.: **-dami** — skaitydami, žiūrėdami
    - мн. ч. ж. р.: **-damos** — skaitydamos, žiūrėdamos

    Возвратные: *mokytis* → **mokydamasis, mokydamasi, mokydamiesi, mokydamosi**. С приставкой -si- стоит после неё: *atsikelti* → **atsikeldamas**.

    **Употребление**:
    - одновременное действие подлежащего: *Aš užmigau **žiūrėdamas** televizorių* (заснул, смотря телевизор);
    - **prieš** + pusdalyvis = «перед тем как»: *Pagalvok prieš **sakydamas*** — подумай, прежде чем говорить;
    - **būdamas** + сущ./возраст = «когда был…»: ***būdamas** vaikas* — будучи ребёнком, ***būdama** aštuonerių* — в восемь лет;
    - с отрицанием: ***Nežinodamas**, ką daryti, nieko nedariau* — не зная, что делать, ничего не делал.

    Главное правило: у pusdalyvis и у главного глагола **одно и то же подлежащее**. Если действуют разные лица, нужен *padalyvis* (следующий урок).
comparison:
  ru: |
    Это прямой аналог русского деепричастия несовершенного вида: *читая, смотря, будучи*. Правило то же — деепричастие относится к подлежащему («Читая книгу, я уснул», а не «Читая книгу, мне стало скучно»).

    Главное отличие: русское деепричастие не меняется, а литовское **согласуется с подлежащим**: он — *skaitydamas*, она — *skaitydama*, они — *skaitydami / skaitydamos*. Поэтому, говоря о себе, выбирайте форму по своему роду: мужчина скажет *Eidamas namo…*, женщина — *Eidama namo…*

    Для «сделав» (совершенный вид) литовский использует причастие прошедшего времени: *perskaitęs, perskaičiusi* — «прочитав».
examples:
  - { text: "Skaitydama laišką, ji verkė.", translation: "Она плакала, читая письмо.", source: "tatoeba:2462372" }
  - { text: "Aš užmigau žiūrėdamas televizorių.", translation: "Я заснул, смотря телевизор.", source: "tatoeba:2173324" }
  - { text: "Visi verkėme, žiūrėdami šį filmą.", translation: "Мы все плакали, когда смотрели этот фильм.", source: "tatoeba:3948779" }
  - { text: "Dar būdamas vaikas aš jau gerai mokėjau plaukti.", translation: "Ещё будучи ребёнком, я уже хорошо умел плавать.", source: "tatoeba:4149466" }
  - { text: "Uždaryk langą prieš išeidamas.", translation: "Закрой окно перед уходом.", source: "tatoeba:2746968" }
