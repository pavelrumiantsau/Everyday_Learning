    text: "Kava kainuoja tris ___."
    answer: "eurus"
    hint: "euras → вин. мн."
    translation: "Кофе стоит три евро."
  - type: cloze
    text: "Bilietas kainavo dvidešimt ___."
    answer: "eurų"
    hint: "20 → род. мн."
    translation: "Билет стоил двадцать евро."
  - type: cloze
    text: "Ar galiu mokėti ___?"
    answer: "kortele"
    hint: "kortelė → тв. п."
    translation: "Можно заплатить картой?"
  - type: cloze
    text: "Kiek mokate ___ butą?"
    answer: "už"
    hint: "за"
    translation: "Сколько вы платите за квартиру?"
  - type: cloze
    text: "Vakar ___ visus pinigus drabužiams."
    answer: "išleidau"
