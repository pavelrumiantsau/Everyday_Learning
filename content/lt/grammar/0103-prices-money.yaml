    translation: "Вчера я потратил все деньги на одежду."
  - type: cloze
    text: "Gal gali man ___ penkiasdešimt eurų?"
    answer: "paskolinti"
    hint: "одолжить (дать)"
    translation: "Можешь одолжить мне пятьдесят евро?"
  - type: cloze
    text: "Šiandien visoms prekėms taikoma ___."
    answer: "nuolaida"
    hint: "скидка"
    translation: "Сегодня на все товары действует скидка."
