id: lt-g-0103
cefr: B1
order: 103
title: "Цены и деньги: kainuoja du eurus, mokėti kortele, išleisti, skolinti"
explanation:
  ru: |
    **kainuoti** (kainuoja, kainavo) + **винительный**: ***Kiek kainuoja?*** — *Kainuoja **eurą** / du **eurus** / penkis **eurus**.*
    - 10–20 и десятки, сотни → **род. мн.**: *dešimt **eurų**, šimtą **eurų***
    - так же *centas*: *penkiasdešimt centų*

    **mokėti** (moka, mokėjo):
    - за что — ***už*** + вин.: *mokėti **už** butą*
    - чем — творительный: *mokėti **kortele** / **grynaisiais*** (картой / наличными)

    **Ещё полезные глаголы:**
    - ***išleisti*** — потратить: *Išleidau visus pinigus.* · ***uždirbti*** — заработать
    - ***skolinti / paskolinti*** — одолжить (дать) кому: *Paskolink man…* · ***skolintis*** — занять (взять): *skolintis iš draugo*
    - ***brangu / pigu*** — дорого / дёшево · ***nuolaida*** — скидка · ***grąža*** — сдача
comparison:
  ru: |
    «Стоит два евро» — винительный, как в русском «стоит рубль»: *kainuoja **du eurus***. «Заплатить картой» — творительный без предлога, как в русском: *mokėti **kortele***.
examples:
  - { text: "Kiek kainuoja?", translation: "Сколько стоит?", source: "tatoeba:3589725" }
  - { text: "Kiek kainuoja duona?", translation: "Сколько стоит хлеб?", source: "tatoeba:5989009" }
  - { text: "Tai kainuoja du eurus.", translation: "Это стоит два евро.", source: "tatoeba:12325828" }
  - { text: "Aš išleidau šimtą eurų.", translation: "Я потратил сто евро.", source: "tatoeba:13736063" }
  - { text: "Paskolink man dvidešimt eurų.", translation: "Одолжи мне двадцать евро.", source: "tatoeba:9945794" }
exercises:
