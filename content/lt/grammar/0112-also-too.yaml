id: lt-g-0112
cefr: A2
order: 112
title: "Тоже и также: irgi, taip pat, ir; aš irgi ne"
explanation:
  ru: |
    - ***irgi*** — тоже (разговорное): *Aš **irgi** noriu.*
    - ***taip pat*** — тоже, также (нейтральное, письменное): *Ji **taip pat** graži.* · *Laiške taip pat buvo nuotrauka.*
    - ***ir*** — «и» в значении «тоже, даже»: ***Ir** aš!* · *Kur tu, ten **ir** aš.* · *Kviečiame **ir** jūsų šeimą.*

    **С отрицанием** — так же, как в русском «я тоже не»:
    - *Aš **irgi** nežinau.* · *Jos **taip pat** nėra.* · коротко: ***Ir aš ne.***

    *irgi* и *taip pat* обычно стоят **сразу после** слова, к которому относятся: *Aš irgi…*, *Tomas taip pat…*
comparison:
  ru: |
    В русском «тоже» с отрицанием иногда меняют на «тоже не» / «и я нет»; в литовском так же: *Aš irgi ne.* = *Ir aš ne.* Не путайте *taip pat* (тоже) с *taip* (так) и *pat* (самый, как раз): *tas pats*.
examples:
  - { text: "Taip, aš irgi.", translation: "Да, я тоже.", source: "tatoeba:12773627" }
  - { text: "Aš irgi noriu!", translation: "Я тоже хочу!", source: "tatoeba:13719479" }
  - { text: "Ji irgi nežino.", translation: "Она тоже не знает.", source: "tatoeba:8409755" }
  - { text: "Ji taip pat graži.", translation: "Она тоже красивая.", source: "tatoeba:11965506" }
  - { text: "Kur tu eisi, ten ir aš.", translation: "Куда ты пойдёшь, туда и я.", source: "tatoeba:13451899" }
