id: lt-g-0119
cefr: B2
order: 119
title: "Носовые ą, ę, į, ų: knygą, но su knyga; knygų, esąs, pažįstu"
explanation:
  ru: |
    *ą, ę, į, ų* сегодня звучат как **долгие** *a, e, i, u* — носового звука нет. Поэтому их легко пропустить на письме. Где они пишутся:

    **1. Окончания:**
    - винительный ед. ч.: *knyg**ą**, up**ę**, brol**į**, naktį, sūn**ų***; прилагательные: *ger**ą**, didel**į**, graž**ų***; *ger**ąjį**, ger**ąją***
    - родительный мн. ч. — **всегда -ų**: *knygų, žmonių, gerų, mūsų*
    - причастия: *es**ą**s, tur**į**s* (наст.), *buv**ę**s, skait**ę**s* (прош.), *skaitysi**ą**s* (буд.)

    **Без носовой:** творительный ж. р. — ***su knyga**, su mama, su gera drauge*; именительный — *knyga*. В речи *knygą* и *knyga* почти одинаковы, на письме их различает только знак.

    **2. Корни:** носовая пишется там, где в родственной форме слышно *an, en, in, un*:
    - *k**ą**sti – k**an**da*, *si**ų**sti – si**un**čia*, *sk**ę**sti – sk**en**do*, *l**į**sti – l**en**da*, *paž**į**stu – paž**in**ti*

    **3. Приставка и предлог *į*** — всегда с носовой: ***į** namus, **į**eiti, **į**domu*. А в *yra, ypač* — *y*.
comparison:
  ru: |
    Это похоже на русское «тся / ться»: в речи одинаково, на письме — по правилу. Самое частое правило: «кого? что?» в ед. ч. → носовая (*matau knygą*), «с кем? чем?» → нет (*su knyga*). Родительный мн. ч. («чего? кого?» — много) → всегда *-ų*. Пропущенная носовая — частая ошибка в письменных заданиях B2.
examples:
  - { text: "Aš imu knygą.", translation: "Я беру книгу.", source: "tatoeba:12498212" }
  - { text: "Tu turi sūnų.", translation: "У тебя есть сын.", source: "tatoeba:12078331" }
  - { text: "Aš neturiu sūnų.", translation: "У меня нет сыновей.", source: "tatoeba:12137975" }
  - { text: "Paimk šitą dėžę.", translation: "Возьми этот ящик.", source: "tatoeba:10125100" }
  - { text: "Jis mano esąs turtingas.", translation: "Он думает, что он богат.", source: "tatoeba:10930377" }
exercises:
