    hint: "naujas → вин."
    translation: "Он купил новую машину."
  - type: cloze
    text: "Iš kalno matome ___."
    answer: "upę"
    hint: "upė → вин."
    translation: "С горы мы видим реку."
  - type: cloze
    text: "Jis sakė ___ pavargęs."
    answer: "esąs"
