    text: "Vakar perskaičiau įdomią ___."
    answer: "knygą"
    hint: "knyga → вин."
    translation: "Вчера я прочитал интересную книгу."
  - type: cloze
    text: "Kalbėjau telefonu su ___."
    answer: "mama"
    hint: "mama → твор. (с мамой)"
    translation: "Я говорил по телефону с мамой."
  - type: cloze
    text: "Neturiu ___."
    answer: "pinigų"
    hint: "pinigai → род. мн."
    translation: "У меня нет денег."
  - type: cloze
    text: "Jis nusipirko ___ automobilį."
