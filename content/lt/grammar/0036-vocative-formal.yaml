id: lt-g-0036
cefr: B2
order: 36
title: "Обращение: Jonai!, sese!; вежливое Jūs и официальное письмо"
explanation:
  ru: |
    **Звательный падеж** (*šauksmininkas*) — форма для обращения:
    - **-as → -ai** в именах: *Jonas → **Jonai**, Tomas → **Tomai**, Petras → **Petrai***
    - **-as → -e** в нарицательных: *draugas → **drauge**, ponas → **pone***
    - **-is → -i**: *brolis → **broli**, tėtis → **tėti***
    - **-us → -au**: *sūnus → **sūnau***
    - **-a → -a**: *mama → **mama**, Rasa → **Rasa***
    - **-ė → -e**: *sesė → **sese**, Birutė → **Birute***

    **Вежливость:**
    - **Jūs** — «вы» одному человеку; в письме пишется **с большой буквы**: *Jūs, Jūsų, Jums*.
    - **ponas, ponia, panelė** + имя в звательном: ***Pone Jonai**, **ponia Rasa***.
    - просьба: *Ar **galėtumėte**…?* (не могли бы вы), *Būkite malonūs, …* (будьте добры).

    **Официальное письмо:**
    - начало: ***Gerbiamasis pone** Petrai, / **Gerbiamoji ponia** Rasa,* или нейтрально *Laba diena,*
    - конец: ***Pagarbiai**,* или ***Su pagarba**,* + имя и фамилия.
comparison:
  ru: |
    В русском звательный почти исчез («мам!», «Боже!»), а в литовском он обязателен: сказать «Jonas, ateik!» — ошибка, нужно ***Jonai**, ateik!* Женские фамилии на *-ienė, -aitė, -ytė* в звательном меняют *-ė* на *-e*: *ponia Kazlauskiene*.
examples:
  - { text: "Tomai, grįžk!", translation: "Том, вернись!", source: "tatoeba:12570129" }
  - { text: "Mama, kur mes?", translation: "Мама, где мы?", source: "tatoeba:13716402" }
  - { text: "Tėti, kur mama?", translation: "Папа, где мама?", source: "tatoeba:13423245" }
  - { text: "Tai yra paskutinis traukinys, pone.", translation: "Это последний поезд, господин.", source: "tatoeba:1660109" }
