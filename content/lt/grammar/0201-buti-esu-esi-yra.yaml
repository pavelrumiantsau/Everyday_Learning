id: lt-g-0201
cefr: A1
order: 201
track: foundation
title: "Глагол būti: aš esu, tu esi, jis yra"
explanation:
  ru: |
    **Būti** — «быть». В русском в настоящем времени этот глагол обычно не говорят: «я студент». В литовском его **говорят**: Aš **esu** studentas.

    Формы настоящего времени:
    - aš **esu** — я
    - tu **esi** — ты
    - jis, ji **yra** — он, она
    - mes **esame** — мы
    - jūs **esate** — вы (и вежливое «Вы»)
    - jie, jos **yra** — они (*jie* — мужчины или смешанная группа, *jos* — только женщины)

    Местоимение можно опустить — форма глагола и так показывает, кто: *Esu studentas.* В разговоре в третьем лице *yra* часто пропускают: *Ji lietuvė.* — «Она литовка».

    **Отрицание:** *ne* пишется слитно: **nesu, nesi, nesame, nesate**. В третьем лице — **nėra**: *Jis nėra mokytojas.* — «Он не учитель».

    **Вопрос** начинается со слова **ar** (как русское «ли», но всегда в начале): *Ar tu esi studentas?* — «Ты студент?» Ответ: *Taip, esu.* / *Ne, nesu.*

    С незнакомыми и старшими говорят на «вы»: *Ar jūs esate mokytojas?*
comparison:
  ru: |
    По-русски «я — студент», «он — врач» — без глагола. По-литовски глагол нужен: *Aš esu studentas. Jis yra gydytojas.* Вопрос с **ar** похож на русское «Студент ли ты?», только *ar* всегда стоит первым.
