  - { text: "Jis yra mokytojas.", translation: "Он учитель.", source: "tatoeba:5989093" }
  - { text: "Ji yra gydytoja.", translation: "Она врач.", source: "tatoeba:12368464" }
  - { text: "Mes esame darbe.", translation: "Мы на работе.", source: "tatoeba:11450538" }
