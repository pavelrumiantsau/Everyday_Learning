id: lt-g-0249
cefr: A2
order: 249
track: foundation
title: "Сколько: daug, mažai, kiek, keli, keletas; kilogramas obuolių"
explanation:
  ru: |
    После слов количества — **родительный падеж**:
    - **daug** — много, **mažai** — мало, **kiek?** — сколько?, **šiek tiek / truputį** — немного, **per daug** — слишком много, **daugiau** — больше
    - считаемое — мн. ч.: *daug žmonių, mažai knygų*; несчитаемое — ед. ч.: *daug laiko, šiek tiek cukraus*
    - меры: *kilogramas obuolių, litras pieno, pakelis arbatos, butelis vandens, gabalas pyrago*

    **Ловушка — keli и keletas** (несколько):
    - **keli / kelios** — как прилагательное, в том же падеже: *keli draugai*, *kelios knygos*, *su keliais draugais*
    - **keletas** — как существительное + родительный: *keletas žmonių*, вин. п.: *turiu **keletą** klausimų*
comparison:
  ru: |
    Как в русском «много людей», «литр молока». Особенность — *keli*: по-русски «несколько друзей» (род. п.), а по-литовски *keli draugai* (им. п.).
examples:
  - { text: "Parke daug žmonių.", translation: "В парке много людей.", source: "tatoeba:3263602" }
  - { text: "Aš turiu daug knygų.", translation: "У меня много книг.", source: "tatoeba:3955023" }
  - { text: "Tai daug laiko atima.", translation: "Это отнимает много времени.", source: "tatoeba:12570849" }
  - { text: "Ar per daug pinigų?", translation: "Слишком много денег?", source: "tatoeba:11582181" }
  - { text: "Jį daug kartų įspėjo.", translation: "Его много раз предупреждали.", source: "tatoeba:13098663" }
