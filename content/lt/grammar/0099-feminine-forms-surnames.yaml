id: lt-g-0099
cefr: B1
order: 99
title: "Женские формы: mokytoja, studentė; фамилии Kazlauskienė, Kazlauskaitė"
explanation:
  ru: |
    **Профессии** — у почти каждой есть женская форма:
    - *-tojas → **-toja***: *mokytojas → mokytoja, gydytojas → gydytoja, vairuotojas → vairuotoja*
    - *-ėjas → **-ėja***: *pardavėjas → pardavėja, virėjas → virėja*
    - *-as / -is / -ius → **-ė***: *studentas → studentė, direktorius → direktorė*
    - *-ininkas → **-ininkė***: *dainininkas → dainininkė*

    **Фамилии** — у женщин свои окончания:
    - замужняя: ***-ienė***: *Kazlauskas → **Kazlauskienė***, *Petraitis → Petraitienė*, *Butkus → Butkuvienė*
    - незамужняя: ***-aitė / -ytė / -utė / -ūtė***: *Kazlauskas → **Kazlauskaitė***, *Petraitis → Petraitytė*, *Butkus → Butkutė*
    - нейтральная форма на ***-ė*** (не указывает на семейное положение): *Kazlauskė*

    **Обращение** — звательный падеж: *Laba diena, ponia **Kazlauskiene**! · pone **Kazlauskai**!*
comparison:
  ru: |
    В русском фамилия жены совпадает с мужской в женском роде (*Казлаускас → Казлаускас*), а в литовском по фамилии видно, замужем ли женщина: *Kazlauskienė* — жена, *Kazlauskaitė* — дочь.
examples:
  - { text: "Ar jūs mokytoja?", translation: "Вы учительница?", source: "tatoeba:12348918" }
  - { text: "Ji nori būti mokytoja.", translation: "Она хочет быть учительницей.", source: "tatoeba:13391288" }
  - { text: "Ar tu dainininkė?", translation: "Ты певица?", source: "tatoeba:12328020" }
  - { text: "Ji yra jauna studentė.", translation: "Она молодая студентка.", source: "tatoeba:2725782" }
  - { text: "Aš ne studentė.", translation: "Я не студентка.", source: "tatoeba:13562760" }
