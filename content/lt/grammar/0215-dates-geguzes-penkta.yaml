    text: "Gimiau ___ dešimtą dieną."
    answer: "sausio"
    hint: "sausis"
    translation: "Я родился десятого января."
  - type: cloze
    text: "Egzaminas yra spalio ___ dieną."
    answer: "antrą"
    hint: "2"
    translation: "Экзамен второго октября."
  - type: cloze
    text: "Kada tavo ___?"
    answer: "gimtadienis"
    translation: "Когда у тебя день рождения?"
  - type: cloze
    text: "Jis gimė ___ trečią dieną."
    answer: "liepos"
    hint: "liepa"
    translation: "Он родился третьего июля."
  - type: cloze
    text: "Susitinkame birželio ___ dieną."
