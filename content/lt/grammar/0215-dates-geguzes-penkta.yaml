    hint: "1"
    translation: "Встречаемся первого июня."
  - type: cloze
    text: "Ji gimė ___ dvidešimtą dieną."
    answer: "rugsėjo"
    hint: "rugsėjis"
    translation: "Она родилась двадцатого сентября."
  - type: cloze
    text: "Gimiau gruodžio dvyliktą ___."
    answer: "dieną"
    translation: "Я родился двенадцатого декабря."
