id: lt-g-0230
cefr: A2
order: 230
track: foundation
title: "Множественное число во всех падежах: draugų, draugams, draugais, drauguose"
explanation:
  ru: |
    Четыре образца — по ним склоняется большинство существительных во множественном числе:

    - **draugas** (м. р., -as): draugai — draug**ų** — draug**ams** — draug**us** — draug**ais** — draug**uose**
    - **brolis** (м. р., -is): broliai — brol**ių** — brol**iams** — brol**ius** — brol**iais** — brol**iuose**
    - **knyga** (ж. р., -a): knygos — knyg**ų** — knyg**oms** — knyg**as** — knyg**omis** — knyg**ose**
    - **kėdė** (ж. р., -ė): kėdės — kėdž**ių** — kėd**ėms** — kėd**es** — kėd**ėmis** — kėd**ėse**

    Порядок падежей: кто? (им.) — кого? чего? (род.) — кому? (дат.) — кого? что? (вин.) — кем? чем? (твор.) — где? (мест.).

    Полезно запомнить:
    - **родительный мн. ч. всегда на -ų** (*draugų, knygų, kėdžių*) — после *daug, nėra, kiek*: *daug knygų*
    - **твор. мн. ч.**: *su draugais, su knygomis*
    - **мест. мн. ч.**: *miestuose, parduotuvėse, namuose*
    - в *kėdė → kėdžių* снова *d → dž* перед *-ių*
comparison:
  ru: |
    Падежей столько же, сколько в русском (плюс звательный), и вопросы те же. Удобно: родительный множественного числа у всех слов кончается на *-ų*, как будто русское «-ов / -ей» стало одним окончанием.
examples:
  - { text: "Aš gyvenu su tėvais.", translation: "Я живу с родителями.", source: "tatoeba:12209589" }
  - { text: "Tai filmas vaikams.", translation: "Это фильм для детей.", source: "tatoeba:12895862" }
  - { text: "Kiek metų tavo tėvams?", translation: "Сколько лет твоим родителям?", source: "tatoeba:10718285" }
  - { text: "Jis naršė senose knygose.", translation: "Он рылся в старых книгах.", source: "tatoeba:13260353" }
  - { text: "Ar turi vaikų?", translation: "У тебя дети есть?", source: "tatoeba:2657703" }
