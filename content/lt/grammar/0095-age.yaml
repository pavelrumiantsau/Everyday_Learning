id: lt-g-0095
cefr: B1
order: 95
title: "Возраст: man trisdešimt metų, vienerių metų vaikas, mano amžiaus"
explanation:
  ru: |
    **Сколько лет** — кому в дательном: ***Kiek tau metų?*** — *Man trisdešimt metų.*
    - 10–20 и круглые десятки → ***metų*** (род. мн.): *dvidešimt **metų**, keturiasdešimt metų*
    - 1, 21, 31… → ***vieneri*** *metai*: *Man trisdešimt **vieneri** metai.*
    - 2–9 → *metai* с числительным: *penki metai, šeši metai*; для 2–4 часто собирательные: *dveji, treji metai*

    **«Ребёнок одного года, девочка пятнадцати лет»** — родительный:
    - ***vienerių metų*** *vaikas* · *penkiolikos metų mergaitė*

    **amžius** — возраст (и «век»):
    - *mano **amžiaus*** (моего возраста), *vieno amžiaus* (одного возраста), *pensinio amžiaus* (пенсионного возраста)

    **Кто старше:** *vyresnis / jaunesnis **už** mane* (или *nei aš*); на сколько — творительный: *dvejais metais vyresnis*.
comparison:
  ru: |
    Как в русском «мне двадцать лет» — дательный. Отличия: «на два года старше» = ***dvejais metais*** *vyresnis* (творительный без предлога) и «старше меня» = *vyresnis **už** mane*.
examples:
  - { text: "Man šeši metai.", translation: "Мне шесть лет.", source: "tatoeba:12118598" }
  - { text: "Man šešiasdešimt vieneri metai.", translation: "Мне шестьдесят один год.", source: "tatoeba:10323241" }
  - { text: "Aš buvau jūsų amžiaus.", translation: "Я был вашего возраста.", source: "tatoeba:3576780" }
  - { text: "Jie visi vieno amžiaus.", translation: "Они все одного возраста.", source: "tatoeba:12198552" }
  - { text: "Ji maždaug tavo amžiaus.", translation: "Она примерно твоего возраста.", source: "tatoeba:12855182" }
