id: lt-g-0231
cefr: A2
order: 231
track: foundation
title: "Где именно: ant stalo, po stalu, prie lango, šalia, už, tarp"
explanation:
  ru: |
    Предлоги места. Почти все — с **родительным** падежом:
    - **ant** + род. — на: *ant stalo* — на столе
    - **prie** + род. — у, возле: *prie lango* — у окна, *prie durų* — у двери
    - **šalia** + род. — рядом с: *šalia stoties* — рядом с вокзалом
    - **už** + род. — за: *už namo* — за домом
    - **tarp** + род. — между, среди: *tarp banko ir pašto* — между банком и почтой
    - **virš** + род. — над: *virš stalo* — над столом

    Исключения:
    - **po** + **творительный** — под: *po stalu, po lova* (на письме *lova* не меняется)
    - **priešais** + **винительный** — напротив: *priešais bažnyčią*

    *Kur yra raktas? — Ant stalo.* Ответ часто без глагола.
comparison:
  ru: |
    Как русские «на, у, рядом с, за, между». Только падеж почти всегда один — родительный: *ant stalo* («на стол**а**», хотя по-русски «на стол**е**»).
examples:
  - { text: "Raktas ant stalo.", translation: "Ключ на столе.", source: "tatoeba:13840261" }
  - { text: "Krepšys po stalu.", translation: "Корзина под столом.", source: "tatoeba:10665592" }
  - { text: "Ji stovi prie durų.", translation: "Она стоит у двери.", source: "tatoeba:13221398" }
  - { text: "Aš šalia stoties.", translation: "Я рядом со станцией.", source: "tatoeba:13520580" }
  - { text: "Jis slepiasi už durų.", translation: "Он прячется за дверью.", source: "tatoeba:13358904" }
