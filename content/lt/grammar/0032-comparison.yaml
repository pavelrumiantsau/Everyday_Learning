id: lt-g-0032
cefr: B1
order: 32
title: "Степени сравнения: geresnis, geriausias, greičiau"
explanation:
  ru: |
    **Сравнительная степень:**
    - прилагательные: **-esnis, -esnė**: *geras → **geresnis***, *gražus → **gražesnis***, *didelis → **didesnis***, *šiltas → **šiltesnis***
    - наречия: **-iau**: *greitai → **greičiau***, *gerai → **geriau***, *lėtai → **lėčiau***, *daug → **daugiau***, *mažai → **mažiau***, *pigiai → **pigiau***
    - о возрасте людей: **vyresnis** (старше), **jaunesnis** (моложе)

    **«Чем»:** **už + вин. п.** или **negu / nei + им. п.**:
    - *Aš jaunesnis **už jus**.* = *Aš jaunesnis **negu jūs**.*

    **Превосходная степень:** **-iausias, -iausia** (наречия **-iausiai**): *geriausias, didžiausia, gražiausiai*. Часто с **pats / pati**: ***pats geriausias*** — самый лучший.

    **«Один из лучших»** — *vienas **geriausių*** (род. п. мн. ч., без *iš*).

    **Усиление:** *daug / kur kas geresnis* — гораздо лучше, *dar geresnis* — ещё лучше, ***vis** šilčiau* — всё теплее.
comparison:
  ru: |
    Как в русском, но сравнение чаще строится через *už* с винительным: *už mane* — «меня» («старше меня» = *vyresnis už mane*). Суффикс *-iau* у наречий похож на русское «-ее»: *greičiau* — «быстрее».
examples:
  - { text: "Aš jaunesnis už jus.", translation: "Я моложе вас.", source: "tatoeba:10539642" }
  - { text: "Ji aukštesnė už tave.", translation: "Она выше тебя.", source: "tatoeba:10188704" }
  - { text: "Tu geriau už mane dainuoji.", translation: "Ты лучше меня поёшь.", source: "tatoeba:12348864" }
  - { text: "Tu pats geriausias tėtis!", translation: "Ты самый лучший папа!", source: "tatoeba:10723160" }
  - { text: "Auksas brangesnis už šviną.", translation: "Золото дороже свинца.", source: "tatoeba:11583673" }
exercises:
