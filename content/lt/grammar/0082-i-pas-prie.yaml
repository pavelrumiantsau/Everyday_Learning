id: lt-g-0082
cefr: B1
order: 82
title: "Куда и к кому: į, pas, prie, ant, link"
explanation:
  ru: |
    Русское «в / к / на» в литовском распределяется по пяти предлогам.

    - ***į*** + вин. п. — **внутрь**, в место или учреждение: *į parduotuvę, į mokyklą, į Vilnių*
    - ***pas*** + вин. п. — **к человеку** и **у человека**: *Einu **pas** gydytoją.* (к врачу) · *Esu **pas** draugą.* (у друга)
    - ***prie*** + род. п. — **к / у / возле**: *Sėsk **prie** stalo.* · *Važiuojame **prie** jūros.* (на море) · *stovi **prie** durų*
    - ***ant*** + род. п. — **на** поверхность / на поверхности: *Padėk **ant** stalo.* · *Užlipome **ant** kalno.*
    - ***link*** + род. п. — **в сторону**, часто после слова: *ėjo **namų link*** или *link namų*

    Удобно: *pas* и *prie* не меняются для «где?» и «куда?»: *pas draugą* = и «у друга», и «к другу».
comparison:
  ru: |
    Типичный русизм — ***į*** с человеком: *eiti į gydytoją* ✗ → ***pas*** *gydytoją* ✓. И «на море, на озеро» — обычно ***prie*** *jūros, prie ežero* (к берегу), а не *ant*.
examples:
  - { text: "Ji pas gydytoją.", translation: "Она у врача.", source: "tatoeba:10346186" }
  - { text: "Eikime pas mane!", translation: "Пойдемте ко мне!", source: "tatoeba:12178139" }
  - { text: "Važiuokime prie ežero.", translation: "Давай съездим на озеро.", source: "tatoeba:11525993" }
  - { text: "Sėskite prie stalo!", translation: "Садитесь за стол!", source: "tatoeba:12368445" }
  - { text: "Ji stovi prie durų.", translation: "Она стоит у двери.", source: "tatoeba:13221398" }
