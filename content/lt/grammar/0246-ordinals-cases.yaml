id: lt-g-0246
cefr: A2
order: 246
track: foundation
title: "Порядковые числительные в падежах: pirmame aukšte, antrą kartą"
explanation:
  ru: |
    Порядковые числительные (*pirmas, antras, trečias…*) склоняются как прилагательные на *-as / -a*:
    - **где?** (мест.): *pirmame aukšte* — на первом этаже, *trečioje klasėje* — в третьем классе, *ketvirtame kurse* — на четвёртом курсе
    - **который раз?** (вин.): *pirmą kartą* — в первый раз, *antrą kartą*
    - **до какого часа?** (род., ж. р.): *iki šeštos valandos*
    - **во сколько?** (вин., ж. р.): *penktą valandą*

    Формы мест. п.: м. р. **-ame** (*pirmame, antrame, trečiame*), ж. р. **-oje** (*pirmoje, antroje, trečioje*).

    *Klasė, eilė, valanda* — женского рода, *aukštas, kursas, kartas* — мужского.
comparison:
  ru: |
    Как русские «на первом этаже», «в первый раз»: порядковое число согласуется с существительным. Только «в первый раз» по-литовски без предлога: *pirmą kartą*.
examples:
  - { text: "Ji pirmame aukšte.", translation: "Она на первом этаже.", source: "tatoeba:11031912" }
  - { text: "Aš gyvenau trečiame aukšte.", translation: "Я жил на третьем этаже.", source: "tatoeba:13417862" }
  - { text: "Tu pirmą kartą vėluoji.", translation: "Ты впервые опаздываешь.", source: "tatoeba:13176832" }
  - { text: "Aš čia jau ne pirmą kartą.", translation: "Я здесь уже не в первый раз.", source: "tatoeba:9850811" }
  - { text: "Ar tau tai pirmą kartą?", translation: "У тебя такое впервой?", source: "tatoeba:11059584" }
