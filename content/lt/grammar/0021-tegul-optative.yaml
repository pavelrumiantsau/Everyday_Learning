    answer: "Tegul"
    also: ["Tegu"]
    hint: "«пусть»"
    translation: "Пусть он придёт завтра."
  - type: cloze
    text: "Tegul vaikai ___ lauke."
    answer: "žaidžia"
    hint: "žaisti, наст. вр."
    translation: "Пусть дети играют на улице."
  - type: cloze
    text: "Tegul jis ___, jis labai pavargęs."
    answer: "pailsi"
    also: ["pasilsi", "ilsisi"]
    hint: "pailsėti, наст. вр."
    translation: "Пусть он отдохнёт, он очень устал."
  - type: cloze
    text: "Pasakyk jam, tegul ___."
    answer: "palaukia"
    hint: "palaukti, наст. вр."
    translation: "Скажи ему, пусть подождёт."
  - type: cloze
    text: "___ laisva Lietuva!"
    answer: "Tegyvuoja"
    hint: "gyvuoti (gyvuoja) + te-"
    translation: "Да здравствует свободная Литва!"
  - type: cloze
    text: "___ taip, kaip tu nori."
    answer: "Tebūnie"
    also: ["Tebūna", "Tegul būna", "Tegu būna"]
    hint: "būti, торжественная форма"
    translation: "Пусть будет так, как ты хочешь."
  - type: cloze
    text: "Linkiu tau ___!"
    answer: "sėkmės"
    hint: "sėkmė, род. п."
    translation: "Желаю тебе удачи!"
  - type: cloze
    text: "Geros ___!"
    answer: "kelionės"
