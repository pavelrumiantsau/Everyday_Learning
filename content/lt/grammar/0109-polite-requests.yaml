    hint: "не могли бы (вы)"
    translation: "Не могли бы вы мне помочь?"
  - type: cloze
    text: "Gal ___ šiek tiek palaukti?"
    answer: "galėtumėte"
    also: ["galėtum"]
    hint: "не могли бы"
    translation: "Не могли бы вы немного подождать?"
  - type: cloze
    text: "___ užsisakyti stalelį dviem."
    answer: "Norėčiau"
