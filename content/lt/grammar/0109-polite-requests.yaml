    translation: "Вам не трудно было бы позвонить мне вечером?"
  - type: cloze
    text: "Norėčiau ___ kavos su pienu."
    answer: "puodelio"
    hint: "puodelis → род. п."
    translation: "Я хотел бы чашку кофе с молоком."
