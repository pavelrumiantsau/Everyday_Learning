id: lt-g-0236
cefr: A2
order: 236
track: foundation
title: "Возвратные глаголы во всех временах; когда: kai"
explanation:
  ru: |
    *-si* есть во всех временах:
    - **настоящее:** keliuosi, keliesi, keliasi, keliamės, keliatės
    - **прошедшее:** kėliausi, kėleisi, kėlėsi, kėlėmės, kėlėtės (*keltis — keliasi — kėlėsi*)
    - **будущее:** kelsiuosi, kelsiesi, kelsis, kelsimės, kelsitės
    - **многократное:** keldavausi, keldavosi
    - *mokytis*: mokausi — mokiausi — mokysiuosi

    С *ne-* и приставкой *-si-* по-прежнему уходит вперёд: *nesikėliau, atsikėliau*.

    **Kai** — «когда» в середине предложения: *Kai buvau mažas, gyvenau kaime.* — Когда я был маленьким, я жил в деревне.
    О будущем после *kai* — будущее время, как в русском: *Kai grįšiu, paskambinsiu.* — Когда вернусь, позвоню.
comparison:
  ru: |
    Как в русском «встаю — вставал — буду вставать», только «-ся» никогда не теряется: *keliuosi — kėliausi — kelsiuosi*. *Kai* — как русское «когда» в сложном предложении.
examples:
  - { text: "Jie rūpinosi manimi, kai aš buvau mažas.", translation: "Они заботились обо мне, когда я был маленьким.", source: "tatoeba:13554751" }
  - { text: "Aš šitą knygą perskaičiau, kai buvau universitete.", translation: "Я прочёл эту книгу, будучи в университете.", source: "tatoeba:13403905" }
  - { text: "Aš mokiausi šitoje mokykloje.", translation: "Я учился в этой школе.", source: "tatoeba:11851413" }
  - { text: "Vakare aš mokysiuosi.", translation: "Вечером я буду заниматься.", source: "tatoeba:10767888" }
  - { text: "Prašau, paskambink man, kai užbaigsi.", translation: "Позвони мне, пожалуйста, когда закончишь.", source: "tatoeba:13623211" }
