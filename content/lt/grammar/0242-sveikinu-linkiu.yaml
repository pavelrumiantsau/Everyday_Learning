id: lt-g-0242
cefr: A2
order: 242
track: foundation
title: "Поздравления: sveikinu su gimtadieniu; linkiu sėkmės"
explanation:
  ru: |
    **Поздравляю с…** — *Sveikinu* (*Sveikiname*) **su** + творительный:
    - *su gimtadieniu* — с днём рождения, *su Kalėdomis* — с Рождеством
    - *su Naujaisiais metais* — с Новым годом, *su vestuvėmis* — со свадьбой
    - коротко, без глагола: ***Su gimtadieniu!***

    **Желаю…** — *Linkiu* (*Linkime*) + **кому** (дат.) + **чего** (родительный):
    - *Linkiu tau sėkmės.* — Желаю тебе удачи.
    - *Linkime jums sveikatos ir laimės.* — Желаем вам здоровья и счастья.
    - *Linkiu ramių švenčių.* — Желаю спокойных праздников.

    **Открытка или письмо:**
    - начало: *Mielas Jonai,* / *Mieloji Rasa,* (друзьям); *Gerbiamas pone Jonai,* (официально)
    - конец: *Su meile* (с любовью), *Su pagarba* (с уважением), *Tavo / Jūsų Olga*
comparison:
  ru: |
    Как в русском: «поздравляю **с** днём рождения» — творительный, «желаю удачи» — родительный. Конструкции совпадают, нужно только знать формы: *su gimtadieniu, sėkmės*.
examples:
  - { text: "Sveikinu su gimtadieniu.", translation: "Поздравляю с днём рождения.", source: "tatoeba:2226181" }
  - { text: "Linkiu laimės!", translation: "Желаю счастья!", source: "tatoeba:13103090" }
  - { text: "Linkiu tau sėkmės.", translation: "Желаю удачи.", source: "tatoeba:1673808" }
  - { text: "Linkiu Tomui sėkmės.", translation: "Желаю Тому удачи.", source: "tatoeba:8347605" }
  - { text: "Sveikinu su jūsų jubiliejumi.", translation: "Поздравляю с вашей годовщиной.", source: "tatoeba:2226182" }
