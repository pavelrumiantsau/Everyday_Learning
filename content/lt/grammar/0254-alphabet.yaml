id: lt-g-0254
cefr: A1
order: 254
track: foundation
title: "Алфавит: 32 буквы; имя по буквам"
explanation:
  ru: |
    В литовском алфавите **32 буквы**, и почти все читаются **так, как пишутся**:

    a, **ą**, b, c, **č**, d, e, **ę**, **ė**, f, g, h, i, **į**, **y**, j, k, l, m, n, o, p, r, s, **š**, t, u, **ų**, **ū**, v, z, **ž**

    Особые буквы:
    - **č, š, ž** — «ч», «ш», «ж»
    - **ą, ę, į, ų** (с «хвостиком», *nosinės*) — сегодня это просто **долгие** a, e, i, u
    - **ė** — долгий закрытый «э»; **y** — долгий «и» (как *į*); **ū** — долгий «у» (как *ų*)

    Букв **q, w, x** нет — они бывают только в иностранных именах.

    **Имя по буквам** (*pasakyti paraidžiui*) — частая просьба в банке, на почте и на экзамене: *Kaip rašoma jūsų pavardė?* — Как пишется ваша фамилия? Отвечают буквами: *P, e, t, r, o, v, a.* Названия особых букв: *če, eš, žė, nosinė a, ilgoji i (y), ilgoji u (ū)*.

    Нажмите 🔊 у упражнений: вы слышите всё предложение и пишете пропущенное слово.
comparison:
  ru: |
    Почти каждой литовской букве соответствует один звук, как в русском. Непривычны только знаки над и под буквами — они меняют звук или долготу, поэтому их нельзя пропускать.
examples:
