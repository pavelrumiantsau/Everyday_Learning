id: lt-g-0250
cefr: A2
order: 250
track: foundation
title: "Приставки: ateiti, išeiti, įeiti, nueiti, pereiti; padaryti, nupirkti"
explanation:
  ru: |
    Приставки меняют смысл глагола, как в русском. **С глаголами движения** (*eiti, važiuoti, bėgti…*):
    - **at-** — при-: *ateiti* — прийти, *atvažiuoti* — приехать
    - **iš-** — вы-, у-: *išeiti* — выйти, уйти, *išvažiuoti* — уехать
    - **į-** — в-: *įeiti* — войти
    - **nu-** — до-, с-, от-: *nueiti* — сходить, дойти
    - **per-** — пере-: *pereiti* gatvę — перейти улицу
    - **už-** — за-: *užeiti* — зайти (ненадолго)
    - **par-** — домой: *pareiti* — вернуться домой
    - **pra-** — про-, мимо: *praeiti* — пройти (мимо)

    **Сделать до конца** (совершенный вид) — тоже приставка, часто **pa-**: *daryti → padaryti, rašyti → parašyti, valgyti → pavalgyti*; иногда другая: *pirkti → nupirkti, gerti → išgerti*.

    Все формы как у основного глагола: *ateiti — ateina — atėjo; išeisiu, išėjau*.
comparison:
  ru: |
    Почти как русские приставки: *at-* = «при-», *iš-* = «вы-», *per-* = «пере-», *už-* = «за-». *Parašyti* — «написать», *pavalgyti* — «поесть»: та же разница видов.
examples:
  - { text: "Ji atėjo.", translation: "Она пришла.", source: "tatoeba:7695323" }
  - { text: "Jis įėjo.", translation: "Он вошёл.", source: "tatoeba:12287939" }
  - { text: "Visi nuėjo namo.", translation: "Все пошли домой.", source: "tatoeba:13720559" }
  - { text: "Ji išėjo iš mūsų.", translation: "Она ушла от нас.", source: "tatoeba:6872247" }
