id: lt-g-0216
cefr: A1
order: 216
track: foundation
title: "У меня болит: man skauda galvą; sergu; gerk, gerkite"
explanation:
  ru: |
    **Что болит?** — *Man skauda* + **винительный падеж**:
    - *Man skauda **galvą**.* — У меня болит голова.
    - *Jam skauda **pilvą** / **gerklę** / **dantį** / **nugarą** / **koją**.*
    - *Kas jums skauda?* — Что у вас болит?

    **Болеть (быть больным)** — *sirgti*: aš **sergu**, tu **sergi**, jis/ji **serga**. *Aš sergu.* — Я болен (больна).

    **Как я себя чувствую:** *Jaučiuosi gerai / blogai.* — Чувствую себя хорошо / плохо.

    **Просьба, совет (повелительное наклонение):** от инфинитива убираем *-ti* и добавляем **-k** (на «ты») или **-kite** (на «вы»):
    - gerti → **gerk**, **gerkite** — пей(те)
    - valgyti → **valgyk**, **valgykite** — ешь(те)
    - eiti → **eik**, **eikite** — иди(те)
    - kalbėti → **kalbėk**, **kalbėkite** — говори(те)

    Пожелание больному: ***Pasveik!*** / ***Pasveikite!*** — Выздоравливай(те)!
comparison:
  ru: |
    По-русски «у меня болит голова» — голова в именительном. По-литовски — в винительном: *man skauda galv**ą***. Повелительное легко: всегда *-k / -kite*: *gerk — gerkite*.
examples:
  - { text: "Man skauda galvą.", translation: "Голова у меня болит.", source: "tatoeba:2153648" }
  - { text: "Man skauda pilvą.", translation: "У меня болит живот.", source: "tatoeba:2191866" }
  - { text: "Man skauda dantį.", translation: "У меня зуб болит.", source: "tatoeba:11334849" }
  - { text: "Jis serga.", translation: "Он болен.", source: "tatoeba:1666712" }
  - { text: "Valgyk!", translation: "Ешь!", source: "tatoeba:12403135" }
