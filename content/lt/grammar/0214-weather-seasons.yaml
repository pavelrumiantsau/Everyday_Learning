id: lt-g-0214
cefr: A1
order: 214
track: foundation
title: "Погода и времена года: lyja, sninga, šalta; žiemą, vasarą"
explanation:
  ru: |
    **Погода** — короткие предложения без подлежащего, как в русском:
    - **Lyja.** — Идёт дождь. **Sninga.** — Идёт снег.
    - **Šalta.** — Холодно. **Šilta.** — Тепло. **Karšta.** — Жарко.
    - **Pučia vėjas.** — Дует ветер. **Šviečia saulė.** — Светит солнце.
    - *Koks šiandien oras?* — Какая сегодня погода?

    **Мне холодно:** *Man šalta.* — кому — в дательном падеже, как в *man patinka*.

    **Когда? Времена года и месяцы** — в винительном падеже, без предлога:
    - **žiemą** — зимой, **pavasarį** — весной, **vasarą** — летом, **rudenį** — осенью
    - месяцы: *sausį, vasarį, kovą, balandį, gegužę, birželį, liepą, rugpjūtį, rugsėjį, spalį, lapkritį, gruodį* — в январе, в феврале…

    Названия месяцев в литовском свои, не латинские: *sausis* — январь, *liepa* — июль (и «липа»).
comparison:
  ru: |
    «Холодно», «жарко», «идёт снег» — так же безлично: *šalta, karšta, sninga*. А «зимой», «летом» — по-литовски тоже одно слово без предлога: *žiemą, vasarą*.
examples:
  - { text: "Sninga.", translation: "Идёт снег.", source: "tatoeba:1283320" }
  - { text: "Lyja ir pučia vėjas.", translation: "Идёт дождь, и дует ветер.", source: "tatoeba:10973893" }
  - { text: "Šalta.", translation: "Холодно.", source: "tatoeba:8978040" }
  - { text: "Jis gimė žiemą.", translation: "Он родился зимой.", source: "tatoeba:11041205" }
  - { text: "Aš mėgstu rudenį.", translation: "Я люблю осень.", source: "tatoeba:12112736" }
