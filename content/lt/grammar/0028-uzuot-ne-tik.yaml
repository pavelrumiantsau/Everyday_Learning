    hint: "вместо того чтобы"
    translation: "Вместо того чтобы работать, он весь день смотрел телевизор."
  - type: cloze
    text: "Užuot ___, ji tylėjo."
    answer: "atsakiusi"
    hint: "atsakyti, прич. прош. вр., ж. р."
    translation: "Вместо того чтобы ответить, она молчала."
  - type: cloze
    text: "Jis kalba ne tik lietuviškai, ___ ir latviškai."
