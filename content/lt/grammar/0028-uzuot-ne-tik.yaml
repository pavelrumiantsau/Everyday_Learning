id: lt-g-0028
cefr: B2
order: 28
title: "Užuot, ne tik… bet ir, nei… nei, arba… arba"
explanation:
  ru: |
    **užuot** — «вместо того чтобы». После него — **причастие прошедшего времени** (согласуется с подлежащим) или инфинитив:
    - ***Užuot ėjęs** dirbti, aš visą dieną gulėjau lovoje.* — Вместо того чтобы идти работать…
    - *Užuot **atsakiusi**, ji tylėjo.* — о женщине: *-usi*.
    - без подлежащего (общее утверждение) — деепричастие на **-us**: *Užuot tuščiai **kalbėjus**, geriau vertėtų patylėti.*

    **Парные союзы:**
    - **ne tik…, bet ir…** — не только…, но и…: *Valgyk **ne tik** žuvį, **bet ir** mėsą.*
    - **nei… nei…** — ни… ни…; глагол **с отрицанием**, как в русском: *Aš **ne**geriu **nei** kavos, **nei** arbatos.*
    - **arba… arba…** — или… или…: ***Arba** taip, **arba** ne.*
    - **tai… tai…** — то… то…: ***Tai** lyja, **tai** sninga.*

    После *nei… nei* и отрицания дополнение стоит в **родительном падеже**: *nei kavos, nei arbatos*.
comparison:
  ru: |
    «Вместо того чтобы + инфинитив» в литовском чаще передаётся причастием: *užuot dirbęs* — буквально «вместо (того, чтобы) работав». Не путай *nei* «ни» с *nei* «чем» при сравнении: *geriau nei vakar* — лучше, чем вчера.
examples:
  - { text: "Užuot tuščiai kalbėjus, geriau vertėtų patylėti.", translation: "Чем болтать без толку, лучше помалкивать.", source: "tatoeba:2730415" }
  - { text: "Valgyk ne tik žuvį, bet ir mėsą.", translation: "Ешь не только рыбу, но и мясо.", source: "tatoeba:10366591" }
  - { text: "Arba taip, arba ne.", translation: "Либо да, либо нет.", source: "tatoeba:12682860" }
  - { text: "Nei žuvis, nei mėsa.", translation: "Ни рыба ни мясо.", source: "tatoeba:11937892" }
  - { text: "Liaudis yra ne tik jūs, bet ir mes.", translation: "Народ — это не только вы, но и мы.", source: "tatoeba:13859815" }
