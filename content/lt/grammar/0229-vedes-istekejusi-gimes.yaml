id: lt-g-0229
cefr: A2
order: 229
track: foundation
title: "Семейное положение: vedęs, ištekėjusi, išsiskyręs; gimęs, gimusi"
explanation:
  ru: |
    В анкетах и биографиях нужны слова-причастия. На A2 их учим **как отдельные слова**, по роду и числу:

    |---|---|---|---|
    - **женат / замужем:** *vedęs* (о мужчине) — *ištekėjusi* (о женщине) — *vedę* (о паре: *Jie vedę.*)
    - **не женат / не замужем:** *nevedęs* — *netekėjusi*
    - **разведён(-а):** *išsiskyręs* — *išsiskyrusi*
    - **вдовец / вдова:** *našlys* — *našlė* (это существительные)

    **Родился / родилась:** *gimęs* — *gimusi*: *Esu gimęs Kaune.* (мужчина) — *Esu gimusi Vilniuje.* (женщина). Так же часто говорят *Gimiau Kaune.*

    В анкете: ***Šeiminė padėtis:*** *vedęs / ištekėjusi / nevedęs / netekėjusi / išsiskyręs (-usi)*.
comparison:
  ru: |
    Как русские «женат» и «замужем», но окончание показывает род: *vedęs* — о мужчине, *ištekėjusi* — о женщине.
examples:
  - { text: "Taip, aš vedęs.", translation: "Да, я женат.", source: "tatoeba:9937260" }
  - { text: "Ar Tomas vedęs?", translation: "Том женат?", source: "tatoeba:11633069" }
  - { text: "Aš esu išsiskyręs.", translation: "Я разведён.", source: "tatoeba:10698647" }
  - { text: "Aš buvau vedęs.", translation: "Я был женат.", source: "tatoeba:12420430" }
  - { text: "Deja, jis vedęs.", translation: "Увы, он женат.", source: "tatoeba:13292666" }
