id: lt-g-0106
cefr: B1
order: 106
title: "Смотреть и видеть, слушать и слышать: žiūrėti, matyti, klausytis, girdėti"
explanation:
  ru: |
    **Смотреть / видеть**
    - ***žiūrėti*** (žiūri, žiūrėjo) — смотреть (намеренно): на кого — ***į*** + вин.: *žiūri **į** mane*; фильм, телевизор — вин. без предлога: *žiūrėti filmą*
    - ***matyti*** (mato, matė) — видеть (способность, результат); ***pamatyti*** — увидеть: *Nieko nematau.*
    - ***stebėti*** — наблюдать

    **Слушать / слышать**
    - ***klausytis*** (klausosi, klausėsi) + **род. п.** — слушать: *klausausi **muzikos**, **radijo***
    - ***klausyti*** + род. п. (без *-si*) — **слушаться**: *Klausyk **mamos**!*
    - ***girdėti*** (girdi, girdėjo) — слышать; ***išgirsti*** — услышать: *Ar girdi?*
comparison:
  ru: |
    «Смотрю на тебя» — *žiūriu **į** tave* (с предлогом). «Слушаю музыку» — *klausau**si** **muzikos*** (родительный и *-si*); без *-si* — «слушаться»: *klausyti tėvų* — слушаться родителей.
examples:
  - { text: "Aš tik žiūriu.", translation: "Я только смотрю.", source: "tatoeba:2606266" }
  - { text: "Ji į ją žiūri.", translation: "Она на неё смотрит.", source: "tatoeba:12325788" }
  - { text: "Po pietų aš klausausi radijo.", translation: "После обеда я слушаю радио.", source: "tatoeba:13266127" }
  - { text: "Ar girdi balsą?", translation: "Ты слышишь голос?", source: "tatoeba:3596273" }
  - { text: "Ar tu mus girdi?", translation: "Ты нас слышишь?", source: "tatoeba:12770063" }
