# Can-do goals per quarter (PLAN §3.4), used by the quarterly self-check (/check, last Sunday of the quarter).
# Poll options are limited to 100 characters and 10 per language.
quarters:
  - id: q1
    label: "Q1 · окт–дек 2026"
    start: "2026-10-01"
    end: "2026-12-31"
    lt:
      - Говорю 10 минут о повседневной жизни и работе
      - Пишу письмо или сообщение на 120 слов
      - Использую прошедшее многократное (dirbdavau)
      - Спрягаю глаголы в будущем времени без ошибок
      - Ставлю родительный падеж после отрицания
      - Понимаю короткие новости LRT со словарём
    es:
      - Заказываю в кафе, представляюсь, спрашиваю дорогу
      - Спрягаю правильные глаголы в настоящем времени
      - Различаю ser и estar
      - Использую gustar и ir a + инфинитив
  - id: q2
    label: "Q2 · янв–мар 2027"
    start: "2027-01-01"
    end: "2027-03-31"
    lt:
      - Понимаю новости LRT по радио на знакомые темы
      - Пересказываю прочитанную статью
      - Использую действительные причастия (-ąs, -ęs, -antis)
      - Использую pusdalyvis (-damas) и padalyvis (-ant, -us)
      - Строю придаточные с kuris и kad
    es:
      - Рассказываю о поездке 5 минут (с репетитором)
      - Использую pretérito (hablé, comí, viví)
      - Использую возвратные глаголы (me levanto)
  - id: q3
    label: "Q3 · апр–июн 2027"
    start: "2027-04-01"
    end: "2027-06-30"
    lt:
      - Обсуждаю тему 20 минут и высказываю мнение
      - Пишу текст-мнение на 250 слов
      - Использую страдательный залог (yra padarytas)
      - Понимаю косвенную речь (jis esąs)
      - Различаю формальный и разговорный стиль
    es:
      - Рассказываю историю о прошлом
      - Различаю pretérito и imperfecto
      - Использую будущее время
    fr:
      - Представляюсь и справляюсь в магазине и кафе
      - Правильно произношу носовые гласные
      - Использую être, avoir и артикли
  - id: q4
    label: "Q4 · июл–сен 2027"
    start: "2027-07-01"
    end: "2027-09-30"
    lt:
      - Спонтанно говорю с носителями без подготовки
      - Понимаю главное в сложных текстах и передачах
      - Понимаю суть быстрых подкастов и фильмов
      - Аргументирую позицию устно и письменно
    es:
      - Справляюсь с незапланированными ситуациями в поездке
      - Узнаю presente de subjuntivo
      - Различаю por и para
    fr:
      - Описываю свой день и выходные
      - Использую passé composé
      - Понимаю медленные подкасты (InnerFrench)
  - id: final
    label: "Итог года · окт–дек 2027"
    start: "2027-10-01"
    end: "2027-12-31"
    lt:
      - Уверенно общаюсь на литовском на работе и в быту (B2)
      - Смотрю сериалы и слушаю LRT без субтитров
      - Пишу официальные письма без серьёзных ошибок
    es:
      - Свободно общаюсь в поездках и на бытовые темы (A2+)
      - Читаю простые статьи и понимаю Dreaming Spanish
    fr:
      - Справляюсь с базовыми ситуациями (A1+)
