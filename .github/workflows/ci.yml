name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Colleagues extension branches must leave Spanish/French materials as they are (docs/EXTENSION-PLAN.md §4.4).
      - name: Spanish/French materials untouched
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --unshallow origin && bash scripts/ci/untouched.sh
      - run: pnpm content:validate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke

  # Every push to main that passes the checks goes live (SETUP.md step 5).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply new database migrations
        run: pnpm db:migrate
      - name: Deploy the Worker
        run: pnpm deploy:worker
