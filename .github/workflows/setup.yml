name: Setup

# Personal copy, first setup (docs/SETUP-COPY.md step 6): Cloudflare account, database, deploy, Telegram, claim link.
# Safe to run again (e.g. after adding GROQ_API_KEY): nothing is wiped. Does nothing in the original repository.
on:
  workflow_dispatch:
    inputs:
      reset_owner:
        description: "Отвязать бота от текущего аккаунта Telegram (новая ссылка привяжет заново)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: deploy

jobs:
  setup:
    if: github.repository != 'pavelrumiantsau/Everyday_Learning'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CI: "1"
    steps:
      - name: Check the secrets
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN (шаг 1)"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN (шаг 3)"
          if [ -n "$missing" ]; then
            echo "### ✗ Не хватает секретов:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Settings → Secrets and variables → Actions → New repository secret (шаг 5 инструкции)." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare account, database and address
        run: pnpm exec tsx scripts/ci/copy.ts configure
      - name: Create or update the database tables
        run: pnpm db:migrate
      - name: Deploy the bot and the Mini App
        run: pnpm deploy:worker
      - name: Forget the current owner
        if: inputs.reset_owner
        run: pnpm exec tsx scripts/ci/copy.ts reset-owner
      - name: Secrets, Telegram webhook and the claim link
        run: pnpm exec tsx scripts/ci/copy.ts secrets
